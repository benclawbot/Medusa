[package]
name = "medusa-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
hex.workspace = true
medusa-browser-client = { path = "../medusa-browser-client" }
medusa-capabilities = { path = "../medusa-capabilities" }
medusa-config = { path = "../medusa-config" }
medusa-core.workspace = true
medusa-escalation = { path = "../medusa-escalation" }
medusa-extensions = { path = "../medusa-extensions" }
medusa-intelligence = { path = "../medusa-intelligence" }
medusa-multi-agent-scheduler = { path = "../medusa-multi-agent-scheduler" }
medusa-protocol.workspace = true
medusa-provider = { path = "../medusa-provider" }
medusa-world-model.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
time.workspace = true
ulid.workspace = true
walkdir = "2.5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
