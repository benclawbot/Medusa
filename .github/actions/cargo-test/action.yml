name: "Cargo Test"
description: "Run `cargo test` for a workspace member, optionally filtered to a specific crate."

inputs:
  crate:
    description: "Single crate to test (e.g. 'medusa-runtime'). Empty runs the whole workspace."
    required: false
    default: ""
  test_args:
    description: "Additional arguments to pass to `cargo test`."
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: cargo test
      shell: bash
      run: |
        if [ -n "${{ inputs.crate }}" ]; then
          cargo test -p ${{ inputs.crate }} --locked ${{ inputs.test_args }}
        else
          cargo test --workspace --locked ${{ inputs.test_args }}
        fi
