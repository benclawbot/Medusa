name: "Setup Rust"
description: "Install the pinned Rust 1.88.0 toolchain with clippy + rustfmt components. The calling workflow must checkout the repository first."

runs:
  using: composite
  steps:
    - name: Install pinned Rust toolchain
      uses: dtolnay/rust-toolchain@1.88.0
      with:
        components: clippy, rustfmt
    - name: Install Linux system dependencies
      if: runner.os == 'Linux'
      shell: bash
      # medusa-tui uses keyring with the Secret Service backend, which links
      # against the system D-Bus client library via libdbus-sys/pkg-config.
      run: |
        sudo apt-get update
        sudo apt-get install -y libdbus-1-dev pkg-config
