name: Issue 758 analysis workspace verifier

on:
  push:
    branches:
      - agent/issue-758-analysis-workspace

permissions:
  contents: write

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Wire production module
        shell: python
        run: |
          from pathlib import Path
          p = Path('crates/medusa-runtime/src/lib.rs')
          s = p.read_text()
          marker = 'pub mod attachment;\n'
          if 'pub mod analysis_workspace;' not in s:
              s = s.replace(marker, marker + 'pub mod analysis_workspace;\n', 1)
          p.write_text(s)
      - name: Format
        run: cargo fmt --all
      - name: Check runtime
        run: cargo check -p medusa-runtime --locked
      - name: Test persistent analysis workspace
        run: cargo test -p medusa-runtime analysis_workspace --locked -- --nocapture
      - name: Clippy
        run: cargo clippy -p medusa-runtime --locked --all-targets -- -D warnings
      - name: Commit verified wiring
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add crates/medusa-runtime/src/lib.rs crates/medusa-runtime/src/analysis_workspace.rs
            git commit -m "feat(runtime): wire persistent analysis workspace"
            git push
          fi
