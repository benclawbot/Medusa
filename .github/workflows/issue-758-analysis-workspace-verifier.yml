name: Issue 758 analysis workspace verifier

on:
  push:
    branches:
      - agent/issue-758-analysis-workspace

permissions:
  contents: write

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux sandbox backend
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Wire runtime-owned analysis host and process-tree ownership
        shell: python
        run: |
          from pathlib import Path

          host = Path('crates/medusa-runtime/src/analysis_tool.rs')
          s = host.read_text()
          s = s.replace('''        if !plan.delegation.allowed {\n            return Err(policy("analysis delegation is disabled by the admitted production plan"));\n        }\n''', '')
          s = s.replace('ErrorCode::InvalidToolInput', 'ErrorCode::InvalidInput')
          host.write_text(s)

          runtime = Path('crates/medusa-runtime/src/lib.rs')
          s = runtime.read_text()
          if 'mod analysis_tool;' not in s:
              marker = 'pub mod analysis_contained;\n'
              if marker not in s:
                  raise SystemExit('analysis contained module marker not found')
              s = s.replace(marker, marker + 'mod analysis_tool;\n', 1)
          old = '    let engine = AgentEngine::new_with_cancellation(provider, config.clone(), Arc::clone(cancel));\n'
          new = '''    let analysis_host = Arc::new(crate::analysis_tool::RuntimeAnalysisHost::new(\n        state.repo.clone(),\n        config.clone(),\n        state.session_api_key.clone(),\n        state.team_control.clone(),\n        events.clone(),\n        Arc::clone(cancel),\n    ));\n    let engine = AgentEngine::new_with_cancellation(provider, config.clone(), Arc::clone(cancel))\n        .with_analysis_workspace_host(analysis_host);\n'''
          if 'RuntimeAnalysisHost::new(' not in s:
              if old not in s:
                  raise SystemExit('runtime engine construction marker not found')
              s = s.replace(old, new, 1)
          runtime.write_text(s)

          team = Path('crates/medusa-agent/src/team.rs')
          s = team.read_text()
          if '"analysis_workspace".to_owned(),' not in s:
              marker = '            "skill_read".to_owned(),\n'
              if marker not in s:
                  raise SystemExit('team read-only tool allowlist marker not found')
              s = s.replace(marker, marker + '            "analysis_workspace".to_owned(),\n', 1)
          team.write_text(s)

          tree = Path('crates/medusa-process-containment/src/process_tree.rs')
          s = tree.read_text()
          s = s.replace(
              'process::{Child, Command, ExitStatus},',
              'process::{Child, ChildStderr, ChildStdout, Command, ExitStatus},',
          )
          marker = '''    pub fn id(&self) -> u32 {\n        self.child.id()\n    }\n'''
          addition = marker + '''\n    /// Transfers the captured stdout pipe to the supervising runtime.\n    pub fn take_stdout(&mut self) -> Option<ChildStdout> {\n        self.child.stdout.take()\n    }\n\n    /// Transfers the captured stderr pipe to the supervising runtime.\n    pub fn take_stderr(&mut self) -> Option<ChildStderr> {\n        self.child.stderr.take()\n    }\n'''
          if 'pub fn take_stdout(&mut self)' not in s:
              if marker not in s:
                  raise SystemExit('process tree id marker not found')
              s = s.replace(marker, addition, 1)
          tree.write_text(s)

          policy = Path('crates/medusa-agent/src/policy.rs')
          s = policy.read_text()
          s = s.replace(
              '''use std::{\n    process::{Command, Stdio},\n    thread,\n    time::{Duration, Instant},\n};''',
              '''use std::{\n    io::Read,\n    process::{Command, Stdio},\n    thread,\n    time::{Duration, Instant},\n};\n\n#[cfg(any(target_os = "linux", target_os = "macos"))]\nuse medusa_process_containment::OwnedProcessTree;''',
          )
          start = s.index('''#[cfg(any(target_os = "linux", target_os = "macos"))]\nfn output_with_timeout(''')
          end = s.index('''\n#[cfg(not(any(target_os = "linux", target_os = "macos", windows)))]\nfn sandbox_unavailable''', start)
          replacement = '''#[cfg(any(target_os = "linux", target_os = "macos"))]\nfn output_with_timeout(\n    command: &mut Command,\n    description: &str,\n    cancellation: &AtomicBool,\n) -> MedusaResult<Output> {\n    command.stdout(Stdio::piped()).stderr(Stdio::piped());\n    let mut tree = OwnedProcessTree::spawn(command).map_err(|error| {\n        MedusaError::new(\n            ErrorCode::DependencyUnavailable,\n            ErrorCategory::Environment,\n            format!("{description} unavailable: {error}"),\n        )\n    })?;\n    let stdout = tree.take_stdout().ok_or_else(|| {\n        MedusaError::new(\n            ErrorCode::InternalInvariant,\n            ErrorCategory::Internal,\n            format!("{description} stdout pipe was unavailable"),\n        )\n    })?;\n    let stderr = tree.take_stderr().ok_or_else(|| {\n        MedusaError::new(\n            ErrorCode::InternalInvariant,\n            ErrorCategory::Internal,\n            format!("{description} stderr pipe was unavailable"),\n        )\n    })?;\n    let stdout_reader = thread::spawn(move || {\n        let mut pipe = stdout;\n        let mut bytes = Vec::new();\n        pipe.read_to_end(&mut bytes).map(|_| bytes)\n    });\n    let stderr_reader = thread::spawn(move || {\n        let mut pipe = stderr;\n        let mut bytes = Vec::new();\n        pipe.read_to_end(&mut bytes).map(|_| bytes)\n    });\n    let started = Instant::now();\n    loop {\n        if cancellation.load(Ordering::Acquire) {\n            let _ = tree.terminate();\n            let _ = tree.wait();\n            return Err(cancelled_command(description));\n        }\n        if let Some(status) = tree.try_wait()? {\n            let stdout = stdout_reader\n                .join()\n                .map_err(|_| MedusaError::new(ErrorCode::ToolExecutionFailed, ErrorCategory::Execution, format!("{description} stdout reader terminated unexpectedly")))??;\n            let stderr = stderr_reader\n                .join()\n                .map_err(|_| MedusaError::new(ErrorCode::ToolExecutionFailed, ErrorCategory::Execution, format!("{description} stderr reader terminated unexpectedly")))??;\n            return Ok(Output { status, stdout, stderr });\n        }\n        if started.elapsed() >= SHELL_COMMAND_TIMEOUT {\n            let _ = tree.terminate();\n            let _ = tree.wait();\n            return Err(MedusaError::new(\n                ErrorCode::ToolExecutionFailed,\n                ErrorCategory::Execution,\n                format!(\n                    "{description} timed out after {} seconds",\n                    SHELL_COMMAND_TIMEOUT.as_secs()\n                ),\n            ));\n        }\n        thread::sleep(Duration::from_millis(50));\n    }\n}\n'''
          s = s[:start] + replacement + s[end:]
          policy.write_text(s)
      - name: Format
        run: cargo fmt --all
      - name: Check runtime, agent, and containment
        run: cargo check -p medusa-process-containment -p medusa-agent -p medusa-runtime --locked
      - name: Test persistent analysis workspace
        run: cargo test -p medusa-runtime analysis_workspace --locked -- --nocapture
      - name: Test contained analysis backend
        run: cargo test -p medusa-runtime --test analysis_workspace_containment --locked -- --nocapture
      - name: Test process-tree ownership
        run: cargo test -p medusa-process-containment process_tree --locked -- --nocapture
      - name: Test analysis host and scheduler admission
        run: cargo test -p medusa-agent analysis_host -p medusa-runtime analysis_tool --locked -- --nocapture
      - name: Clippy
        run: cargo clippy -p medusa-process-containment -p medusa-agent -p medusa-runtime --locked --all-targets -- -D warnings
      - name: Commit verified source
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add crates/medusa-process-containment/src/process_tree.rs crates/medusa-agent/src/policy.rs crates/medusa-runtime/src/lib.rs crates/medusa-runtime/src/analysis_tool.rs crates/medusa-runtime/Cargo.toml crates/medusa-runtime/tests/analysis_workspace_containment.rs crates/medusa-agent/src/team.rs
            git commit -m "fix(containment): own analysis process trees through cancellation"
            git push
          fi
