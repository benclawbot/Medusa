name: Apply #686 verification graph selection

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'perf/686-wire-verification-selection'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0
      - name: Apply graph verification patch
        shell: bash
        run: |
          if grep -q 'fn graph_verification_assessment' crates/medusa-agent/src/verification_authority.rs; then
            echo 'graph verification patch already applied'
            exit 0
          fi
          git fetch origin main
          git show origin/main:.github/patches/686-verification-selection.patch > /tmp/686.patch
          git apply --check /tmp/686.patch
          git apply /tmp/686.patch
          rm -f .github/686-verification-trigger.txt
          cargo fmt --all
          git diff --check
          cargo test -p medusa-agent --locked verification_authority -- --nocapture
          cargo clippy -p medusa-agent --all-targets --locked -- -D warnings
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Wire repository graph into authoritative verification'
          git push origin HEAD:${{ github.head_ref }}
