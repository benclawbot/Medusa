name: Release Integrity Policy

on:
  pull_request:
    paths:
      - ".github/**"
      - "scripts/release-workflow-policy.py"
  push:
    branches:
      - main
    paths:
      - ".github/**"
      - "scripts/release-workflow-policy.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-policy:
    name: Immutable release policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Validate policy fixtures
        run: python3 scripts/release-workflow-policy.py self-test
      - name: Enforce immutable release workflow policy
        run: python3 scripts/release-workflow-policy.py check --root .
