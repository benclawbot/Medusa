#[cfg(test)]
mod coding_trajectory_tests {
    use super::*;

    fn trajectory() -> CodingTrajectoryCheckpoint {
        CodingTrajectoryCheckpoint {
            task_stack: vec!["implement-874".to_owned(), "wire-resume".to_owned()],
            task_graph: vec![TaskEdge {
                parent: "implement-874".to_owned(),
                child: "wire-resume".to_owned(),
            }],
            plan_steps: vec![
                PlanStepCheckpoint {
                    id: "schema".to_owned(),
                    description: "persist trajectory schema".to_owned(),
                    status: PlanStepStatus::Completed,
                },
                PlanStepCheckpoint {
                    id: "resume".to_owned(),
                    description: "restore after compaction".to_owned(),
                    status: PlanStepStatus::Active,
                },
            ],
            delegations: vec![DelegatedWorkCheckpoint {
                id: "worker-1".to_owned(),
                parent_task: "wire-resume".to_owned(),
                summary: "inspect recovery integration".to_owned(),
                status: DelegationStatus::PendingJoin,
            }],
            modified_files: vec!["crates/medusa-session-continuity/src/root.rs".to_owned()],
            verification_receipts: vec![VerificationReceipt {
                command: "cargo test -p medusa-session-continuity".to_owned(),
                outcome: VerificationOutcome::Failed,
                evidence: Some("first verifier pass exposed a resume mismatch".to_owned()),
            }],
            unresolved_uncertainties: vec!["pending delegated recovery inspection".to_owned()],
            continuation_intent: Some("join worker-1, repair verifier failure, rerun tests".to_owned()),
            ..CodingTrajectoryCheckpoint::default()
        }
    }

    fn task_with_trajectory(value: CodingTrajectoryCheckpoint) -> AuthoritativeTaskState {
        AuthoritativeTaskState {
            plan_state: Some("running".to_owned()),
            active_step: Some("resume".to_owned()),
            coding_trajectory: Some(value),
            ..AuthoritativeTaskState::default()
        }
    }

    #[test]
    fn trajectory_survives_repair_compaction_and_multi_hop_resume() {
        let temp = tempfile::tempdir().expect("tempdir");
        let store = ContinuityStore::new(temp.path().join("session.json"));
        let initial = store.create("trajectory-session").expect("create");
        let attached = store
            .attach(AttachRequest {
                client_id: "daemon".to_owned(),
                client_kind: ClientKind::Daemon,
                requested_mode: AttachmentMode::Owner,
                expected_revision: initial.revision,
                journal_cursor: 0,
                occurred_at_unix_ms: 1,
                event_id: "attach".to_owned(),
            })
            .expect("attach")
            .session()
            .clone();
        let original = trajectory();
        let repair = store
            .mutate(MutationRequest {
                client_id: "daemon".to_owned(),
                expected_revision: attached.revision,
                occurred_at_unix_ms: 2,
                event_id: "repair-checkpoint".to_owned(),
                event: SessionEventKind::RepairLoopCheckpointed,
                task: task_with_trajectory(original.clone()),
            })
            .expect("repair checkpoint")
            .session()
            .clone();
        let compacted = store
            .mutate(MutationRequest {
                client_id: "daemon".to_owned(),
                expected_revision: repair.revision,
                occurred_at_unix_ms: 3,
                event_id: "compaction".to_owned(),
                event: SessionEventKind::CompactionCheckpointed,
                task: repair.task.clone(),
            })
            .expect("compaction")
            .session()
            .clone();
        let loaded = store.load().expect("load after compaction");
        assert_eq!(loaded.task, compacted.task);
        let first = loaded
            .task
            .coding_trajectory
            .as_ref()
            .expect("trajectory")
            .restored_for_resume()
            .expect("first resume");
        let resumed = store
            .mutate(MutationRequest {
                client_id: "daemon".to_owned(),
                expected_revision: loaded.revision,
                occurred_at_unix_ms: 4,
                event_id: "resume-1".to_owned(),
                event: SessionEventKind::TrajectoryRestored {
                    resume_hops: first.resume_hops,
                },
                task: task_with_trajectory(first.clone()),
            })
            .expect("resume one")
            .session()
            .clone();
        let second = resumed
            .task
            .coding_trajectory
            .as_ref()
            .expect("trajectory")
            .restored_for_resume()
            .expect("second resume");
        assert_eq!(second.resume_hops, 2);
        assert_eq!(second.delegations, original.delegations);
        assert_eq!(second.verification_receipts, original.verification_receipts);
        assert_eq!(second.unresolved_uncertainties, original.unresolved_uncertainties);
        assert_eq!(second.continuation_intent, original.continuation_intent);
        assert_eq!(second.modified_files, original.modified_files);
        assert_eq!(second.plan_steps, original.plan_steps);
    }

    #[test]
    fn rejects_incompatible_and_unbounded_trajectory_checkpoints() {
        let mut incompatible = trajectory();
        incompatible.schema_version = CODING_TRAJECTORY_SCHEMA_VERSION + 1;
        assert!(matches!(
            incompatible.validate(),
            Err(ContinuityError::UnsupportedTrajectorySchema { .. })
        ));
        let mut oversized = trajectory();
        oversized.task_stack = (0..=MAX_TRAJECTORY_ITEMS)
            .map(|index| format!("task-{index}"))
            .collect();
        assert!(matches!(
            oversized.validate(),
            Err(ContinuityError::TrajectoryTooLarge)
        ));
    }
}
