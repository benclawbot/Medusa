name: Temporary issue 874 trajectory migration
on:
  push:
    branches:
      - codex/issue-874-coding-trajectory-state
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/issue-874-coding-trajectory-state
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0
        with:
          components: rustfmt,clippy
      - run: python3 scripts/fix-874-trajectory.py
      - run: cargo fmt --all
      - run: cargo test -p medusa-session-continuity --locked
      - run: cargo clippy -p medusa-session-continuity --all-targets --locked -- -D warnings
      - run: |
          git config user.name 'BenClawBot (AlphaOM3G1)'
          git config user.email 'benclawbot@gmail.com'
          git add crates/medusa-session-continuity/src/root.rs
          git commit -m 'feat: persist coding trajectory across continuity boundaries'
          git push origin HEAD:codex/issue-874-coding-trajectory-state
