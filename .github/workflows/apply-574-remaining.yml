name: Apply remaining 574 revision slice

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/574-config-revisions-events'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/574-config-revisions-events
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0 # 1.88.0
        with:
          components: rustfmt,clippy
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/medusa-desktop/package-lock.json
      - name: Apply verified remaining patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/patches/574.remaining.* > /tmp/574-remaining.patch.b64
          echo "fd0c4f40ff04b46638ef31ee67a75b10b79d7184663f46530d74f479c7e542d5  /tmp/574-remaining.patch.b64" | sha256sum -c -
          base64 --decode /tmp/574-remaining.patch.b64 > /tmp/574-remaining.patch
          echo "5cd5d2fdafc5ceb7b5ba40691a35413884a50f5a4a38bc5813ecda3e487a3f7d  /tmp/574-remaining.patch" | sha256sum -c -
          git apply --index /tmp/574-remaining.patch
      - name: Format Rust
        run: cargo fmt --all
      - name: Check whitespace
        run: git diff --check
      - name: Focused Rust tests
        run: cargo test -p medusa-config -p medusa-runtime -p medusa-cli --all-features --locked -- --nocapture
      - name: Focused Rust Clippy
        run: cargo clippy -p medusa-config -p medusa-runtime -p medusa-cli --all-targets --all-features --locked -- -D warnings
      - name: Desktop Rust tests
        run: cargo test --manifest-path apps/medusa-desktop/src-tauri/Cargo.toml --lib --locked -- --nocapture
      - name: Desktop frontend checks
        working-directory: apps/medusa-desktop
        run: |
          npm ci
          npm run typecheck
          npm test
      - name: Commit implementation only
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/patches/574.remaining.*
          git rm .github/workflows/apply-574-remaining.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Add revisioned shared configuration changes"
          git push origin HEAD:agent/574-config-revisions-events
