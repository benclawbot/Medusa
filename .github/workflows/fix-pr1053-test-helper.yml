name: Fix PR 1053 Test Helper

on:
  pull_request:
    types: [synchronize]
    paths:
      - '.github/workflows/fix-pr1053-test-helper.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ux/action-based-recovery
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0 # 1.88.0
        with:
          components: rustfmt
      - name: Restore test-only review baseline helper
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/medusa-runtime/src/lib.rs')
          text = path.read_text()
          marker = '''fn should_capture_review_baseline_for_plan(\n'''
          helper = '''#[cfg(test)]\nfn should_capture_review_baseline(general_chat: bool, resuming_pending_question: bool) -> bool {\n    !general_chat && !resuming_pending_question\n}\n\n'''
          if helper in text:
              raise SystemExit('test helper already present')
          if text.count(marker) != 1:
              raise SystemExit(f'expected one insertion marker, found {text.count(marker)}')
          path.write_text(text.replace(marker, helper + marker))
          PY
          cargo fmt --all
          git diff --check
      - name: Commit runtime lib through file-backed GitHub API payload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          path='crates/medusa-runtime/src/lib.rs'
          sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=ux/action-based-recovery" --jq .sha)"
          SHA="$sha" PATH_TO_FILE="$path" python3 - <<'PY'
          import base64, json, os
          from pathlib import Path
          path = Path(os.environ['PATH_TO_FILE'])
          payload = {
              'message': 'fix(runtime): keep legacy baseline predicate test-only',
              'content': base64.b64encode(path.read_bytes()).decode('ascii'),
              'sha': os.environ['SHA'],
              'branch': 'ux/action-based-recovery',
          }
          Path('payload.json').write_text(json.dumps(payload))
          PY
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$path" --input payload.json
