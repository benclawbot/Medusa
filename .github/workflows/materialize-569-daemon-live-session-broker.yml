name: Materialize daemon live-session broker

on:
  pull_request:
    branches:
      - agent/569-continuity-commands
    paths:
      - crates/medusa-daemon/src/live_session.rs
      - validation/materialize_569_daemon_live_session_broker.py
      - validation/fix_569_daemon_live_session_import.py
      - .github/workflows/materialize-569-daemon-live-session-broker.yml

permissions:
  contents: write

concurrency:
  group: materialize-569-daemon-broker-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/569-daemon-live-session-broker'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0 # stable
      - name: Materialize reviewed daemon broker wiring
        run: |
          python3 validation/materialize_569_daemon_live_session_broker.py
          python3 validation/fix_569_daemon_live_session_import.py
      - name: Format and validate daemon broker
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test -p medusa-daemon live_session
          cargo test -p medusa-runtime attachment
          cargo test -p medusa-session-continuity
          cargo clippy -p medusa-daemon -p medusa-runtime -p medusa-session-continuity --all-targets --all-features -- -D warnings
      - name: Commit source-only result
        run: |
          git rm .github/workflows/materialize-569-daemon-live-session-broker.yml
          git rm validation/materialize_569_daemon_live_session_broker.py
          git rm validation/fix_569_daemon_live_session_import.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/medusa-daemon/Cargo.toml
          git add crates/medusa-daemon/src/lib.rs
          git add crates/medusa-daemon/src/live_session.rs
          git add crates/medusa-runtime/src/attachment/session.rs
          git commit -m "Add daemon live-session broker"
          git push origin HEAD:${{ github.head_ref }}
