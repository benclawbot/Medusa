name: Issue 974 comment materialize

on:
  issue_comment:
    types: [created]

permissions:
  contents: write

jobs:
  materialize:
    if: >-
      github.event.issue.number == 975 &&
      github.event.comment.body == '/materialize-974'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/974-provider-aware-tui
          fetch-depth: 0
      - name: Apply staged source changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/issue-974-materialize.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(source) if "python3 - <<'PY'" in line) + 1
          end = next(i for i in range(start, len(source)) if source[i].strip() == 'PY')
          body = '\n'.join(line[10:] if line.startswith('          ') else line for line in source[start:end]) + '\n'
          Path('/tmp/materialize.py').write_text(body)
          PY
          python3 /tmp/materialize.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/medusa-tui/src/runtime.rs')
          text = p.read_text()
          old = '''        let acknowledgement = self.dispatch(FrontendCommand::ConfigureModel {
            provider: provider.clone(),
            model,
        })?;'''
          new = '''        let acknowledgement = self.dispatch(FrontendCommand::ConfigureModel {
            provider: provider.clone(),
            model: model.clone(),
        })?;'''
          if old in text:
              p.write_text(text.replace(old, new, 1))
          PY
      - name: Commit materialized source
        shell: bash
        run: |
          rm -f .github/workflows/issue-974-materialize.yml .github/workflows/issue-974-pr-materialize.yml .github/workflows/issue-974-push-finalize.yml .github/issue-974-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(tui): make OAuth model configuration provider-aware"
          git push origin HEAD:agent/974-provider-aware-tui
