name: Rustfmt repair 503

on:
  push:
    branches:
      - agent/issue-503-correction-signals

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-503-correction-signals
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt
      - run: cargo fmt --all
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/medusa-improvement/src/correction_signals.rs
          git commit -m "style: apply rustfmt to correction signals"
          git push origin HEAD:agent/issue-503-correction-signals
