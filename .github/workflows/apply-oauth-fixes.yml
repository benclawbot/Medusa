name: Apply GitHub OAuth compiler fixes

on:
  push:
    branches:
      - agent/629-github-oauth-parity

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/629-github-oauth-parity
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0
        with:
          toolchain: stable
          components: rustfmt
      - name: Apply compiler corrections
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, before, after, count=None):
              text = path.read_text()
              found = text.count(before)
              expected = count if count is not None else 1
              if found != expected:
                  raise SystemExit(f"expected {expected} occurrences in {path}, found {found}: {before!r}")
              path.write_text(text.replace(before, after))

          compatibility = Path("crates/medusa-github/src/repository_creation/compatibility.rs")
          replace(
              compatibility,
              "#[derive(Clone, Debug, Eq, PartialEq)]\npub struct LegacyGitHubConversion",
              "#[derive(Clone, Debug, PartialEq)]\npub struct LegacyGitHubConversion",
          )

          typed_prepare = Path("crates/medusa-github/src/repository_creation/typed_prepare.rs")
          replace(typed_prepare, "use serde_json::{Map, Value, json};", "use serde_json::{Value, json};")
          replace(
              typed_prepare,
              "} => reviewers(document, *number, reviewers, team_reviewers, false),",
              "} => prepare_reviewers(document, *number, reviewers, team_reviewers, false),",
          )
          replace(
              typed_prepare,
              "} => reviewers(document, *number, reviewers, team_reviewers, true),",
              "} => prepare_reviewers(document, *number, reviewers, team_reviewers, true),",
          )
          replace(typed_prepare, "fn reviewers(\n", "fn prepare_reviewers(\n")

          coordinator = Path("crates/medusa-github/src/repository_creation/coordinator.rs")
          replace(coordinator, "use std::{collections::BTreeMap, path::PathBuf};", "use std::collections::BTreeMap;")
          replace(coordinator, "use serde_json::{Map, Value, json};", "use serde_json::{Value, json};")
          replace(
              coordinator,
              "self.reconcile_existing(document, &prepared, attempt_id, request_digest)?",
              "self.reconcile_existing(\n                            document,\n                            &prepared,\n                            attempt_id.clone(),\n                            request_digest.clone(),\n                        )?",
          )

          direct = Path("crates/medusa-github/src/repository_creation/direct.rs")
          replace(direct, "Method, StatusCode, Url,", "Method, Url,")
          replace(direct, "CONTENT_TYPE, ETAG, HeaderMap", "CONTENT_TYPE, HeaderMap")

          cli = Path("crates/medusa-cli/src/github_operation.rs")
          replace(
              cli,
              "ReqwestGitHubApiTransport, ReqwestOAuthTransport, SystemExecutor,",
              "ReqwestOAuthTransport, StreamingReqwestGitHubApiTransport, SystemExecutor,",
          )
          replace(
              cli,
              "ReqwestGitHubApiTransport::new()?",
              "StreamingReqwestGitHubApiTransport::new()?",
              count=2,
          )
          PY
          cargo fmt --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.rs'
          git commit -m "Fix GitHub OAuth compiler diagnostics and stream uploads"
          git push origin HEAD:agent/629-github-oauth-parity
