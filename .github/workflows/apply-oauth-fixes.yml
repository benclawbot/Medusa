name: Apply GitHub OAuth compiler fixes

on:
  push:
    branches:
      - agent/629-github-oauth-parity

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/629-github-oauth-parity
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0
        with:
          toolchain: stable
          components: rustfmt
      - name: Apply compiler corrections
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_all(filename, before, after, minimum=1):
              path = Path(filename)
              text = path.read_text()
              found = text.count(before)
              if found < minimum:
                  raise SystemExit(f"expected at least {minimum} occurrences in {filename}, found {found}: {before!r}")
              path.write_text(text.replace(before, after))

          replace_all(
              "crates/medusa-github/src/repository_creation/compatibility.rs",
              "#[derive(Clone, Debug, Eq, PartialEq)]\npub struct LegacyGitHubConversion",
              "#[derive(Clone, Debug, PartialEq)]\npub struct LegacyGitHubConversion",
          )
          replace_all(
              "crates/medusa-github/src/repository_creation/typed_prepare.rs",
              "use serde_json::{Map, Value, json};",
              "use serde_json::{Value, json};",
          )
          replace_all(
              "crates/medusa-github/src/repository_creation/typed_prepare.rs",
              "reviewers(",
              "prepare_reviewers(",
              minimum=3,
          )
          replace_all(
              "crates/medusa-github/src/repository_creation/coordinator.rs",
              "use std::{collections::BTreeMap, path::PathBuf};",
              "use std::collections::BTreeMap;",
          )
          replace_all(
              "crates/medusa-github/src/repository_creation/coordinator.rs",
              "use serde_json::{Map, Value, json};",
              "use serde_json::{Value, json};",
          )
          replace_all(
              "crates/medusa-github/src/repository_creation/coordinator.rs",
              "self.reconcile_existing(document, &prepared, attempt_id, request_digest)?",
              "self.reconcile_existing(document, &prepared, attempt_id.clone(), request_digest.clone())?",
          )
          replace_all(
              "crates/medusa-github/src/repository_creation/direct.rs",
              "StatusCode, ",
              "",
          )
          replace_all(
              "crates/medusa-github/src/repository_creation/direct.rs",
              "ETAG, ",
              "",
          )
          replace_all(
              "crates/medusa-cli/src/github_operation.rs",
              "ReqwestGitHubApiTransport",
              "StreamingReqwestGitHubApiTransport",
              minimum=3,
          )
          PY
          cargo fmt --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.rs'
          git commit -m "Fix GitHub OAuth compiler diagnostics and stream uploads"
          git push origin HEAD:agent/629-github-oauth-parity
