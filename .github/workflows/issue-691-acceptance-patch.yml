name: Issue 691 acceptance patch

on:
  push:
    branches:
      - agent/issue-691-mutation-dag

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/issue-691-mutation-dag
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0
        with:
          toolchain: 1.88.0
          components: rustfmt
      - name: Apply patch and clean helpers
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/issue-691-acceptance-patch.py
          cargo fmt --all
          git rm .github/workflows/issue-691-acceptance-patch.yml .github/issue-691-acceptance-patch.py
          git add crates/medusa-runtime/src/mutating_worker_coordinator.rs crates/medusa-runtime/src/parallel_mutation_batch.rs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: record parallel mutation efficiency and recover staging'
          git push origin HEAD:agent/issue-691-mutation-dag
