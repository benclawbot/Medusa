name: Repair 687 Tool DAG Verifier
on:
  push:
    branches: [perf/687-tool-dag]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Narrow engine import rewrite
        shell: python
        run: |
          from pathlib import Path
          p = Path('.github/workflows/fix-687-tool-dag.yml')
          s = p.read_text()
          old = "          s=s.replace('collections::VecDeque,', 'collections::{BTreeMap, VecDeque},')\n"
          new = "          old_import='''use std::{\\n    collections::VecDeque,\\n    path::Path,\\n    sync::{Arc, Mutex, atomic::AtomicBool},\\n    thread,\\n};'''\n          new_import='''use std::{\\n    collections::{BTreeMap, VecDeque},\\n    path::Path,\\n    sync::{Arc, Mutex, atomic::AtomicBool},\\n    thread,\\n};'''\n          assert old_import in s\n          s=s.replace(old_import,new_import,1)\n"
          assert old in s
          p.write_text(s.replace(old, new, 1))
      - name: Remove repair workflow and publish verifier fix
        run: |
          rm .github/workflows/repair-687-tool-dag-verifier.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/fix-687-tool-dag.yml .github/workflows/repair-687-tool-dag-verifier.yml
          git commit -m 'Fix #687 DAG verifier import targeting'
          git push origin HEAD:perf/687-tool-dag
