name: Issue 974 materialize

on:
  push:
    branches: [agent/974-provider-aware-tui]

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply provider-aware TUI fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected snippet missing in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          # TUI may perform authenticated loopback discovery and browser reconnect through the
          # same openai-oauth helper already used by first-run setup.
          replace(
              "crates/medusa-tui/Cargo.toml",
              "medusa-runtime = { path = \"../medusa-runtime\" }\nserde.workspace = true",
              "medusa-runtime = { path = \"../medusa-runtime\" }\nreqwest.workspace = true\nserde.workspace = true",
          )

          runtime = Path("crates/medusa-tui/src/runtime.rs")
          text = runtime.read_text()
          text = text.replace(
              "    thread,\n    time::Duration,\n};",
              "    process::{Command, Stdio},\n    thread,\n    time::Duration,\n};",
              1,
          )
          text = text.replace(
              "use medusa_config::{Config, Mode, credential_environment};",
              "use medusa_config::{Config, Mode, credential_environment, model_capabilities};",
              1,
          )
          marker = "const DAEMON_POLL_INTERVAL: Duration = Duration::from_millis(50);\n"
          if marker not in text:
              raise SystemExit("runtime marker missing")
          helper = r'''
const OPENAI_OAUTH_GATEWAY_MODELS: &str = "http://127.0.0.1:10531/v1/models";

fn openai_oauth_models() -> Result<Vec<String>, String> {
    let client = reqwest::blocking::Client::builder()
        .connect_timeout(Duration::from_millis(350))
        .timeout(Duration::from_secs(2))
        .build()
        .map_err(|error| format!("OAuth model discovery client failed: {error}"))?;
    let response = client
        .get(OPENAI_OAUTH_GATEWAY_MODELS)
        .send()
        .map_err(|error| format!("OAuth gateway is not ready: {error}"))?;
    if !response.status().is_success() {
        return Err(format!("OAuth gateway model discovery returned {}", response.status()));
    }
    let value: serde_json::Value = response
        .json()
        .map_err(|error| format!("OAuth model discovery returned invalid JSON: {error}"))?;
    let mut models = value
        .get("data")
        .and_then(serde_json::Value::as_array)
        .into_iter()
        .flatten()
        .filter_map(|item| item.get("id").and_then(serde_json::Value::as_str))
        .filter(|id| !id.trim().is_empty())
        .map(str::to_owned)
        .collect::<Vec<_>>();
    models.sort();
    models.dedup();
    if models.is_empty() {
        Err("OAuth gateway returned no selectable models".to_owned())
    } else {
        Ok(models)
    }
}

pub(crate) fn discover_openai_oauth_models() -> Vec<String> {
    openai_oauth_models().unwrap_or_default()
}

pub(crate) fn ensure_openai_oauth_connected() -> Result<Vec<String>, String> {
    if let Ok(models) = openai_oauth_models() {
        return Ok(models);
    }
    let status = Command::new("npx")
        .args([
            "--yes",
            "openai-oauth@latest",
            "login",
            "--open",
            "--login-timeout-ms",
            "300000",
        ])
        .stdin(Stdio::null())
        .stdout(Stdio::null())
        .stderr(Stdio::null())
        .status()
        .map_err(|error| {
            format!(
                "could not launch ChatGPT browser sign-in: {error}. Install Node.js and retry"
            )
        })?;
    if !status.success() {
        return Err(format!("ChatGPT browser sign-in exited with {status}"));
    }
    openai_oauth_models()
}
'''
          text = text.replace(marker, marker + helper, 1)

          old = '''    fn configure_model(&mut self, configuration: ModelConfiguration) -> Result<(), RuntimeError> {\n        self.sync_credential(&configuration.provider, configuration.api_key)?;\n        let provider = configuration.provider;\n        let model = configuration.model;'''
          new = '''    fn configure_model(&mut self, configuration: ModelConfiguration) -> Result<(), RuntimeError> {\n        self.sync_credential(&configuration.provider, configuration.api_key)?;\n        let provider = configuration.provider;\n        let model = configuration.model;\n        if provider == "openai-oauth" {\n            let available = ensure_openai_oauth_connected().map_err(invalid_runtime)?;\n            if !available.iter().any(|candidate| candidate == &model) {\n                return Err(invalid_runtime(format!(\n                    "model `{model}` is not available to the authenticated ChatGPT OAuth account"\n                )));\n            }\n        }'''
          if old not in text:
              raise SystemExit("configure_model snippet missing")
          text = text.replace(old, new, 1)

          old = '''        let acknowledgement = self.dispatch(FrontendCommand::SetEffort {\n            effort: configuration.effort.label().to_owned(),\n        })?;'''
          new = '''        let effort_label = configuration.effort.label();\n        let capabilities = model_capabilities(&provider, &model);\n        if capabilities.reasoning\n            && capabilities\n                .reasoning_effort_levels\n                .iter()\n                .any(|level| level == effort_label)\n        {\n            let acknowledgement = self.dispatch(FrontendCommand::RunCommand {\n                input: format!("/config set reasoning {effort_label}"),\n            })?;\n            if !matches!(\n                acknowledgement.result,\n                FrontendControlResult::CommandAccepted { .. }\n            ) {\n                return Err(invalid_runtime(\n                    "daemon rejected provider reasoning configuration",\n                ));\n            }\n        }\n        let acknowledgement = self.dispatch(FrontendCommand::SetEffort {\n            effort: effort_label.to_owned(),\n        })?;'''
          if old not in text:
              raise SystemExit("SetEffort snippet missing")
          text = text.replace(old, new, 1)
          runtime.write_text(text)

          models = Path("crates/medusa-tui/src/app/models.rs")
          text = models.read_text()
          text = text.replace(
              "    apply_provider_defaults, diagnose_config_catalog, provider_catalog_entry,\n    provider_ids_with_current, provider_model_options, repair_config_check,",
              "    apply_provider_defaults, diagnose_config_catalog, model_capabilities, provider_catalog_entry,\n    provider_ids_with_current, provider_model_options, repair_config_check,",
              1,
          )
          text = text.replace(
              "        let models = provider_model_options(selected_provider, current_model, &[]);",
              '''        let discovered = if selected_provider == "openai-oauth" {\n            crate::runtime::discover_openai_oauth_models()\n        } else {\n            Vec::new()\n        };\n        let models = provider_model_options(selected_provider, current_model, &discovered);''',
              1,
          )
          needle = '''    #[must_use]\n    pub fn api_key_mask(&self) -> String {'''
          insert = '''    #[must_use]\n    pub fn requires_api_key(&self) -> bool {\n        provider_catalog_entry(self.provider())\n            .is_some_and(|entry| entry.auth_methods.contains(&"api-key"))\n    }\n\n    fn effort_options(&self) -> Vec<Effort> {\n        let capabilities = model_capabilities(self.provider(), &self.selected_model());\n        let mut options = Vec::new();\n        for level in capabilities.reasoning_effort_levels {\n            match level.as_str() {\n                "low" => options.push(Effort::Low),\n                "medium" => options.push(Effort::Medium),\n                "high" => options.push(Effort::High),\n                _ => {}\n            }\n        }\n        if options.is_empty() {\n            vec![Effort::Auto]\n        } else {\n            options\n        }\n    }\n\n    fn normalize_effort(&mut self) {\n        let options = self.effort_options();\n        if !options.contains(&self.effort) {\n            self.effort = options.first().copied().unwrap_or(Effort::Auto);\n        }\n    }\n\n    fn refresh_selected_provider(&mut self, connect_oauth: bool) {\n        let provider = self.provider().to_owned();\n        let current = self.selected_model();\n        let discovered = if provider == "openai-oauth" {\n            if connect_oauth {\n                crate::runtime::ensure_openai_oauth_connected().unwrap_or_default()\n            } else {\n                crate::runtime::discover_openai_oauth_models()\n            }\n        } else {\n            Vec::new()\n        };\n        self.model_options = provider_model_options(&provider, &current, &discovered);\n        self.model_selection.set_selected(0, self.model_options.len());\n        self.normalize_effort();\n    }\n\n    #[must_use]\n    pub fn api_key_mask(&self) -> String {'''
          if needle not in text:
              raise SystemExit("api key insertion marker missing")
          text = text.replace(needle, insert, 1)

          old = '''    pub(super) fn cycle_focus(&mut self) {\n        self.focus = match self.focus {\n            ModelModalFocus::Provider => ModelModalFocus::Model,\n            ModelModalFocus::Model => ModelModalFocus::Effort,\n            ModelModalFocus::Effort => ModelModalFocus::ApiKey,\n            ModelModalFocus::ApiKey => ModelModalFocus::Apply,\n            ModelModalFocus::Apply => ModelModalFocus::Provider,\n        };\n    }'''
          new = '''    pub(super) fn cycle_focus(&mut self) {\n        self.focus = match self.focus {\n            ModelModalFocus::Provider => {\n                self.refresh_selected_provider(true);\n                ModelModalFocus::Model\n            }\n            ModelModalFocus::Model => ModelModalFocus::Effort,\n            ModelModalFocus::Effort if self.requires_api_key() => ModelModalFocus::ApiKey,\n            ModelModalFocus::Effort => ModelModalFocus::Apply,\n            ModelModalFocus::ApiKey => ModelModalFocus::Apply,\n            ModelModalFocus::Apply => ModelModalFocus::Provider,\n        };\n    }'''
          if old not in text:
              raise SystemExit("cycle_focus snippet missing")
          text = text.replace(old, new, 1)

          old = '''            ModelModalFocus::Provider => {\n                self.provider_selection\n                    .move_by(self.provider_options.len(), delta);\n                let provider = self.provider().to_owned();\n                self.model_options = provider_model_options(&provider, "", &[]);\n                self.model_selection\n                    .set_selected(0, self.model_options.len());\n            }\n            ModelModalFocus::Model => {\n                self.model_selection\n                    .move_by(self.model_options.len(), delta);\n            }\n            ModelModalFocus::Effort => {\n                const EFFORTS: [Effort; 4] =\n                    [Effort::Low, Effort::Medium, Effort::High, Effort::Auto];\n                let index = EFFORTS\n                    .iter()\n                    .position(|candidate| *candidate == self.effort)\n                    .unwrap_or(2);\n                self.effort = EFFORTS[cycle_index(index, EFFORTS.len(), delta)];\n            }'''
          new = '''            ModelModalFocus::Provider => {\n                self.provider_selection\n                    .move_by(self.provider_options.len(), delta);\n                self.refresh_selected_provider(false);\n            }\n            ModelModalFocus::Model => {\n                self.model_selection\n                    .move_by(self.model_options.len(), delta);\n                self.normalize_effort();\n            }\n            ModelModalFocus::Effort => {\n                let efforts = self.effort_options();\n                let index = efforts\n                    .iter()\n                    .position(|candidate| *candidate == self.effort)\n                    .unwrap_or(0);\n                self.effort = efforts[cycle_index(index, efforts.len(), delta)];\n            }'''
          if old not in text:
              raise SystemExit("move_selection snippet missing")
          text = text.replace(old, new, 1)

          # Never send an API key for auth-less OAuth routes even if stale input somehow exists.
          text = text.replace(
              "            api_key: (!self.api_key.is_empty()).then(|| self.api_key.clone()),",
              "            api_key: (self.requires_api_key() && !self.api_key.is_empty()).then(|| self.api_key.clone()),",
              1,
          )
          models.write_text(text)

          # Event handling must not focus/type into an API-key field for OAuth/none auth routes.
          modal = Path("crates/medusa-tui/src/app/modal_events.rs")
          text = modal.read_text()
          text = text.replace(
              "                if let Some(modal) = self.model_modal.as_mut() {\n                    modal.focus_api_key();\n                    modal.insert_key_text(&text);\n                }",
              "                if let Some(modal) = self.model_modal.as_mut()\n                    && modal.requires_api_key()\n                {\n                    modal.focus_api_key();\n                    modal.insert_key_text(&text);\n                }",
              1,
          )
          text = text.replace(
              "                    if let Some(modal) = self.model_modal.as_mut()\n                        && modal.focus() == ModelModalFocus::ApiKey\n                    {\n                        modal.delete_key_character();\n                    }",
              "                    if let Some(modal) = self.model_modal.as_mut()\n                        && modal.requires_api_key()\n                        && modal.focus() == ModelModalFocus::ApiKey\n                    {\n                        modal.delete_key_character();\n                    }",
              1,
          )
          text = text.replace(
              "                    if let ClipboardContent::Text(text) = clipboard\n                        && let Some(modal) = self.model_modal.as_mut()\n                    {\n                        modal.focus_api_key();\n                        modal.insert_key_text(&text);\n                    }",
              "                    if let ClipboardContent::Text(text) = clipboard\n                        && let Some(modal) = self.model_modal.as_mut()\n                        && modal.requires_api_key()\n                    {\n                        modal.focus_api_key();\n                        modal.insert_key_text(&text);\n                    }",
              1,
          )
          text = text.replace(
              "                    if let Some(modal) = self.model_modal.as_mut()\n                        && modal.focus() == ModelModalFocus::ApiKey\n                    {\n                        modal.insert_key_text(&character.to_string());\n                    }",
              "                    if let Some(modal) = self.model_modal.as_mut()\n                        && modal.requires_api_key()\n                        && modal.focus() == ModelModalFocus::ApiKey\n                    {\n                        modal.insert_key_text(&character.to_string());\n                    }",
              1,
          )
          modal.write_text(text)

          support = Path("crates/medusa-tui/src/render/support.rs")
          text = support.read_text()
          old = '''    lines.push(StyledLine::with_marker(\n        if focus == ApiKey { "› " } else { "  " },\n        if focus == ApiKey {\n            Color::Magenta\n        } else {\n            Color::DarkGrey\n        },\n        format!("API key   {}", model_modal.api_key_mask()),\n        if focus == ApiKey {\n            Color::White\n        } else {\n            Color::Grey\n        },\n    ));\n    if focus == ApiKey {\n        lines.push(StyledLine::new(\n            "Type or paste a replacement key (used only for this Medusa session).",\n            Color::DarkGrey,\n        ));\n    }'''
          new = '''    if model_modal.requires_api_key() {\n        lines.push(StyledLine::with_marker(\n            if focus == ApiKey { "› " } else { "  " },\n            if focus == ApiKey {\n                Color::Magenta\n            } else {\n                Color::DarkGrey\n            },\n            format!("API key   {}", model_modal.api_key_mask()),\n            if focus == ApiKey {\n                Color::White\n            } else {\n                Color::Grey\n            },\n        ));\n        if focus == ApiKey {\n            lines.push(StyledLine::new(\n                "Type or paste a replacement key (used only for this Medusa session).",\n                Color::DarkGrey,\n            ));\n        }\n    } else if model_modal.provider() == "openai-oauth" {\n        lines.push(StyledLine::new(\n            "Authentication  ChatGPT OAuth (browser sign-in; no API key)",\n            Color::Grey,\n        ));\n    }'''
          if old not in text:
              raise SystemExit("render api key snippet missing")
          text = text.replace(old, new, 1)
          support.write_text(text)

          # Add regressions close to the model modal implementation.
          models = Path("crates/medusa-tui/src/app/models.rs")
          text = models.read_text()
          text += r'''

#[cfg(test)]
mod provider_aware_model_modal_regression {
    use super::*;

    #[test]
    fn oauth_never_requires_or_emits_an_api_key() {
        let mut modal = ModelModal::new(Some("openai-oauth / gpt-5"), Some("effort:high"), true);
        assert!(!modal.requires_api_key());
        modal.api_key = "should-never-leak".to_owned();
        assert!(modal.configuration().api_key.is_none());
    }

    #[test]
    fn reasoning_effort_options_are_derived_from_model_capabilities() {
        let modal = ModelModal::new(Some("openai-oauth / gpt-5"), Some("effort:high"), false);
        assert_eq!(modal.effort_options(), vec![Effort::Low, Effort::Medium, Effort::High]);

        let modal = ModelModal::new(Some("minimax / MiniMax-M3"), Some("effort:high"), false);
        assert_eq!(modal.effort_options(), vec![Effort::Auto]);
    }
}
'''
          models.write_text(text)
          PY
      - name: Format
        run: cargo fmt --all -- --check || cargo fmt --all
      - name: Focused tests
        run: |
          cargo test -p medusa-config --locked
          cargo test -p medusa-tui --locked
      - name: Check runtime and TUI
        run: cargo check -p medusa-runtime -p medusa-tui --locked
      - name: Remove materializer and commit
        shell: bash
        run: |
          rm .github/workflows/issue-974-materialize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(tui): make OAuth model configuration provider-aware"
          git push origin HEAD:agent/974-provider-aware-tui
