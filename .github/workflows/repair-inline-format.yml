name: Repair Inline Format Lint

on:
  push:
    branches:
      - agent/local-execution-bridge

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/local-execution-bridge
      - name: Fix inline format argument
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/medusa-transaction-coordinator/src/lib.rs')
          text = path.read_text()
          old = 'format!("{:02x}", byte).repeat(32)'
          new = 'format!("{byte:02x}").repeat(32)'
          if old not in text:
              raise SystemExit('format lint target not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/medusa-transaction-coordinator/src/lib.rs
          git commit -m "Inline transaction fingerprint format argument"
          git push origin HEAD:agent/local-execution-bridge
