name: Materialize frontend command control plane

on:
  pull_request:
    branches:
      - agent/569-daemon-live-session-broker
    paths:
      - crates/medusa-daemon/src/frontend_control.rs
      - validation/materialize_569_frontend_control_plane.py
      - .github/workflows/materialize-569-frontend-control-plane.yml

permissions:
  contents: write

concurrency:
  group: materialize-569-frontend-control-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/569-frontend-control-plane'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0 # stable
      - name: Materialize reviewed frontend control wiring
        run: python3 validation/materialize_569_frontend_control_plane.py
      - name: Format and validate frontend control plane
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test -p medusa-daemon frontend_control
          cargo test -p medusa-daemon live_session
          cargo test -p medusa-protocol frontend
          cargo test -p medusa-runtime attachment
          cargo clippy -p medusa-daemon -p medusa-protocol -p medusa-runtime --all-targets --all-features -- -D warnings
      - name: Commit source-only result
        run: |
          git rm .github/workflows/materialize-569-frontend-control-plane.yml
          git rm validation/materialize_569_frontend_control_plane.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/medusa-daemon/Cargo.toml
          git add crates/medusa-daemon/src/lib.rs
          git add crates/medusa-daemon/src/live_session.rs
          git add crates/medusa-daemon/src/frontend_control.rs
          git add crates/medusa-runtime/src/lib.rs
          git commit -m "Add serialized frontend command control plane"
          git push origin HEAD:${{ github.head_ref }}
