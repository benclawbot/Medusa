name: Temporary wire final release verifier

on:
  push:
    branches:
      - fix/immutable-stable-release-publication

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/immutable-stable-release-publication
      - name: Wire final draft verification into stable signers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          release_ref = "          ref: $" + "{{ needs.prepare.outputs.sha }}\n"
          checkout = (
              "    steps:\n"
              "      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4\n"
              "        with:\n"
              + release_ref
              + "      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4\n"
          )
          original = """    steps:\n      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4\n"""
          publish = '          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false\n'
          verify = """          python3 scripts/verify-stable-release-authority.py \\\n            --tag "$RELEASE_TAG" \\\n            --repo "$GITHUB_REPOSITORY" \\\n            --require-draft\n          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false\n"""

          for name in (
              ".github/workflows/sign-release-manifest.yml",
              ".github/workflows/sign-release-manifest-recovery.yml",
          ):
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              if "scripts/verify-stable-release-authority.py" in text:
                  continue
              if text.count(original) != 1:
                  raise SystemExit(f"unexpected signer download-artifact shape: {name}")
              if text.count(publish) != 1:
                  raise SystemExit(f"unexpected signer publish shape: {name}")
              text = text.replace(original, checkout, 1).replace(publish, verify, 1)
              path.write_text(text, encoding="utf-8", newline="\n")
          PY
          git add .github/workflows/sign-release-manifest.yml .github/workflows/sign-release-manifest-recovery.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Verify final signed draft before publication"
          git push origin HEAD:fix/immutable-stable-release-publication
