name: Apply 655 Update Lifecycle

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: apply-655-lifecycle-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0 # 1.88.0
        with:
          components: rustfmt, clippy
      - name: Apply health-atomic lifecycle correction
        run: python3 scripts/apply-655-lifecycle-v2.py
      - name: Validate focused updater lifecycle
        shell: bash
        run: |
          set -o pipefail
          {
            cargo fmt --all
            cargo test -p medusa-update --all-targets --locked
            cargo test -p medusa-cli --bin medusa --locked update_command
            cargo clippy -p medusa-update -p medusa-cli --all-targets --locked -- -D warnings
          } 2>&1 | tee lifecycle-tests.log
      - name: Upload lifecycle test log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lifecycle-tests-${{ github.sha }}
          path: lifecycle-tests.log
          if-no-files-found: error
          retention-days: 2
      - name: Commit validated lifecycle correction
        shell: bash
        run: |
          set -euo pipefail
          git rm \
            .github/workflows/apply-655-lifecycle.yml \
            scripts/apply-655-lifecycle.py \
            scripts/apply-655-lifecycle-v2.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            crates/medusa-update/src/install.rs \
            crates/medusa-update/src/github.rs \
            crates/medusa-update/src/github/support.rs \
            crates/medusa-cli/src/update_command.rs \
            crates/medusa-cli/src/main.rs
          git commit -m "Finalize health-atomic verified updater lifecycle"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
