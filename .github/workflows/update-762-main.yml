name: Update PR 762 with main
on: push
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: issue-752-durable-session-actions
          fetch-depth: 0
      - run: |
          git config user.name benclawbot
          git config user.email 259942410+benclawbot@users.noreply.github.com
          git fetch origin main
          if ! git merge --no-edit origin/main; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            test "$conflicts" = "crates/medusa-agent/src/evidence.rs"
            git checkout --ours crates/medusa-agent/src/evidence.rs
            git add crates/medusa-agent/src/evidence.rs
            test -z "$(git diff --name-only --diff-filter=U)"
            git commit --no-edit
          fi
          git push origin HEAD:issue-752-durable-session-actions
