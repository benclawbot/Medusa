name: Refresh Documentation Inventory Once

on:
  push:
    branches:
      - fix/rolling-update-publish-race
    paths:
      - '.github/workflows/refresh-documentation-inventory-once.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Regenerate reviewed documentation inventory
        run: python3 scripts/check-documentation.py --write
      - name: Commit generated inventory through GitHub contents API
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          path='docs/documentation-inventory.json'
          sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=$GITHUB_REF_NAME" --jq .sha)"
          content="$(base64 -w0 "$path")"
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$path" \
            -f message='Refresh documentation inventory' \
            -f content="$content" \
            -f sha="$sha" \
            -f branch="$GITHUB_REF_NAME"
