name: Live provider dogfood

on:
  workflow_dispatch:
    inputs:
      model:
        description: Optional known MiniMax model override for a targeted diagnostic run
        required: false
        default: ""
        type: string
  schedule:
    - cron: "17 3 * * 1"
  pull_request:
    paths:
      - "scripts/live-coding-e2e.py"
      - "scripts/run-live-coding-e2e.py"
      - "scripts/live-model-selection.py"
      - "scripts/live-coding-e2e.sh"
      - "scripts/live-dogfood-report.py"
      - "scripts/run-live-dogfood-report.py"
      - "scripts/test-live-dogfood.py"
      - "scripts/test-live-model-selection.py"
      - "scripts/check-provider-support.py"
      - "docs/provider-support.json"
      - "docs/PROVIDER-SUPPORT.md"
      - "docs/LIVE-PROVIDER-DOGFOOD.md"
      - ".github/workflows/live-provider-dogfood.yml"

permissions:
  contents: write

concurrency:
  group: live-provider-dogfood-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch-956:
    name: Materialize issue 956 source fix
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/956-windows-longpaths-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - name: Patch worker Git commands and add regression
        shell: python
        run: |
          from pathlib import Path

          path = Path('crates/medusa-workers/src/lib.rs')
          text = path.read_text(encoding='utf-8')
          old = 'Command::new("git").args(args).current_dir(repo).output()?'
          new = 'git_command(repo).args(args).output()?'
          if text.count(old) != 5:
              raise SystemExit(f'expected 5 direct Git command sites, found {text.count(old)}')
          text = text.replace(old, new)

          anchor = '''fn run_git(repo: &Path, args: &[&str]) -> MedusaResult<()> {\n'''
          helper = '''fn git_command(repo: &Path) -> Command {\n    let mut command = Command::new("git");\n    command\n        .args(["-c", "core.longPaths=true"])\n        .current_dir(repo);\n    command\n}\n\n'''
          if anchor not in text:
              raise SystemExit('Git helper insertion point changed')
          text = text.replace(anchor, helper + anchor, 1)

          test_anchor = '''    #[test]\n    fn cleanup_removes_worktree_and_temporary_branch() {\n'''
          regression = '''    #[cfg(windows)]\n    #[test]\n    fn windows_cleanup_handles_deep_medusa_runtime_paths() {\n        let (_directory, repo, worktrees) = repository();\n        let manager = WorkerManager::new(&repo, &worktrees).expect("manager");\n        let base = manager.repository_head().expect("base");\n        let worker = manager\n            .create_worker("long-path-cleanup")\n            .expect("worker");\n        let worktree = worker.worktree.clone();\n        let execution_id = "e".repeat(64);\n        let session_id = "s".repeat(64);\n        let request_id = "r".repeat(64);\n        let artifact_id = "a".repeat(64);\n        let deep = worker\n            .worktree\n            .join(".medusa")\n            .join("executions")\n            .join(execution_id)\n            .join("sessions")\n            .join(session_id)\n            .join("request-manifests")\n            .join(request_id)\n            .join("artifacts")\n            .join(artifact_id);\n        fs::create_dir_all(&deep).expect("deep runtime directory");\n        let manifest = deep.join("request-manifest.json");\n        fs::write(&manifest, "{}\\n").expect("deep runtime manifest");\n        assert!(\n            manifest.as_os_str().to_string_lossy().len() > 260,\n            "fixture must exceed the legacy Windows path limit"\n        );\n\n        manager\n            .discard_untracked_runtime_state(&worker, &base)\n            .expect("discard deep runtime state");\n        assert!(!worker.worktree.join(".medusa").exists());\n\n        manager.cleanup(&[worker]).expect("cleanup worktree");\n        assert!(!worktree.exists());\n    }\n\n'''
          if test_anchor not in text:
              raise SystemExit('cleanup regression insertion point changed')
          text = text.replace(test_anchor, regression + test_anchor, 1)
          path.write_text(text, encoding='utf-8')
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0
      - name: Format and validate worker crate
        run: |
          cargo fmt --all
          cargo test -p medusa-workers --locked
      - name: Commit only the product fix
        shell: bash
        run: |
          git checkout origin/main -- .github/workflows/live-provider-dogfood.yml
          git config user.name 'Medusa CI'
          git config user.email 'medusa@users.noreply.github.com'
          git add crates/medusa-workers/src/lib.rs .github/workflows/live-provider-dogfood.yml
          git diff --cached --check
          git commit -m 'fix(workers): make Windows cleanup long-path safe'
          git push origin HEAD:${{ github.head_ref }}

  contract:
    name: Harness contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Compile and test the evidence contract
        run: |
          python -m py_compile scripts/live-coding-e2e.py scripts/run-live-coding-e2e.py scripts/live-model-selection.py scripts/live-dogfood-report.py scripts/run-live-dogfood-report.py scripts/test-live-dogfood.py scripts/test-live-model-selection.py scripts/check-provider-support.py
          python scripts/check-provider-support.py
          python scripts/test-live-dogfood.py
          python scripts/test-live-model-selection.py

  live-provider:
    name: Live installed binary (${{ matrix.platform }})
    needs: contract
    if: github.event_name != 'pull_request' || github.head_ref == 'agent/555-cross-platform-dogfood'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            os: ubuntu-latest
          - platform: macOS
            os: macos-latest
          - platform: Windows
            os: windows-2022
    env:
      MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
      MEDUSA_LIVE_MODEL: ${{ github.event.inputs.model || '' }}
      LIVE_E2E_TIMEOUT_SECONDS: "1500"
      LIVE_E2E_HEARTBEAT_SECONDS: "60"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0
      - name: Validate committed exact-build dependency authority
        run: cargo metadata --locked --format-version 1
      - name: Install Linux containment backend
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
      - name: Require and mask the live credential
        run: python -c "import os,sys; key=os.environ.get('MINIMAX_API_KEY',''); print('::add-mask::'+key) if key else sys.exit('MINIMAX_API_KEY is required')"
      - name: Run bounded live product dogfood
        run: python scripts/run-live-coding-e2e.py --output live-e2e-artifacts
      - name: Upload sanitized platform evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: live-provider-${{ matrix.platform }}
          path: live-e2e-artifacts
          if-no-files-found: error
          retention-days: 14

  report:
    name: Exact-build dogfood report
    needs: [contract, live-provider]
    if: always() && needs.contract.result == 'success' && needs.live-provider.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: live-provider-*
          path: live-provider-evidence
      - name: Validate and publish one cross-platform report
        run: |
          python scripts/run-live-dogfood-report.py \
            --input live-provider-evidence \
            --json live-provider-report/report.json \
            --markdown live-provider-report/report.md
      - name: Upload exact-build report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: live-provider-report
          path: live-provider-report
          if-no-files-found: error
          retention-days: 30
