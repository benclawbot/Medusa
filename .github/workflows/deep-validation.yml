name: Deep Validation

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deep-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    name: Exhaustive workspace validation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0 # 1.88.0
        with:
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: medusa-deep-validation
          add-job-id-key: "false"
      - name: Validate committed dependency authority
        run: cargo metadata --locked --format-version 1 >/dev/null
      - name: Full workspace tests
        env:
          MEDUSA_ALLOW_INSECURE_PROVIDER_HTTP: "1"
        run: cargo test --workspace --all-features --locked -- --nocapture
      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --locked --no-deps
      - name: Assert validation preserved Cargo.lock
        run: git diff --exit-code -- Cargo.lock
