name: Deep Validation

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deep-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    name: Exhaustive workspace validation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: medusa-deep-validation
          add-job-id-key: "false"
      - name: Validate committed dependency authority
        uses: ./.github/actions/cargo-locked
        with:
          command: "metadata --locked --format-version 1 >/dev/null"
      - name: Full all-target Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Production panic audit
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test-production-panic-exemptions.py
          python3 scripts/check-production-panic-exemptions.py
          cargo clippy --workspace --all-features --locked --lib --bins --examples -- \
            -D clippy::unwrap_used \
            -D clippy::expect_used \
            -D clippy::panic
      - name: Full workspace tests
        env:
          MEDUSA_ALLOW_INSECURE_PROVIDER_HTTP: "1"
        run: cargo test --workspace --all-features --locked -- --nocapture
      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --locked --no-deps
      - name: Assert validation preserved Cargo.lock
        run: git diff --exit-code -- Cargo.lock
