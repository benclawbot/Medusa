name: Live MiniMax TUI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-minimax-tui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  interactive-tui:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.draft == false &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        contains(github.event.pull_request.labels.*.name, 'final-issue-validation')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
      LIVE_TUI_TIMEOUT_SECONDS: '600'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0 # 1.88.0
      - name: Validate committed dependency authority
        run: cargo metadata --locked --format-version 1 >/dev/null
      - name: Install terminal and containment prerequisites
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns
          fi
      - name: Require configured live-test secret
        shell: bash
        run: |
          if [[ -z "${MINIMAX_API_KEY:-}" ]]; then
            echo 'MINIMAX_API_KEY repository secret is required for the live TUI gate.' >&2
            exit 2
          fi
          echo "::add-mask::$MINIMAX_API_KEY"
      - name: Apply diagnostic workaround for issue 952
        shell: python
        run: |
          from pathlib import Path

          path = Path("crates/medusa-runtime/src/attachment/session.rs")
          text = path.read_text(encoding="utf-8")
          old = '''    pub fn acknowledge_cursor(
              &mut self,
              cursor: u64,
              occurred_at_unix_ms: i64,
              event_id: impl Into<String>,
          ) -> Result<(), RuntimeError> {
              let outcome = continuity_store(&self.repo, &self.session.id.to_string())
                  .acknowledge_cursor(CursorAckRequest {
                      client_id: self.client_id.clone(),
                      expected_revision: self.continuity.revision,
                      cursor,
                      occurred_at_unix_ms,
                      event_id: event_id.into(),
                  })
                  .map_err(RuntimeError::agent)?;
              self.continuity = outcome.session().clone();
              Ok(())
          }
          '''
          new = '''    pub fn acknowledge_cursor(
              &mut self,
              cursor: u64,
              occurred_at_unix_ms: i64,
              event_id: impl Into<String>,
          ) -> Result<(), RuntimeError> {
              let store = continuity_store(&self.repo, &self.session.id.to_string());
              let event_id = event_id.into();
              let request = |expected_revision| CursorAckRequest {
                  client_id: self.client_id.clone(),
                  expected_revision,
                  cursor,
                  occurred_at_unix_ms,
                  event_id: event_id.clone(),
              };
              let outcome = match store.acknowledge_cursor(request(self.continuity.revision)) {
                  Ok(outcome) => outcome,
                  Err(ContinuityError::StaleRevision { .. }) => {
                      let refreshed = store.load().map_err(RuntimeError::agent)?;
                      validate_continuity_identity(&refreshed, &self.session.id.to_string())?;
                      store
                          .acknowledge_cursor(request(refreshed.revision))
                          .map_err(RuntimeError::agent)?
                  }
                  Err(error) => return Err(RuntimeError::agent(error)),
              };
              self.continuity = outcome.session().clone();
              Ok(())
          }
          '''
          if text.count(old) != 1:
              raise SystemExit("#952 diagnostic patch target changed")
          path.write_text(text.replace(old, new), encoding="utf-8")
      - name: Build the packaged Medusa entry point
        run: cargo build --release --locked --bin medusa
      - name: Submit and render one MiniMax-M2.7 answer through the real TUI
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/live-minimax-tui-cargo-target
        run: |
          sed -i.bak 's/MiniMax-M3/MiniMax-M2.7/g' scripts/live-tui-minimax-e2e.py
          python3 scripts/live-tui-minimax-e2e.py \
            --binary target/release/medusa \
            --work-root "${RUNNER_TEMP}/live-minimax-tui-work" \
            --output-dir live-tui-minimax-evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: live-minimax-tui-evidence
          path: live-tui-minimax-evidence
          if-no-files-found: warn
