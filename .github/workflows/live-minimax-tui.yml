name: Live MiniMax TUI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      model:
        description: Optional known MiniMax model override for a targeted diagnostic run
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: live-minimax-tui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  interactive-tui:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.draft == false &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        contains(github.event.pull_request.labels.*.name, 'final-issue-validation')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
      MEDUSA_LIVE_MODEL: ${{ github.event.inputs.model || '' }}
      LIVE_TUI_TIMEOUT_SECONDS: '600'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0 # 1.88.0
      - name: Validate committed dependency authority
        run: cargo metadata --locked --format-version 1 >/dev/null
      - name: Install terminal and containment prerequisites
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v bwrap >/dev/null 2>&1; then
            apt_args=(
              -o Acquire::Retries=2
              -o Acquire::http::Timeout=15
              -o Acquire::https::Timeout=15
              -o Acquire::http::ConnectTimeout=10
              -o Acquire::https::ConnectTimeout=10
            )
            if ! timeout --signal=TERM --kill-after=10s 120s sudo apt-get "${apt_args[@]}" update; then
              echo "::error title=Live prerequisite unavailable::apt update failed or exceeded 120s while installing bubblewrap"
              exit 2
            fi
            if ! timeout --signal=TERM --kill-after=10s 120s sudo apt-get "${apt_args[@]}" install --yes bubblewrap; then
              echo "::error title=Live prerequisite unavailable::bubblewrap installation failed or exceeded 120s"
              exit 2
            fi
          else
            echo "bubblewrap already available; skipping apt bootstrap"
          fi
          command -v bwrap >/dev/null 2>&1 || {
            echo "::error title=Live prerequisite unavailable::bubblewrap installation completed without a bwrap executable"
            exit 2
          }
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns
          fi
      - name: Require configured live-test secret
        shell: bash
        run: |
          if [[ -z "${MINIMAX_API_KEY:-}" ]]; then
            echo 'MINIMAX_API_KEY repository secret is required for the live TUI gate.' >&2
            exit 2
          fi
          echo "::add-mask::$MINIMAX_API_KEY"
      - name: Build the packaged Medusa entry point
        run: cargo build --release --locked --bin medusa
      - name: Submit and render one MiniMax answer through the real TUI
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/live-minimax-tui-cargo-target
        run: |
          python3 scripts/run-live-tui-minimax-e2e.py \
            --binary target/release/medusa \
            --work-root "${RUNNER_TEMP}/live-tui-minimax-work" \
            --output-dir live-tui-minimax-evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: live-minimax-tui-evidence
          path: live-tui-minimax-evidence
          if-no-files-found: warn
