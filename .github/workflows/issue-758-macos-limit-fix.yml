name: Issue 758 macOS limit fix

on:
  push:
    branches:
      - agent/issue-758-analysis-workspace

permissions:
  contents: write

jobs:
  integrate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Diagnose Darwin resident-set limit
        shell: bash
        run: |
          python3 - <<'PY'
          import resource, subprocess, sys
          for name in ['RLIMIT_RSS','RLIMIT_MEMLOCK']:
              if not hasattr(resource, name):
                  print(name, 'missing')
                  continue
              kind = getattr(resource, name)
              print(name, 'current', resource.getrlimit(kind))
              code = f'''import resource\nkind=getattr(resource,{name!r})\nsoft,hard=resource.getrlimit(kind)\nreq=536870912\ntarget=req if hard == resource.RLIM_INFINITY else min(req, hard)\nprint({name!r},soft,hard,target)\ntry:\n resource.setrlimit(kind,(target,hard)); print('soft-ok',resource.getrlimit(kind))\nexcept Exception as e:\n print('soft-fail',type(e).__name__,repr(e))\n'''
              subprocess.run([sys.executable, '-c', code], check=True)
          PY
      - name: Apply portable Unix resource limits
        shell: python
        run: |
          from pathlib import Path
          path = Path('crates/medusa-runtime/src/analysis_contained.rs')
          text = path.read_text()
          old = '''if sys.platform != "win32":
              import resource
              resource.setrlimit(resource.RLIMIT_CPU, (10, 10))
              resource.setrlimit(resource.RLIMIT_AS, (536870912, 536870912))
              resource.setrlimit(resource.RLIMIT_FSIZE, (16777216, 16777216))
              if hasattr(resource, "RLIMIT_NPROC"):
                  resource.setrlimit(resource.RLIMIT_NPROC, (1, 1))
          '''
          new = '''if sys.platform != "win32":
              import resource
              def tighten_limit(kind, requested):
                  _soft, hard = resource.getrlimit(kind)
                  target = requested if hard == resource.RLIM_INFINITY else min(requested, hard)
                  resource.setrlimit(kind, (target, hard))
              tighten_limit(resource.RLIMIT_CPU, 10)
              if sys.platform == "darwin":
                  tighten_limit(resource.RLIMIT_RSS, 536870912)
              else:
                  tighten_limit(resource.RLIMIT_AS, 536870912)
              tighten_limit(resource.RLIMIT_FSIZE, 16777216)
              if hasattr(resource, "RLIMIT_NPROC"):
                  tighten_limit(resource.RLIMIT_NPROC, 1)
          '''
          if old not in text:
              raise SystemExit('resource-limit block not found')
          path.write_text(text.replace(old, new, 1))
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check -p medusa-runtime -p medusa-agent -p medusa-process-containment --locked
      - name: Test contained backend
        run: cargo test -p medusa-runtime --test analysis_workspace_containment --locked -- --nocapture
      - name: Clippy
        run: cargo clippy -p medusa-runtime -p medusa-agent -p medusa-process-containment --locked --all-targets -- -D warnings
      - name: Commit production fix
        shell: bash
        run: |
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add crates/medusa-runtime/src/analysis_contained.rs
            git commit -m "fix(containment): use Darwin resident-set analysis limit"
            git push
          fi
