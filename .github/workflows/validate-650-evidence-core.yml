name: Validate 650 Evidence Core

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: validate-650-evidence-core-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event.pull_request.number == 663 && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0 # 1.88.0
        with:
          components: rustfmt, clippy
      - name: Validate evidence authority crate
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          changed="$(git diff --name-only | sort)"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(Cargo.lock|crates/medusa-evidence/src/(artifact|change|evidence|lib|verification)\.rs)$' || true)"
          test -z "$unexpected"
          cargo fmt --all -- --check
          cargo check -p medusa-evidence --all-targets
          cargo test -p medusa-evidence
          cargo clippy -p medusa-evidence --all-targets -- -D warnings
      - name: Publish formatted source and lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/');
          const branch = process.env.HEAD_REF;
          const token = process.env.GITHUB_TOKEN;
          const paths = [
            'Cargo.lock',
            'crates/medusa-evidence/src/artifact.rs',
            'crates/medusa-evidence/src/change.rs',
            'crates/medusa-evidence/src/evidence.rs',
            'crates/medusa-evidence/src/lib.rs',
            'crates/medusa-evidence/src/verification.rs',
          ];
          async function request(url, options = {}) {
            const response = await fetch(`https://api.github.com${url}`, {
              ...options,
              headers: {
                Accept: 'application/vnd.github+json',
                Authorization: `Bearer ${token}`,
                'X-GitHub-Api-Version': '2022-11-28',
                'User-Agent': 'medusa-evidence-core',
              },
            });
            const text = await response.text();
            const data = text ? JSON.parse(text) : {};
            if (!response.ok) throw new Error(`${response.status} ${text}`);
            return data;
          }
          (async () => {
            for (const path of paths) {
              const encoded = path.split('/').map(encodeURIComponent).join('/');
              const current = await request(`/repos/${owner}/${repo}/contents/${encoded}?ref=${encodeURIComponent(branch)}`);
              const desired = fs.readFileSync(path);
              const existing = Buffer.from((current.content || '').replace(/\n/g, ''), 'base64');
              if (existing.equals(desired)) {
                console.log(`unchanged ${path}`);
                continue;
              }
              const updated = await request(`/repos/${owner}/${repo}/contents/${encoded}`, {
                method: 'PUT',
                body: JSON.stringify({
                  message: `Validate evidence core: ${path}`,
                  content: desired.toString('base64'),
                  sha: current.sha,
                  branch,
                }),
              });
              console.log(`published ${path} at ${updated.commit.sha}`);
            }
          })().catch((error) => {
            console.error(error.stack || String(error));
            process.exit(1);
          });
          NODE
