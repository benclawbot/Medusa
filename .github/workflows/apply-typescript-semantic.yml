name: Apply TypeScript semantic tranche
on:
  push:
    branches: [codex/656-typescript-semantic-readonly]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Apply verified source patch
        run: |
          cat .medusa-ts-semantic/chunk* | base64 -d > /tmp/change.patch
          echo '38b36ab6e36b9e5303e38dfad570eb397d0758713e41c759f335ad6b658e9e17  /tmp/change.patch' | sha256sum -c -
          git apply -p2 --check /tmp/change.patch
          git apply -p2 /tmp/change.patch
          rm -rf .medusa-ts-semantic .github/workflows/apply-typescript-semantic.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add TypeScript semantic production queries'
          git push
