name: Verify 687 Downstream Failure Propagation
on:
  push:
    branches: [perf/687-downstream-failure-propagation]
permissions:
  contents: write
jobs:
  verify-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0
        with:
          components: rustfmt, clippy
      - name: Apply downstream failure propagation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              s = p.read_text()
              assert s.count(old) >= count, f"anchor missing in {path}: {old[:100]!r}"
              p.write_text(s.replace(old, new, count))

          path = 'crates/medusa-agent/src/tool_dag.rs'
          anchor = '''pub(crate) fn drain_positions<T>(queue: &mut VecDeque<T>, positions: &[usize]) -> Vec<T> {\n'''
          addition = '''pub(crate) fn drain_failed_dependents<I>(\n    queue: &mut VecDeque<(I, String, Value)>,\n    failed: &[(String, Value)],\n) -> Vec<(I, String, Value)> {\n    if queue.is_empty() || failed.is_empty() {\n        return Vec::new();\n    }\n    let mut blockers = failed\n        .iter()\n        .map(|(name, input)| profile(name, input))\n        .collect::<Vec<_>>();\n    let mut blocked = Vec::new();\n    let mut retained = VecDeque::new();\n    for (id, name, input) in std::mem::take(queue) {\n        let current = profile(&name, &input);\n        if blockers.iter().any(|prior| depends_on(prior, &current)) {\n            blockers.push(current);\n            blocked.push((id, name, input));\n        } else {\n            retained.push_back((id, name, input));\n        }\n    }\n    *queue = retained;\n    blocked\n}\n\n'''
          replace(path, anchor, addition + anchor)

          helper_anchor = '''    fn calls(items: &[(&str, Value)]) -> Vec<(String, Value)> {\n        items\n            .iter()\n            .map(|(name, input)| ((*name).to_owned(), input.clone()))\n            .collect()\n    }\n'''
          helper = helper_anchor + '''\n    fn queued_calls(items: &[(&str, Value)]) -> VecDeque<(String, String, Value)> {\n        calls(items)\n            .into_iter()\n            .enumerate()\n            .map(|(index, (name, input))| (format!("call-{index}"), name, input))\n            .collect()\n    }\n'''
          replace(path, helper_anchor, helper)

          test_anchor = '''    #[test]\n    fn non_idempotent_calls_never_have_dedup_keys() {\n'''
          tests = '''    #[test]\n    fn failed_dependency_blocks_conflicting_downstream_calls_transitively() {\n        let mut queue = queued_calls(&[\n            ("fs_write", json!({"path":"a.rs","content":"x"})),\n            ("fs_read", json!({"path":"b.rs"})),\n            ("apply_structured_patch", json!({"repository_revision":"r","edits":[]})),\n            ("web_fetch", json!({"url":"https://example.com"})),\n        ]);\n        let failed = calls(&[("fs_read", json!({"path":"a.rs"}))]);\n        let blocked = drain_failed_dependents(&mut queue, &failed);\n        assert_eq!(\n            blocked.iter().map(|(_, name, _)| name.as_str()).collect::<Vec<_>>(),\n            vec!["fs_write", "fs_read", "apply_structured_patch"]\n        );\n        assert_eq!(\n            queue.iter().map(|(_, name, _)| name.as_str()).collect::<Vec<_>>(),\n            vec!["web_fetch"]\n        );\n    }\n\n    #[test]\n    fn failed_network_dependency_does_not_cancel_repository_work() {\n        let mut queue = queued_calls(&[\n            ("fs_read", json!({"path":"a.rs"})),\n            ("web_fetch", json!({"url":"https://example.com/next"})),\n        ]);\n        let failed = calls(&[("web_search", json!({"query":"docs"}))]);\n        let blocked = drain_failed_dependents(&mut queue, &failed);\n        assert!(blocked.is_empty());\n        assert_eq!(queue.len(), 2);\n    }\n\n'''
          replace(path, test_anchor, tests + test_anchor)

          path = 'crates/medusa-agent/src/engine.rs'
          anchor = '''fn audited_tool_name(name: &str, input: &serde_json::Value) -> String {\n'''
          helper = '''fn dependency_failure_error(name: &str) -> MedusaError {\n    let mut error = MedusaError::new(\n        ErrorCode::DependencyUnavailable,\n        ErrorCategory::Execution,\n        format!("tool {name} was cancelled because an authoritative dependency failed"),\n    );\n    error.context.insert(\n        "authoritative_dependency_failed".into(),\n        serde_json::Value::Bool(true),\n    );\n    error\n}\n\n'''
          replace(path, anchor, helper + anchor)

          anchor = '''            for (id, name, input, result) in executed {\n'''
          new = '''            let failed_dependencies = executed\n                .iter()\n                .filter_map(|(_, name, input, result)| {\n                    let error = result.as_ref().err()?;\n                    let awaiting_approval = error.code == ErrorCode::PolicyDenied\n                        && self.config.agent.mode != Mode::ReadOnly\n                        && self.execution_policy.denial_reason(name, input).is_none()\n                        && interactively_approvable(name, input);\n                    (!awaiting_approval).then(|| (name.clone(), input.clone()))\n                })\n                .collect::<Vec<_>>();\n            let blocked = crate::tool_dag::drain_failed_dependents(\n                &mut calls,\n                &failed_dependencies,\n            );\n            let mut executed = executed;\n            executed.extend(blocked.into_iter().map(|(id, name, input)| {\n                let error = dependency_failure_error(&name);\n                (id, name, input, Err(error))\n            }));\n\n            for (id, name, input, result) in executed {\n'''
          replace(path, anchor, new)
          PY
      - name: Format
        run: cargo fmt --all -- --check || (cargo fmt --all && cargo fmt --all -- --check)
      - name: Tool DAG tests
        run: cargo test -p medusa-agent tool_dag -- --nocapture
      - name: Agent library tests
        run: cargo test -p medusa-agent --lib -- --nocapture
      - name: Clippy
        run: cargo clippy -p medusa-agent --all-targets --all-features -- -D warnings
      - name: Publish verified source only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/medusa-agent/src/tool_dag.rs crates/medusa-agent/src/engine.rs
          git commit -m 'Cancel downstream DAG work after dependency failure'
          git push origin HEAD:perf/687-downstream-failure-propagation
