name: Apply documentation inventory fix

on:
  push:
    branches:
      - feat/persistent-permission-modes

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/persistent-permission-modes
          fetch-depth: 0
      - name: Refresh documentation inventory
        run: python3 scripts/check-documentation.py --write
      - name: Validate documentation inventory
        run: python3 scripts/check-documentation.py
      - name: Commit inventory
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/documentation-inventory.json
          git commit -m "docs: refresh documentation inventory"
          git push origin HEAD:feat/persistent-permission-modes
