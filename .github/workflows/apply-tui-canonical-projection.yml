name: Apply TUI canonical projection

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: apply-tui-canonical-projection
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ github.event.pull_request.head.ref == 'agent/652-tui-canonical-projection' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/652-tui-canonical-projection
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0 # 1.88.0
        with:
          components: clippy,rustfmt
      - name: Apply verified canonical TUI patch
        run: python3 .github/scripts/apply-tui-canonical-projection.py
      - name: Apply generated Clippy correction
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/medusa-tui/src/runtime.rs")
          text = path.read_text(encoding="utf-8")
          old = """                            description: (option.value != option.label)
                                .then_some(option.value)
                                .unwrap_or_default(),
                            label: option.label,
"""
          new = """                            description: if option.value != option.label {
                                option.value
                            } else {
                                String::new()
                            },
                            label: option.label,
"""
          if text.count(old) != 1:
              raise SystemExit(f"expected one generated Clippy anchor, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Refresh dependency lock
        run: cargo generate-lockfile
      - name: Format
        run: cargo fmt --all
      - name: Validate focused crates
        run: cargo test -p medusa-protocol -p medusa-runtime -p medusa-tui --all-targets --locked
      - name: Lint focused crates
        run: cargo clippy -p medusa-protocol -p medusa-runtime -p medusa-tui --all-targets --locked -- -D warnings
      - name: Validate architecture index
        run: python3 scripts/check-architecture-index.py
      - name: Remove one-shot generator
        run: |
          rm .github/scripts/apply-tui-canonical-projection.py
          rm .github/scripts/tui-generator-rerun.txt
          rm .github/workflows/apply-tui-canonical-projection.yml
      - name: Commit generated implementation
        run: |
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Migrate TUI to canonical frontend projection"
          git push origin HEAD:agent/652-tui-canonical-projection
