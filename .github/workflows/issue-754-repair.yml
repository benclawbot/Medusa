name: Issue 754 repair

on:
  push:
    paths:
      - '.github/workflows/issue-754-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/issue-754-compaction-manifest-v2
      - name: Repair and integrate
        shell: python
        run: |
          from pathlib import Path

          compaction = Path('crates/medusa-agent/src/compaction_v2.rs')
          text = compaction.read_text()
          needle = '            MessageBlock::Image { .. } => None,\n'
          if '            MessageBlock::Text { .. } => None,\n' not in text:
              if needle not in text:
                  raise SystemExit('could not locate semantic match tail')
              text = text.replace(needle, '            MessageBlock::Text { .. } => None,\n' + needle, 1)
          compaction.write_text(text)

          lib = Path('crates/medusa-agent/src/lib.rs')
          text = lib.read_text()
          if 'pub mod compaction_v2;' not in text:
              text = text.replace('mod approval;\n', 'mod approval;\npub mod compaction_v2;\n', 1)
          lib.write_text(text)

          support = Path('crates/medusa-agent/src/engine_support.rs')
          text = support.read_text()
          text = text.replace(
              'ImageSource, Message, MessageBlock, ProviderCapabilities, ProviderExecutionPhase, Role,\n',
              'ImageSource, Message, MessageBlock, ProviderCapabilities, ProviderExecutionPhase,\n',
              1,
          )
          if 'without requiring a live model provider' in text:
              start = text.index('/// Compacts durable session history without requiring a live model provider.\npub fn compact_session')
              end = text.index('pub(crate) fn compact_message_text', start)
              replacement = '''/// Compacts durable session history into a crash-safe V2 hybrid manifest.\npub fn compact_session(session: &mut AgentSession, focus: Option<&str>) -> MedusaResult<()> {\n    compact_session_with_semantic(session, focus, None)\n}\n\npub(crate) fn compact_session_with_semantic(\n    session: &mut AgentSession,\n    focus: Option<&str>,\n    semantic: Option<crate::compaction_v2::ValidatedSemanticSummary>,\n) -> MedusaResult<()> {\n    let original_messages = session.messages.len();\n    let source_event_sequences = session.events.iter().map(|event| event.sequence).collect::<Vec<_>>();\n    let migrated_v1 = session.messages.iter().flat_map(|message| &message.content).any(|block| {\n        matches!(block, MessageBlock::Text { text } if text.starts_with("[medusa-compaction-v1]"))\n    });\n    let prepared = crate::compaction_v2::prepare_with_semantic(session, focus, semantic)?;\n    let generation = prepared.manifest.generation;\n    let mut preserved_sections = prepared.preserved_sections;\n    preserved_sections.push(format!("migrated_v1={migrated_v1}"));\n    if !session.tool_artifacts.contains(&prepared.manifest_path) {\n        session.tool_artifacts.push(prepared.manifest_path.clone());\n    }\n    session.messages = prepared.projection;\n    append_event(\n        session,\n        Actor::Coordinator,\n        EventPayload::ConversationCompacted {\n            original_messages: u32::try_from(original_messages).unwrap_or(u32::MAX),\n            retained_messages: u32::try_from(session.messages.len()).unwrap_or(u32::MAX),\n            generation,\n            source_event_sequences,\n            preserved_sections,\n        },\n    )?;\n    session.updated_at = OffsetDateTime::now_utc();\n    persist(session)\n}\n\n'''
              text = text[:start] + replacement + text[end:]
          support.write_text(text)
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0 # 1.88.0
      - run: cargo generate-lockfile
      - run: cargo fmt --all
      - run: cargo test -p medusa-agent compaction --locked -- --nocapture
      - run: cargo check -p medusa-agent --locked
      - name: Commit product integration
        run: |
          git config user.name 'BenClawBot (AlphaOM3G1)'
          git config user.email 'benclawbot@gmail.com'
          git add crates/medusa-agent/src/lib.rs crates/medusa-agent/src/engine_support.rs crates/medusa-agent/src/compaction_v2.rs
          git commit -m 'feat: activate compaction manifest v2'
          git push origin HEAD:agent/issue-754-compaction-manifest-v2
