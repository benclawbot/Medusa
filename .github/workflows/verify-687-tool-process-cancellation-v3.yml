name: Verify 687 Tool Process Cancellation V3
on:
  push:
    branches: [perf/687-tool-process-cancellation]
permissions:
  contents: write
jobs:
  verify-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0
        with:
          components: rustfmt, clippy
      - name: Apply cancellation source patch with compile repairs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/verify-687-tool-process-cancellation.yml').read_text()
          start = workflow.index("          python - <<'PY'\n") + len("          python - <<'PY'\n")
          end = workflow.index("          PY\n      - name: Format", start)
          lines = workflow[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'

          old = '''replace(\n    'crates/medusa-agent/src/engine.rs',\n    '                    execute_approved_tool(&session.repo, &name, &input)',\n    ''' + "'''" + '''                    execute_approved_tool_cancellable(\\n                        &session.repo,\\n                        &name,\\n                        &input,\\n                        self.cancellation.as_ref(),\\n                    )''' + "'''" + ''',\n)'''
          new = '''replace(\n    'crates/medusa-agent/src/engine.rs',\n    '                let result = execute_approved_tool(&session.repo, &approval.tool, &approval.input);',\n    ''' + "'''" + '''                let result = execute_approved_tool_cancellable(\\n                    &session.repo,\\n                    &approval.tool,\\n                    &approval.input,\\n                    self.cancellation.as_ref(),\\n                );''' + "'''" + ''',\n)'''
          assert old in script
          script = script.replace(old, new, 1)
          Path('/tmp/apply_cancel.py').write_text(script)
          PY
          python /tmp/apply_cancel.py
          python - <<'PY'
          from pathlib import Path

          # Repair shell signature targeting: compatibility wrappers stay four-argument,
          # and only the internal validated runner carries the optional cancellation token.
          p = Path('crates/medusa-agent/src/tools/shell.rs')
          s = p.read_text()
          wrong_run = '''pub(crate) fn run(\n    repo: &Path,\n    program: &str,\n    args: &[String],\n    output_mode: OutputMode,\n    cancellation: Option<&AtomicBool>,\n) -> MedusaResult<String> {'''
          right_run = '''pub(crate) fn run(\n    repo: &Path,\n    program: &str,\n    args: &[String],\n    output_mode: OutputMode,\n) -> MedusaResult<String> {'''
          assert wrong_run in s
          s = s.replace(wrong_run, right_run, 1)
          old_validated = '''fn run_validated(\n    repo: &Path,\n    program: &str,\n    args: &[String],\n    output_mode: OutputMode,\n) -> MedusaResult<String> {'''
          new_validated = '''fn run_validated(\n    repo: &Path,\n    program: &str,\n    args: &[String],\n    output_mode: OutputMode,\n    cancellation: Option<&AtomicBool>,\n) -> MedusaResult<String> {'''
          assert old_validated in s
          s = s.replace(old_validated, new_validated, 1)
          p.write_text(s)

          # The parallel executor must capture only the cancellation token, not AgentEngine<P>,
          # otherwise ModelProvider P would incorrectly need Sync.
          p = Path('crates/medusa-agent/src/engine.rs')
          s = p.read_text()
          marker = '                let cache = &safe_tool_cache;\n                map_parallel_ordered(batch, |(id, name, input)| {'
          assert marker in s
          s = s.replace(
              marker,
              '                let cache = &safe_tool_cache;\n                let cancellation = Arc::clone(&self.cancellation);\n                map_parallel_ordered(batch, |(id, name, input)| {',
              1,
          )
          before, after = s.split('                map_parallel_ordered(batch, |(id, name, input)| {', 1)
          assert 'self.cancellation.as_ref()' in after
          after = after.replace('self.cancellation.as_ref()', 'cancellation.as_ref()', 1)
          p.write_text(before + '                map_parallel_ordered(batch, |(id, name, input)| {' + after)
          PY
      - name: Format
        run: cargo fmt --all -- --check || (cargo fmt --all && cargo fmt --all -- --check)
      - name: Agent library tests
        run: cargo test -p medusa-agent --lib -- --nocapture
      - name: Process containment tests
        run: cargo test -p medusa-process-containment --lib -- --nocapture
      - name: Clippy
        run: cargo clippy -p medusa-agent -p medusa-process-containment --all-targets --all-features -- -D warnings
      - name: Publish verified source only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/medusa-agent/src/engine.rs crates/medusa-agent/src/policy.rs crates/medusa-agent/src/tools/mod.rs crates/medusa-agent/src/tools/shell.rs crates/medusa-agent/src/windows_sandbox.rs crates/medusa-process-containment/src/lib.rs crates/medusa-process-containment/src/base_container.rs
          git commit -m 'Propagate cancellation into contained tool subprocesses'
          git push origin HEAD:perf/687-tool-process-cancellation
