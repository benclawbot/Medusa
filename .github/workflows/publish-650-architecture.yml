name: Publish 650 Evidence Architecture

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: publish-650-evidence-architecture-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  publish:
    if: github.event.pull_request.number == 663 && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Regenerate validated architecture
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply-650-architecture.py
          python3 scripts/test-architecture-index.py
          python3 scripts/check-architecture-index.py
          python3 scripts/check-mutation-lifecycle.py
          python3 scripts/check-evidence-authority.py
          python3 scripts/architecture-conformance.py --known-failures --json
      - name: Publish non-workflow architecture files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/');
          const branch = process.env.HEAD_REF;
          const token = process.env.GITHUB_TOKEN;
          const paths = [
            'docs/architecture/INDEX.md',
            'docs/architecture/baseline.json',
            'docs/architecture/owners.json',
            'scripts/architecture-conformance.py',
            'scripts/check-architecture-index.py',
            'scripts/check-evidence-authority.py',
          ];
          async function request(url, options = {}) {
            const response = await fetch(`https://api.github.com${url}`, {
              ...options,
              headers: {
                Accept: 'application/vnd.github+json',
                Authorization: `Bearer ${token}`,
                'X-GitHub-Api-Version': '2022-11-28',
                'User-Agent': 'medusa-evidence-architecture-publisher',
              },
            });
            const text = await response.text();
            let data = {};
            if (text) data = JSON.parse(text);
            return { response, data, text };
          }
          (async () => {
            for (const path of paths) {
              const encoded = path.split('/').map(encodeURIComponent).join('/');
              const current = await request(`/repos/${owner}/${repo}/contents/${encoded}?ref=${encodeURIComponent(branch)}`);
              if (!current.response.ok && current.response.status !== 404) {
                throw new Error(`GET ${path}: ${current.response.status} ${current.text}`);
              }
              const desired = fs.readFileSync(path);
              if (current.response.ok) {
                const existing = Buffer.from((current.data.content || '').replace(/\n/g, ''), 'base64');
                if (existing.equals(desired)) continue;
              }
              const body = {
                message: `Record evidence authority architecture: ${path}`,
                content: desired.toString('base64'),
                branch,
              };
              if (current.response.ok) body.sha = current.data.sha;
              const updated = await request(`/repos/${owner}/${repo}/contents/${encoded}`, {
                method: 'PUT',
                body: JSON.stringify(body),
              });
              if (!updated.response.ok) {
                throw new Error(`PUT ${path}: ${updated.response.status} ${updated.text}`);
              }
            }
          })().catch((error) => {
            console.error(error.stack || String(error));
            process.exit(1);
          });
          NODE
