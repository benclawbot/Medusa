name: Implement issue 305 capabilities

on:
  push:
    branches:
      - issue-305-explicit-capabilities

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-305-explicit-capabilities
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt
      - name: Add explicit capability runtime
        shell: bash
        run: |
          cat > crates/medusa-capabilities/src/explicit.rs <<'RS'
          use std::{
              collections::{BTreeMap, BTreeSet},
              path::{Path, PathBuf},
          };

          use medusa_core::{ErrorCategory, ErrorCode, MedusaError, MedusaResult};
          use medusa_github::{AuthStatus, CommandExecutor, GitHubService};
          use medusa_improvement::ImprovementProposal;
          use medusa_transaction_coordinator::{
              CoordinatorError, Decision, Participant, TransactionCoordinator, TransactionPhase, Vote,
          };
          use serde::{Deserialize, Serialize};
          use sha2::{Digest, Sha256};

          use crate::{Capability, CapabilityRegistry, CapabilityState};

          #[derive(Clone, Copy, Debug, Deserialize, Eq, Ord, PartialEq, PartialOrd, Serialize)]
          #[serde(rename_all = "snake_case")]
          pub enum CapabilityPermission {
              Read,
              Write,
              RepositoryMutation,
              RuntimeMutation,
          }

          #[derive(Clone, Debug, Deserialize, Eq, PartialEq, Serialize)]
          pub struct CapabilityDescriptor {
              pub id: String,
              pub capability: Capability,
              pub description: String,
              pub permissions: BTreeSet<CapabilityPermission>,
              pub explicit_approval: BTreeSet<CapabilityPermission>,
          }

          #[must_use]
          pub fn github_descriptor() -> CapabilityDescriptor {
              CapabilityDescriptor {
                  id: "github_operations".into(),
                  capability: Capability::GitHub,
                  description: "Authenticated GitHub reads and explicitly approved writes through medusa-github".into(),
                  permissions: BTreeSet::from([
                      CapabilityPermission::Read,
                      CapabilityPermission::Write,
                      CapabilityPermission::RepositoryMutation,
                  ]),
                  explicit_approval: BTreeSet::from([
                      CapabilityPermission::Write,
                      CapabilityPermission::RepositoryMutation,
                  ]),
              }
          }

          #[must_use]
          pub fn self_improvement_descriptor() -> CapabilityDescriptor {
              CapabilityDescriptor {
                  id: "self_improvement".into(),
                  capability: Capability::SelfImprovement,
                  description: "Reviewable improvement proposals committed through the transaction coordinator".into(),
                  permissions: BTreeSet::from([
                      CapabilityPermission::Read,
                      CapabilityPermission::RepositoryMutation,
                      CapabilityPermission::RuntimeMutation,
                  ]),
                  explicit_approval: BTreeSet::from([
                      CapabilityPermission::RepositoryMutation,
                      CapabilityPermission::RuntimeMutation,
                  ]),
              }
          }

          #[derive(Clone, Debug, Deserialize, Eq, PartialEq, Serialize)]
          pub struct CapabilityGrant {
              pub capability: Capability,
              pub permissions: BTreeSet<CapabilityPermission>,
          }

          #[derive(Clone, Debug, Deserialize, Eq, PartialEq, Serialize)]
          pub struct CapabilityAuditEvent {
              pub sequence: u64,
              pub descriptor_id: String,
              pub capability: Capability,
              pub permission: CapabilityPermission,
              pub allowed: bool,
              pub explicit_approval: bool,
              pub reason: String,
          }

          pub struct CapabilityAuthorizer {
              registry: CapabilityRegistry,
              grants: BTreeMap<Capability, BTreeSet<CapabilityPermission>>,
              events: Vec<CapabilityAuditEvent>,
          }

          impl CapabilityAuthorizer {
              #[must_use]
              pub fn new(registry: CapabilityRegistry, grants: Vec<CapabilityGrant>) -> Self {
                  let grants = grants
                      .into_iter()
                      .map(|grant| (grant.capability, grant.permissions))
                      .collect();
                  Self {
                      registry,
                      grants,
                      events: Vec::new(),
                  }
              }

              pub fn require(
                  &mut self,
                  descriptor: &CapabilityDescriptor,
                  permission: CapabilityPermission,
                  explicit_approval: bool,
              ) -> MedusaResult<()> {
                  let available = self.registry.available(descriptor.capability);
                  let declared = descriptor.permissions.contains(&permission);
                  let granted = self
                      .grants
                      .get(&descriptor.capability)
                      .is_some_and(|permissions| permissions.contains(&permission));
                  let approval_required = descriptor.explicit_approval.contains(&permission);
                  let approval_satisfied = !approval_required || explicit_approval;
                  let allowed = available && declared && granted && approval_satisfied;
                  let reason = if !available {
                      self.registry.state(descriptor.capability).detail
                  } else if !declared {
                      "permission is not declared by the capability".into()
                  } else if !granted {
                      "permission was not granted".into()
                  } else if !approval_satisfied {
                      "explicit approval is required".into()
                  } else {
                      "capability permission granted".into()
                  };
                  self.events.push(CapabilityAuditEvent {
                      sequence: self.events.len() as u64 + 1,
                      descriptor_id: descriptor.id.clone(),
                      capability: descriptor.capability,
                      permission,
                      allowed,
                      explicit_approval,
                      reason: reason.clone(),
                  });
                  if allowed {
                      Ok(())
                  } else {
                      Err(policy_denied(reason))
                  }
              }

              #[must_use]
              pub fn events(&self) -> &[CapabilityAuditEvent] {
                  &self.events
              }

              #[must_use]
              pub fn registry(&self) -> &CapabilityRegistry {
                  &self.registry
              }
          }

          #[derive(Clone, Debug, Deserialize, Eq, PartialEq, Serialize)]
          pub struct PendingGitHubIssue {
              pub id: String,
              pub title: String,
              pub body: String,
          }

          #[derive(Clone, Debug, Deserialize, Eq, PartialEq, Serialize)]
          pub struct ImprovementPatchProposal {
              pub proposal: ImprovementProposal,
              pub rationale: String,
              pub unified_diff: String,
              pub verification_commands: Vec<String>,
              pub rollback_metadata: String,
          }

          impl ImprovementPatchProposal {
              pub fn validate(&self) -> MedusaResult<()> {
                  self.proposal.validate()?;
                  if self.rationale.trim().is_empty()
                      || self.unified_diff.trim().is_empty()
                      || self.verification_commands.is_empty()
                      || self
                          .verification_commands
                          .iter()
                          .any(|command| command.trim().is_empty())
                      || self.rollback_metadata.trim().is_empty()
                  {
                      return Err(invalid("improvement patch proposal is incomplete"));
                  }
                  Ok(())
              }
          }

          #[derive(Clone, Debug, Deserialize, Eq, PartialEq, Serialize)]
          pub struct CapabilityDiagnostics {
              pub states: BTreeMap<Capability, CapabilityState>,
              pub descriptors: Vec<CapabilityDescriptor>,
              pub audit_events: Vec<CapabilityAuditEvent>,
          }

          pub struct ExplicitCapabilityRuntime<E> {
              authorizer: CapabilityAuthorizer,
              github: GitHubService<E>,
              coordinator: TransactionCoordinator,
              pending_github_issues: BTreeMap<String, PendingGitHubIssue>,
              pending_improvements: BTreeMap<String, ImprovementPatchProposal>,
          }

          impl<E: CommandExecutor> ExplicitCapabilityRuntime<E> {
              #[must_use]
              pub fn new(
                  registry: CapabilityRegistry,
                  grants: Vec<CapabilityGrant>,
                  github: GitHubService<E>,
              ) -> Self {
                  Self {
                      authorizer: CapabilityAuthorizer::new(registry, grants),
                      github,
                      coordinator: TransactionCoordinator::default(),
                      pending_github_issues: BTreeMap::new(),
                      pending_improvements: BTreeMap::new(),
                  }
              }

              pub fn github_auth_status(&mut self) -> MedusaResult<AuthStatus> {
                  self.authorizer.require(
                      &github_descriptor(),
                      CapabilityPermission::Read,
                      false,
                  )?;
                  self.github.auth_status()
              }

              pub fn propose_github_issue(
                  &mut self,
                  id: impl Into<String>,
                  title: impl Into<String>,
                  body: impl Into<String>,
              ) -> MedusaResult<PendingGitHubIssue> {
                  self.authorizer.require(
                      &github_descriptor(),
                      CapabilityPermission::Read,
                      false,
                  )?;
                  let proposal = PendingGitHubIssue {
                      id: id.into(),
                      title: title.into(),
                      body: body.into(),
                  };
                  if proposal.id.trim().is_empty()
                      || proposal.title.trim().is_empty()
                      || proposal.body.trim().is_empty()
                  {
                      return Err(invalid("GitHub issue proposal is incomplete"));
                  }
                  if self
                      .pending_github_issues
                      .insert(proposal.id.clone(), proposal.clone())
                      .is_some()
                  {
                      return Err(invalid("GitHub issue proposal id must be unique"));
                  }
                  Ok(proposal)
              }

              pub fn approve_github_issue(
                  &mut self,
                  proposal_id: &str,
                  explicit_approval: bool,
              ) -> MedusaResult<String> {
                  self.authorizer.require(
                      &github_descriptor(),
                      CapabilityPermission::Write,
                      explicit_approval,
                  )?;
                  let proposal = self
                      .pending_github_issues
                      .get(proposal_id)
                      .cloned()
                      .ok_or_else(|| invalid("GitHub issue proposal does not exist"))?;
                  let output = self.github.create_issue(&proposal.title, &proposal.body)?;
                  self.pending_github_issues.remove(proposal_id);
                  Ok(output)
              }

              pub fn stage_improvement(
                  &mut self,
                  patch: ImprovementPatchProposal,
                  sensitive_change_approval: bool,
              ) -> MedusaResult<String> {
                  self.authorizer.require(
                      &self_improvement_descriptor(),
                      CapabilityPermission::Read,
                      false,
                  )?;
                  patch.validate()?;
                  if patch
                      .proposal
                      .touched_paths
                      .iter()
                      .any(|path| protected_path(path))
                      && !sensitive_change_approval
                  {
                      return Err(policy_denied(
                          "policy, sandbox, approval, credential, or update-trust paths require explicit approval",
                      ));
                  }
                  let transaction_id = format!("improvement-{}", patch.proposal.id);
                  let participant = Participant {
                      worker_id: "self-improvement".into(),
                      lease_epoch: 1,
                      intent_fingerprint: fingerprint(patch.unified_diff.as_bytes()),
                  };
                  self.coordinator
                      .create(
                          transaction_id.clone(),
                          patch.proposal.id.clone(),
                          1,
                          vec![participant],
                          fingerprint(patch.rationale.as_bytes()),
                      )
                      .map_err(coordinator_error)?;
                  self.coordinator
                      .transition(&transaction_id, TransactionPhase::Resolving)
                      .map_err(coordinator_error)?;
                  self.coordinator
                      .transition(&transaction_id, TransactionPhase::Preparing)
                      .map_err(coordinator_error)?;
                  self.coordinator
                      .transition(&transaction_id, TransactionPhase::Prepared)
                      .map_err(coordinator_error)?;
                  self.pending_improvements
                      .insert(transaction_id.clone(), patch);
                  Ok(transaction_id)
              }

              pub fn approve_improvement(
                  &mut self,
                  transaction_id: &str,
                  explicit_approval: bool,
                  mut commit: impl FnMut(&ImprovementPatchProposal) -> MedusaResult<()>,
              ) -> MedusaResult<()> {
                  self.authorizer.require(
                      &self_improvement_descriptor(),
                      CapabilityPermission::RepositoryMutation,
                      explicit_approval,
                  )?;
                  let patch = self
                      .pending_improvements
                      .get(transaction_id)
                      .cloned()
                      .ok_or_else(|| invalid("improvement transaction does not exist"))?;
                  let verification = fingerprint(
                      patch.verification_commands.join("\n").as_bytes(),
                  );
                  let rollback = fingerprint(patch.rollback_metadata.as_bytes());
                  self.coordinator
                      .attach_evidence(
                          transaction_id,
                          Some(verification),
                          Some(rollback),
                          None,
                      )
                      .map_err(coordinator_error)?;
                  self.coordinator
                      .vote(
                          transaction_id,
                          Vote::Prepared {
                              worker_id: "self-improvement".into(),
                              lease_epoch: 1,
                          },
                      )
                      .map_err(coordinator_error)?;
                  if self
                      .coordinator
                      .decide(transaction_id)
                      .map_err(coordinator_error)?
                      != Decision::Commit
                  {
                      return Err(policy_denied("improvement transaction was not committed"));
                  }
                  self.coordinator
                      .transition(transaction_id, TransactionPhase::Committing)
                      .map_err(coordinator_error)?;
                  if let Err(error) = commit(&patch) {
                      self.coordinator
                          .transition(transaction_id, TransactionPhase::Recovering)
                          .map_err(coordinator_error)?;
                      self.coordinator
                          .transition(transaction_id, TransactionPhase::Failed)
                          .map_err(coordinator_error)?;
                      return Err(error);
                  }
                  self.coordinator
                      .transition(transaction_id, TransactionPhase::Committed)
                      .map_err(coordinator_error)?;
                  self.pending_improvements.remove(transaction_id);
                  Ok(())
              }

              #[must_use]
              pub fn transaction_phase(&self, transaction_id: &str) -> Option<TransactionPhase> {
                  self.coordinator
                      .record(transaction_id)
                      .map(|record| record.phase.clone())
              }

              #[must_use]
              pub fn diagnostics(&self) -> CapabilityDiagnostics {
                  CapabilityDiagnostics {
                      states: self.authorizer.registry().capabilities.clone(),
                      descriptors: vec![github_descriptor(), self_improvement_descriptor()],
                      audit_events: self.authorizer.events().to_vec(),
                  }
              }
          }

          fn protected_path(path: &Path) -> bool {
              let normalized = path.to_string_lossy().replace('\\', "/");
              [
                  ".github/workflows",
                  ".medusa/policy",
                  "crates/medusa-hardening",
                  "crates/medusa-capabilities",
                  "crates/medusa-config",
                  "crates/medusa-update",
              ]
              .iter()
              .any(|prefix| normalized == *prefix || normalized.starts_with(&format!("{prefix}/")))
          }

          fn fingerprint(bytes: &[u8]) -> String {
              hex::encode(Sha256::digest(bytes))
          }

          fn coordinator_error(error: CoordinatorError) -> MedusaError {
              MedusaError::new(
                  ErrorCode::InternalInvariant,
                  ErrorCategory::Internal,
                  error.to_string(),
              )
          }

          fn invalid(message: impl Into<String>) -> MedusaError {
              MedusaError::new(ErrorCode::InvalidInput, ErrorCategory::Validation, message)
          }

          fn policy_denied(message: impl Into<String>) -> MedusaError {
              MedusaError::new(ErrorCode::PolicyDenied, ErrorCategory::Policy, message)
          }

          #[cfg(test)]
          mod tests {
              use super::*;
              use medusa_github::CommandOutput;
              use medusa_improvement::{ImprovementRisk, ImprovementTarget};
              use std::sync::{Arc, Mutex};

              #[derive(Clone, Default)]
              struct FakeExecutor(Arc<Mutex<Vec<(String, Vec<String>)>>>);

              impl CommandExecutor for FakeExecutor {
                  fn run(
                      &self,
                      program: &str,
                      arguments: &[String],
                      _: Option<&Path>,
                  ) -> MedusaResult<CommandOutput> {
                      self.0
                          .lock()
                          .expect("commands")
                          .push((program.into(), arguments.to_vec()));
                      Ok(CommandOutput {
                          success: true,
                          stdout: "ok".into(),
                          stderr: String::new(),
                      })
                  }
              }

              struct FakeProbe;
              impl crate::CommandProbe for FakeProbe {
                  fn available(&self, program: &str, _: &[&str]) -> bool {
                      matches!(program, "gh" | "git" | "node" | "sh" | "cmd")
                  }
              }

              fn runtime() -> (ExplicitCapabilityRuntime<FakeExecutor>, FakeExecutor) {
                  let directory = tempfile::tempdir().expect("tempdir").keep();
                  let registry =
                      CapabilityRegistry::discover_with(directory.clone(), &FakeProbe).expect("registry");
                  let grants = vec![
                      CapabilityGrant {
                          capability: Capability::GitHub,
                          permissions: BTreeSet::from([
                              CapabilityPermission::Read,
                              CapabilityPermission::Write,
                          ]),
                      },
                      CapabilityGrant {
                          capability: Capability::SelfImprovement,
                          permissions: BTreeSet::from([
                              CapabilityPermission::Read,
                              CapabilityPermission::RepositoryMutation,
                          ]),
                      },
                  ];
                  let executor = FakeExecutor::default();
                  let github = GitHubService::with_executor(
                      "owner/repo",
                      "github.com",
                      Some(directory),
                      executor.clone(),
                  );
                  (
                      ExplicitCapabilityRuntime::new(registry, grants, github),
                      executor,
                  )
              }

              fn patch(path: &str) -> ImprovementPatchProposal {
                  ImprovementPatchProposal {
                      proposal: ImprovementProposal {
                          id: "proposal-1".into(),
                          target: ImprovementTarget::Skill,
                          risk: ImprovementRisk::Low,
                          source_sessions: vec!["session-1".into()],
                          problem: "Repeated verification friction".into(),
                          evidence: vec!["failure-1".into()],
                          proposed_change: "Improve verification guidance".into(),
                          rejected_alternatives: vec!["No change".into()],
                          evaluation_plan: "Run focused and workspace tests".into(),
                          safety_analysis: "No direct mutation".into(),
                          rollback: "Revert the transaction patch".into(),
                          touched_paths: BTreeSet::from([PathBuf::from(path)]),
                      },
                      rationale: "Evidence supports a scoped skill update".into(),
                      unified_diff: "--- a/skills/x.md\n+++ b/skills/x.md".into(),
                      verification_commands: vec!["cargo test -p medusa-capabilities".into()],
                      rollback_metadata: "restore pre-transaction tree".into(),
                  }
              }

              #[test]
              fn github_read_proposal_approval_and_audit_are_explicit() {
                  let (mut runtime, executor) = runtime();
                  assert!(runtime.github_auth_status().expect("status").authenticated);
                  runtime
                      .propose_github_issue("issue-1", "Title", "Body")
                      .expect("proposal");
                  let before = executor.0.lock().expect("commands").len();
                  assert!(runtime.approve_github_issue("issue-1", false).is_err());
                  assert_eq!(executor.0.lock().expect("commands").len(), before);
                  assert_eq!(
                      runtime
                          .approve_github_issue("issue-1", true)
                          .expect("approved"),
                      "ok"
                  );
                  let diagnostics = runtime.diagnostics();
                  assert!(diagnostics
                      .audit_events
                      .iter()
                      .any(|event| !event.allowed && event.permission == CapabilityPermission::Write));
                  assert!(diagnostics
                      .audit_events
                      .iter()
                      .any(|event| event.allowed && event.permission == CapabilityPermission::Write));
              }

              #[test]
              fn denied_capability_fails_before_external_side_effects() {
                  let (mut runtime, executor) = runtime();
                  runtime
                      .propose_github_issue("issue-1", "Title", "Body")
                      .expect("proposal");
                  assert!(runtime.approve_github_issue("issue-1", false).is_err());
                  assert!(executor.0.lock().expect("commands").is_empty());
              }

              #[test]
              fn improvement_uses_transaction_evidence_and_commit_callback() {
                  let (mut runtime, _) = runtime();
                  let transaction = runtime
                      .stage_improvement(patch("skills/x.md"), false)
                      .expect("stage");
                  let mut committed = false;
                  assert!(runtime
                      .approve_improvement(&transaction, false, |_| {
                          committed = true;
                          Ok(())
                      })
                      .is_err());
                  assert!(!committed);
                  runtime
                      .approve_improvement(&transaction, true, |_| {
                          committed = true;
                          Ok(())
                      })
                      .expect("commit");
                  assert!(committed);
                  assert_eq!(
                      runtime.transaction_phase(&transaction),
                      Some(TransactionPhase::Committed)
                  );
              }

              #[test]
              fn protected_paths_require_sensitive_change_approval() {
                  let (mut runtime, _) = runtime();
                  assert!(runtime
                      .stage_improvement(
                          patch("crates/medusa-hardening/src/lib.rs"),
                          false,
                      )
                      .is_err());
              }
          }
          RS

          python3 - <<'PY'
          from pathlib import Path

          lib = Path("crates/medusa-capabilities/src/lib.rs")
          text = lib.read_text()
          text = text.replace("    GitHub,\n    Browser,", "    GitHub,\n    SelfImprovement,\n    Browser,")
          text = text.replace("const ALL: [Self; 9]", "const ALL: [Self; 10]")
          text = text.replace("        Self::GitHub,\n        Self::Browser,", "        Self::GitHub,\n        Self::SelfImprovement,\n        Self::Browser,")
          text = text.replace("            Self::GitHub => \"GitHub\",\n            Self::Browser", "            Self::GitHub => \"GitHub\",\n            Self::SelfImprovement => \"Self-improvement\",\n            Self::Browser")
          needle = '''        insert(
              &mut capabilities,
              Capability::Memory,
              memory,
              if memory {
                  "repository state directory is writable"
              } else {
                  "repository state directory is unavailable or read-only"
              },
          );
          '''
          replacement = needle + '''        insert(
              &mut capabilities,
              Capability::SelfImprovement,
              memory,
              if memory {
                  "self-improvement proposals can be staged for review"
              } else {
                  "self-improvement requires writable repository state"
              },
          );
          '''
          if needle not in text:
              raise SystemExit("memory insertion point not found")
          text = text.replace(needle, replacement, 1)
          text = text.replace("#[cfg(test)]\nmod tests", "pub mod explicit;\npub use explicit::*;\n\n#[cfg(test)]\nmod tests", 1)
          text = text.replace("assert_eq!(prompt.lines().count(), 9);", "assert_eq!(prompt.lines().count(), 10);")
          lib.write_text(text)

          cargo = Path("crates/medusa-capabilities/Cargo.toml")
          text = cargo.read_text()
          text = text.replace(
              'medusa-extensions = { path = "../medusa-extensions" }\n',
              'medusa-extensions = { path = "../medusa-extensions" }\nmedusa-github = { path = "../medusa-github" }\nmedusa-improvement = { path = "../medusa-improvement" }\nmedusa-transaction-coordinator = { path = "../medusa-transaction-coordinator" }\nhex.workspace = true\nsha2.workspace = true\n',
          )
          cargo.write_text(text)
          PY

          cargo fmt --all
          cargo generate-lockfile
          cargo test -p medusa-capabilities
          rm .github/workflows/implement-305.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/medusa-capabilities Cargo.lock .github/workflows/implement-305.yml
          git commit -m "Wire explicit GitHub and improvement capabilities"
          git push origin HEAD:issue-305-explicit-capabilities
