name: Fix issue 305 Clippy

on:
  pull_request:
    types: [reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'issue-305-explicit-capabilities'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-305-explicit-capabilities
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt,clippy
      - name: Factor test command record type
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/medusa-capabilities/src/explicit.rs')
          text = path.read_text()
          old = '''    #[derive(Clone, Default)]
    struct FakeExecutor(Arc<Mutex<Vec<(String, Vec<String>)>>>);
'''
          new = '''    type RecordedCommands = Arc<Mutex<Vec<(String, Vec<String>)>>>;

    #[derive(Clone, Default)]
    struct FakeExecutor(RecordedCommands);
'''
          if old not in text:
              raise SystemExit('Clippy target not found')
          path.write_text(text.replace(old, new, 1))
          PY
          cargo fmt --all
          cargo clippy -p medusa-capabilities --all-targets -- -D warnings
          cargo test -p medusa-capabilities
          rm .github/workflows/fix-305-clippy.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/medusa-capabilities/src/explicit.rs .github/workflows/fix-305-clippy.yml
          git commit -m "Factor capability test command records"
          git push origin HEAD:issue-305-explicit-capabilities
