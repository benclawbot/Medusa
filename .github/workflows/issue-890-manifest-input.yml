name: Issue 890 manifest input refactor

on:
  push:
    branches:
      - codex/issue-890-model-request-policy
    paths:
      - scripts/issue890_manifest_input.py
      - .github/workflows/issue-890-manifest-input.yml

permissions:
  contents: write

jobs:
  refactor-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-890-model-request-policy
          fetch-depth: 0
      - run: python3 scripts/issue890_manifest_input.py
      - run: cargo fmt --all
      - run: rm scripts/issue890_manifest_input.py .github/workflows/issue-890-manifest-input.yml
      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Bundle effective request manifest inputs"
          git push origin HEAD:codex/issue-890-model-request-policy
      - name: Clippy full workspace
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Effective request integration tests
        run: cargo test -p medusa-agent --test effective_request_manifest --locked
      - name: Provider retry/failover test
        run: cargo test -p medusa-provider manager::tests::retryable_primary_failure_falls_back_and_caches_response --locked
      - name: CLI request-audit build
        run: cargo check -p medusa-cli --locked
