name: Temporary dead-code suppression audit

on:
  push:
    branches:
      - codex/issue-858-dead-code-migrations

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inventory scoped suppression attributes
        shell: bash
        run: |
          set -euo pipefail
          pattern='#\[allow\((dead_code|unused_[^)]*)\)\]'
          echo '=== all scoped suppressions ==='
          grep -RInE --include='*.rs' "$pattern" crates tools apps/medusa-desktop/src-tauri/src || status=$?
          if [[ ${status:-0} -gt 1 ]]; then exit "$status"; fi
          echo '=== production candidates (exclude obvious tests/bin) ==='
          find crates tools apps/medusa-desktop/src-tauri/src -type f -name '*.rs' \
            ! -path '*/tests/*' ! -path '*/test/*' ! -path '*/bin/*' -print0 \
            | xargs -0 grep -nHE "$pattern" || status=$?
          if [[ ${status:-0} -gt 1 ]]; then exit "$status"; fi
