name: Temporary dead-code migration

on:
  push:
    branches:
      - codex/issue-858-dead-code-migrations

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply audited suppression migrations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=None):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              expected = 1 if count is None else count
              if actual != expected:
                  raise SystemExit(f"{path}: expected {expected} occurrences, found {actual}: {old!r}")
              p.write_text(text.replace(old, new))

          replace('crates/medusa-review-model/src/root.rs', '#[allow(unused_imports)]\n#[path = "verification_evidence.rs"]', '#[path = "verification_evidence.rs"]')
          replace('crates/medusa-tui/src/render.rs', '''#[cfg(not(unix))]\n#[allow(dead_code)]\npub(super) fn draw_portable(\n    stdout: &mut io::Stdout,\n    _options: &TuiOptions,\n    identity: &UiIdentity,\n    app: &AppState,\n) -> io::Result<()> {\n    let (width, height) = size()?;\n    let frame = render_frame(identity, app, width, height);\n    draw_portable_frame(stdout, width, &frame, None)\n}\n\n''', '')
          replace('crates/medusa-daemon/src/artifact_store.rs', '    #[allow(dead_code)]\n    pub fn export(', '    pub fn export(')
          replace('crates/medusa-agent/src/verification_cancellation.rs', '// Staged API for the immediately following authority-summary tranche.\n#[allow(dead_code)]\npub(crate) fn take_runtime_metrics', '// Drains repository-scoped verification runtime metrics after an authority run.\npub(crate) fn take_runtime_metrics')
          replace('crates/medusa-agent/src/session.rs', '#[allow(dead_code)]\nmod skill_outcomes;', 'mod skill_outcomes;')
          replace('crates/medusa-agent/src/session.rs', '#[allow(unused_imports)]\npub use usage::', 'pub use usage::')
          replace('crates/medusa-agent/src/verification_authority.rs', '#[allow(dead_code)]\n#[path = "verification_authority_legacy.rs"]', '#[path = "verification_authority_legacy.rs"]')
          replace('crates/medusa-agent/src/repository_profile.rs', '#[allow(dead_code)]\npub(crate) fn reset', '#[cfg(test)]\npub(crate) fn reset')
          replace('crates/medusa-agent/src/session_browser.rs', 'pub struct SessionBrowser {\n    #[allow(dead_code)]\n    config: SessionBrowserConfig,\n    client: Option<BrowserClient>,\n}', 'pub struct SessionBrowser {\n    client: Option<BrowserClient>,\n}')
          replace('crates/medusa-agent/src/session_browser.rs', '                config: config.clone(),\n                client: None,', '                client: None,', count=2)
          replace('crates/medusa-agent/src/session_browser.rs', '            config: config.clone(),\n            client: Some(client),', '            client: Some(client),')
          replace('crates/medusa-agent/src/tools/browser_dispatch.rs', '#[allow(dead_code)]\npub fn build', 'pub fn build')
          replace('crates/medusa-agent/src/tools/browser_dispatch.rs', '#[allow(dead_code)]\npub fn format_response', 'pub fn format_response')
          replace('crates/medusa-agent/src/journal.rs', '#[allow(dead_code)]\n', '#[cfg(test)]\n', count=3)
          replace('crates/medusa-agent/src/usage.rs', '#[allow(dead_code)]\nimpl SessionUsage', 'impl SessionUsage')
          replace('crates/medusa-agent/src/usage.rs', '#[allow(dead_code)]\npub fn session_usage', 'pub fn session_usage')
          replace('crates/medusa-context/src/refinement_root.rs', '#[allow(dead_code)]\n#[path = "refinement.rs"]', '#[path = "refinement.rs"]')
          PY
          cargo fmt --all -- --check
          echo '=== remaining scoped suppressions ==='
          grep -RInE --include='*.rs' '#\[allow\((dead_code|unused_[^)]*)\)\]' crates tools apps/medusa-desktop/src-tauri/src || true
          git diff --check
      - name: Validate affected crates
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked --all-targets \
            -p medusa-agent -p medusa-daemon -p medusa-tui -p medusa-review-model -p medusa-context
      - name: Commit audited migrations
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/medusa-review-model/src/root.rs \
            crates/medusa-tui/src/render.rs \
            crates/medusa-daemon/src/artifact_store.rs \
            crates/medusa-agent/src/verification_cancellation.rs \
            crates/medusa-agent/src/session.rs \
            crates/medusa-agent/src/verification_authority.rs \
            crates/medusa-agent/src/repository_profile.rs \
            crates/medusa-agent/src/session_browser.rs \
            crates/medusa-agent/src/tools/browser_dispatch.rs \
            crates/medusa-agent/src/journal.rs \
            crates/medusa-agent/src/usage.rs \
            crates/medusa-context/src/refinement_root.rs
          git commit -m 'refactor: resolve scoped dead-code suppressions'
          git push origin HEAD:codex/issue-858-dead-code-migrations
