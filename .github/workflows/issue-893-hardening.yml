name: Issue 893 final delegation hardening

on:
  push:
    branches:
      - agent/issue-893-delegation-contracts

permissions:
  contents: write

jobs:
  harden-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0
        with:
          components: rustfmt,clippy
      - name: Apply final hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/issue-893-hardening.py
          python3 scripts/issue-893-hardening-fix.py
          cargo fmt --all
      - name: Validate authority and recovery
        shell: bash
        run: |
          set -euo pipefail
          cargo check -p medusa-agent -p medusa-runtime --all-targets --locked
          cargo clippy -p medusa-agent -p medusa-runtime --all-targets --all-features --locked -- -D warnings
          cargo test -p medusa-agent delegation --locked
          cargo test -p medusa-agent worker_execution --locked
          cargo test -p medusa-runtime delegation_contract --locked
          cargo test -p medusa-runtime multi_agent_coordinator --locked
          cargo test -p medusa-runtime mutating_worker_coordinator --locked
      - name: Commit validated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/issue-893-hardening.yml scripts/issue-893-hardening.py scripts/issue-893-hardening-fix.py
          git add crates/medusa-agent crates/medusa-runtime
          git diff --cached --check
          git commit -m "Harden delegation retry authority"
          git push origin HEAD:${{ github.ref_name }}
