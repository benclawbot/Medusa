name: Issue 893 mutating retry diagnostic

on:
  push:
    branches:
      - agent/issue-893-delegation-contracts

jobs:
  diagnose-retry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0
      - name: Expose current hardened retry error
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/issue-893-hardening.py
          python3 scripts/issue-893-hardening-fix.py
          python3 scripts/issue-893-compile-fix.py
          python3 scripts/issue-893-clippy-fix.py
          python3 scripts/issue-893-session-test-fix.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/medusa-runtime/src/mutating_worker_coordinator_tests.rs')
          text = path.read_text()
          old = '    assert!(error.contains("out-of-scope"));'
          new = '    assert!(error.contains("out-of-scope"), "unexpected error: {error}");'
          if old not in text:
              raise SystemExit('diagnostic assertion anchor missing')
          path.write_text(text.replace(old, new, 1))
          PY
          cargo fmt --all
          cargo test -p medusa-runtime mutating_worker_coordinator::tests::out_of_scope_change_is_rejected_without_touching_primary_repo --locked -- --nocapture
