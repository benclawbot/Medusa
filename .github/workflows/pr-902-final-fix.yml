name: PR 902 Final Validation Fix

on:
  push:
    branches:
      - codex/issue-889-tool-pipeline

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/issue-889-tool-pipeline
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0
        with:
          components: rustfmt,clippy
      - name: Apply final fixes
        run: |
          python3 scripts/pr-902-final-fix.py
          python3 scripts/check-documentation.py --write
          cargo fmt --all
          git diff --check
      - name: Verify exact Clippy gate
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Verify medusa-agent full tests
        run: cargo test -p medusa-agent --lib --all-features --locked
      - name: Verify documentation inventory
        run: python3 scripts/check-documentation.py
      - name: Commit verified fixes and remove temporary helpers
        run: |
          rm .github/workflows/pr-902-final-fix.yml scripts/pr-902-final-fix.py
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Fix certified denial projection and documentation inventory"
          git push origin HEAD:codex/issue-889-tool-pipeline
