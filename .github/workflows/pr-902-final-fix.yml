name: PR 902 Final Validation Fix

on:
  push:
    branches: [codex/issue-889-tool-pipeline]

permissions:
  contents: write

concurrency:
  group: pr-902-final-fix
  cancel-in-progress: true

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/issue-889-tool-pipeline
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0
        with:
          components: rustfmt,clippy
      - name: Apply final fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          engine_path = Path('crates/medusa-agent/src/engine.rs')
          engine = engine_path.read_text()
          start_marker = '''                if let Err(error) = &result
                    && error.code == ErrorCode::PolicyDenied
                    && self.config.agent.mode != Mode::ReadOnly
                    && self.execution_policy.denial_reason(&name, &input).is_none()
                    && interactively_approvable(&name, &input)
                {
'''
          end_marker = '''                let event_tool = audited_tool_name(&name, &input);
'''
          start = engine.index(start_marker)
          end = engine.index(end_marker, start)
          old = engine[start:end]
          approval_body_start = old.index('                    let action = approval_action_label')
          approval_body = old[approval_body_start:]
          # Remove the existing denial event prefix and closing brace, preserving approval body.
          approval_body = approval_body.rsplit('                }\n', 1)[0]
          new = '''                let awaiting_approval = result.as_ref().err().is_some_and(|error| {
                    error.code == ErrorCode::PolicyDenied
                        && self.config.agent.mode != Mode::ReadOnly
                        && self.execution_policy.denial_reason(&name, &input).is_none()
                        && interactively_approvable(&name, &input)
                });
                if let Err(error) = &result
                    && error.code == ErrorCode::PolicyDenied
                {
                    append_observed(
                        session,
                        EventPayload::ToolCallDenied {
                            tool: audited_tool_name(&name, &input),
                            reason: if awaiting_approval {
                                "tool requires explicit user approval".to_owned()
                            } else {
                                error.to_string()
                            },
                        },
                        &mut observer,
                    )?;
                }
                if awaiting_approval {
''' + approval_body + '''
                }
'''
          engine = engine[:start] + new + engine[end:]
          engine_path.write_text(engine)

          tools_path = Path('crates/medusa-agent/src/tools/mod.rs')
          tools = tools_path.read_text()
          old_test = '''        let error = execute_tool_cancellable_with_policy_certified(
            directory.path(),
            "fs_write",
            &json!({"path":"denied.txt","content":"no"}),
            &AtomicBool::new(false),
            &policy,
        )
        .err()
        .expect("researcher write must be denied by certified pipeline");'''
          new_test = '''        let error = execute_tool_cancellable_with_policy_certified(
            directory.path(),
            "fs_write",
            &json!({"path":"denied.txt","content":"no"}),
            &AtomicBool::new(false),
            &policy,
        )
        .expect("certified execution")
        .result
        .expect_err("researcher write must be denied by certified pipeline");'''
          assert tools.count(old_test) == 1
          tools = tools.replace(old_test, new_test)
          tools_path.write_text(tools)
          PY
          python3 scripts/check-documentation.py --write
          cargo fmt --all
          git diff --check
      - name: Verify exact Clippy gate
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Verify medusa-agent full tests
        run: cargo test -p medusa-agent --lib --all-features --locked
      - name: Verify documentation inventory
        run: python3 scripts/check-documentation.py
      - name: Commit verified fixes and remove helper workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/pr-902-final-fix.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Fix certified denial projection and documentation inventory"
          git push origin HEAD:codex/issue-889-tool-pipeline
