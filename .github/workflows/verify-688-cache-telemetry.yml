name: Verify 688 Cache Telemetry

on:
  push:
    branches: [perf/688-cache-telemetry]

permissions:
  contents: write

concurrency:
  group: verify-688-cache-telemetry
  cancel-in-progress: true

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: perf/688-cache-telemetry
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0
        with:
          components: rustfmt,clippy
      - name: Align patcher with current manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/apply-688-cache-telemetry.py')
          text = path.read_text()
          text = text.replace('medusa-core = { path = \\"../medusa-core\\" }', 'medusa-core.workspace = true')
          text = text.replace('tokio.workspace = true', 'tokio = { version = \\"1.47\\", features = [\\"macros\\", \\"net\\", \\"rt\\", \\"time\\"] }')
          text = text.replace('        let mut config = Config::default();\n        config.model.provider = "anthropic".to_owned();\n', '')
          text = text.replace('serde_json::to_value(&request.tools).unwrap_or_else(|_| json!([]))', 'json!(request.tools)')
          path.write_text(text)
          PY
      - name: Apply cache telemetry wiring
        run: python3 .github/scripts/apply-688-cache-telemetry.py
      - name: Refresh lock
        run: cargo check -p medusa-provider
      - name: Format
        run: cargo fmt --all
      - name: Strict Clippy
        run: cargo clippy -p medusa-provider --all-targets --all-features -- -D warnings
      - name: Focused tests
        run: cargo test -p medusa-prompt-cache -p medusa-provider -- --nocapture
      - name: Commit verified source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock crates/medusa-provider
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Wire prompt cache telemetry and native cache controls"
          git push origin HEAD:perf/688-cache-telemetry
