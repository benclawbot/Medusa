name: Issue 890 one-shot source patch

on:
  push:
    branches:
      - codex/issue-890-model-request-policy
    paths:
      - scripts/issue890_apply.py
      - .github/workflows/issue-890-apply.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-890-model-request-policy
          fetch-depth: 0
      - name: Apply source patch
        run: python3 scripts/issue890_apply.py
      - name: Format Rust
        run: cargo fmt --all
      - name: Remove one-shot tooling
        run: rm scripts/issue890_apply.py .github/workflows/issue-890-apply.yml
      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement durable effective model request manifests"
          git push origin HEAD:codex/issue-890-model-request-policy
