name: Temporary issue 871 image capability integration
on:
  push:
    branches: [codex/issue-871-desktop-image-capability]
permissions:
  contents: write
jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/issue-871-desktop-image-capability
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Apply image capability fix
        run: python3 .github/scripts/temp_issue_871_patch.py
      - name: Validate Desktop frontend
        run: |
          cd apps/medusa-desktop
          npm ci
          npm run typecheck
          npm test -- --run
          npm run build
      - name: Commit product changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/medusa-desktop/src
          git commit -m "Fix Desktop image capability detection"
          git push origin HEAD:codex/issue-871-desktop-image-capability
