name: Temporary issue 871 image capability integration
on:
  push:
    branches: [codex/issue-871-desktop-image-capability]
permissions:
  contents: write
jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/issue-871-desktop-image-capability
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Apply image capability fix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          catalog = Path('apps/medusa-desktop/src/providerCatalog.ts')
          s = catalog.read_text()
          old = '''export function modelSupports(\n  provider: ProviderCatalogEntry | undefined,\n  modelId: string,\n  capability: keyof ModelCapabilities,\n): boolean {\n  const model = provider?.models?.find((candidate) => candidate.id === modelId);\n  if (!model) return false;\n  const value = model.capabilities[capability];\n  return typeof value === "boolean" ? value : value.length > 0;\n}\n'''
          new = '''export type ModelCapabilityState = "supported" | "unsupported" | "unknown";\n\nexport function modelCapabilityState(\n  provider: ProviderCatalogEntry | undefined,\n  modelId: string,\n  capability: keyof ModelCapabilities,\n): ModelCapabilityState {\n  const model = provider?.models?.find((candidate) => candidate.id === modelId);\n  if (!model) return "unknown";\n  const value = model.capabilities[capability];\n  const supported = typeof value === "boolean" ? value : value.length > 0;\n  return supported ? "supported" : "unsupported";\n}\n\nexport function modelSupports(\n  provider: ProviderCatalogEntry | undefined,\n  modelId: string,\n  capability: keyof ModelCapabilities,\n): boolean {\n  return modelCapabilityState(provider, modelId, capability) === "supported";\n}\n'''
          if old not in s: raise SystemExit('providerCatalog modelSupports anchor missing')
          catalog.write_text(s.replace(old, new, 1))

          app = Path('apps/medusa-desktop/src/App.tsx')
          s = app.read_text()
          old = 'import { loadProviderCatalog, type ProviderCatalogEntry } from "./providerCatalog";'
          new = 'import { loadProviderCatalog, modelCapabilityState, type ProviderCatalogEntry } from "./providerCatalog";'
          if old not in s: raise SystemExit('App import anchor missing')
          s = s.replace(old, new, 1)
          old = '''  const imageCompatibility = useMemo(() => {\n    const normalized = provider.trim().toLowerCase();\n    if (normalized === "anthropic" || normalized === "openai" || normalized === "chatgpt-oauth") {\n      return { supported: true, text: `${model} is configured for image input.` };\n    }\n    if (normalized === "anthropic-compatible") {\n      return { supported: false, text: "This compatible route is text-only unless image support is explicitly configured." };\n    }\n    return { supported: undefined, text: "Image compatibility will be verified by the runtime before upload." };\n  }, [provider, model]);'''
          new = '''  const imageCompatibility = useMemo(() => {\n    const selectedProvider = providerCatalog.find((candidate) =>\n      candidate.profileProvider === provider\n      && (sharedConfiguration?.provider !== provider || candidate.connection === sharedConfiguration.connection)\n    ) ?? providerCatalog.find((candidate) => candidate.profileProvider === provider);\n    const state = modelCapabilityState(selectedProvider, model, "image_input");\n    if (state === "supported") {\n      return { supported: true, text: `${model} is configured for image input.` };\n    }\n    if (state === "unsupported") {\n      return { supported: false, text: `${model} does not advertise image input on this route.` };\n    }\n    return { supported: undefined, text: "Image compatibility will be verified by the runtime before upload." };\n  }, [providerCatalog, provider, model, sharedConfiguration?.provider, sharedConfiguration?.connection]);'''
          if old not in s: raise SystemExit('App image compatibility anchor missing')
          app.write_text(s.replace(old, new, 1))

          tests = Path('apps/medusa-desktop/src/App.test.tsx')
          s = tests.read_text()
          addition = r'''

it("uses canonical model capability metadata for OpenAI OAuth image input", async () => {
  const imageCapabilities = {
    tool_calling: true,
    image_input: true,
    audio_input: false,
    realtime: false,
    reasoning: true,
    reasoning_effort_levels: ["medium"],
    streaming: true,
    structured_output: true,
    prompt_caching: true,
  };
  vi.mocked(loadSharedConfiguration).mockResolvedValue({
    revision: 3,
    activeProfile: "default",
    connection: "chatgpt-oauth",
    provider: "openai-oauth",
    model: "gpt-5.1-codex",
    effort: "medium",
    auth: "oauth",
    configured: true,
    credentialConfigured: true,
  });
  vi.mocked(loadProviderCatalog).mockResolvedValue([{
    id: "openai-oauth",
    displayName: "OpenAI account",
    description: "Browser OAuth route",
    connection: "chatgpt-oauth",
    profileProvider: "openai-oauth",
    authMethods: ["oauth"],
    defaultAuth: "oauth",
    defaultModel: "gpt-5.1-codex",
    modelOptions: ["gpt-5.1-codex"],
    models: [{
      id: "gpt-5.1-codex",
      display_name: "GPT-5.1 Codex",
      provider_id: "openai-oauth",
      profile_provider: "openai-oauth",
      availability: "available",
      source: "curated",
      capabilities: imageCapabilities,
      deprecated: false,
      recommended: true,
    }],
    browserOauth: true,
    discoverModels: true,
    customValues: false,
    currentCustom: false,
  }]);
  vi.mocked(startRuntime).mockResolvedValue({ runtimeId: "runtime-oauth", repo: "" });

  render(<App />);
  await waitFor(() => expect(startRuntime).toHaveBeenCalled());
  expect(screen.getByText("gpt-5.1-codex is configured for image input.")).toBeInTheDocument();
});

it("does not confuse a connection identifier with a profile provider identifier", async () => {
  vi.mocked(loadSharedConfiguration).mockResolvedValue({
    revision: 3,
    activeProfile: "default",
    connection: "chatgpt-oauth",
    provider: "chatgpt-oauth",
    model: "gpt-5.1-codex",
    effort: "medium",
    auth: "oauth",
    configured: true,
    credentialConfigured: true,
  });
  vi.mocked(loadProviderCatalog).mockResolvedValue([{
    id: "openai-oauth",
    displayName: "OpenAI account",
    description: "Browser OAuth route",
    connection: "chatgpt-oauth",
    profileProvider: "openai-oauth",
    authMethods: ["oauth"],
    defaultAuth: "oauth",
    defaultModel: "gpt-5.1-codex",
    modelOptions: ["gpt-5.1-codex"],
    browserOauth: true,
    discoverModels: true,
    customValues: false,
    currentCustom: false,
  }]);
  vi.mocked(startRuntime).mockResolvedValue({ runtimeId: "runtime-oauth", repo: "" });

  render(<App />);
  await waitFor(() => expect(startRuntime).toHaveBeenCalled());
  expect(screen.getByText("Image compatibility will be verified by the runtime before upload.")).toBeInTheDocument();
});

it("keeps custom routes conservative without image capability metadata", async () => {
  vi.mocked(loadSharedConfiguration).mockResolvedValue({
    revision: 2,
    activeProfile: "default",
    connection: "anthropic-compatible",
    provider: "anthropic-compatible",
    model: "custom-model",
    effort: "medium",
    auth: "none",
    configured: true,
    credentialConfigured: true,
  });
  vi.mocked(loadProviderCatalog).mockResolvedValue([{
    id: "anthropic-compatible",
    displayName: "Compatible endpoint",
    description: "Custom route",
    connection: "anthropic-compatible",
    profileProvider: "anthropic-compatible",
    authMethods: ["none"],
    defaultAuth: "none",
    defaultModel: "custom-model",
    modelOptions: ["custom-model"],
    browserOauth: false,
    discoverModels: false,
    customValues: true,
    currentCustom: false,
  }]);
  vi.mocked(startRuntime).mockResolvedValue({ runtimeId: "runtime-custom", repo: "" });

  render(<App />);
  await waitFor(() => expect(startRuntime).toHaveBeenCalled());
  expect(screen.getByText("Image compatibility will be verified by the runtime before upload.")).toBeInTheDocument();
});
'''
          tests.write_text(s + addition)
          PY
      - name: Validate Desktop frontend
        run: |
          cd apps/medusa-desktop
          npm ci
          npm run typecheck
          npm test -- --run
          npm run build
      - name: Commit product changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/medusa-desktop/src
          git commit -m "Fix Desktop image capability detection"
          git push origin HEAD:codex/issue-871-desktop-image-capability
