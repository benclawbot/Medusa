name: One-shot TUI input divider layout

on:
  push:
    branches:
      - fix/tui-input-divider-layout

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: fix/tui-input-divider-layout
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0
        with:
          toolchain: 1.88.0
          components: rustfmt
      - name: Move context meter below input divider
        shell: python
        run: |
          from pathlib import Path
          path = Path('crates/medusa-tui/src/render.rs')
          text = path.read_text(encoding='utf-8')
          old = '''    bottom_row = bottom_row.saturating_add(1);\n    set_frame_line(\n        &mut frame,\n        bottom_row,\n        StyledLine::new(context_meter_line(app), Color::Grey),\n    );\n    bottom_row = bottom_row.saturating_add(1);\n    set_frame_line(\n        &mut frame,\n        bottom_row,\n        StyledLine::new("─".repeat(usize::from(width)), Color::White),\n    );\n'''
          new = '''    bottom_row = bottom_row.saturating_add(1);\n    set_frame_line(\n        &mut frame,\n        bottom_row,\n        StyledLine::new("─".repeat(usize::from(width)), Color::White),\n    );\n    bottom_row = bottom_row.saturating_add(1);\n    set_frame_line(\n        &mut frame,\n        bottom_row,\n        StyledLine::new(context_meter_line(app), Color::Grey),\n    );\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one composer context/divider block, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
      - name: Format check
        run: cargo fmt --all -- --check
      - name: TUI tests
        run: cargo test -p medusa-tui --locked
      - name: Commit source-only change
        run: |
          rm .github/workflows/one-shot-tui-input-divider.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/medusa-tui/src/render.rs .github/workflows/one-shot-tui-input-divider.yml
          git commit -m "fix(tui): keep context meter below input divider"
          git push origin HEAD:fix/tui-input-divider-layout
