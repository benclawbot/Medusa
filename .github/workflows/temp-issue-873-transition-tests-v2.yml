name: Temporary issue 873 transition tests v2
on:
  push:
    branches: [codex/issue-873-verification-contract]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/issue-873-verification-contract
          fetch-depth: 0
      - name: Add typed terminal state coverage
        env:
          TEST_B64: 
        run: |
          python -c 'import base64,os,pathlib; p=pathlib.Path("crates/medusa-agent/src/verification_contract.rs"); s=p.read_text(); t=base64.b64decode(os.environ["TEST_B64"]).decode(); pos=s.rfind("\n}\n"); assert pos>=0; p.write_text(s if "explicit_terminal_state_transitions_are_typed_and_auditable" in s else s[:pos]+"\n"+t+s[pos:])'
          cargo fmt --all
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/medusa-agent/src/verification_contract.rs
          git diff --cached --quiet && exit 0
          git commit -m 'Test verification contract terminal states'
          git push origin HEAD:codex/issue-873-verification-contract
