name: Apply 655 Generated Changes

on:
  push:
    branches: [agent/655-verified-prebuilt-updater]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/655-verified-prebuilt-updater
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0 # 1.88.0
        with:
          components: rustfmt
      - name: Apply focused large-file edits
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          main_path = Path("crates/medusa-cli/src/main.rs")
          main = main_path.read_text(encoding="utf-8")
          main = main.replace(
              "mod headless_approval;\n",
              "mod headless_approval;\nmod update_command;\n",
              1,
          )
          old_update = '''    /// Check for or install the latest Medusa main-branch build.
              Update {
                  /// Report whether this build matches the current main branch without modifying it.
                  #[arg(long)]
                  check: bool,
                  /// Apply an available update without an additional prompt (for managed automation).
                  #[arg(long)]
                  automatic: bool,
              },'''
          new_update = '''    /// Check for or install a verified prebuilt Medusa release.
              Update {
                  /// Report whether an eligible update exists without modifying this installation.
                  #[arg(long)]
                  check: bool,
                  /// Apply an available update without an additional prompt (for managed automation).
                  #[arg(long)]
                  automatic: bool,
                  /// Select the verified release channel or the explicit slow developer source channel.
                  #[arg(long, default_value = "release", value_parser = ["release", "source"])]
                  channel: String,
                  /// Permit an intentional version or rollout-sequence rollback.
                  #[arg(long)]
                  allow_downgrade: bool,
              },'''
          if old_update not in main:
              raise SystemExit("update command block changed unexpectedly")
          main = main.replace(old_update, new_update, 1)
          main = main.replace(
              "fn run() -> MedusaResult<()> {\n    let cli = Cli::parse();",
              "fn run() -> MedusaResult<()> {\n    medusa_update::acknowledge_update_health()?;\n    let cli = Cli::parse();",
              1,
          )
          old_arm = "        CommandKind::Update { check, automatic } => update(&repo, check, automatic),"
          new_arm = '''        CommandKind::Update {
                      check,
                      automatic,
                      channel,
                      allow_downgrade,
                  } => update_command::run(&repo, check, automatic, &channel, allow_downgrade),'''
          if old_arm not in main:
              raise SystemExit("update match arm changed unexpectedly")
          main = main.replace(old_arm, new_arm, 1)
          main = main.replace(
              "use medusa_update::{InstallKind, InstallLocation, MainBranchUpdater, UpdatePolicy};\n",
              "",
              1,
          )
          start = main.find("\nfn update(repo: &Path, check_only: bool, automatic: bool) -> MedusaResult<()> {")
          end = main.find("\nfn request_daemon_shutdown(", start)
          if start < 0 or end < 0:
              raise SystemExit("legacy update function boundaries changed unexpectedly")
          main = main[:start] + "\n" + main[end:]
          main_path.write_text(main, encoding="utf-8")

          workflow_path = Path(".github/workflows/publish-release.yml")
          workflow = workflow_path.read_text(encoding="utf-8")
          old_header = '''  publish-draft:
              name: Attest and create release
              needs: [validate, linux, macos, windows]
              runs-on: ubuntu-latest
              timeout-minutes: 20'''
          new_header = '''  publish-draft:
              name: Attest and create release
              needs: [validate, linux, macos, windows]
              runs-on: ubuntu-latest
              environment: release-signing
              timeout-minutes: 20'''
          if old_header not in workflow:
              raise SystemExit("publish job header changed unexpectedly")
          workflow = workflow.replace(old_header, new_header, 1)
          old_env = '''          RELEASE_TAG: ${{ needs.validate.outputs.release-tag }}
                    RELEASE_SHA: ${{ github.sha }}'''
          new_env = '''          RELEASE_TAG: ${{ needs.validate.outputs.release-tag }}
                    RELEASE_VERSION: ${{ needs.validate.outputs.version }}
                    RELEASE_SHA: ${{ github.sha }}
                    RELEASE_SEQUENCE: ${{ github.run_number }}
                    MEDUSA_RELEASE_ED25519_PRIVATE_KEY_PEM: ${{ secrets.MEDUSA_RELEASE_ED25519_PRIVATE_KEY_PEM }}'''
          if old_env not in workflow:
              raise SystemExit("release evidence environment changed unexpectedly")
          workflow = workflow.replace(old_env, new_env, 1)
          old_manifest = '''          python3 scripts/release-evidence.py manifest \\
                    --assets release-assets \\
                    --output release-assets/medusa-release-manifest.json \\
                    --checksums release-assets/SHA256SUMS'''
          new_manifest = '''          release_key="$RUNNER_TEMP/medusa-release-ed25519.pem"
                    test -n "$MEDUSA_RELEASE_ED25519_PRIVATE_KEY_PEM"
                    umask 077
                    printf '%s\\n' "$MEDUSA_RELEASE_ED25519_PRIVATE_KEY_PEM" > "$release_key"
                    python3 scripts/release-evidence.py manifest \\
                      --root . \\
                      --assets release-assets \\
                      --output release-assets/medusa-release-manifest.json \\
                      --checksums release-assets/SHA256SUMS \\
                      --version "$RELEASE_VERSION" \\
                      --revision "$RELEASE_SHA" \\
                      --sequence "$RELEASE_SEQUENCE" \\
                      --rollout-percentage 100 \\
                      --minimum-updater-version "1.0.0"
                    python3 scripts/release-evidence.py sign-manifest \\
                      --manifest release-assets/medusa-release-manifest.json \\
                      --output release-assets/medusa-release-manifest.sig.json \\
                      --private-key "$release_key" \\
                      --key-id medusa-release-2026-01
                    python3 scripts/release-evidence.py verify-signature \\
                      --manifest release-assets/medusa-release-manifest.json \\
                      --signature release-assets/medusa-release-manifest.sig.json \\
                      --public-key release/keys/medusa-release-2026-01.pem
                    rm -f "$release_key"'''
          if old_manifest not in workflow:
              raise SystemExit("release manifest command changed unexpectedly")
          workflow = workflow.replace(old_manifest, new_manifest, 1)
          workflow_path.write_text(workflow, encoding="utf-8")
          PY
      - name: Refresh lock and format Rust
        run: |
          set -euo pipefail
          cargo generate-lockfile
          cargo fmt --all
      - name: Commit generated result and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-655-generated.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.lock crates/medusa-cli/src/main.rs .github/workflows/publish-release.yml
          git commit -m "Wire the verified release channel and signing pipeline"
          git push origin HEAD:agent/655-verified-prebuilt-updater
