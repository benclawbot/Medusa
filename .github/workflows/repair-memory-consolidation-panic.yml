name: Repair Memory Consolidation Panic Audit

on:
  push:
    branches:
      - agent/local-execution-bridge

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/local-execution-bridge
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt
      - name: Propagate consolidation serialization errors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/medusa-memory-consolidation/src/lib.rs')
          text = path.read_text()
          text = text.replace('let source_fingerprint = fingerprint(&ordered);', 'let source_fingerprint = fingerprint(&ordered)?;', 1)
          text = text.replace('let conflict_fingerprint = fingerprint(&(key.as_str(), &values, &supporting_ids));', 'let conflict_fingerprint = fingerprint(&(key.as_str(), &values, &supporting_ids))?;', 1)
          text = text.replace('        ));\n        memories.push(ConsolidatedMemory {', '        ))?;\n        memories.push(ConsolidatedMemory {', 1)
          text = text.replace('let result_fingerprint = fingerprint(&(&memories, &conflicts, &deferred));', 'let result_fingerprint = fingerprint(&(&memories, &conflicts, &deferred))?;', 1)
          text = text.replace(
              'fn fingerprint<T: Serialize>(value: &T) -> String {\n    let bytes = serde_json::to_vec(value).expect("serializable memory consolidation state");\n    hex::encode(Sha256::digest(bytes))\n}',
              'fn fingerprint<T: Serialize>(value: &T) -> Result<String, &\'static str> {\n    let bytes = serde_json::to_vec(value).map_err(|_| "memory consolidation serialization failed")?;\n    Ok(hex::encode(Sha256::digest(bytes)))\n}',
              1,
          )
          path.write_text(text)
          PY
          cargo fmt --all
      - name: Commit repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/medusa-memory-consolidation/src/lib.rs
          git commit -m "Propagate memory consolidation serialization errors"
          git push origin HEAD:agent/local-execution-bridge
