name: Apply live permission refresh

on:
  push:
    branches:
      - feat/persistent-permission-modes

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/persistent-permission-modes
          fetch-depth: 0
      - name: Apply runtime refresh
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/medusa-runtime/src/lib.rs')
          text = path.read_text()
          method = '''    fn refresh_permission_mode(&mut self) -> Result<PermissionMode, RuntimeError> {
              let permission_mode = PermissionStore::user()
                  .and_then(|store| store.load())
                  .map_err(RuntimeError::agent)?;
              let execution_mode = permission_mode.execution_mode();
              self.base_config.agent.mode = execution_mode;
              self.config.agent.mode = execution_mode;
              self.plan_mode = permission_mode.is_read_only();
              Ok(permission_mode)
          }

          '''
          if 'fn refresh_permission_mode(&mut self)' not in text:
              needle = '    fn settings_event(&self) -> RuntimeEvent {\n'
              if needle not in text:
                  raise SystemExit('settings_event insertion point missing')
              text = text.replace(needle, method + needle, 1)
          prompt_marker = '    info!(repository = %state.repo.display(), "runtime prompt started");\n'
          refresh = prompt_marker + '    state.refresh_permission_mode()?;\n'
          if refresh not in text:
              if prompt_marker not in text:
                  raise SystemExit('run_prompt marker missing')
              text = text.replace(prompt_marker, refresh, 1)
          path.write_text(text)
          PY
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0
        with:
          toolchain: 1.88.0
          components: rustfmt
      - run: cargo fmt --all
      - name: Check runtime
        run: cargo check -p medusa-runtime --locked
      - name: Commit live refresh
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/medusa-runtime/src/lib.rs
          git commit -m "fix: apply persisted permissions to live runtimes"
          git push origin HEAD:feat/persistent-permission-modes
