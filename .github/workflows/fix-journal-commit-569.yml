name: Fix issue 569 journal commit compatibility

on:
  push:
    branches:
      - agent/569-runtime-durable-event-coverage
    paths:
      - .github/workflows/fix-journal-commit-569.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Preserve write-ahead commit and concurrent merge semantics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('crates/medusa-agent/src/journal.rs')
          text = path.read_text()
          old = '''pub(crate) fn commit_snapshot(session: &AgentSession) -> MedusaResult<AgentSession> {
              let _guard = lock_journal();
              verify_chain(&session.events)?;
              ensure_initialized(session)?;
              let path = journal_path(&session.repo, &session.id)?;
              let state = read_journal(&path, &session.id, true, true)?;
              let mut merged = session.clone();
              merge_committed_events(&mut merged, &state.events)?;
              append_record(&path, &snapshot_record(&merged))?;
              Ok(merged)
          }
          '''
          new = '''pub(crate) fn commit_snapshot(session: &AgentSession) -> MedusaResult<AgentSession> {
              let _guard = lock_journal();
              verify_chain(&session.events)?;
              ensure_initialized(session)?;
              let path = journal_path(&session.repo, &session.id)?;
              let state = read_journal(&path, &session.id, true, false)?;
              let mut merged = session.clone();

              if state.events != merged.events {
                  if let Some(committed) = state.committed_snapshot.as_ref() {
                      merge_committed_events(&mut merged, &committed.events)?;
                  }
              }

              if state.events != merged.events {
                  let recovered = read_journal(&path, &session.id, true, true)?;
                  merged = session.clone();
                  merge_committed_events(&mut merged, &recovered.events)?;
                  if recovered.events != merged.events {
                      return Err(persistence_error(
                          "cannot commit a session whose events diverge from the journal",
                      ));
                  }
              }

              append_record(&path, &snapshot_record(&merged))?;
              Ok(merged)
          }
          '''
          if old not in text:
              raise SystemExit('expected commit_snapshot block not found')
          path.write_text(text.replace(old, new, 1))
          PY
          cargo fmt --all
          cargo test -p medusa-agent session::journal::tests --lib
          cargo clippy -p medusa-agent --all-targets --all-features -- -D warnings
          rm .github/workflows/fix-journal-commit-569.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Preserve journal write-ahead commit semantics"
          git push
