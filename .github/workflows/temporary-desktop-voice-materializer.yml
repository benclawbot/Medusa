name: Temporary desktop voice materializer
on:
  workflow_dispatch:
  push:
    branches: [agent/issue-484-desktop-voice-controls]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: agent/issue-484-desktop-voice-controls }
      - run: git apply .github/voice-app.patch
      - run: |
          rm .github/voice-app.patch .github/workflows/temporary-desktop-voice-materializer.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Desktop: add realtime voice controls"
          git push
