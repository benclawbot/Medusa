name: Apply integration payload

on:
  push:
    branches: [fix/integrate-shipped-subsystems]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event_name != 'push' || github.event.head_commit.message != 'Apply integrated subsystem code changes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - name: Apply code integration archive
        shell: bash
        run: |
          set -euo pipefail
          cat .github/integration-code/chunk-* > /tmp/integration-code.b64
          base64 --decode /tmp/integration-code.b64 > /tmp/integration-code.tar.gz
          tar -xzf /tmp/integration-code.tar.gz
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/architecture-policy.json crates/medusa-agent/src/policy.rs crates/medusa-improvement/src/lib.rs crates/medusa-intelligence/src/lib.rs scripts/architecture-policy.py
          git diff --cached --check
          git commit -m 'Apply integrated subsystem code changes'
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
