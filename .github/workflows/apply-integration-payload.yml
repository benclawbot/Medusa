name: Apply integration payload

on:
  push:
    branches: [fix/integrate-shipped-subsystems]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'Apply integrated subsystem changes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - name: Apply exact integration archive
        shell: bash
        run: |
          set -euo pipefail
          cat .github/integration-payload/chunk-* > /tmp/integration-files.b64
          base64 --decode /tmp/integration-files.b64 > /tmp/integration-files.tar.gz
          tar -xzf /tmp/integration-files.tar.gz
          rm -rf .github/integration-payload .github/workflows/apply-integration-payload.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'Apply integrated subsystem changes'
          git push origin HEAD:${GITHUB_REF_NAME}
