name: Issue 754 review fixes

on:
  push:
    paths:
      - .github/workflows/issue-754-review-fixes.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/issue-754-compaction-manifest-v2
      - name: Apply review fixes
        run: python3 .github/scripts/issue754_review_fixes.py
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0
      - run: cargo generate-lockfile
      - run: cargo fmt --all
      - name: Test compaction unit coverage
        run: cargo test -p medusa-agent compaction --locked -- --nocapture
      - name: Test structured compaction integration
        run: cargo test -p medusa-agent --test structured_compaction --locked -- --nocapture
      - name: Check agent
        run: cargo check -p medusa-agent --locked
      - name: Commit review fixes
        run: |
          git config user.name 'BenClawBot (AlphaOM3G1)'
          git config user.email 'benclawbot@gmail.com'
          git add crates/medusa-agent/src/compaction_v2.rs crates/medusa-agent/src/engine.rs
          git commit -m 'fix: address compaction v2 review findings'
          git push origin HEAD:agent/issue-754-compaction-manifest-v2
