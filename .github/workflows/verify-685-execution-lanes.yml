name: Verify 685 Execution Lanes
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  verify:
    if: github.head_ref == 'perf/685-execution-lanes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: perf/685-execution-lanes
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0
        with:
          components: rustfmt, clippy
      - name: Wire execution lane module
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('crates/medusa-agent/src/lib.rs')
          s = p.read_text()
          if 'mod execution_lane;' not in s:
              s = s.replace('mod evidence;\n', 'mod evidence;\nmod execution_lane;\n', 1)
          export = 'pub use execution_lane::{ExecutionLane, ExecutionLaneDecision, ExecutionLaneInput, select_execution_lane};\n'
          if export not in s:
              s = s.replace('pub use engine_support::{compact_session, update_session_objective};\n', 'pub use engine_support::{compact_session, update_session_objective};\n' + export, 1)
          p.write_text(s)
          PY
      - name: Format
        run: cargo fmt --all -- --check
      - name: Focused tests
        run: cargo test -p medusa-agent execution_lane -- --nocapture
      - name: Agent tests
        run: cargo test -p medusa-agent --lib -- --nocapture
      - name: Clippy
        run: cargo clippy -p medusa-agent --all-targets --all-features --locked -- -D warnings
      - name: Publish verified source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/medusa-agent/src/lib.rs
          git diff --cached --quiet || git commit -m 'Wire deterministic execution lane selection'
          git push origin HEAD:perf/685-execution-lanes
