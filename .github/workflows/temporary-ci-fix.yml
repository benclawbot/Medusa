name: Temporary Telegram CI fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0 # 1.88.0
        with:
          components: rustfmt
      - name: Scope test-only protocol constants
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          for name in ("command.rs", "event.rs"):
              path = Path("crates/medusa-protocol/src/frontend") / name
              text = path.read_text()
              old = "use super::FRONTEND_PROTOCOL_VERSION;"
              new = "#[cfg(test)]\nuse super::FRONTEND_PROTOCOL_VERSION;"
              if new not in text:
                  if old not in text:
                      raise SystemExit(f"expected import not found in {path}")
                  path.write_text(text.replace(old, new, 1))
          PY
      - name: Apply canonical formatting
        shell: bash
        run: cargo fmt --all
      - name: Commit CI fix
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "fix: scope frontend protocol constants to tests"
          git push origin "HEAD:${HEAD_BRANCH}"
