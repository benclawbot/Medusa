name: Apply issue 690 panic-audit fix

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/issue-690-panic-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'perf/690-bounded-speculative-implementation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0
        with:
          components: rustfmt,clippy
      - name: Remove production panic and verify exact audit scope
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('crates/medusa-multi-agent-scheduler/src/speculation.rs')
          s = p.read_text()
          old = '''    let implementation = planning.task(TaskKind::Implementation);\n    let eligible = planning.lane == ExecutionLane::StandardMutation'''
          new = '''    let Some(implementation) = planning.task(TaskKind::Implementation) else {\n        return SpeculationPolicy {\n            eligible: false,\n            class: None,\n            rationale: "speculation requires a high-confidence medium-risk mutation with exact resolved scope"\n                .to_owned(),\n            budget,\n            assumptions: None,\n        };\n    };\n    let eligible = planning.lane == ExecutionLane::StandardMutation'''
          assert old in s, 'policy implementation lookup shape changed'
          s = s.replace(old, new, 1)
          old = '''        && implementation.is_some_and(|planned| planned.task.speculative);'''
          new = '''        && implementation.task.speculative;'''
          assert old in s, 'policy eligibility shape changed'
          s = s.replace(old, new, 1)
          old = '''    let implementation = implementation.expect("eligibility requires implementation task");\n'''
          assert old in s, 'expect site changed'
          s = s.replace(old, '', 1)
          p.write_text(s)
          PY
          cargo fmt --all
          cargo generate-lockfile
          cargo clippy --workspace --all-features --locked --lib --bins --examples -- \
            -D clippy::unwrap_used \
            -D clippy::expect_used \
            -D clippy::panic
          cargo test -p medusa-multi-agent-scheduler --lib speculation -- --nocapture
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/medusa-multi-agent-scheduler/src/speculation.rs
          git diff --cached --quiet && exit 0
          git commit -m 'fix: fail closed without panic in speculation policy'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
