name: Apply parent review turn fix

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: apply-parent-review-turn-fix-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ github.event.pull_request.number == 665 && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0 # 1.88.0
        with:
          components: rustfmt
      - name: Apply verified role-safe parent review patch
        shell: bash
        run: |
          set -euo pipefail
          patch=.github/scripts/parent-review-turn-fix.patch
          git apply --check "$patch"
          git apply "$patch"
          cargo fmt --all
          rm -f "$patch" .github/workflows/zz-apply-parent-review-turn-fix.yml
          git diff --check
      - name: Validate focused crates
        run: cargo test -p medusa-agent -p medusa-runtime --lib --locked
      - name: Commit generated fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Fix role-scoped transactional parent review prompts"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
