name: Launch durable session attachment materialization

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/materialize-durable-session-attachments-pr.yml

permissions:
  contents: write

jobs:
  launch:
    if: github.head_ref == 'agent/durable-session-attachments'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/durable-session-attachments
          fetch-depth: 0
      - name: Execute prepared implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          from pathlib import Path

          source = Path('.github/workflows/materialize-durable-session-attachments.yml')
          launcher = Path('.github/workflows/materialize-durable-session-attachments-pr.yml')
          text = source.read_text()
          marker = '        run: |\n'
          script = text.split(marker, 1)[1]
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in script.splitlines()
          ) + '\n'
          script = '\n'.join(
              line
              for line in script.splitlines()
              if not line.startswith('decode crates/medusa-runtime/src/session_broker.rs ')
              and not line.startswith('decode docs/architecture/durable-session-attachments.md ')
          ) + '\n'
          script = script.replace(
              f'rm {source}',
              f'rm {source} {launcher}',
          )
          script = script.replace(
              f'docs/architecture/durable-session-attachments.md {source}',
              f'docs/architecture/durable-session-attachments.md {source} {launcher}',
          )
          Path('/tmp/materialize.sh').write_text(script)
          PYCODE
          bash /tmp/materialize.sh
