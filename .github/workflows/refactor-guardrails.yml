name: Refactor Guardrails

on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'crates/**'
      - 'apps/**'
      - 'README.md'
      - 'scripts/check-workflow-hygiene.sh'
      - 'scripts/test-workflow-hygiene.sh'
      - 'scripts/check-capability-evidence.py'
      - 'scripts/test-capability-evidence.py'
      - 'scripts/check-documentation.py'
      - 'scripts/test-documentation.py'
      - 'scripts/check-release-keyring.py'
      - 'scripts/test-release-keyring.py'
      - 'scripts/prepare-tauri-linux-tools.py'
      - 'scripts/test-prepare-tauri-linux-tools.py'
      - 'release/keys/**'
      - 'docs/**'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'crates/**'
      - 'apps/**'
      - 'README.md'
      - 'scripts/check-workflow-hygiene.sh'
      - 'scripts/test-workflow-hygiene.sh'
      - 'scripts/check-capability-evidence.py'
      - 'scripts/test-capability-evidence.py'
      - 'scripts/check-documentation.py'
      - 'scripts/test-documentation.py'
      - 'scripts/check-release-keyring.py'
      - 'scripts/test-release-keyring.py'
      - 'scripts/prepare-tauri-linux-tools.py'
      - 'scripts/test-prepare-tauri-linux-tools.py'
      - 'release/keys/**'
      - 'docs/**'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: refactor-guardrails-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-hygiene:
    name: Workflows are read-only or explicitly justified
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Test workflow hygiene guard
        run: bash scripts/test-workflow-hygiene.sh
      - name: Audit repository workflows
        run: bash scripts/check-workflow-hygiene.sh

  compatibility-baseline:
    name: Public API and benchmark baseline present
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate baseline documents
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/REFACTOR-BASELINE.md
          test -s docs/PUBLIC-API-BASELINE.md
          test -s docs/BENCHMARKS.md
          grep -q '75%' docs/REFACTOR-BASELINE.md
          grep -q '5%' docs/BENCHMARKS.md
          grep -q 'medusa-agent' docs/PUBLIC-API-BASELINE.md
          echo refactor-baseline-ok

  public-api-compatibility:
    name: Rust public API remains compatible
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Compare governed crates with the pull-request base
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2
        with:
          baseline-rev: ${{ github.event.pull_request.base.sha }}
          package: medusa-core,medusa-provider,medusa-memory,medusa-intelligence,medusa-agent,medusa-workers,medusa-extensions,medusa-hardening,medusa-daemon,medusa-cli,medusa-tui
          rust-toolchain: '1.93.0'

  capability-evidence:
    name: Capability claims match code, tests, gates, and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Run adversarial synchronization fixtures
        run: python3 scripts/test-capability-evidence.py
      - name: Validate repository capability evidence
        run: python3 scripts/check-capability-evidence.py

  documentation-reconciliation:
    name: Documentation links and reviewed dispositions remain current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Test cross-platform documentation hashing
        run: python3 scripts/test-documentation.py
      - name: Validate every tracked Markdown document
        shell: bash
        run: |
          set -euo pipefail
          if python3 scripts/check-documentation.py; then
            exit 0
          fi
          committed="$(mktemp)"
          cp docs/documentation-inventory.json "$committed"
          python3 scripts/check-documentation.py --write
          echo "::group::Exact stale documentation inventory diff"
          diff -u "$committed" docs/documentation-inventory.json || true
          echo "::endgroup::"
          cp "$committed" docs/documentation-inventory.json
          echo "committed documentation inventory is stale" >&2
          exit 1

  release-keyring:
    name: Release signing remains redundant and rotation-ready
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Run adversarial keyring policy fixtures
        run: python3 scripts/test-release-keyring.py
      - name: Validate public keys, overlap, workflow, and embedded trust references
        run: python3 scripts/check-release-keyring.py

  tauri-linux-tools:
    name: Tauri Linux tool bootstrap fails closed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Test retries, verified cache reuse, and checksum rejection
        run: python3 scripts/test-prepare-tauri-linux-tools.py
