name: PR 902 Format

on:
  push:
    branches: [codex/issue-889-tool-pipeline]

permissions:
  contents: write

concurrency:
  group: pr-902-format
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/issue-889-tool-pipeline
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0
        with:
          components: rustfmt
      - name: Apply rustfmt only
        run: cargo fmt --all
      - name: Commit formatter output
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- crates/medusa-agent/src/engine.rs crates/medusa-agent/src/tools/mod.rs crates/medusa-agent/src/tool_pipeline.rs
          git commit -m "Apply rustfmt to certified tool pipeline"
          git push origin HEAD:codex/issue-889-tool-pipeline
