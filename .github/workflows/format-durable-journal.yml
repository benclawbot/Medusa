name: Format durable journal PR

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/format-durable-journal.yml
      - crates/medusa-agent/src/evidence.rs
      - crates/medusa-agent/src/journal.rs
      - crates/medusa-agent/src/session.rs
      - crates/medusa-agent/src/session_browser.rs

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.ref == 'agent/durable-session-journal-clean' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/durable-session-journal-clean
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          git rm .github/workflows/format-durable-journal.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/medusa-agent/src/evidence.rs crates/medusa-agent/src/journal.rs crates/medusa-agent/src/session.rs crates/medusa-agent/src/session_browser.rs
          git commit -m "Format durable session journal"
          git push origin HEAD:agent/durable-session-journal-clean
