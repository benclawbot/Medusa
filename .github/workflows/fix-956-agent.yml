name: Temporary fix 956

on:
  push:
    branches:
      - fix/956-windows-long-path-cleanup
    paths:
      - .github/workflows/fix-956-agent.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Apply Windows long-path Git fix and regression
        shell: python
        run: |
          from pathlib import Path

          path = Path("crates/medusa-workers/src/lib.rs")
          text = path.read_text()
          old = 'Command::new("git").args(args).current_dir(repo).output()?'
          if text.count(old) != 4:
              raise SystemExit(f"expected four direct git command sites, found {text.count(old)}")
          text = text.replace(old, 'git_command(repo).args(args).output()?')

          marker = '''fn run_git(repo: &Path, args: &[&str]) -> MedusaResult<()> {\n'''
          helper = '''fn git_command(repo: &Path) -> Command {\n    let mut command = Command::new("git");\n    #[cfg(windows)]\n    command.args(["-c", "core.longPaths=true"]);\n    command.current_dir(repo);\n    command\n}\n\n'''
          if marker not in text:
              raise SystemExit("run_git marker missing")
          text = text.replace(marker, helper + marker, 1)

          test_marker = '''    #[test]\n    fn cleanup_removes_worktree_and_temporary_branch() {\n'''
          regression = r'''    #[cfg(windows)]
    #[test]
    fn windows_cleanup_handles_deep_medusa_runtime_paths() {
        let (_directory, repo, worktrees) = repository();
        let manager = WorkerManager::new(&repo, &worktrees).expect("manager");
        let base = manager.repository_head().expect("base");
        let worker = manager
            .create_worker("long-path-cleanup")
            .expect("worker");
        let worktree = worker.worktree.clone();
        let segment = "request-manifest-".to_owned() + &"x".repeat(96);
        let deep = worker
            .worktree
            .join(".medusa")
            .join("request-manifests")
            .join(&segment)
            .join(&segment)
            .join(&segment);
        fs::create_dir_all(&deep).expect("deep runtime directory");
        fs::write(deep.join("manifest.json"), "{}\n").expect("deep runtime file");
        assert!(deep.as_os_str().len() > 260, "fixture must exceed legacy MAX_PATH");

        manager
            .discard_untracked_runtime_state(&worker, &base)
            .expect("discard deep runtime state");
        manager.cleanup(&[worker]).expect("cleanup deep worktree");
        assert!(!worktree.exists());
    }

'''
          if test_marker not in text:
              raise SystemExit("cleanup test marker missing")
          text = text.replace(test_marker, regression + test_marker, 1)
          path.write_text(text)

          Path(".github/workflows/fix-956-agent.yml").unlink()
      - name: Format and test workers
        run: |
          cargo fmt --all -- --check
          cargo test -p medusa-workers --locked
          cargo clippy -p medusa-workers --all-targets --all-features --locked -- -D warnings
      - name: Commit fix
        run: |
          git config user.name medusa-agent
          git config user.email medusa-agent@users.noreply.github.com
          git add crates/medusa-workers/src/lib.rs .github/workflows/fix-956-agent.yml
          git commit -m "fix(workers): make Windows cleanup long-path safe"
          git push origin HEAD:fix/956-windows-long-path-cleanup
