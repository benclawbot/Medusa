name: Finalize desktop daemon authority staging

on:
  push:
    branches:
      - agent/652-desktop-daemon-authority-finalize

permissions:
  contents: write
  statuses: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/652-desktop-daemon-authority-finalize
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0
        with:
          components: rustfmt
      - name: Generate final source tree
        run: |
          python .github/scripts/apply_desktop_daemon_protocol.py
          python .github/scripts/apply_desktop_daemon_authority.py
          python .github/scripts/fix_desktop_daemon_clippy.py
          cargo generate-lockfile
          cargo generate-lockfile --manifest-path apps/medusa-desktop/src-tauri/Cargo.toml
          cargo fmt --all
          git diff --check
          git diff --name-only --diff-filter=ACMRTUXB | grep -v '^\.github/' > generated-files.txt
          test -s generated-files.txt
      - name: Build unattached final commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          repo = os.environ["GITHUB_REPOSITORY"]
          parent = os.environ["GITHUB_SHA"]
          token = os.environ["GH_TOKEN"]
          api = "https://api.github.com"

          def request(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = Request(
                  api + path,
                  data=data,
                  method=method,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "medusa-finalize-staging",
                  },
              )
              with urlopen(req) as response:
                  body = response.read()
              return json.loads(body) if body else {}

          status_path = f"/repos/{repo}/statuses/{parent}"
          try:
              commit = request("GET", f"/repos/{repo}/git/commits/{parent}")
              entries = []
              for line in Path("generated-files.txt").read_text().splitlines():
                  path = line.strip()
                  if not path:
                      continue
                  encoded = base64.b64encode(Path(path).read_bytes()).decode()
                  blob = request(
                      "POST",
                      f"/repos/{repo}/git/blobs",
                      {"content": encoded, "encoding": "base64"},
                  )
                  entries.append({"path": path, "mode": "100644", "type": "blob", "sha": blob["sha"]})

              delete_paths = [
                  ".github/scripts/apply_desktop_daemon_authority.py",
                  ".github/scripts/apply_desktop_daemon_protocol.py",
                  ".github/scripts/desktop_authority_payload_0.txt",
                  ".github/scripts/desktop_authority_payload_1.txt",
                  ".github/scripts/desktop_authority_payload_2.txt",
                  ".github/scripts/desktop_authority_payload_3.txt",
                  ".github/scripts/desktop_authority_payload_4.txt",
                  ".github/scripts/fix_desktop_daemon_clippy.py",
                  ".github/workflows/apply-desktop-daemon-authority.yml",
                  ".github/workflows/finalize-desktop-daemon-authority.yml",
              ]
              entries.extend(
                  {"path": path, "mode": "100644", "type": "blob", "sha": None}
                  for path in delete_paths
              )
              tree = request(
                  "POST",
                  f"/repos/{repo}/git/trees",
                  {"base_tree": commit["tree"]["sha"], "tree": entries},
              )
              final_commit = request(
                  "POST",
                  f"/repos/{repo}/git/commits",
                  {
                      "message": "feat: make desktop workflows daemon-authoritative",
                      "tree": tree["sha"],
                      "parents": [parent],
                  },
              )
              request(
                  "POST",
                  status_path,
                  {
                      "state": "success",
                      "context": "desktop-authority/final-commit",
                      "description": f"final commit {final_commit['sha']}",
                  },
              )
              print(final_commit["sha"])
          except Exception as error:
              try:
                  request(
                      "POST",
                      status_path,
                      {
                          "state": "failure",
                          "context": "desktop-authority/final-commit",
                          "description": "failed to prepare final source commit",
                      },
                  )
              finally:
                  raise
          PY
