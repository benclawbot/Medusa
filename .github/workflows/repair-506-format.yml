name: Repair issue 506 formatting

on:
  push:
    branches:
      - agent/issue-506-deterministic-regression-replay

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-506-deterministic-regression-replay
      - name: Apply rustfmt patch and clean up
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/medusa-improvement/src/regression_replay.rs")
          text = path.read_text()
          replacements = {
              '            let trigger_correct = candidate.candidate_triggered == scenario.candidate_should_trigger;': '            let trigger_correct =\n                candidate.candidate_triggered == scenario.candidate_should_trigger;',
              '                diagnostics.push("originating failure was not reproduced by the baseline".to_owned());': '                diagnostics\n                    .push("originating failure was not reproduced by the baseline".to_owned());',
              '                diagnostics.push("candidate trigger behavior did not match scenario intent".to_owned());': '                diagnostics\n                    .push("candidate trigger behavior did not match scenario intent".to_owned());',
              '        assert!(bundle\n            .scenarios\n            .iter()\n            .any(|scenario| scenario.kind == ReplayScenarioKind::NonApplicableContext));': '        assert!(\n            bundle\n                .scenarios\n                .iter()\n                .any(|scenario| scenario.kind == ReplayScenarioKind::NonApplicableContext)\n        );',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"expected rustfmt source not found: {old}")
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/medusa-improvement/src/regression_replay.rs
          git rm .github/workflows/repair-506-format.yml
          git commit -m "fix: format deterministic regression replay"
          git push
