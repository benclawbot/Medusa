name: Materialize Issue 568 Source

on:
  push:
    branches:
      - agent/568-complete-telegram
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-568
  cancel-in-progress: false

jobs:
  materialize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/568-complete-telegram
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0
      - name: Materialize generated Telegram source
        shell: bash
        run: |
          set -euo pipefail
          cargo check -p medusa-daemon --all-features
          cargo fmt --all
      - name: Remove one-time materialization layer
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            crates/medusa-daemon/build.rs \
            crates/medusa-daemon/build_support.rs \
            crates/medusa-daemon/build_fixups.rs \
            crates/medusa-daemon/build_native.rs \
            crates/medusa-daemon/build_voice_integration.rs \
            crates/medusa-daemon/build_mini_app_integration.rs \
            crates/medusa-daemon/build_mini_app_client.rs \
            crates/medusa-daemon/build_webhook_integration.rs \
            crates/medusa-daemon/build_security.rs \
            crates/medusa-daemon/build_compile_fixups.rs \
            crates/medusa-daemon/src/telegram/materialize_source.rs \
            crates/medusa-daemon/.issue-568-materialized \
            .github/workflows/materialize-568.yml
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/medusa-daemon/src/telegram/mod.rs')
          text = path.read_text()
          text = text.replace('#[cfg(test)]\nmod materialize_source;\n', '')
          path.write_text(text)
          PY
          cargo fmt --all -- --check
      - name: Commit source-only gateway
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'Materialize Telegram gateway source'
          git push origin HEAD:agent/568-complete-telegram
