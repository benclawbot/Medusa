name: Bootstrap issue 447 fix

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.head_ref == 'perf/447-async-capability-discovery'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply exact source transforms
        shell: python
        run: |
          from pathlib import Path
          from textwrap import dedent

          runtime_path = Path("crates/medusa-runtime/src/runtime_impl.rs")
          runtime = runtime_path.read_text()
          start_marker = "fn worker_loop_with_state("
          loop_marker = "    while let Ok(command) = commands.recv() {"
          start = runtime.index(start_marker)
          loop = runtime.index(loop_marker, start)
          prefix = dedent('''\
          fn worker_loop_with_state(
              state: RuntimeState,
              commands: Receiver<RuntimeCommand>,
              events: Sender<RuntimeEvent>,
              cancel: Arc<AtomicBool>,
              submission: Arc<Mutex<SubmissionState>>,
          ) {
              worker_loop_with_discovery(
                  state,
                  commands,
                  events,
                  cancel,
                  submission,
                  capability_event,
              );
          }

          fn worker_loop_with_discovery<F>(
              mut state: RuntimeState,
              commands: Receiver<RuntimeCommand>,
              events: Sender<RuntimeEvent>,
              cancel: Arc<AtomicBool>,
              submission: Arc<Mutex<SubmissionState>>,
              discover: F,
          ) where
              F: FnOnce(PathBuf) -> RuntimeEvent + Send + 'static,
          {
              let _ = events.send(state.settings_event());
              let capability_repo = state.repo.clone();
              let capability_events = events.clone();
              if let Err(error) = thread::Builder::new()
                  .name("medusa-capability-discovery".to_owned())
                  .spawn(move || {
                      let _ = capability_events.send(discover(capability_repo));
                  })
              {
                  let _ = events.send(RuntimeEvent::Notice {
                      title: "Runtime capabilities unavailable".to_owned(),
                      details: vec![format!("failed to start capability discovery: {error}")],
                  });
              }
          ''')
          runtime = runtime[:start] + prefix + runtime[loop:]

          cancel_marker = "fn cancel_requested("
          cancel = runtime.index(cancel_marker)
          helper = dedent('''\
          fn capability_event(repo: PathBuf) -> RuntimeEvent {
              match CapabilityRegistry::discover(repo) {
                  Ok(registry) => RuntimeEvent::Notice {
                      title: "Runtime capabilities".to_owned(),
                      details: registry
                          .prompt_summary()
                          .lines()
                          .map(str::to_owned)
                          .collect(),
                  },
                  Err(error) => RuntimeEvent::Notice {
                      title: "Runtime capabilities unavailable".to_owned(),
                      details: vec![error.to_string()],
                  },
              }
          }

          ''')
          runtime = runtime[:cancel] + helper + runtime[cancel:]
          runtime_path.write_text(runtime)

          tests_path = Path("crates/medusa-runtime/src/tests.rs")
          tests = tests_path.read_text()
          test_marker = "#[test]\nfn text_prompt_becomes_user_message_block()"
          if tests.count(test_marker) != 1:
              raise SystemExit("tests anchor mismatch")
          regression = dedent('''\
          #[test]
          fn command_processing_does_not_wait_for_capability_discovery() {
              use std::{
                  sync::{Arc, Mutex, mpsc},
                  thread,
                  time::Duration,
              };

              let directory = tempdir().expect("temporary directory");
              let state = RuntimeState::load(directory.path().to_path_buf()).expect("runtime state");
              let (command_tx, command_rx) = mpsc::channel();
              let (event_tx, event_rx) = mpsc::channel();
              let cancel = Arc::new(AtomicBool::new(false));
              let submission = Arc::new(Mutex::new(SubmissionState::default()));
              let (discovery_started_tx, discovery_started_rx) = mpsc::channel();
              let (release_tx, release_rx) = mpsc::channel();

              let worker = thread::spawn(move || {
                  worker_loop_with_discovery(
                      state,
                      command_rx,
                      event_tx,
                      cancel,
                      submission,
                      move |_| {
                          discovery_started_tx.send(()).expect("signal discovery start");
                          release_rx.recv().expect("release discovery");
                          RuntimeEvent::Notice {
                              title: "Runtime capabilities".to_owned(),
                              details: vec!["ready".to_owned()],
                          }
                      },
                  );
              });

              assert!(matches!(
                  event_rx.recv_timeout(Duration::from_secs(1)),
                  Ok(RuntimeEvent::Settings { .. })
              ));
              discovery_started_rx
                  .recv_timeout(Duration::from_secs(1))
                  .expect("discovery started");

              command_tx
                  .send(RuntimeCommand::Slash(SlashCommand::Help))
                  .expect("send help command");
              assert!(matches!(
                  event_rx.recv_timeout(Duration::from_secs(1)),
                  Ok(RuntimeEvent::Notice { title, .. }) if title == "Slash commands"
              ));

              release_tx.send(()).expect("release discovery");
              assert!(matches!(
                  event_rx.recv_timeout(Duration::from_secs(1)),
                  Ok(RuntimeEvent::Notice { title, .. }) if title == "Runtime capabilities"
              ));
              command_tx
                  .send(RuntimeCommand::Shutdown)
                  .expect("stop worker");
              worker.join().expect("worker joins");
          }

          ''')
          tests_path.write_text(tests.replace(test_marker, regression + test_marker, 1))

          build_path = Path("crates/medusa-runtime/build.rs")
          build = build_path.read_text()
          old_a = '"    let _ = events.send(state.settings_event());\\n    let capability_event =",'
          new_a = '"    let _ = events.send(state.settings_event());\\n    let capability_repo =",'
          old_b = '"    let _ = events.send(state.settings_event());\\n    for recovery_event in recovery::startup_events(&state.repo) {\\n        let _ = events.send(recovery_event);\\n    }\\n    let capability_event =",'
          new_b = '"    let _ = events.send(state.settings_event());\\n    for recovery_event in recovery::startup_events(&state.repo) {\\n        let _ = events.send(recovery_event);\\n    }\\n    let capability_repo =",'
          if build.count(old_a) != 1 or build.count(old_b) != 1:
              raise SystemExit("build anchors mismatch")
          build_path.write_text(build.replace(old_a, new_a, 1).replace(old_b, new_b, 1))

      - name: Remove bootstrap files
        run: rm .github/issue-447-runtime-fix.patch .github/workflows/issue-447-bootstrap.yml

      - name: Format
        run: cargo fmt --all -- --check

      - name: Focused runtime tests
        run: cargo test -p medusa-runtime command_processing_does_not_wait_for_capability_discovery

      - name: Runtime test suite
        run: cargo test -p medusa-runtime

      - name: Runtime clippy
        run: cargo clippy -p medusa-runtime --all-targets -- -D warnings

      - name: Commit validated source changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/medusa-runtime/build.rs crates/medusa-runtime/src/runtime_impl.rs crates/medusa-runtime/src/tests.rs
          git add -u .github
          git commit -m "perf(runtime): unblock first prompt during capability discovery"
          git push origin HEAD:${{ github.head_ref }}
