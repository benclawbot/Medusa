name: Apply updater path test fix

on:
  push:
    branches:
      - feat/persistent-permission-modes

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/persistent-permission-modes
          fetch-depth: 0
      - name: Make updater path test host-independent
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/medusa-update/src/source.rs')
          lines = path.read_text().splitlines()
          marker = '    fn source_build_target_directory_is_repo_scoped() {'
          index = lines.index(marker)
          lines[index:index + 7] = [
              marker,
              '        let repo = Path::new(r"C:\\repo");',
              '        assert_eq!(',
              '            cargo_target_directory(repo),',
              '            repo.join(".medusa").join("update-cache").join("cargo-target")',
              '        );',
              '    }',
          ]
          path.write_text('\n'.join(lines) + '\n')
          PY
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/medusa-update/src/source.rs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "test: make updater target path assertion host-independent"
          git push origin HEAD:feat/persistent-permission-modes
