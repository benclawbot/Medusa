name: Fix issue 569 retained append API lint

on:
  push:
    branches:
      - agent/569-runtime-durable-event-coverage
    paths:
      - .github/workflows/fix-clippy-569.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve retained append API without dead-code failure
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('crates/medusa-agent/src/journal.rs')
          text = path.read_text()
          text = text.replace(
              '#[derive(Clone, Copy, Debug, Eq, PartialEq)]\npub(crate) enum AppendDisposition',
              '#[allow(dead_code)]\n#[derive(Clone, Copy, Debug, Eq, PartialEq)]\npub(crate) enum AppendDisposition',
              1,
          )
          text = text.replace(
              'pub(crate) fn append_event(\n',
              '#[allow(dead_code)]\npub(crate) fn append_event(\n',
              1,
          )
          path.write_text(text)
          PY
          cargo fmt --all
          rm .github/workflows/fix-clippy-569.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Retain low-level journal append API"
          git push
