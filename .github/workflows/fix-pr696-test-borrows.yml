name: Fix PR 696 test borrows
on:
  push:
    branches:
      - codex/656-typescript-lsp-production
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/656-typescript-lsp-production
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c3e4e4022e16d87065
        with:
          toolchain: 1.88.0
          components: rustfmt
      - name: Borrow optional paths in tests
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('crates/medusa-intelligence/src/typescript_workspace.rs')
          text = path.read_text()
          text = text.replace('.config_path\n                .expect("config")', '.config_path\n                .as_ref()\n                .expect("config")')
          text = text.replace('.package_root\n                .expect("package")', '.package_root\n                .as_ref()\n                .expect("package")')
          path.write_text(text)
          PY
          cargo fmt --all
          rm .github/workflows/fix-pr696-test-borrows.yml
      - name: Commit correction
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/medusa-intelligence/src/typescript_workspace.rs .github/workflows/fix-pr696-test-borrows.yml
          git commit -m "Borrow TypeScript workspace test paths"
          git push origin HEAD:codex/656-typescript-lsp-production
