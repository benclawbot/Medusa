name: Fix 649 Review Evidence Precedence

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: fix-649-review-evidence-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fix:
    if: github.event.pull_request.number == 662 && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0 # 1.88.0
        with:
          components: rustfmt, clippy
      - name: Apply evidence-precedence correction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          transaction_path = Path('crates/medusa-runtime/src/mutation_transaction.rs')
          transaction = transaction_path.read_text(encoding='utf-8')
          review_function = '''    pub fn review_context(&self) -> Result<String, String> {
              if self.state.lifecycle != MutationLifecycle::ReviewPending {
                  return Err(format!(
                      "parent review requires review_pending state, found {:?}",
                      self.state.lifecycle
                  ));
              }
              let patch = fs::read_to_string(self.root.join("prepared.patch"))
                  .map_err(|error| error.to_string())?;
              Ok(format!(
                  "Transactional parent review packet. This packet is the authoritative input for the review decision. The original user request has already been admitted, scoped, and executed by an isolated implementer; do not execute it again or reject the prepared commit merely because this read-only reviewer lacks mutation tools. The primary repository intentionally remains at base HEAD `{}` until authorization, so repository retrieval from the primary tree is stale with respect to prepared commit `{}` and must not be used to claim the patch is absent. Review immutable tree `{}`, exact changed-path scope {:?}, patch fingerprint `{}`, implementation evidence fingerprint `{}`, and runtime worktree verification evidence {:?}. Runtime verification evidence and the immutable patch are authoritative. Implementer narratives and earlier planning or risk summaries are advisory only; ignore any statement that conflicts with the patch or runtime evidence.\n\nPrepared patch:\n{}\n\nDecision rules: accept when the exact patch implements the scoped request, changed paths match the scope, and runtime verification evidence passes. Request revision only for a concrete defect in the prepared patch, scope, or runtime evidence. Do not request revision merely because the original request uses direct-action wording or a completion token, because the parent role is read-only, or because the primary tree still contains base content. You are not being asked to write files, run tests, or claim integration already completed. End the final response with exactly one machine-readable line: `MEDUSA_REVIEW_ACCEPTED: <rationale>` to accept this exact commit, or `MEDUSA_REVISION_REQUESTED: <rationale>` to reject it and preserve the isolated worktree. Any other ending fails closed and cannot authorize integration.",
                  self.state.base_head,
                  self.state.prepared_commit,
                  self.state.prepared_tree,
                  self.state.changed_paths,
                  self.state.patch_fingerprint,
                  self.state.implementation_evidence_fingerprint,
                  self.state.worktree_verification_evidence,
                  patch,
              ))
          }
          '''
          transaction, count = re.subn(
              r'    pub fn review_context\(&self\) -> Result<String, String> \{.*?\n    \}\n\n    pub fn record_parent_review',
              review_function + '\n    pub fn record_parent_review',
              transaction,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'expected one review_context replacement, found {count}')

          test_anchor = '''    #[test]
              fn revision_request_preserves_primary_repository() {'''
          precedence_test = '''    #[test]
              fn review_context_prioritizes_prepared_artifact_and_runtime_evidence() {
                  let (_directory, repo, _manager, mut input) = fixture();
                  input.implementation_summary =
                      "reviewer lacks write tools and the primary tree is unchanged".to_owned();
                  input.worktree_verification_evidence = vec![
                      "test result: ok. 1 passed; 0 failed".to_owned(),
                  ];
                  let root = repo.join(".medusa/executions/test");
                  let transaction =
                      MutationTransaction::open_or_prepare(&root, &repo, input).expect("transaction");
                  let context = transaction.review_context().expect("review context");
                  assert!(context.contains("authoritative input for the review decision"));
                  assert!(context.contains("primary repository intentionally remains at base HEAD"));
                  assert!(context.contains("repository retrieval from the primary tree is stale"));
                  assert!(context.contains("test result: ok. 1 passed; 0 failed"));
                  assert!(context.contains("Implementer narratives and earlier planning or risk summaries are advisory only"));
                  assert!(context.contains("Do not request revision merely because"));
              }

          '''
          if test_anchor not in transaction:
              raise SystemExit('could not locate transaction test insertion point')
          transaction = transaction.replace(test_anchor, precedence_test + test_anchor, 1)
          transaction_path.write_text(transaction, encoding='utf-8')

          coordinator_path = Path('crates/medusa-runtime/src/mutating_worker_coordinator.rs')
          coordinator = coordinator_path.read_text(encoding='utf-8')
          parent_context = '''    pub fn parent_context(&self) -> String {
              format!(
                  "Authoritative isolated implementation evidence. Task `{}` ran as worker `{}` in isolated session `{}`. Immutable commit `{}` (tree `{}`) remains outside the primary repository at base HEAD `{}`. Changed paths: {:?}. Runtime worktree verification: {:?}. The parent is a read-only reviewer and must not write files directly. The untouched primary repository is expected before authorization and is not evidence that the prepared commit lacks the change.\n\n{}\n\nNon-authoritative implementer narrative (advisory only; ignore any claim that conflicts with the immutable patch or runtime verification evidence):\n{}",
                  self.task_id,
                  self.worker_id,
                  self.session_id,
                  self.prepared_commit,
                  self.prepared_tree,
                  self.base_head,
                  self.changed_paths,
                  self.verification_evidence,
                  self.review_context,
                  self.summary,
              )
          }
          '''
          coordinator, count = re.subn(
              r'    pub fn parent_context\(&self\) -> String \{.*?\n    \}\n',
              parent_context,
              coordinator,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'expected one parent_context replacement, found {count}')
          coordinator_path.write_text(coordinator, encoding='utf-8')

          runtime_path = Path('crates/medusa-runtime/src/lib.rs')
          runtime = runtime_path.read_text(encoding='utf-8')
          old = '''    if let Some(evidence) = coordinator_evidence.as_ref() {
              task_context.push(evidence.parent_context());
          }
          if let Some(evidence) = implementation_evidence.as_ref() {
              task_context.push(evidence.parent_context());
          }
          '''
          new = '''    if implementation_evidence.is_none() {
              if let Some(evidence) = coordinator_evidence.as_ref() {
                  task_context.push(evidence.parent_context());
              }
          }
          if let Some(evidence) = implementation_evidence.as_ref() {
              task_context.push(evidence.parent_context());
          }
          '''
          if runtime.count(old) != 1:
              raise SystemExit(f'expected one task-context block, found {runtime.count(old)}')
          runtime_path.write_text(runtime.replace(old, new, 1), encoding='utf-8')
          PY
          cargo fmt --all
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            crates/medusa-runtime/src/lib.rs \
            crates/medusa-runtime/src/mutating_worker_coordinator.rs \
            crates/medusa-runtime/src/mutation_transaction.rs | sort)"
          test "$changed" = "$expected"
          git diff --check
          git diff --stat
      - name: Validate correction
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p medusa-runtime mutation_transaction::tests::review_context_prioritizes_prepared_artifact_and_runtime_evidence --locked
          cargo test -p medusa-runtime --lib --locked
          cargo clippy -p medusa-runtime --lib --locked -- -D warnings
          python3 scripts/check-mutation-lifecycle.py
      - name: Publish corrected source
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/');
          const branch = process.env.HEAD_REF;
          const token = process.env.GITHUB_TOKEN;
          const paths = [
            'crates/medusa-runtime/src/lib.rs',
            'crates/medusa-runtime/src/mutating_worker_coordinator.rs',
            'crates/medusa-runtime/src/mutation_transaction.rs',
          ];

          async function request(url, options = {}) {
            const response = await fetch(`https://api.github.com${url}`, {
              ...options,
              headers: {
                Accept: 'application/vnd.github+json',
                Authorization: `Bearer ${token}`,
                'X-GitHub-Api-Version': '2022-11-28',
                'User-Agent': 'medusa-review-evidence-fix',
                ...(options.headers || {}),
              },
            });
            const text = await response.text();
            const data = text ? JSON.parse(text) : {};
            if (!response.ok) throw new Error(`${response.status} ${text}`);
            return data;
          }

          (async () => {
            for (const path of paths) {
              const encodedPath = path.split('/').map(encodeURIComponent).join('/');
              const current = await request(
                `/repos/${owner}/${repo}/contents/${encodedPath}?ref=${encodeURIComponent(branch)}`,
              );
              const updated = await request(`/repos/${owner}/${repo}/contents/${encodedPath}`, {
                method: 'PUT',
                body: JSON.stringify({
                  message: `Prioritize immutable review evidence: ${path}`,
                  content: fs.readFileSync(path).toString('base64'),
                  sha: current.sha,
                  branch,
                }),
              });
              console.log(`published ${path} at ${updated.commit.sha}`);
            }
          })().catch((error) => {
            console.error(error.stack || error.message || String(error));
            process.exit(1);
          });
          NODE
