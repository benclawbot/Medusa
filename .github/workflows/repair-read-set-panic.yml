name: Repair Read Set Panic Audit

on:
  push:
    branches:
      - agent/local-execution-bridge

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/local-execution-bridge
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt
      - name: Propagate read-set serialization errors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/medusa-worker-read-set/src/lib.rs')
          text = path.read_text()
          text = text.replace(
              'let fingerprint = fingerprint(&(worker_id.as_str(), task_id.as_str(), &files));',
              'let fingerprint = fingerprint(&(worker_id.as_str(), task_id.as_str(), &files))?;',
              1,
          )
          text = text.replace(
              'let validation_fingerprint = fingerprint(&(\n        read_set.fingerprint.as_str(),\n        &stale_reads,\n        &unchanged_paths,\n    ));',
              'let validation_fingerprint = fingerprint(&(\n        read_set.fingerprint.as_str(),\n        &stale_reads,\n        &unchanged_paths,\n    ))?;',
              1,
          )
          text = text.replace(
              'fn fingerprint<T: Serialize>(value: &T) -> String {\n    let bytes = serde_json::to_vec(value).expect("serializing read-set data cannot fail");\n    fingerprint_bytes(&bytes)\n}',
              'fn fingerprint<T: Serialize>(value: &T) -> Result<String, &\'static str> {\n    let bytes = serde_json::to_vec(value).map_err(|_| "read-set serialization failed")?;\n    Ok(fingerprint_bytes(&bytes))\n}',
              1,
          )
          path.write_text(text)
          PY
          cargo fmt --all
      - name: Commit repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/medusa-worker-read-set/src/lib.rs
          git commit -m "Propagate read-set serialization errors"
          git push origin HEAD:agent/local-execution-bridge
