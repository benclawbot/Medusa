name: Issue 974 trusted materializer

on:
  pull_request_target:
    types: [synchronize]

permissions:
  contents: read

jobs:
  materialize:
    if: >-
      github.event.pull_request.number == 975 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/974-provider-aware-tui'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/974-provider-aware-tui
          fetch-depth: 0
          persist-credentials: false
      - name: Execute staged source edits
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/issue-974-materialize.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(workflow) if "python3 - <<'PY'" in line) + 1
          end = next(i for i in range(start, len(workflow)) if workflow[i].strip() == 'PY')
          body = workflow[start:end]
          indent = min(len(line) - len(line.lstrip()) for line in body if line.strip())
          source = '\n'.join(line[indent:] for line in body) + '\n'
          exec(compile(source, 'issue-974-materializer.py', 'exec'), {})
          PY
          rm -f .github/workflows/issue-974-materialize.yml
          rm -f .github/workflows/issue-974-pr-materialize.yml
          rm -f .github/issue-974-trigger
      - name: Format and validate
        run: |
          cargo fmt --all
          git diff --check
          cargo test -p medusa-config --locked
          cargo test -p medusa-tui --locked
          cargo check -p medusa-runtime -p medusa-tui --locked
          cargo clippy -p medusa-config -p medusa-runtime -p medusa-tui --all-targets -- -D warnings
      - name: Package validated source
        shell: bash
        run: |
          git diff --name-only --diff-filter=ACMRT origin/main...HEAD > materialized-files.txt
          git diff --name-only --diff-filter=D origin/main...HEAD > materialized-deletions.txt
          git diff --binary origin/main...HEAD > issue-974.patch
          tar -czf issue-974-source.tar.gz --files-from materialized-files.txt
          git rev-parse HEAD > materialized-parent.txt
          sha256sum issue-974-source.tar.gz > materialized-sha256.txt
      - name: Upload validated source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-974-materialized-source
          path: |
            issue-974-source.tar.gz
            issue-974.patch
            materialized-files.txt
            materialized-deletions.txt
            materialized-parent.txt
            materialized-sha256.txt
          if-no-files-found: error
