name: Issue 974 trusted materializer

on:
  pull_request_target:
    types: [synchronize, labeled, reopened]

permissions:
  contents: write

jobs:
  materialize:
    if: >-
      github.event.pull_request.number == 975 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/974-provider-aware-tui'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Apply staged source changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/issue-974-materialize.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(source) if "python3 - <<'PY'" in line) + 1
          end = next(i for i in range(start, len(source)) if source[i].strip() == 'PY')
          body = '\n'.join(line[10:] if line.startswith('          ') else line for line in source[start:end]) + '\n'
          Path('/tmp/materialize.py').write_text(body)
          PY
          python3 /tmp/materialize.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/medusa-tui/src/runtime.rs')
          text = p.read_text()
          old = '''        let acknowledgement = self.dispatch(FrontendCommand::ConfigureModel {
            provider: provider.clone(),
            model,
        })?;'''
          new = '''        let acknowledgement = self.dispatch(FrontendCommand::ConfigureModel {
            provider: provider.clone(),
            model: model.clone(),
        })?;'''
          if old not in text:
              raise SystemExit('configure model ownership snippet missing')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Validate materialized source
        run: |
          cargo fmt --all
          git diff --check
          cargo check -p medusa-tui
          cargo test -p medusa-config --locked
          cargo test -p medusa-tui --locked
          cargo check -p medusa-runtime -p medusa-tui --locked
          cargo clippy -p medusa-config -p medusa-runtime -p medusa-tui --all-targets -- -D warnings
      - name: Commit validated source
        shell: bash
        run: |
          rm -f .github/workflows/issue-974-materialize.yml .github/workflows/issue-974-pr-materialize.yml .github/workflows/issue-974-push-finalize.yml .github/issue-974-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(tui): make OAuth model configuration provider-aware"
          git push origin HEAD:agent/974-provider-aware-tui
