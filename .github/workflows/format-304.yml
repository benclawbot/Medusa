name: Format issue 304 sources

on:
  push:
    branches:
      - issue-304-turn-memory-pipeline

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-304-turn-memory-pipeline
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt
      - name: Format and remove temporary workflow
        run: |
          cargo fmt --all
          rm .github/workflows/format-304.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/medusa-runtime/src/generated_lib.rs crates/medusa-mcp-cache/src/generated_lib.rs .github/workflows/format-304.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Format canonical turn pipeline"
          git push origin HEAD:issue-304-turn-memory-pipeline
