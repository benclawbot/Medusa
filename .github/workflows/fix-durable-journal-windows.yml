name: Fix durable journal Windows lint

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/fix-durable-journal-windows.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.ref == 'agent/durable-session-journal-clean' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/durable-session-journal-clean
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Correct cross-platform helper
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('crates/medusa-agent/src/session.rs')
          source = path.read_text()
          old = '''fn sync_parent(path: &Path) {
    #[cfg(unix)]
    if let Some(parent) = path.parent() {
        if let Ok(directory) = fs::File::open(parent) {
            let _ = directory.sync_all();
        }
    }
}'''
          new = '''fn sync_parent(path: &Path) {
    #[cfg(unix)]
    if let Some(parent) = path.parent() {
        if let Ok(directory) = fs::File::open(parent) {
            let _ = directory.sync_all();
        }
    }
    #[cfg(not(unix))]
    let _ = path;
}'''
          if source.count(old) != 1:
              raise SystemExit(f'expected one sync_parent helper, found {source.count(old)}')
          path.write_text(source.replace(old, new))
          PY
          cargo fmt --all
          git rm .github/workflows/fix-durable-journal-windows.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/medusa-agent/src/session.rs
          git commit -m "Fix durable journal Windows lint"
          git push origin HEAD:agent/durable-session-journal-clean
