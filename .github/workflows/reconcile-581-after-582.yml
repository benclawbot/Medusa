name: Reconcile PR 581 after PR 582

on:
  push:
    branches:
      - agent/569-runtime-durable-event-coverage
    paths:
      - .github/workflows/reconcile-581-after-582.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/569-runtime-durable-event-coverage
      - name: Merge current main and retain the broader implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          original_head="$(git rev-parse HEAD)"
          git fetch origin main
          if git merge-base --is-ancestor origin/main HEAD; then
            rm .github/workflows/reconcile-581-after-582.yml
            git add -A
            git commit -m "Remove completed PR 581 reconciliation workflow"
            git push origin HEAD:agent/569-runtime-durable-event-coverage
            exit 0
          fi
          git merge --no-commit --no-ff origin/main || true
          git checkout "$original_head" -- \
            crates/medusa-agent/src/journal.rs \
            crates/medusa-agent/src/lib.rs \
            crates/medusa-protocol/src/lib.rs \
            crates/medusa-runtime/src/lib.rs
          rm .github/workflows/reconcile-581-after-582.yml
          git add -A
          unresolved="$(git diff --name-only --diff-filter=U)"
          if [ -n "$unresolved" ]; then
            printf 'Unresolved merge paths:\n%s\n' "$unresolved" >&2
            exit 1
          fi
          git commit -m "Reconcile durable event coverage with merged PR 582"
          git push origin HEAD:agent/569-runtime-durable-event-coverage
