name: Temporary issue 870 Desktop OAuth integration
on:
  push:
    branches: [codex/issue-870-desktop-onboarding]
permissions:
  contents: write
jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/issue-870-desktop-onboarding
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Add OAuth authority and frontend integration
        run: |
          cat > apps/medusa-desktop/src-tauri/src/provider_auth.rs <<'RS'
          use std::process::{Command, Stdio};

          fn browser_oauth_spec(provider: &str) -> Result<(&'static str, [&'static str; 6]), String> {
              if provider != "openai-oauth" {
                  return Err(format!(
                      "provider `{provider}` does not expose a Medusa browser sign-in helper"
                  ));
              }
              Ok((
                  "npx",
                  [
                      "--yes",
                      "openai-oauth@latest",
                      "login",
                      "--open",
                      "--login-timeout-ms",
                      "300000",
                  ],
              ))
          }

          #[tauri::command]
          pub async fn desktop_browser_oauth(provider: String) -> Result<(), String> {
              let (program, args) = browser_oauth_spec(&provider)?;
              tauri::async_runtime::spawn_blocking(move || {
                  let status = Command::new(program)
                      .args(args)
                      .stdin(Stdio::null())
                      .stdout(Stdio::null())
                      .stderr(Stdio::null())
                      .status()
                      .map_err(|error| {
                          format!(
                              "could not launch browser sign-in with openai-oauth: {error}. Install Node.js and retry from Medusa"
                          )
                      })?;
                  if status.success() {
                      Ok(())
                  } else {
                      Err(format!("openai-oauth browser sign-in exited with {status}"))
                  }
              })
              .await
              .map_err(|error| format!("browser sign-in task failed: {error}"))?
          }

          #[cfg(test)]
          mod tests {
              use super::*;

              #[test]
              fn oauth_command_matches_cli_contract() {
                  let (program, args) = browser_oauth_spec("openai-oauth").expect("oauth spec");
                  assert_eq!(program, "npx");
                  assert_eq!(
                      args,
                      [
                          "--yes",
                          "openai-oauth@latest",
                          "login",
                          "--open",
                          "--login-timeout-ms",
                          "300000",
                      ]
                  );
              }

              #[test]
              fn non_oauth_provider_is_rejected() {
                  assert!(browser_oauth_spec("minimax").is_err());
              }
          }
          RS

          python3 - <<'PY'
          from pathlib import Path

          lib = Path('apps/medusa-desktop/src-tauri/src/lib.rs')
          s = lib.read_text()
          s = s.replace('mod pull_requests;\n', 'mod pull_requests;\nmod provider_auth;\n')
          s = s.replace('use pull_requests::runtime_create_draft_pull_request;\n', 'use pull_requests::runtime_create_draft_pull_request;\nuse provider_auth::desktop_browser_oauth;\n')
          s = s.replace('            desktop_model_registry,\n', '            desktop_model_registry,\n            desktop_browser_oauth,\n')
          lib.write_text(s)

          catalog = Path('apps/medusa-desktop/src/providerCatalog.ts')
          s = catalog.read_text()
          s = s.replace('export async function loadProviderCatalog(): Promise<ProviderCatalogEntry[]> {\n  const providers = await invoke<ProviderCatalogEntry[]>("desktop_provider_catalog");', 'export async function loadProviderCatalog(refresh = false): Promise<ProviderCatalogEntry[]> {\n  const providers = await invoke<ProviderCatalogEntry[]>("desktop_provider_catalog");')
          s = s.replace('    const registry = await loadModelRegistry();', '    const registry = await loadModelRegistry(refresh);')
          s += '\nexport async function startBrowserOauth(provider: string): Promise<void> {\n  await invoke("desktop_browser_oauth", { provider });\n}\n'
          catalog.write_text(s)

          onboarding = Path('apps/medusa-desktop/src/DesktopOnboarding.tsx')
          s = onboarding.read_text()
          s = s.replace('  onApply: (next: { provider: string; model: string; effort: Effort; apiKey?: string }) => Promise<void>;\n', '  onApply: (next: { provider: string; model: string; effort: Effort; apiKey?: string }) => Promise<void>;\n  onBrowserOauth: (provider: string) => Promise<void>;\n')
          s = s.replace('export function DesktopOnboarding({ configuration, providers, error, onApply }: Props) {', 'export function DesktopOnboarding({ configuration, providers, error, onApply, onBrowserOauth }: Props) {')
          s = s.replace('  const [saving, setSaving] = useState(false);\n', '  const [saving, setSaving] = useState(false);\n  const [authenticating, setAuthenticating] = useState(false);\n  const [oauthConnected, setOauthConnected] = useState(configuration.credentialConfigured);\n')
          anchor = '  const verify = async () => {\n'
          oauth_fn = '''  const authenticateWithBrowser = async () => {\n    setAuthenticating(true);\n    try {\n      await onBrowserOauth(provider);\n      setOauthConnected(true);\n      setStep("model");\n    } finally {\n      setAuthenticating(false);\n    }\n  };\n\n'''
          if anchor not in s:
              raise SystemExit('DesktopOnboarding verify anchor missing')
          s = s.replace(anchor, oauth_fn + anchor, 1)
          old = '{oauth && !configuration.credentialConfigured && <p role="status">Browser OAuth is not yet connected for this profile.</p>}\n            <div>\n              <button className="secondary-action" onClick={() => setStep("provider")}>Back</button>\n              <button className="primary-action" disabled={oauth ? !configuration.credentialConfigured : !credentialless && !apiKey.trim()} onClick={() => setStep("model")}>Continue</button>\n            </div>'
          new = '''{oauth && !oauthConnected && <p role="status">Browser OAuth is not yet connected for this profile.</p>}\n            <div>\n              <button className="secondary-action" disabled={authenticating} onClick={() => setStep("provider")}>Back</button>\n              {oauth && !oauthConnected ? (\n                <button className="primary-action" disabled={authenticating} onClick={() => void authenticateWithBrowser()}>{authenticating ? "Opening browser…" : "Sign in with browser"}</button>\n              ) : (\n                <button className="primary-action" disabled={!oauth && !credentialless && !apiKey.trim()} onClick={() => setStep("model")}>Continue</button>\n              )}\n            </div>'''
          if old not in s:
              raise SystemExit('DesktopOnboarding auth controls anchor missing')
          s = s.replace(old, new, 1)
          onboarding.write_text(s)

          app = Path('apps/medusa-desktop/src/App.tsx')
          s = app.read_text()
          s = s.replace('import { loadProviderCatalog, type ProviderCatalogEntry } from "./providerCatalog";', 'import { loadProviderCatalog, startBrowserOauth, type ProviderCatalogEntry } from "./providerCatalog";')
          s = s.replace('  const refreshConfiguration = useCallback(async () => {\n', '  const refreshConfiguration = useCallback(async (refreshModels = false) => {\n')
          s = s.replace('      loadProviderCatalog(),\n', '      loadProviderCatalog(refreshModels),\n', 1)
          anchor = '  const applyModel = async () => {\n'
          oauth_cb = '''  const completeBrowserOauth = async (nextProvider: string) => {\n    try {\n      await startBrowserOauth(nextProvider);\n      await refreshConfiguration(true);\n      setError(undefined);\n    } catch (cause) {\n      setError(String(cause));\n      throw cause;\n    }\n  };\n\n'''
          if anchor not in s:
              raise SystemExit('App applyModel anchor missing')
          s = s.replace(anchor, oauth_cb + anchor, 1)
          old = '        onApply={completeOnboarding}\n'
          new = '        onApply={completeOnboarding}\n        onBrowserOauth={completeBrowserOauth}\n'
          if old not in s:
              raise SystemExit('App onboarding props anchor missing')
          s = s.replace(old, new, 1)
          app.write_text(s)
          PY

          cat > apps/medusa-desktop/src/DesktopOnboarding.test.tsx <<'TS'
          import { fireEvent, render, screen, waitFor } from "@testing-library/react";
          import { expect, it, vi } from "vitest";
          import { DesktopOnboarding } from "./DesktopOnboarding";
          import type { ProviderCatalogEntry } from "./providerCatalog";
          import type { SharedConfiguration } from "./runtime";

          const oauthProvider: ProviderCatalogEntry = {
            id: "openai-oauth",
            displayName: "OpenAI account",
            description: "OpenAI OAuth",
            connection: "chatgpt-oauth",
            profileProvider: "openai-oauth",
            authMethods: ["oauth"],
            defaultAuth: "oauth",
            defaultModel: "gpt-5",
            modelOptions: ["gpt-5"],
            browserOauth: true,
            discoverModels: true,
            customValues: false,
            currentCustom: false,
          };

          const configuration: SharedConfiguration = {
            revision: 0,
            activeProfile: "default",
            connection: "chatgpt-oauth",
            provider: "openai-oauth",
            model: "gpt-5",
            effort: "medium",
            auth: "oauth",
            configured: false,
            credentialConfigured: false,
          };

          it("uses browser OAuth and advances only after success", async () => {
            const onBrowserOauth = vi.fn().mockResolvedValue(undefined);
            render(<DesktopOnboarding configuration={configuration} providers={[oauthProvider]} onApply={vi.fn()} onBrowserOauth={onBrowserOauth} />);
            expect(screen.getByRole("heading", { name: "Authenticate" })).toBeInTheDocument();
            fireEvent.click(screen.getByRole("button", { name: "Sign in with browser" }));
            await waitFor(() => expect(onBrowserOauth).toHaveBeenCalledWith("openai-oauth"));
            expect(await screen.findByRole("heading", { name: "Choose a model" })).toBeInTheDocument();
          });

          it("keeps authentication recoverable when browser OAuth fails", async () => {
            const onBrowserOauth = vi.fn().mockRejectedValue(new Error("cancelled"));
            render(<DesktopOnboarding configuration={configuration} providers={[oauthProvider]} onApply={vi.fn()} onBrowserOauth={onBrowserOauth} />);
            fireEvent.click(screen.getByRole("button", { name: "Sign in with browser" }));
            await waitFor(() => expect(onBrowserOauth).toHaveBeenCalled());
            expect(screen.getByRole("heading", { name: "Authenticate" })).toBeInTheDocument();
            expect(screen.getByRole("button", { name: "Sign in with browser" })).toBeEnabled();
          });
          TS

          python3 - <<'PY'
          from pathlib import Path
          p = Path('apps/medusa-desktop/src/App.test.tsx')
          s = p.read_text()
          marker = 'it("starts a general chat without requiring a project", async () => {'
          test = '''it("shows first-run onboarding without starting a runtime for an unconfigured profile", async () => {\n  vi.mocked(loadSharedConfiguration).mockResolvedValueOnce({\n    revision: 0,\n    activeProfile: "default",\n    connection: "direct",\n    provider: "minimax",\n    model: "MiniMax-M3",\n    effort: "medium",\n    auth: "api-key",\n    configured: false,\n    credentialConfigured: false,\n  });\n  render(<App />);\n  expect(await screen.findByRole("heading", { name: "Set up Medusa" })).toBeInTheDocument();\n  expect(startRuntime).not.toHaveBeenCalled();\n});\n\n'''
          if marker not in s:
              raise SystemExit('App test insertion anchor missing')
          s = s.replace(marker, test + marker, 1)
          p.write_text(s)
          PY
      - name: Validate frontend and Rust adapter
        run: |
          cd apps/medusa-desktop
          npm ci
          npm run typecheck
          npm test
          npm run build
          cd src-tauri
          cargo fmt --all -- --check
          cargo test --lib
          cargo clippy --all-targets -- -D warnings
      - name: Commit product changes and remove helper
        run: |
          rm .github/workflows/temp-issue-870-oauth.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/medusa-desktop/src apps/medusa-desktop/src-tauri/src .github/workflows/temp-issue-870-oauth.yml
          git commit -m "Add Desktop browser OAuth onboarding"
          git push origin HEAD:codex/issue-870-desktop-onboarding
