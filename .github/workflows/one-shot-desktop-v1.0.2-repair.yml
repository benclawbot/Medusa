name: One-shot Desktop v1.0.2 repair

on:
  push:
    branches:
      - release/rebuild-desktop-v1.0.2

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: release/rebuild-desktop-v1.0.2
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0 # 1.88.0
        with:
          components: rustfmt
      - name: Apply exact desktop rustfmt repair
        run: cargo fmt --manifest-path apps/medusa-desktop/src-tauri/Cargo.toml
      - name: Normalize documentation inventory newline
        shell: python
        run: |
          from pathlib import Path
          path = Path('docs/documentation-inventory.json')
          data = path.read_bytes().rstrip(b'\r\n') + b'\n'
          path.write_bytes(data)
      - name: Remove one-shot helper and commit repairs
        shell: bash
        run: |
          rm .github/workflows/one-shot-desktop-v1.0.2-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No repairs required.'
            exit 0
          fi
          git commit -m 'fix: repair desktop release validation'
          git push origin HEAD:release/rebuild-desktop-v1.0.2
