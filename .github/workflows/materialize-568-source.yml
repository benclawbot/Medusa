name: Materialize #568 Telegram delivery

on:
  push:
    branches: [agent/568-complete-telegram]
  pull_request:
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: materialize-568-telegram
  cancel-in-progress: true

jobs:
  materialize:
    if: >-
      github.repository == 'benclawbot/Medusa' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/agent/568-complete-telegram') ||
       (github.event_name == 'pull_request' && github.head_ref == 'agent/568-complete-telegram'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/568-complete-telegram
          fetch-depth: 0
      - name: Apply exact Telegram delivery patch
        shell: bash
        run: |
          set -euo pipefail
          cat .medusa-materialize/telegram-slice.patch.b64.* | base64 --decode > "$RUNNER_TEMP/telegram-delivery.patch"
          git apply --check --exclude=.github/workflows/materialize-568-source.yml "$RUNNER_TEMP/telegram-delivery.patch"
          git apply --exclude=.github/workflows/materialize-568-source.yml "$RUNNER_TEMP/telegram-delivery.patch"
          rm -rf .medusa-materialize .github/workflows/materialize-568-source.yml
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0 # 1.88.0
        with:
          components: rustfmt,clippy
      - name: Format materialized source
        run: cargo fmt --all
      - name: Commit source-only result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Deliver canonical session events through Telegram"
          git push origin HEAD:agent/568-complete-telegram
      - name: Lint Telegram delivery slice
        shell: bash
        run: cargo clippy -p medusa-daemon --all-targets --locked -- -D warnings
      - name: Test Telegram delivery slice
        shell: bash
        run: cargo test -p medusa-daemon --locked telegram -- --nocapture
