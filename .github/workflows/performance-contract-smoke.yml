name: Performance Contract and Telemetry Smoke

on:
  push:
    branches: [main]
    paths:
      - 'benchmarks/performance/**'
      - 'scripts/performance/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Compare representative fixtures
        run: >-
          python scripts/performance/compare_runs.py
          benchmarks/performance/fixtures/baseline.json
          benchmarks/performance/fixtures/candidate.json
      - name: Reject correctness regression
        shell: bash
        run: |
          cp benchmarks/performance/fixtures/candidate.json /tmp/regression.json
          python - <<'PY'
          import json
          path = '/tmp/regression.json'
          data = json.load(open(path, encoding='utf-8'))
          data['verified_success'] = False
          json.dump(data, open(path, 'w', encoding='utf-8'))
          PY
          if python scripts/performance/compare_runs.py benchmarks/performance/fixtures/baseline.json /tmp/regression.json; then
            echo 'comparator accepted an unverified result' >&2
            exit 1
          fi

  validate-telemetry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Summarize complete fixture
        run: python scripts/performance/summarize_runs.py benchmarks/performance/fixtures/run-v1.json > /tmp/report.json
      - name: Verify percentiles
        run: python -c "import json; r=json.load(open('/tmp/report.json')); assert r['groups'][0]['p95_ms'] == 1000.0"
      - name: Reject missing telemetry
        shell: bash
        run: |
          python - <<'PY'
          import json
          source = 'benchmarks/performance/fixtures/run-v1.json'
          data = json.load(open(source, encoding='utf-8'))
          del data['artifacts']
          json.dump(data, open('/tmp/incomplete.json', 'w', encoding='utf-8'))
          PY
          if python scripts/performance/summarize_runs.py /tmp/incomplete.json; then
            echo 'summarizer accepted incomplete telemetry' >&2
            exit 1
          fi
