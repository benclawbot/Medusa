name: Publish Rolling Main CLI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rolling-main-cli
  cancel-in-progress: true

jobs:
  build:
    name: Build rolling CLI (${{ matrix.os }})
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0 # 1.88.0
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2
      - name: Build Medusa CLI
        run: cargo build --release --locked --bin medusa
      - name: Package exact-revision rolling asset
        run: >-
          python scripts/package-main-update.py
          --revision ${{ github.sha }}
          --binary ${{ runner.os == 'Windows' && 'target/release/medusa.exe' || 'target/release/medusa' }}
          --output release-assets
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rolling-main-${{ runner.os }}-${{ runner.arch }}
          path: release-assets
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish immutable rolling CLI
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: rolling-main-*
          path: release-assets
          merge-multiple: true
      - name: Verify complete exact-revision bundle
        shell: bash
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: >-
          python scripts/verify-main-update-bundle.py
          --bundle release-assets
          --revision "$EXPECTED_REVISION"
      - name: Publish the immutable revision release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_tag="main-${GITHUB_SHA}"
          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            draft="$(gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
            if [[ "$draft" != "true" ]]; then
              echo "release $release_tag is already published; refusing to mutate an immutable release" >&2
              exit 1
            fi
          else
            gh release create "$release_tag" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --draft \
              --prerelease \
              --title "Medusa rolling main CLI $GITHUB_SHA" \
              --notes "Immutable prebuilt CLI transport for main commit $GITHUB_SHA. Stable releases remain separately signed."
          fi

          # Draft release assets are not downloadable by updater clients. The
          # release becomes visible only after every verified platform pair is
          # uploaded, so no client can observe a partially published revision.
          gh release upload "$release_tag" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$release_tag" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease

      - name: Refresh the legacy rolling alias for older clients
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view main-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create main-latest \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "Medusa rolling main CLI (legacy alias)" \
              --notes "Compatibility alias for clients older than the immutable main-<sha> updater protocol."
          fi

          # The new updater never reads this mutable alias. Older clients still
          # validate each manifest revision and digest; upload archives first so
          # a legacy client can never accept a new manifest without its bytes.
          for archive in release-assets/*.tar.gz release-assets/*.zip; do
            gh release upload main-latest "$archive" --repo "$GITHUB_REPOSITORY" --clobber
          done
          for manifest in release-assets/*.tar.gz.json release-assets/*.zip.json; do
            gh release upload main-latest "$manifest" --repo "$GITHUB_REPOSITORY" --clobber
          done
          if [[ "$(gh release view main-latest --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" == "true" ]]; then
            gh release edit main-latest --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
          fi
