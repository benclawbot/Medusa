name: Fix PR 607 callback result

on:
  push:
    branches:
      - agent/568-durable-media-groups

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/568-durable-media-groups
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0
        with:
          toolchain: 1.88.0
          components: rustfmt
      - name: Normalize callback result type
        shell: python
        run: |
          from pathlib import Path
          path = Path("crates/medusa-daemon/src/telegram/runtime.rs")
          source = path.read_text()
          old = '''                        Ok(_) => self
                            .client
                            .answer_callback_query(&callback.query_id, None)?,
'''
          new = '''                        Ok(_) => {
                            self.client
                                .answer_callback_query(&callback.query_id, None)?;
                        }
'''
          if source.count(old) != 1:
              raise SystemExit("expected callback branch not found exactly once")
          path.write_text(source.replace(old, new))
      - run: cargo fmt --all
      - name: Commit source fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/medusa-daemon/src/telegram/runtime.rs
          git commit -m "Normalize Telegram callback result type"
          git push origin HEAD:agent/568-durable-media-groups
