name: Finalize PR 384

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

jobs:
  merge-main:
    if: github.event.pull_request.number == 384
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/374-appcontainer-shadow-workspace
          fetch-depth: 0
      - name: Merge current main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
          git push origin HEAD:fix/374-appcontainer-shadow-workspace
