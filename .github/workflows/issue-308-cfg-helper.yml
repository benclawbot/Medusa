name: Issue 308 Gate Sandbox Helper

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/issue-308-fail-closed-windows-sandbox'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-308-fail-closed-windows-sandbox
      - name: Gate helper to unsupported platforms
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('crates/medusa-agent/src/policy.rs')
          text = path.read_text()
          old = 'fn sandbox_unavailable(message: impl Into<String>) -> MedusaError {\n'
          new = '#[cfg(not(any(target_os = "linux", target_os = "macos")))]\nfn sandbox_unavailable(message: impl Into<String>) -> MedusaError {\n'
          if old not in text:
              raise SystemExit('sandbox helper anchor missing')
          path.write_text(text.replace(old, new, 1))
          PY
          cargo fmt --all
          cargo test -p medusa-core
          cargo test -p medusa-agent policy::tests
      - name: Commit correction and remove workflow
        run: |
          rm .github/workflows/issue-308-cfg-helper.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Gate sandbox unavailable helper by platform"
          git push origin HEAD:agent/issue-308-fail-closed-windows-sandbox
