name: Verify 688 Live Stream Transport

on:
  push:
    branches: [perf/688-live-stream-transport]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    if: github.event_name == 'push' || github.head_ref == 'perf/688-live-stream-transport'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: perf/688-live-stream-transport
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0
        with:
          toolchain: 1.88.0
          components: rustfmt,clippy
      - name: Apply live streaming transport tranche
        run: |
          python3 .github/scripts/apply-688-live-stream-transport.py
          python3 .github/scripts/fix-688-streaming-fixtures.py
      - name: Format
        run: cargo fmt --all
      - name: Provider tests
        run: cargo test -p medusa-provider -- --nocapture
      - name: Provider Clippy
        run: cargo clippy -p medusa-provider --all-targets --all-features -- -D warnings
      - name: Commit verified source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/medusa-provider Cargo.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Wire live OpenAI streaming transport"
          git push origin HEAD:perf/688-live-stream-transport
