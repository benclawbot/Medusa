name: Finalize issue 352 workspace fixtures

on:
  push:
    branches: [fix/352-self-contained-fallback-profiles]
    paths: [.github/workflows/fix-issue-352-workspace.yml]
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

concurrency:
  group: issue-352-workspace-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/352-self-contained-fallback-profiles
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - name: Update capability fixtures
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/medusa-agent/src/engine_support.rs')
          text = path.read_text()
          old_a = '''            max_image_bytes: Some(1024),
            max_images_per_request: Some(2),
        };'''
          new_a = '''            max_image_bytes: Some(1024),
            max_images_per_request: Some(2),
            tool_calling: true,
            streaming: false,
        };'''
          old_b = '''            max_image_bytes: None,
            max_images_per_request: None,
        };'''
          new_b = '''            max_image_bytes: None,
            max_images_per_request: None,
            tool_calling: true,
            streaming: false,
        };'''
          if old_a in text:
              text = text.replace(old_a, new_a, 1)
          if old_b in text:
              text = text.replace(old_b, new_b, 1)
          path.write_text(text)
          PY
          cargo fmt --all
      - name: Commit fixture updates
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/medusa-agent/src/engine_support.rs
          if ! git diff --cached --quiet; then
            git commit -m "test(agent): declare complete provider capabilities (#352)"
            git pull --rebase origin fix/352-self-contained-fallback-profiles
            git push origin HEAD:fix/352-self-contained-fallback-profiles
          fi
      - name: Workspace Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Workspace tests
        run: cargo test --workspace --all-targets --all-features
