name: Temporary source snapshot

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Package source
        shell: bash
        run: tar --exclude=.git -czf /tmp/medusa-source.tar.gz .
      - name: Upload source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: medusa-source-${{ github.sha }}
          path: /tmp/medusa-source.tar.gz
          retention-days: 1
          if-no-files-found: error
