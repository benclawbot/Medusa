name: Temporary desktop lock fix

on:
  push:
    branches:
      - fix/runtime-scoped-preview-protocol

permissions:
  contents: write

jobs:
  lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/runtime-scoped-preview-protocol
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0
        with:
          toolchain: 1.88.0
      - name: Refresh desktop lock and remove temporary workflow
        run: |
          set -euo pipefail
          cargo metadata --manifest-path apps/medusa-desktop/src-tauri/Cargo.toml --format-version 1 >/dev/null
          rm .github/workflows/temporary-desktop-lock-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/medusa-desktop/src-tauri/Cargo.lock .github/workflows/temporary-desktop-lock-fix.yml
          git commit -m 'build: refresh desktop dependency authority'
          git push origin HEAD:fix/runtime-scoped-preview-protocol
