name: Apply issue 690 runtime compile fix

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/issue-690-runtime-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'perf/690-bounded-speculative-implementation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0
      - name: Patch runtime propagation and lifecycle exhaustiveness
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('crates/medusa-runtime/src/mutating_worker_coordinator.rs')
          s = p.read_text()
          old = '''                    packet,\n                    state.base_head,\n                    None,\n                );'''
          new = '''                    packet,\n                    state.base_head,\n                    speculative,\n                    None,\n                );'''
          assert old in s, 'resume execute_attempts call shape changed'
          s = s.replace(old, new, 1)
          old = '''        packet,\n        base_head,\n        Some(worker),\n    )'''
          new = '''        packet,\n        base_head,\n        speculative,\n        Some(worker),\n    )'''
          assert old in s, 'new execute_attempts call shape changed'
          s = s.replace(old, new, 1)
          old = '''    packet: ContextPacket,\n    base_head: String,\n    mut initial_worker: Option<Worker>,'''
          new = '''    packet: ContextPacket,\n    base_head: String,\n    speculative: Option<&SpeculativeExecutionContext>,\n    mut initial_worker: Option<Worker>,'''
          assert old in s, 'execute_attempts signature shape changed'
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('crates/medusa-runtime/src/mutation_transaction_state.rs')
          s = p.read_text()
          old = '''            MutationLifecycle::PreparedInIsolation => {\n                (RuntimeActivityKind::Progress, "Prepared in isolation")\n            }\n            MutationLifecycle::ReviewPending =>'''
          new = '''            MutationLifecycle::PreparedInIsolation => {\n                (RuntimeActivityKind::Progress, "Prepared in isolation")\n            }\n            MutationLifecycle::SpeculativePrepared => {\n                (RuntimeActivityKind::Progress, "Speculative mutation prepared")\n            }\n            MutationLifecycle::ReviewPending =>'''
          assert old in s, 'lifecycle emit match shape changed'
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          cargo fmt --all
          cargo check -p medusa-runtime
          cargo test -p medusa-multi-agent-scheduler speculation -- --nocapture
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/medusa-runtime/src/mutating_worker_coordinator.rs crates/medusa-runtime/src/mutation_transaction_state.rs
          git diff --cached --quiet && exit 0
          git commit -m 'fix: propagate speculative runtime context'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
