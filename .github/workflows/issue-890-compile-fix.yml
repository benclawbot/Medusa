name: Issue 890 one-shot compile fix

on:
  push:
    branches:
      - codex/issue-890-model-request-policy
    paths:
      - scripts/issue890_compile_fix.py
      - .github/workflows/issue-890-compile-fix.yml

permissions:
  contents: write

jobs:
  fix-and-check:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-890-model-request-policy
          fetch-depth: 0
      - name: Apply compile fix
        run: python3 scripts/issue890_compile_fix.py
      - name: Format Rust
        run: cargo fmt --all
      - name: Remove one-shot tooling
        run: rm scripts/issue890_compile_fix.py .github/workflows/issue-890-compile-fix.yml
      - name: Commit fixed source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix request event frontend projection"
          git push origin HEAD:codex/issue-890-model-request-policy
      - name: Clippy full workspace
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
