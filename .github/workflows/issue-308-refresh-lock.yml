name: Issue 308 Refresh Lockfile

on:
  push:
    branches:
      - agent/issue-308-native-windows-appcontainer

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-308-native-windows-appcontainer
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Refresh Cargo lockfile
        run: cargo update -p windows-sys --precise 0.59.0 || cargo generate-lockfile
      - name: Commit lockfile
        run: |
          rm .github/workflows/issue-308-refresh-lock.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.lock .github/workflows/issue-308-refresh-lock.yml
          git commit -m "Refresh lockfile for Windows sandbox dependencies"
          git push origin HEAD:agent/issue-308-native-windows-appcontainer
