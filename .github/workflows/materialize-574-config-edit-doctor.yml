name: Materialize config edit and doctor

on:
  pull_request:
    branches:
      - main
    paths:
      - validation/materialize_574_config_edit_doctor.py
      - validation/fix_574_config_edit_doctor.py
      - .github/workflows/materialize-574-config-edit-doctor.yml

permissions:
  contents: write

concurrency:
  group: materialize-574-config-edit-doctor-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/574-config-edit-doctor'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0 # stable
      - name: Materialize reviewed configuration wiring
        run: |
          python3 validation/materialize_574_config_edit_doctor.py
          python3 validation/fix_574_config_edit_doctor.py
      - name: Format and validate configuration surfaces
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test -p medusa-cli config_command
          cargo test -p medusa-config provider_profile
          cargo test -p medusa-runtime support
          cargo clippy -p medusa-cli -p medusa-config -p medusa-runtime --all-targets --all-features -- -D warnings
      - name: Commit source-only result
        run: |
          git rm .github/workflows/materialize-574-config-edit-doctor.yml
          git rm validation/materialize_574_config_edit_doctor.py
          git rm validation/fix_574_config_edit_doctor.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/medusa-cli/src/main.rs
          git add crates/medusa-cli/src/config_command.rs
          git add crates/medusa-config/src/lib.rs
          git add crates/medusa-config/src/provider_profile.rs
          git add crates/medusa-runtime/src/support.rs
          git commit -m "Add transactional config edit and doctor"
          git push origin HEAD:${{ github.head_ref }}
