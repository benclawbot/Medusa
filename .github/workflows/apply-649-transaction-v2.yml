name: Apply 649 Transactional Mutation v2

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: apply-649-transaction-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.number == 662 && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0 # 1.88.0
        with:
          components: rustfmt, clippy
      - name: Apply transaction migration
        run: python3 scripts/run-649-migration.py
      - name: Compile all affected targets
        run: cargo check -p medusa-workers -p medusa-runtime -p medusa-agent -p medusa-cli -p medusa-tui -p medusa-daemon --all-targets
      - name: Validate transactional lifecycle
        shell: bash
        run: |
          set -euo pipefail
          {
            cargo fmt --all
            cargo fmt --all -- --check
            cargo test -p medusa-workers --all-targets --locked
            cargo test -p medusa-runtime --lib --locked
            cargo test -p medusa-agent --lib --locked
            cargo clippy -p medusa-workers -p medusa-runtime -p medusa-agent -p medusa-cli -p medusa-tui -p medusa-daemon --all-targets --locked -- -D warnings
            python3 scripts/check-mutation-lifecycle.py
            python3 scripts/architecture-conformance.py --known-failures --json
            python3 scripts/check-architecture-index.py
          } 2>&1 | tee transaction-validation.log
      - name: Publish validated source atomically
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/');
          const branch = process.env.HEAD_REF;
          const token = process.env.GITHUB_TOKEN;
          const paths = [
            '.github/workflows/architecture-v2-baseline.yml',
            'crates/medusa-workers/src/lib.rs',
            'crates/medusa-runtime/src/lib.rs',
            'crates/medusa-runtime/src/multi_agent_coordinator.rs',
            'crates/medusa-runtime/src/mutation_transaction.rs',
            'crates/medusa-runtime/src/mutating_worker_coordinator.rs',
            'crates/medusa-runtime/src/mutating_worker_coordinator_support.rs',
            'crates/medusa-runtime/src/mutating_worker_coordinator_tests.rs',
            'docs/architecture/INDEX.md',
            'docs/architecture/baseline.json',
            'scripts/architecture-conformance.py',
            'scripts/check-architecture-index.py',
            'scripts/check-mutation-lifecycle.py',
          ];

          async function api(path, options = {}) {
            const response = await fetch(`https://api.github.com${path}`, {
              ...options,
              headers: {
                Accept: 'application/vnd.github+json',
                Authorization: `Bearer ${token}`,
                'X-GitHub-Api-Version': '2022-11-28',
                'User-Agent': 'medusa-transaction-migration',
                ...(options.headers || {}),
              },
            });
            const text = await response.text();
            const data = text ? JSON.parse(text) : {};
            if (!response.ok) {
              throw new Error(`${options.method || 'GET'} ${path}: ${response.status} ${text}`);
            }
            return data;
          }

          (async () => {
            const encodedBranch = branch.split('/').map(encodeURIComponent).join('/');
            const ref = await api(`/repos/${owner}/${repo}/git/ref/heads/${encodedBranch}`);
            const parent = ref.object.sha;
            const commit = await api(`/repos/${owner}/${repo}/git/commits/${parent}`);
            const entries = [];
            for (const path of paths) {
              const blob = await api(`/repos/${owner}/${repo}/git/blobs`, {
                method: 'POST',
                body: JSON.stringify({
                  content: fs.readFileSync(path).toString('base64'),
                  encoding: 'base64',
                }),
              });
              entries.push({ path, mode: '100644', type: 'blob', sha: blob.sha });
            }
            const tree = await api(`/repos/${owner}/${repo}/git/trees`, {
              method: 'POST',
              body: JSON.stringify({ base_tree: commit.tree.sha, tree: entries }),
            });
            const created = await api(`/repos/${owner}/${repo}/git/commits`, {
              method: 'POST',
              body: JSON.stringify({
                message: 'Enforce transactional review before integration',
                tree: tree.sha,
                parents: [parent],
              }),
            });
            await api(`/repos/${owner}/${repo}/git/refs/heads/${encodedBranch}`, {
              method: 'PATCH',
              body: JSON.stringify({ sha: created.sha, force: false }),
            });
            console.log(`published validated source commit ${created.sha}`);
          })().catch((error) => {
            console.error(error.stack || error.message || String(error));
            process.exit(1);
          });
          NODE
      - name: Package validated source
        shell: bash
        run: |
          set -euo pipefail
          tar -czf validated-transaction-source.tar.gz \
            .github/workflows/architecture-v2-baseline.yml \
            crates/medusa-workers/src/lib.rs \
            crates/medusa-runtime/src/lib.rs \
            crates/medusa-runtime/src/multi_agent_coordinator.rs \
            crates/medusa-runtime/src/mutation_transaction.rs \
            crates/medusa-runtime/src/mutating_worker_coordinator.rs \
            crates/medusa-runtime/src/mutating_worker_coordinator_support.rs \
            crates/medusa-runtime/src/mutating_worker_coordinator_tests.rs \
            docs/architecture/INDEX.md \
            docs/architecture/baseline.json \
            scripts/architecture-conformance.py \
            scripts/check-architecture-index.py \
            scripts/check-mutation-lifecycle.py
          tar -tzf validated-transaction-source.tar.gz
      - name: Upload validated source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validated-transaction-source-${{ github.sha }}
          path: validated-transaction-source.tar.gz
          if-no-files-found: error
          retention-days: 2
      - name: Upload transaction validation log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: transaction-validation-${{ github.sha }}
          path: transaction-validation.log
          if-no-files-found: warn
          retention-days: 2
