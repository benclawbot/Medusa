name: Phase 1 high-severity fix

on:
  push:
    branches:
      - fix/high-severity-verified-findings

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/high-severity-verified-findings
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0
        with:
          components: rustfmt,clippy
      - name: Apply Phase 1 fixes
        run: python3 scripts/apply-phase1-remediation.py
      - name: Format
        run: cargo fmt --all -- --check
      - name: Targeted tests
        run: cargo test -p medusa-mcp-cache -p medusa-capabilities -p medusa-recovery-coordinator -p medusa-review-model -p medusa-provider -p medusa-agent
      - name: Workspace clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Commit verified fixes
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- scripts/check-repository-artifacts.py
          rm -f .github/workflows/phase1-high-severity-fix.yml
          rm -f .github/workflows/phase1-pr-remediation.yml
          rm -f scripts/apply-phase1-remediation.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: close verified high-severity correctness gaps"
          git push origin HEAD:fix/high-severity-verified-findings
