name: Materialize durable session journal

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'agent/durable-session-journal-v3' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/durable-session-journal-v3
          fetch-depth: 0
      - name: Apply reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/materialize-durable-journal/patch.* | base64 --decode > /tmp/durable-journal.patch
          echo "2b1f40226d443a2d2d82461159e61abb22293ce1ef31fea896a0cb8f3de66674  /tmp/durable-journal.patch" | sha256sum --check -
          git apply --index /tmp/durable-journal.patch
          rm -rf .github/materialize-durable-journal
          rm -f .github/workflows/materialize-durable-session-journal.yml
          cargo fmt --all
          python3 scripts/check-product-architecture.py
          python3 scripts/check-capability-evidence.py
          git add -A
          git diff --cached --check
      - name: Commit clean implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add crash-durable session journal foundation"
          git push origin HEAD:agent/durable-session-journal-v3
