name: Materialize durable session journal

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'agent/durable-session-journal-v3' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/durable-session-journal-v3
          fetch-depth: 0
      - name: Apply reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/durable-journal-chunks.sha256 <<'EOF'
          4a373043311755882f0860cf578bfa8e2dd647ec9a1e5811562a28b2d00d3941  .github/materialize-durable-journal/patch.000
          8669b45864ad33dc51dc6067e43e64a671b2e51c69ae98fd7cf887423ec4ba37  .github/materialize-durable-journal/patch.001
          aef5d4f797815b31e58f64c3e0589162d450b4822a9419251c55154c561ce930  .github/materialize-durable-journal/patch.002
