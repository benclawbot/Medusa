name: One-shot issue 509 canonical matcher

on:
  push:
    branches:
      - agent/509-explainable-learning-retrieval

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[skip-one-shot-509]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/509-explainable-learning-retrieval
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt
      - name: Apply and test canonical matcher
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/medusa-improvement/src/retrieval.rs')
          text = path.read_text()
          start = text.index('fn explicitly_excluded(')
          end = text.index('\nfn equal_scope_conflict', start)
          replacement = '''fn explicitly_excluded(learning: &ScopedLearning, context: &TaskContext) -> bool {
              let learning_terms = expanded_terms(&format!(
                  "{} {} {}",
                  learning.id, learning.conflict_key, learning.generalized_rule
              ));
              let exclusion_terms = context
                  .explicit_exclusions
                  .iter()
                  .flat_map(|excluded| expanded_terms(excluded))
                  .collect::<BTreeSet<_>>();
              !exclusion_terms.is_disjoint(&learning_terms)
                  || !learning
                      .applicability
                      .excluded_contexts
                      .is_disjoint(&context.scope.context_tags)
          }
          '''
          path.write_text(text[:start] + replacement + text[end:])
          PY
          cargo fmt --all
          cargo test -p medusa-improvement retrieval::tests::nearby_non_applicable_task_is_suppressed
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/medusa-improvement/src/retrieval.rs
          git commit -m 'Use canonical exclusion-term matching [skip-one-shot-509]'
          git push origin HEAD:agent/509-explainable-learning-retrieval
