name: Issue 854 write lane completion

on:
  push:
    branches: [codex/854-mutation-provenance]

permissions:
  contents: write

jobs:
  finish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/854-mutation-provenance
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0
        with:
          components: clippy,rustfmt
      - name: Apply write-lane fix
        run: python scripts/issue854_write_lane_fix.py
      - name: Validate regression set and provenance path
        run: |
          cargo fmt --all
          cargo test -p medusa-agent fixture_bug_fix_survives_restart_with_exact_evidence --locked
          cargo test -p medusa-agent policy_denial_becomes_an_exact_one_shot_approval_question --locked
          cargo test -p medusa-agent --test production_mutation_revert --locked
          cargo test -p medusa-agent transaction --locked
          cargo clippy -p medusa-agent --all-targets --all-features --locked -- -D warnings
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/medusa-agent/src/engine.rs
          git diff --cached --check
          git commit -m "fix: preserve unsupported fs_write lanes without provenance"
          git push origin HEAD:codex/854-mutation-provenance
