name: Refresh lock for issue 304

on:
  push:
    branches:
      - issue-304-turn-memory-pipeline

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-304-turn-memory-pipeline
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Refresh lock and remove temporary workflow
        run: |
          cargo generate-lockfile
          rm .github/workflows/refresh-lock-304.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.lock .github/workflows/refresh-lock-304.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Refresh Cargo lock for turn pipeline"
          git push origin HEAD:issue-304-turn-memory-pipeline
