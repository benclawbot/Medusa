name: Issue 890 final negative regressions
on:
  push:
    branches: [codex/issue-890-model-request-policy]
    paths:
      - scripts/issue890_final_negative_tests.py
      - .github/workflows/issue-890-final-negative-tests.yml
permissions:
  contents: write
jobs:
  test-and-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-890-model-request-policy
          fetch-depth: 0
      - run: python3 scripts/issue890_final_negative_tests.py
      - run: cargo fmt --all
      - run: rm scripts/issue890_final_negative_tests.py .github/workflows/issue-890-final-negative-tests.yml
      - name: Commit negative regressions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add request authority negative regressions"
          git push origin HEAD:codex/issue-890-model-request-policy
      - run: cargo test -p medusa-agent --test effective_request_manifest --locked
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test -p medusa-provider --locked
      - run: cargo test -p medusa-runtime --locked
