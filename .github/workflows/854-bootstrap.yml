name: Issue 854 selective revert completion

on:
  push:
    branches: [codex/854-mutation-provenance]

permissions:
  contents: write

jobs:
  finish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/854-mutation-provenance
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0
      - name: Apply production selective revert wiring
        run: |
          python scripts/issue854_finish.py
          sed -i '/^medusa-agent\.workspace = true$/d' crates/medusa-daemon/Cargo.toml
          python - <<'PY'
          from pathlib import Path
          path = Path('crates/medusa-agent/tests/production_mutation_revert.rs')
          text = path.read_text()
          needle = '    let directory = tempfile::tempdir().expect("tempdir");\n'
          replacement = needle + '    assert!(std::process::Command::new("git").arg("init").arg(directory.path()).status().expect("git init").success());\n'
          if text.count(needle) != 2:
              raise SystemExit('unexpected tempdir fixture count')
          path.write_text(text.replace(needle, replacement))
          PY
      - name: Validate
        run: |
          cargo fmt --all
          cargo test -p medusa-agent --test production_mutation_revert --locked
          cargo test -p medusa-agent transaction --locked
          cargo test -p medusa-daemon frontend_control --locked
          cargo check -p medusa-daemon --locked
      - name: Commit implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/medusa-agent crates/medusa-protocol/src/frontend/command.rs crates/medusa-daemon
          git diff --cached --check
          git commit -m "feat: expose selective revert to runtime clients"
          git push origin HEAD:codex/854-mutation-provenance
