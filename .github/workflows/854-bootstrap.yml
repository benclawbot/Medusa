name: Issue 854 selective revert production path

on:
  push:
    branches: [codex/854-mutation-provenance]

permissions:
  contents: write

jobs:
  finish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/854-mutation-provenance
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0
      - name: Wire selective revert through shared frontend control
        shell: python
        run: |
          from pathlib import Path

          tx = Path('crates/medusa-agent/src/transaction.rs')
          text = tx.read_text()
          anchor = 'pub fn preview_selective_revert(repo: &Path, mutation_id: &str) -> MedusaResult<RevertPreview> {'
          helper = '''pub fn preview_session_selective_revert(\n    repo: &Path,\n    session_id: &str,\n    mutation_id: &str,\n) -> MedusaResult<RevertPreview> {\n    let journal = load_provenance(repo)?;\n    let record = journal\n        .records\n        .iter()\n        .find(|record| record.id == mutation_id)\n        .ok_or_else(|| provenance_boundary_error("mutation provenance record is missing"))?;\n    if record.context.session_id != session_id {\n        return Err(provenance_boundary_error(\n            "mutation provenance does not belong to the requested session",\n        ));\n    }\n    preview_selective_revert(repo, mutation_id)\n}\n\npub fn apply_session_selective_revert(\n    repo: &Path,\n    session_id: &str,\n    mutation_id: &str,\n    activity_id: &str,\n    actor: &str,\n) -> MedusaResult<TransactionOutcome> {\n    preview_session_selective_revert(repo, session_id, mutation_id)?;\n    let sequence = next_mutation_sequence(repo, session_id)?;\n    let occurred_at_unix_ms = i64::try_from(\n        time::OffsetDateTime::now_utc().unix_timestamp_nanos() / 1_000_000,\n    )\n    .map_err(|_| provenance_boundary_error("mutation timestamp overflow"))?;\n    let context = MutationContext {\n        session_id: session_id.to_owned(),\n        task_step_id: None,\n        activity_id: activity_id.to_owned(),\n        actor: actor.to_owned(),\n        sequence,\n        occurred_at_unix_ms,\n    };\n    apply_selective_revert(repo, mutation_id, &context)\n}\n\n'''
          if helper not in text:
              if anchor not in text:
                  raise SystemExit('missing preview selective revert anchor')
              text = text.replace(anchor, helper + anchor, 1)
          tx.write_text(text)

          lib = Path('crates/medusa-agent/src/lib.rs')
          text = lib.read_text()
          old = '''    apply_atomic, apply_atomic_with_context, apply_selective_revert, preview,\n    preview_selective_revert,\n};'''
          new = '''    apply_atomic, apply_atomic_with_context, apply_selective_revert,\n    apply_session_selective_revert, preview, preview_selective_revert,\n    preview_session_selective_revert,\n};'''
          if old not in text:
              raise SystemExit('missing transaction export tail')
          lib.write_text(text.replace(old, new, 1))

          command = Path('crates/medusa-protocol/src/frontend/command.rs')
          text = command.read_text()
          anchor = '''    RecoveryAction {\n        operation: String,\n        checkpoint_id: Option<String>,\n        confirmed_destructive_effects: bool,\n    },'''
          repl = anchor + '''\n    PreviewSelectiveRevert {\n        mutation_id: String,\n    },\n    ApplySelectiveRevert {\n        mutation_id: String,\n    },'''
          if 'PreviewSelectiveRevert' not in text:
              if anchor not in text:
                  raise SystemExit('missing recovery command anchor')
              text = text.replace(anchor, repl, 1)
          validation_anchor = '''            Self::RecoveryAction { operation, .. } if operation.trim().is_empty() => {\n                Err("recovery operation cannot be empty")\n            }'''
          validation_repl = validation_anchor + '''\n            Self::PreviewSelectiveRevert { mutation_id }\n            | Self::ApplySelectiveRevert { mutation_id }\n                if mutation_id.trim().is_empty() =>\n            {\n                Err("mutation id cannot be empty")\n            }'''
          if 'mutation id cannot be empty' not in text:
              if validation_anchor not in text:
                  raise SystemExit('missing recovery validation anchor')
              text = text.replace(validation_anchor, validation_repl, 1)
          command.write_text(text)

          front = Path('crates/medusa-daemon/src/frontend_control.rs')
          text = front.read_text()
          status_anchor = '''    Status {\n        session_id: String,\n        runtime_active: bool,\n        busy: bool,\n        journal_cursor: u64,\n        latest_checkpoint_cursor: Option<u64>,\n        replay_equivalent: bool,\n    },'''
          status_repl = status_anchor + '''\n    SelectiveRevertPreview {\n        session_id: String,\n        mutation_id: String,\n        path: String,\n        start_byte: usize,\n        remove_len: usize,\n        restore_len: usize,\n    },\n    SelectiveRevertApplied {\n        session_id: String,\n        mutation_id: String,\n        inverse_mutation_ids: Vec<String>,\n    },'''
          if 'SelectiveRevertPreview' not in text:
              if status_anchor not in text:
                  raise SystemExit('missing status result anchor')
              text = text.replace(status_anchor, status_repl, 1)

          recovery_anchor = '''            FrontendCommand::RecoveryAction {\n                operation,\n                checkpoint_id,\n                confirmed_destructive_effects,\n            } => {'''
          cases = '''            FrontendCommand::PreviewSelectiveRevert { mutation_id } => {\n                let session_id = required_session_id(envelope)?;\n                self.authorize_control(&session_id, &envelope.client_id)?;\n                let preview = medusa_agent::preview_session_selective_revert(\n                    &self.repo,\n                    &session_id,\n                    mutation_id,\n                )\n                .map_err(|error| FrontendControlError::InvalidCommand(error.to_string()))?;\n                Ok(FrontendControlResult::SelectiveRevertPreview {\n                    session_id,\n                    mutation_id: preview.mutation_id,\n                    path: preview.path,\n                    start_byte: preview.start_byte,\n                    remove_len: preview.remove_len,\n                    restore_len: preview.restore_len,\n                })\n            }\n            FrontendCommand::ApplySelectiveRevert { mutation_id } => {\n                let session_id = required_session_id(envelope)?;\n                self.authorize_control(&session_id, &envelope.client_id)?;\n                let outcome = medusa_agent::apply_session_selective_revert(\n                    &self.repo,\n                    &session_id,\n                    mutation_id,\n                    &envelope.command_id,\n                    "frontend-control",\n                )\n                .map_err(|error| FrontendControlError::InvalidCommand(error.to_string()))?;\n                Ok(FrontendControlResult::SelectiveRevertApplied {\n                    session_id,\n                    mutation_id: mutation_id.clone(),\n                    inverse_mutation_ids: outcome.mutation_ids,\n                })\n            }\n'''
          if 'FrontendCommand::PreviewSelectiveRevert' not in text:
              if recovery_anchor not in text:
                  raise SystemExit('missing recovery execute anchor')
              text = text.replace(recovery_anchor, cases + recovery_anchor, 1)
          front.write_text(text)

          # Ensure the daemon has a direct dependency on the agent public API.
          cargo = Path('crates/medusa-daemon/Cargo.toml')
          text = cargo.read_text()
          if 'medusa-agent.workspace = true' not in text:
              dep_anchor = '[dependencies]\n'
              if dep_anchor not in text:
                  raise SystemExit('missing daemon dependencies section')
              text = text.replace(dep_anchor, dep_anchor + 'medusa-agent.workspace = true\n', 1)
          cargo.write_text(text)

          # Black-box proof: production AgentEngine write -> durable mutation id -> restart-safe preview/apply.
          test = Path('crates/medusa-agent/tests/production_mutation_revert.rs')
          test.write_text(r'''use std::{collections::VecDeque, fs, sync::Mutex};

use medusa_agent::{
    AgentEngine, StepOutcome, apply_session_selective_revert,
    preview_session_selective_revert,
};
use medusa_config::Config;
use medusa_core::{ErrorCategory, ErrorCode, MedusaError, MedusaResult};
use medusa_provider::{ModelProvider, ModelRequest, ModelResponse, ResponseBlock, Usage};
use serde_json::json;

struct ScriptedProvider {
    responses: Mutex<VecDeque<ModelResponse>>,
}

impl ScriptedProvider {
    fn new(responses: Vec<ModelResponse>) -> Self {
        Self { responses: Mutex::new(responses.into()) }
    }
}

impl ModelProvider for ScriptedProvider {
    fn complete(&self, _request: &ModelRequest) -> MedusaResult<ModelResponse> {
        self.responses.lock().expect("provider lock").pop_front().ok_or_else(|| {
            MedusaError::new(
                ErrorCode::DependencyUnavailable,
                ErrorCategory::Internal,
                "scripted response exhausted",
            )
        })
    }
}

fn response(blocks: Vec<ResponseBlock>, stop_reason: &str) -> ModelResponse {
    ModelResponse {
        response_id: Some("fixture".into()),
        stop_reason: Some(stop_reason.into()),
        blocks,
        usage: Usage::default(),
    }
}

#[test]
fn ordinary_dispatch_write_survives_restart_and_selectively_reverts() {
    let directory = tempfile::tempdir().expect("tempdir");
    fs::write(directory.path().join("value.txt"), "alpha\nbeta\n").expect("fixture");
    let engine = AgentEngine::new(
        ScriptedProvider::new(vec![response(
            vec![ResponseBlock::ToolUse {
                id: "write-1".into(),
                name: "fs_write".into(),
                input: json!({"path": "value.txt", "content": "alpha\nBETA\n"}),
            }],
            "tool_use",
        )]),
        Config::default(),
    );
    let mut session = engine
        .create_session(directory.path(), "change beta".into())
        .expect("session");
    assert_eq!(engine.step(&mut session).expect("write step"), StepOutcome::Continue);

    let journal: serde_json::Value = serde_json::from_slice(
        &fs::read(directory.path().join(".medusa/mutation-provenance.json"))
            .expect("provenance journal"),
    )
    .expect("valid provenance json");
    let records = journal["records"].as_array().expect("records");
    assert_eq!(records.len(), 1);
    let mutation_id = records[0]["id"].as_str().expect("mutation id").to_owned();
    assert_eq!(records[0]["context"]["session_id"].as_str(), Some(session.id.as_str()));
    assert_eq!(records[0]["context"]["activity_id"].as_str(), Some("write-1"));

    fs::write(directory.path().join("notes.txt"), "user edit\n").expect("unrelated user edit");
    let restarted = AgentEngine::new(ScriptedProvider::new(vec![]), Config::default());
    let resumed = restarted
        .load_session(directory.path(), session.id.as_str())
        .expect("restart load");
    assert_eq!(resumed.id, session.id);

    let preview = preview_session_selective_revert(
        directory.path(),
        session.id.as_str(),
        &mutation_id,
    )
    .expect("preview");
    assert_eq!(preview.path, "value.txt");
    let outcome = apply_session_selective_revert(
        directory.path(),
        session.id.as_str(),
        &mutation_id,
        "frontend-revert-1",
        "frontend-control",
    )
    .expect("revert");
    assert_eq!(fs::read_to_string(directory.path().join("value.txt")).unwrap(), "alpha\nbeta\n");
    assert_eq!(fs::read_to_string(directory.path().join("notes.txt")).unwrap(), "user edit\n");
    assert_eq!(outcome.mutation_ids.len(), 1);
}

#[test]
fn session_scoped_preview_rejects_cross_session_authority() {
    let directory = tempfile::tempdir().expect("tempdir");
    fs::write(directory.path().join("value.txt"), "before\n").expect("fixture");
    let engine = AgentEngine::new(
        ScriptedProvider::new(vec![response(
            vec![ResponseBlock::ToolUse {
                id: "write-1".into(),
                name: "fs_write".into(),
                input: json!({"path": "value.txt", "content": "after\n"}),
            }],
            "tool_use",
        )]),
        Config::default(),
    );
    let mut session = engine.create_session(directory.path(), "write".into()).expect("session");
    engine.step(&mut session).expect("write step");
    let journal: serde_json::Value = serde_json::from_slice(
        &fs::read(directory.path().join(".medusa/mutation-provenance.json")).unwrap(),
    ).unwrap();
    let mutation_id = journal["records"][0]["id"].as_str().unwrap();
    assert!(preview_session_selective_revert(directory.path(), "other-session", mutation_id).is_err());
}
''')
      - name: Format and validate selective revert path
        run: |
          cargo fmt --all
          cargo test -p medusa-agent --test production_mutation_revert --locked
          cargo test -p medusa-agent transaction --locked
          cargo test -p medusa-daemon frontend_control --locked
          cargo check -p medusa-daemon --locked
      - name: Commit selective revert path
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/medusa-agent crates/medusa-protocol/src/frontend/command.rs crates/medusa-daemon
          git diff --cached --check
          git commit -m "feat: expose selective revert to runtime clients"
          git push origin HEAD:codex/854-mutation-provenance
