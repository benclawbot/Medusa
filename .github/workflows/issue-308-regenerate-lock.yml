name: Issue 308 Regenerate Lockfile

on:
  push:
    branches:
      - agent/issue-308-native-windows-appcontainer

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-308-native-windows-appcontainer
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Regenerate Cargo lockfile
        run: cargo generate-lockfile
      - name: Commit lockfile
        run: |
          rm .github/workflows/issue-308-regenerate-lock.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.lock .github/workflows/issue-308-regenerate-lock.yml
          git commit -m "Regenerate lockfile for Windows sandbox"
          git push origin HEAD:agent/issue-308-native-windows-appcontainer
