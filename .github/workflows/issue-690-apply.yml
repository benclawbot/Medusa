name: Apply issue 690 implementation

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/issue-690-patch/**'
      - '.github/workflows/issue-690-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'perf/690-bounded-speculative-implementation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Apply complete production patch atomically
        shell: bash
        run: |
          set -euo pipefail
          gunzip -c .github/issue-690-patch/issue690.patch.gz > /tmp/issue690.patch
          git apply --check /tmp/issue690.patch
          git apply /tmp/issue690.patch
          rm -rf .github/issue-690-patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add bounded speculative implementation'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
