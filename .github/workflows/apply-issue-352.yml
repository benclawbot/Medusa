name: Apply issue 352 fix

on:
  push:
    branches:
      - fix/352-self-contained-fallback-profiles
    paths:
      - .github/workflows/apply-issue-352.yml
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
    paths:
      - .github/workflows/apply-issue-352.yml
      - .github/scripts/fix_issue_352.py

permissions:
  contents: read

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/352-self-contained-fallback-profiles
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - name: Apply source migration when needed
        run: |
          if grep -q 'fallback_providers: Vec<String>' crates/medusa-config/src/lib.rs; then
            python3 .github/scripts/fix_issue_352.py
          fi
      - name: Format
        run: cargo fmt --all
      - name: Package migrated implementation
        run: |
          mkdir -p issue-352/crates/medusa-config/src issue-352/crates/medusa-provider/src
          cp crates/medusa-config/src/lib.rs issue-352/crates/medusa-config/src/lib.rs
          cp crates/medusa-provider/src/lib.rs issue-352/crates/medusa-provider/src/lib.rs
          cp crates/medusa-provider/src/manager.rs issue-352/crates/medusa-provider/src/manager.rs
      - uses: actions/upload-artifact@v4
        with:
          name: issue-352-migrated-source
          path: issue-352
      - name: Check provider and config crates
        shell: bash
        run: |
          set +e
          cargo check -p medusa-config -p medusa-provider 2>&1 | tee issue-352-check.log
          status=${PIPESTATUS[0]}
          echo "$status" > issue-352-check.status
          exit "$status"
      - name: Upload compiler diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-352-compiler-diagnostics
          path: |
            issue-352-check.log
            issue-352-check.status
      - name: Test provider and config crates
        run: cargo test -p medusa-config -p medusa-provider
      - name: Clippy provider and config crates
        run: cargo clippy -p medusa-config -p medusa-provider --all-targets -- -D warnings
