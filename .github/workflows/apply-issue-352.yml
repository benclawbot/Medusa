name: Apply issue 352 fix

on:
  push:
    branches:
      - fix/352-self-contained-fallback-profiles
    paths:
      - .github/workflows/apply-issue-352.yml
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
    paths:
      - .github/workflows/apply-issue-352.yml
      - .github/scripts/fix_issue_352.py

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/352-self-contained-fallback-profiles
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - name: Apply source migration when needed
        run: |
          if grep -q 'fallback_providers: Vec<String>' crates/medusa-config/src/lib.rs; then
            python3 .github/scripts/fix_issue_352.py
          fi
      - name: Format
        run: cargo fmt --all
      - name: Commit migrated implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/medusa-config/src/lib.rs crates/medusa-provider/src/lib.rs crates/medusa-provider/src/manager.rs
          if ! git diff --cached --quiet; then
            git commit -m "fix(provider): make fallback profiles self-contained (#352)"
            git push origin HEAD:fix/352-self-contained-fallback-profiles
          fi
      - name: Check provider and config crates
        run: cargo check -p medusa-config -p medusa-provider
      - name: Test provider and config crates
        run: cargo test -p medusa-config -p medusa-provider
      - name: Clippy provider and config crates
        run: cargo clippy -p medusa-config -p medusa-provider --all-targets -- -D warnings
