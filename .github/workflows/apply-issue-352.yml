name: Apply issue 352 fix

on:
  push:
    branches:
      - fix/352-self-contained-fallback-profiles
    paths:
      - .github/workflows/apply-issue-352.yml
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main

concurrency:
  group: issue-352-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/352-self-contained-fallback-profiles
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - name: Apply migration and compiler fix
        run: |
          if grep -q 'fallback_providers: Vec<String>' crates/medusa-config/src/lib.rs; then
            python3 .github/scripts/fix_issue_352.py
          fi
          sed -i 's/RouteRouteRetryPolicy/RouteRetryPolicy/g' crates/medusa-provider/src/manager.rs
          cargo fmt --all
      - name: Commit source changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/medusa-config/src/lib.rs crates/medusa-provider/src/lib.rs crates/medusa-provider/src/manager.rs
          if ! git diff --cached --quiet; then
            git commit -m "fix(provider): complete self-contained fallback routes (#352)"
            git pull --rebase origin fix/352-self-contained-fallback-profiles
            git push origin HEAD:fix/352-self-contained-fallback-profiles
          fi
      - name: Check provider and config crates
        run: cargo check -p medusa-config -p medusa-provider
      - name: Test provider and config crates
        shell: bash
        run: |
          set +e
          cargo test -p medusa-config -p medusa-provider 2>&1 | tee issue-352-test.log
          status=${PIPESTATUS[0]}
          echo "$status" > issue-352-test.status
          exit "$status"
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-352-test-diagnostics
          path: |
            issue-352-test.log
            issue-352-test.status
      - name: Clippy provider and config crates
        run: cargo clippy -p medusa-config -p medusa-provider --all-targets -- -D warnings
