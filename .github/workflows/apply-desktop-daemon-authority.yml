name: Build desktop daemon authority patch

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: desktop-daemon-authority-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event.pull_request.head.ref == 'agent/652-desktop-daemon-authority'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Install Linux Tauri dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0
        with:
          components: rustfmt,clippy
      - name: Generate implementation
        run: |
          python .github/scripts/apply_desktop_daemon_protocol.py
          python .github/scripts/apply_desktop_daemon_authority.py
          python .github/scripts/fix_desktop_daemon_clippy.py
          cargo generate-lockfile
          cargo generate-lockfile --manifest-path apps/medusa-desktop/src-tauri/Cargo.toml
          cargo fmt --all
      - name: Package generated source
        run: |
          git diff --name-only --diff-filter=ACMRTUXB | grep -v '^\.github/' > generated-files.txt
          test -s generated-files.txt
          tar -czf generated-source.tar.gz -T generated-files.txt
          git diff --check
      - name: Upload generated source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: desktop-authority-generated-source
          path: |
            generated-source.tar.gz
            generated-files.txt
          if-no-files-found: error
          retention-days: 1
      - name: Validate daemon and protocol
        run: cargo test -p medusa-protocol -p medusa-daemon --all-targets --locked
      - name: Lint daemon and protocol
        run: cargo clippy -p medusa-protocol -p medusa-daemon --all-targets --locked -- -D warnings
      - name: Validate desktop adapter
        run: cargo test --manifest-path apps/medusa-desktop/src-tauri/Cargo.toml --locked
      - name: Lint desktop adapter
        run: cargo clippy --manifest-path apps/medusa-desktop/src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - name: Audit desktop production panic paths
        run: cargo clippy --manifest-path apps/medusa-desktop/src-tauri/Cargo.toml --lib --bins --locked -- -D warnings -D clippy::unwrap_used -D clippy::expect_used -D clippy::panic
      - name: Validate architecture index
        run: python scripts/check-architecture-index.py
