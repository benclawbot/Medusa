name: Issue 350 Bootstrap

on:
  push:
    branches:
      - agent/issue-350-completed-session-learning

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && hashFiles('.github/issue-350-trigger') != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt
      - name: Apply source patch
        run: git apply .github/issue-350.patch
      - name: Format workspace
        run: cargo fmt --all
      - name: Remove bootstrap files
        run: rm .github/issue-350.patch .github/issue-350-trigger .github/workflows/issue-350-bootstrap.yml
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate completed-session learning lifecycle"
          git push origin HEAD:agent/issue-350-completed-session-learning
