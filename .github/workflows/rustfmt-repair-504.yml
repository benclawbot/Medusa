name: Rustfmt repair 504

on:
  push:
    branches:
      - agent/issue-504-root-cause-generalization

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-504-root-cause-generalization
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt
      - name: Format workspace
        run: cargo fmt --all
      - name: Commit formatting
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/medusa-improvement/src/lesson_inference.rs
          git diff --cached --quiet && exit 0
          git commit -m "style: format lesson inference"
          git push origin HEAD:agent/issue-504-root-cause-generalization
