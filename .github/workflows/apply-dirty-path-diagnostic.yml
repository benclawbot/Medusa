name: Apply dirty path diagnostic

on:
  pull_request:
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'fix/read-only-worker-turn-budget-clean'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0
        with:
          components: rustfmt, clippy
      - name: Apply exact diagnostic source changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/medusa-workers/src/lib.rs')
          source = path.read_text()
          start = source.index('fn ensure_clean(repo: &Path) -> MedusaResult<()> {')
          end = source.index('\nfn branch_exists', start)
          replacement = '''fn ensure_clean(repo: &Path) -> MedusaResult<()> {
              let status = git_stdout(repo, &["status", "--porcelain", "--untracked-files=all"])?;
              let dirty = status
                  .lines()
                  .filter(|line| {
                      let path = line.get(3..).unwrap_or_default().trim_matches('"');
                      !(line.starts_with("?? ") && (path == ".medusa" || path.starts_with(".medusa/")))
                  })
                  .map(str::to_owned)
                  .collect::<Vec<_>>();
              if !dirty.is_empty() {
                  Err(MedusaError::new(
                      ErrorCode::PolicyDenied,
                      ErrorCategory::Policy,
                      format!(
                          "merge coordinator requires a clean repository outside Medusa runtime state: {}",
                          dirty.join(", ")
                      ),
                  ))
              } else {
                  Ok(())
              }
          }
          '''
          source = source[:start] + replacement + source[end:]
          marker = '    #[test]\n    fn parallel_feature_fixture_merges_and_verifies() {'
          assert source.count(marker) == 1
          test = '''    #[test]
              fn clean_repository_error_reports_exact_dirty_paths() {
                  let (_directory, repo, worktrees) = repository();
                  fs::create_dir_all(repo.join(".medusa/sessions")).expect("runtime state");
                  fs::write(repo.join(".medusa/sessions/session.json"), "{}\\n").expect("runtime record");
                  fs::write(repo.join("unexpected.txt"), "dirty\\n").expect("dirty path");

                  let error = WorkerManager::new(&repo, worktrees)
                      .expect("manager")
                      .require_clean()
                      .expect_err("dirty repository must fail");
                  assert!(error.to_string().contains("?? unexpected.txt"));
                  assert!(!error.to_string().contains("session.json"));
              }

          '''
          source = source.replace(marker, test + marker)
          path.write_text(source)
          PY
      - name: Format
        run: cargo fmt --all -- --check
      - name: Compile workers
        run: cargo check -p medusa-workers --all-targets
      - name: Strict workers lint
        run: cargo clippy -p medusa-workers --all-targets -- -D warnings
      - name: Workers tests
        run: cargo test -p medusa-workers
      - name: Commit validated source only
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          rm .medusa-patches/dirty-path-diagnostic.patch
          rm .github/workflows/apply-dirty-path-diagnostic.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/medusa-workers/src/lib.rs
          git add -u .medusa-patches .github/workflows
          git commit -m "fix(workers): report dirty repository paths"
          git push origin HEAD:"${HEAD_REF}"
