          s = s.replace('                            } else if page != SettingsPage::BaseUrl\n                                && page != SettingsPage::Status\n                            {', '                            } else if page != SettingsPage::BaseUrl {', 2)
          if 'configuration diagnostics refreshed; Enter repairs only deterministic checks' not in s:
              s = s.replace('                if !matches!(page, SettingsPage::Review | SettingsPage::Profile) {', '                if page == SettingsPage::Status {\n                    self.status = "configuration diagnostics refreshed; Enter repairs only deterministic checks".to_owned();\n                    return Ok(action);\n                }\n                if !matches!(page, SettingsPage::Review | SettingsPage::Profile) {', 1)
          p.write_text(s)

          p = Path('crates/medusa-tui/src/render.rs')
          s = p.read_text()
          old = '''    if page == app::SettingsPage::Status {\n        lines.push(StyledLine::new(\n            format!("Active profile: {profile}"),\n            Color::White,\n        ));\n        lines.push(StyledLine::new(\n            format!(\n                "Last apply timing: {}",\n                modal\n                    .settings_last_apply_timing()\n                    .map_or("none", |timing| timing.label())\n            ),\n            Color::Grey,\n        ));\n        lines.push(StyledLine::new(\n            "Configuration values come from ProviderProfileCatalog; credential material is never displayed.",\n            Color::DarkGrey,\n        ));\n        return lines;\n    }'''
          if old in s:
              new = '''    if page == app::SettingsPage::Status {\n        lines.push(StyledLine::new(\n            format!(\n                "Health: {} · active profile: {profile}",\n                modal.settings_doctor_summary()\n            ),\n            Color::White,\n        ));\n        let selected = modal.settings_selected_choice();\n        for (index, check) in modal.settings_doctor_checks().into_iter().enumerate() {\n            let is_selected = index == selected;\n            lines.push(StyledLine::with_marker(\n                if is_selected { "› " } else { "  " },\n                if is_selected { Color::Magenta } else { Color::DarkGrey },\n                format!("[{}] {} · {}", check.status.label(), check.name, check.detail),\n                if is_selected { Color::White } else { Color::Grey },\n            ));\n            if is_selected {\n                if let Some(remediation) = check.remediation {\n                    lines.push(StyledLine::new(\n                        format!("    {remediation}"),\n                        Color::DarkGrey,\n                    ));\n                }\n                if check.repair.is_some() {\n                    lines.push(StyledLine::new(\n                        "    Enter applies this deterministic repair through ProviderProfileCatalog.",\n                        Color::DarkGrey,\n                    ));\n                } else {\n                    lines.push(StyledLine::new(\n                        "    Enter refreshes diagnostics; no automatic mutation is available for this check.",\n                        Color::DarkGrey,\n                    ));\n                }\n            }\n        }\n        lines.push(StyledLine::new(\n            "Credentials remain external/redacted · Esc returns without applying a repair.",\n            Color::DarkGrey,\n        ));\n        return lines;\n    }'''
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY

          cargo fmt --all
