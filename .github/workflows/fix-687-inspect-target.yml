name: Fix 687 Inspect Target

on:
  push:
    branches: [perf/687-compound-tools-dag]

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: perf/687-compound-tools-dag
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0 # 1.88.0
      - name: Apply production inspect_target compound tool
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          compound = r'''use std::{
              collections::BTreeSet,
              fs,
              path::{Path, PathBuf},
          };

          use medusa_core::MedusaResult;
          use medusa_intelligence::{RepositoryGraph, RepositoryGraphFreshness, ReviewImpact};
          use serde_json::{Value, json};

          use crate::policy::safe_path;

          const MAX_EXCERPT_FILES: usize = 8;
          const MAX_EXCERPT_LINES: usize = 80;
          const MAX_POLICY_FILES: usize = 8;

          pub(crate) fn inspect_target(repo: &Path, input: &Value) -> MedusaResult<String> {
              let path = input.get("path").and_then(Value::as_str).map(str::trim).filter(|value| !value.is_empty());
              let symbol = input.get("symbol").and_then(Value::as_str).map(str::trim).filter(|value| !value.is_empty());
              if path.is_some() == symbol.is_some() {
                  return Err(crate::tools::invalid_tool(
                      "inspect_target requires exactly one of path or symbol",
                  ));
              }

              let graph = RepositoryGraph::open(repo)?;
              if graph.freshness() != RepositoryGraphFreshness::Current {
                  return Err(crate::tools::invalid_tool(
                      "inspect_target refused stale repository-graph evidence",
                  ));
              }

              let definitions = symbol
                  .map(|name| graph.definitions(name).value)
                  .unwrap_or_default();
              let references = symbol
                  .map(|name| graph.references(name).value)
                  .unwrap_or_default();
              let mut target_paths = BTreeSet::<PathBuf>::new();
              if let Some(relative) = path {
                  let absolute = safe_path(repo, relative)?;
                  let root = repo.canonicalize()?;
                  let relative = absolute.strip_prefix(root).map_err(|_| {
                      crate::tools::invalid_tool("inspect_target path escaped repository scope")
                  })?;
                  target_paths.insert(relative.to_path_buf());
              }
              target_paths.extend(definitions.iter().map(|definition| definition.path.clone()));
              target_paths.extend(references.iter().map(|reference| reference.path.clone()));
              if target_paths.is_empty() {
                  return Err(crate::tools::invalid_tool(
                      "inspect_target could not resolve the requested target",
                  ));
              }
              let target_paths = target_paths.into_iter().collect::<Vec<_>>();

              let affected = graph.affected_files(&target_paths);
              let tests = graph.related_tests(&target_paths);
              if affected.freshness != RepositoryGraphFreshness::Current
                  || tests.freshness != RepositoryGraphFreshness::Current
              {
                  return Err(crate::tools::invalid_tool(
                      "inspect_target refused stale dependency or test-impact evidence",
                  ));
              }
              let review = ReviewImpact::analyze(&graph.snapshot().index, &target_paths);

              let files = target_paths
                  .iter()
                  .filter_map(|path| graph.snapshot().files.get(path).cloned())
                  .collect::<Vec<_>>();
              let excerpts = target_paths
                  .iter()
                  .take(MAX_EXCERPT_FILES)
                  .filter_map(|path| source_excerpt(repo, path).ok().map(|text| json!({"path": path, "text": text})))
                  .collect::<Vec<_>>();
              let policy_paths = graph
                  .snapshot()
                  .files
                  .values()
                  .filter(|file| file.policy_file)
                  .map(|file| file.path.clone())
                  .take(MAX_POLICY_FILES)
                  .collect::<Vec<_>>();
              let repository_instructions = policy_paths
                  .iter()
                  .filter_map(|path| source_excerpt(repo, path).ok().map(|text| json!({"path": path, "text": text})))
                  .collect::<Vec<_>>();

              let mut evidence_refs = affected.evidence_refs.clone();
              evidence_refs.extend(tests.evidence_refs.iter().cloned());
              evidence_refs.sort();
              evidence_refs.dedup();

              let omissions = [
                  "recent diagnostic and failure history is not yet persisted by repository-graph schema v1",
                  "inspect_target is read-only; mutation scope remains controlled by policy, approval, and transaction authorities",
              ];
              let response = json!({
                  "target": {"path": path, "symbol": symbol},
                  "repository_revision": graph.snapshot().repository_revision,
                  "graph_revision": graph.snapshot().graph_revision,
                  "freshness": RepositoryGraphFreshness::Current,
                  "confidence_milli": affected.confidence_milli.min(tests.confidence_milli),
                  "source_adapter": "repository-graph-compound-inspection",
                  "evidence_refs": evidence_refs,
                  "definitions": definitions,
                  "references": references,
                  "files": files,
                  "source_excerpts": excerpts,
                  "affected_paths": affected.value,
                  "public_api_risk": review.public_api_risk,
                  "related_tests": tests.value,
                  "repository_policy_paths": policy_paths,
                  "repository_instructions": repository_instructions,
                  "protected_path_constraints": [
                      "all subsequent filesystem paths must remain repository-scoped",
                      "write operations still require the existing approval and mutation authorities"
                  ],
                  "omissions": omissions,
              });
              serde_json::to_string_pretty(&response).map_err(Into::into)
          }

          fn source_excerpt(repo: &Path, relative: &Path) -> MedusaResult<String> {
              let absolute = safe_path(repo, relative.to_string_lossy().as_ref())?;
              let text = fs::read_to_string(absolute)?;
              Ok(text.lines().take(MAX_EXCERPT_LINES).collect::<Vec<_>>().join("\n"))
          }

          #[cfg(test)]
          mod tests {
              use std::{fs, process::Command};

              use serde_json::json;

              use super::*;

              fn fixture() -> tempfile::TempDir {
                  let directory = tempfile::tempdir().expect("tempdir");
                  fs::create_dir(directory.path().join("src")).expect("src");
                  fs::write(
                      directory.path().join("Cargo.toml"),
                      "[package]\nname = \"fixture\"\nversion = \"0.1.0\"\nedition = \"2024\"\n",
                  )
                  .expect("manifest");
                  fs::write(
                      directory.path().join("src/lib.rs"),
                      "pub fn answer() -> u8 { 42 }\npub fn caller() -> u8 { answer() }\n",
                  )
                  .expect("source");
                  fs::write(directory.path().join("AGENTS.md"), "Keep changes scoped.\n").expect("policy");
                  for args in [
                      vec!["init"],
                      vec!["config", "user.email", "fixture@example.com"],
                      vec!["config", "user.name", "Fixture"],
                      vec!["add", "."],
                      vec!["commit", "-m", "fixture"],
                  ] {
                      let output = Command::new("git").args(&args).current_dir(directory.path()).output().expect("git");
                      assert!(output.status.success(), "git {:?}: {}", args, String::from_utf8_lossy(&output.stderr));
                  }
                  directory
              }

              #[test]
              fn path_inspection_is_revision_bound_and_bounded() {
                  let directory = fixture();
                  let output = inspect_target(directory.path(), &json!({"path": "src/lib.rs"})).expect("inspect");
                  let value: Value = serde_json::from_str(&output).expect("json");
                  assert_eq!(value["freshness"], "current");
                  assert_eq!(value["confidence_milli"], 1000);
                  assert_eq!(value["files"][0]["path"], "src/lib.rs");
                  assert!(value["repository_instructions"].as_array().is_some_and(|items| !items.is_empty()));
                  assert!(value["source_excerpts"][0]["text"].as_str().is_some_and(|text| text.contains("answer")));
              }

              #[test]
              fn symbol_inspection_coalesces_navigation_and_test_impact() {
                  let directory = fixture();
                  let output = inspect_target(directory.path(), &json!({"symbol": "answer"})).expect("inspect");
                  let value: Value = serde_json::from_str(&output).expect("json");
                  assert_eq!(value["definitions"].as_array().map(Vec::len), Some(1));
                  assert!(value["references"].as_array().is_some_and(|items| items.len() >= 2));
                  assert!(value["affected_paths"].as_array().is_some_and(|items| !items.is_empty()));
                  assert!(value["related_tests"]["commands"].is_array());
                  assert!(value["evidence_refs"].as_array().is_some_and(|items| !items.is_empty()));
              }
          }
          '''
          Path('crates/medusa-agent/src/tools/compound.rs').write_text(compound, encoding='utf-8')

          tools = Path('crates/medusa-agent/src/tools/mod.rs')
          text = tools.read_text(encoding='utf-8')
          anchor = 'mod browser_dispatch;\n'
          if 'mod compound;\n' not in text:
              if anchor not in text:
                  raise SystemExit('tools module anchor missing')
              text = text.replace(anchor, anchor + 'mod compound;\n', 1)
          dispatch_anchor = '        "code_index" => intelligence::code_index(repo, input),\n'
          dispatch = '        "inspect_target" => compound::inspect_target(repo, input),\n'
          if dispatch not in text:
              if dispatch_anchor not in text:
                  raise SystemExit('tool dispatch anchor missing')
              text = text.replace(dispatch_anchor, dispatch_anchor + dispatch, 1)
          tools.write_text(text, encoding='utf-8')

          registry = Path('crates/medusa-capabilities/src/registry.rs')
          text = registry.read_text(encoding='utf-8')
          next_tool = '''        tool_entry(\n            ToolIdentity {\n                states,\n                name: "typescript_semantic",\n            },'''
          entry = '''        tool_entry(\n            ToolIdentity {\n                states,\n                name: "inspect_target",\n            },\n            Capability::CodeIntelligence,\n            "Inspect one path or symbol with a bounded revision-bound evidence packet containing definitions, references, source excerpts, ownership metadata, dependency impact, related verification, repository instructions, freshness, confidence, omissions, and evidence IDs. Prefer this compound tool over chains of fs_read/search_text/code_index calls.",\n            json!({"type":"object","properties":{"path":{"type":"string"},"symbol":{"type":"string"}},"oneOf":[{"required":["path"]},{"required":["symbol"]}],"additionalProperties":false}),\n            "medusa-agent::tools::compound::inspect_target",\n            [RegistryPermission::Read],\n            false,\n        ),\n'''
          if 'name: "inspect_target"' not in text:
              if next_tool not in text:
                  raise SystemExit('registry insertion anchor missing')
              text = text.replace(next_tool, entry + next_tool, 1)
          registry.write_text(text, encoding='utf-8')
          PY
      - name: Format
        run: cargo fmt --all -- --check || cargo fmt --all
      - name: Focused tests
        run: cargo test -p medusa-agent tools::compound -- --nocapture
      - name: Capability registry tests
        run: cargo test -p medusa-capabilities
      - name: Clippy changed crates
        run: cargo clippy -p medusa-agent -p medusa-capabilities --all-targets --all-features -- -D warnings
      - name: Remove one-shot verifier and publish verified source
        shell: bash
        run: |
          rm .github/workflows/fix-687-inspect-target.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/medusa-agent/src/tools/compound.rs crates/medusa-agent/src/tools/mod.rs crates/medusa-capabilities/src/registry.rs .github/workflows/fix-687-inspect-target.yml
          git commit -m 'Add revision-bound inspect_target compound tool'
          git push origin HEAD:perf/687-compound-tools-dag
