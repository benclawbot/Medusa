name: Issue 308 Normalize Containment

on:
  push:
    branches:
      - agent/issue-308-native-windows-appcontainer

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-308-native-windows-appcontainer
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Resolve and format
        run: |
          cargo check -p medusa-agent --all-targets
          cargo fmt --all
      - name: Commit normalized sources
        run: |
          rm .github/workflows/issue-308-normalize-containment.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.lock crates/medusa-agent crates/medusa-process-containment .github/workflows/issue-308-normalize-containment.yml
          git commit -m "Normalize Windows containment implementation"
          git push origin HEAD:agent/issue-308-native-windows-appcontainer
