name: One-shot setup-rust bootstrap repair

on:
  push:
    branches:
      - fix/ci-setup-rust-bootstrap

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/ci-setup-rust-bootstrap
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install workflow validator dependency
        run: python -m pip install PyYAML==6.0.2
      - name: Repair local-action bootstrap ordering
        run: python scripts/one-shot-setup-rust-bootstrap.py
      - name: Validate workflow YAML and bootstrap ordering
        shell: python
        run: |
          from pathlib import Path
          import yaml
          checkout = "actions/checkout@11d5960a326750d5838078e36cf38b85af677262"
          local = "uses: ./.github/actions/setup-rust"
          count = 0
          for path in sorted(Path('.github/workflows').glob('*.yml')):
              text = path.read_text(encoding='utf-8')
              yaml.safe_load(text)
              if local not in text:
                  continue
              count += 1
              first_local = text.index(local)
              if checkout not in text[:first_local]:
                  raise SystemExit(f"{path}: setup-rust is used before repository checkout")
          if count == 0:
              raise SystemExit('no setup-rust consumers found')
          print(f'validated {count} workflows using setup-rust')
      - name: Commit repair
        shell: bash
        run: |
          rm -f .github/workflows/one-shot-setup-rust-bootstrap.yml
          rm -f scripts/one-shot-setup-rust-bootstrap.py
          rm -f .github/setup-rust-bootstrap-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(ci): bootstrap repository before local setup-rust action"
          git push origin HEAD:fix/ci-setup-rust-bootstrap
