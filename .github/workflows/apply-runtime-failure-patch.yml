name: Apply runtime failure patch

on:
  push:
    branches:
      - agent/wire-failure-learning-runtime
    paths:
      - scripts/apply_failure_runtime.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wire-failure-learning-runtime
          fetch-depth: 0
      - name: Apply runtime integration
        run: python3 scripts/apply_failure_runtime.py
      - name: Format changed Rust
        run: cargo fmt --all
      - name: Commit generated implementation
        run: |
          rm scripts/apply_failure_runtime.py
          rm .github/workflows/apply-runtime-failure-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Wire failure learning into runtime"
          git push origin HEAD:agent/wire-failure-learning-runtime
