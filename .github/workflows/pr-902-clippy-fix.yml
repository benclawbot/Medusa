name: PR 902 Structural Clippy Fix

on:
  push:
    branches: [codex/issue-889-tool-pipeline]

permissions:
  contents: write

concurrency:
  group: pr-902-clippy-fix
  cancel-in-progress: true

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/issue-889-tool-pipeline
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0
        with:
          components: rustfmt,clippy
      - name: Apply structural fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          engine_path = Path('crates/medusa-agent/src/engine.rs')
          engine = engine_path.read_text()

          old_sig = '''fn execute_session_tool(
              repo: &Path,
              name: &str,
              input: &serde_json::Value,
              cancellation: &AtomicBool,
              execution_policy: &AgentExecutionPolicy,
              session_id: &str,
              task_step_id: Option<&str>,
              activity_id: &str,
          ) -> MedusaResult<CertifiedToolExecution> {'''
          new_sig = '''struct SessionToolAuthority<'a> {
              execution_policy: &'a AgentExecutionPolicy,
              session_id: &'a str,
              task_step_id: Option<&'a str>,
              activity_id: &'a str,
          }

          fn execute_session_tool(
              repo: &Path,
              name: &str,
              input: &serde_json::Value,
              cancellation: &AtomicBool,
              authority: SessionToolAuthority<'_>,
          ) -> MedusaResult<CertifiedToolExecution> {'''
          assert engine.count(old_sig) == 1
          engine = engine.replace(old_sig, new_sig)

          start = engine.index('fn execute_session_tool(')
          end = engine.index('\nfn active_plan_step_id', start)
          segment = engine[start:end]
          segment = segment.replace('execution_policy', 'authority.execution_policy')
          segment = segment.replace('next_mutation_sequence(repo, session_id)', 'next_mutation_sequence(repo, authority.session_id)')
          segment = segment.replace('session_id: session_id.to_owned()', 'session_id: authority.session_id.to_owned()')
          segment = segment.replace('task_step_id: task_step_id.map(str::to_owned)', 'task_step_id: authority.task_step_id.map(str::to_owned)')
          segment = segment.replace('activity_id: activity_id.to_owned()', 'activity_id: authority.activity_id.to_owned()')
          engine = engine[:start] + segment + engine[end:]

          parallel_pattern = re.compile(r'''execute_session_tool\(\s*repo,\s*&name,\s*&input,\s*cancellation\.as_ref\(\),\s*&execution_policy,\s*&mutation_session_id,\s*mutation_task_step\.as_deref\(\),\s*&id,\s*\)''')
          parallel_replacement = '''execute_session_tool(
                                  repo,
                                  &name,
                                  &input,
                                  cancellation.as_ref(),
                                  SessionToolAuthority {
                                      execution_policy: &execution_policy,
                                      session_id: &mutation_session_id,
                                      task_step_id: mutation_task_step.as_deref(),
                                      activity_id: &id,
                                  },
                              )'''
          engine, count = parallel_pattern.subn(parallel_replacement, engine, count=1)
          assert count == 1

          normal_pattern = re.compile(r'''execute_session_tool\(\s*&session\.repo,\s*&name,\s*&input,\s*self\.cancellation\.as_ref\(\),\s*&self\.execution_policy,\s*session\.id\.as_str\(\),\s*active_plan_step_id\(session\),\s*&id,\s*\)\?''')
          normal_replacement = '''execute_session_tool(
                              &session.repo,
                              &name,
                              &input,
                              self.cancellation.as_ref(),
                              SessionToolAuthority {
                                  execution_policy: &self.execution_policy,
                                  session_id: session.id.as_str(),
                                  task_step_id: active_plan_step_id(session),
                                  activity_id: &id,
                              },
                          )?'''
          engine, count = normal_pattern.subn(normal_replacement, engine, count=1)
          assert count == 1

          assert engine.count('    AskQuestion(AgentQuestion),') == 1
          engine = engine.replace('    AskQuestion(AgentQuestion),', '    AskQuestion(Box<AgentQuestion>),')
          assert engine.count('post_action = Some(PostToolAction::AskQuestion(question));') == 1
          engine = engine.replace(
              'post_action = Some(PostToolAction::AskQuestion(question));',
              'post_action = Some(PostToolAction::AskQuestion(Box::new(question)));',
          )
          question_block_pattern = re.compile(
              r'(if let Some\(PostToolAction::AskQuestion\(question\)\) = post_action[\s\S]*?\{\s*)'
              r'pause_for_question\(session, question, &mut observer\)\?;'
          )
          engine, count = question_block_pattern.subn(
              r'\1pause_for_question(session, *question, &mut observer)?;',
              engine,
              count=1,
          )
          assert count == 1

          special_start = engine.index('} else if name == "update_plan" {')
          special_end = engine.index('} else if self\n                    .team_context', special_start)
          special = engine[special_start:special_end]
          assert special.count('let execution = execute_engine_tool_with_policy(') == 2
          special = special.replace('let execution = execute_engine_tool_with_policy(', 'execute_engine_tool_with_policy(')
          special, count = re.subn(r'\)\?;\s*execution', ')?', special)
          assert count == 2
          engine = engine[:special_start] + special + engine[special_end:]
          engine_path.write_text(engine)

          tools_path = Path('crates/medusa-agent/src/tools/mod.rs')
          tools = tools_path.read_text()
          assert tools.count('mod pipeline {') == 1
          tools = tools.replace('mod pipeline {', 'pub mod pipeline {', 1)
          obsolete_pattern = re.compile(
              r'pub\(crate\) fn execute_tool_cancellable_with_policy\([\s\S]*?\n}\n\n'
              r'(?=pub\(crate\) fn execute_tool_cancellable\()'
          )
          tools, count = obsolete_pattern.subn('', tools, count=1)
          assert count == 1
          tools_path.write_text(tools)
          PY
          cargo fmt --all
      - name: Verify exact Clippy gate
        shell: bash
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Commit verified fixes and remove helper workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/pr-902-clippy-fix.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Fix certified pipeline Clippy findings"
          git push origin HEAD:codex/issue-889-tool-pipeline
