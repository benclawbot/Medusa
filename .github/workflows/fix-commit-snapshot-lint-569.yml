name: Retain issue 569 snapshot API

on:
  push:
    branches:
      - agent/569-runtime-durable-event-coverage
    paths:
      - .github/workflows/fix-commit-snapshot-lint-569.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Mark retained API
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('crates/medusa-agent/src/journal.rs')
          text = path.read_text()
          needle = 'pub(crate) fn commit_snapshot(session: &AgentSession) -> MedusaResult<AgentSession> {'
          if needle not in text:
              raise SystemExit('commit_snapshot function not found')
          path.write_text(text.replace(needle, '#[allow(dead_code)]\n' + needle, 1))
          PY
          cargo fmt --all
          rm .github/workflows/fix-commit-snapshot-lint-569.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Retain snapshot commit compatibility API"
          git push
