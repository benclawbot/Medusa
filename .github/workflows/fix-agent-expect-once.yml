name: Fix Agent Expect Once

on:
  push:
    branches:
      - ux/action-based-recovery
    paths:
      - '.github/workflows/fix-agent-expect-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref_name }}
      - name: Replace production expect with fail-closed error
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/medusa-agent/src/verification.rs')
          text = path.read_text()
          old = '''            let server = automatic_server\n                .as_ref()\n                .expect("automatic server is present for static fallback");\n'''
          new = '''            let server = automatic_server.as_ref().ok_or_else(|| {\n                MedusaError::new(\n                    ErrorCode::InternalInvariant,\n                    ErrorCategory::Internal,\n                    "automatic static verification fallback was selected without a server",\n                )\n            })?;\n'''
          if text.count(old) != 1:
              raise SystemExit('expected automatic_server fallback pattern not found exactly once')
          path.write_text(text.replace(old, new))
          PY
      - name: Commit fixed source through GitHub contents API
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          path='crates/medusa-agent/src/verification.rs'
          sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=$GITHUB_REF_NAME" --jq .sha)"
          content="$(base64 -w0 "$path")"
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$path" \
            -f message='fix(agent): fail closed in static verification fallback' \
            -f content="$content" \
            -f sha="$sha" \
            -f branch="$GITHUB_REF_NAME"
