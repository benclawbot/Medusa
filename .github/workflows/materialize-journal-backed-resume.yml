name: Materialize journal-backed resume

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'agent/journal-backed-resume' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/journal-backed-resume
          fetch-depth: 0
      - name: Apply reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          echo "596eb9c66bb663e4ad7ad5cc235c5c9581125891e0bc530598583724f482a040  .github/materialize-journal-resume/change.patch" | sha256sum --check -
          git apply --index .github/materialize-journal-resume/change.patch
          rm -rf .github/materialize-journal-resume
          rm -f .github/workflows/materialize-journal-backed-resume.yml
          cargo fmt --all
          cargo test -p medusa-runtime interruption_tests
          cargo test -p medusa-agent session_browser::tests::journal_only_session_is_discovered_and_repairs_its_snapshot
          python3 scripts/check-product-architecture.py
          python3 scripts/check-capability-evidence.py
          git add -A
          git diff --cached --check
      - name: Commit clean implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Persist restart recovery through the session journal"
          git push origin HEAD:agent/journal-backed-resume
