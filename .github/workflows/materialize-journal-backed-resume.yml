name: Materialize journal-backed resume

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'agent/journal-backed-resume' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/journal-backed-resume
          fetch-depth: 0
      - name: Apply reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object .github/materialize-journal-resume/change.patch)" = "4df29a7cae48ba39369f4830374609ae3fc8f69b"
          git apply --index --exclude=docs/architecture/durable-session-journal.md .github/materialize-journal-resume/change.patch
          python3 - <<'PY'
          from pathlib import Path

          path = Path("docs/architecture/durable-session-journal.md")
          text = path.read_text()
          needle = "4. atomically rewrite and flush the compatibility session JSON.\n"
          addition = (
              needle
              + "\nRuntime restart recovery uses this same boundary when interrupted plan steps "
              + "are marked failed; it never updates only the compatibility JSON.\n"
          )
          if needle not in text:
              raise SystemExit("durable journal persistence boundary not found")
          if "Runtime restart recovery uses this same boundary" not in text:
              text = text.replace(needle, addition, 1)
          path.write_text(text)
          PY
          rm -rf .github/materialize-journal-resume
          rm -f .github/workflows/materialize-journal-backed-resume.yml
          cargo fmt --all
          cargo test -p medusa-runtime interruption_tests
          cargo test -p medusa-agent session_browser::tests::journal_only_session_is_discovered_and_repairs_its_snapshot
          python3 scripts/check-product-architecture.py
          python3 scripts/check-capability-evidence.py
          git add -A
          git diff --cached --check
      - name: Commit clean implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Persist restart recovery through the session journal"
          git push origin HEAD:agent/journal-backed-resume
