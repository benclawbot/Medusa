name: Fix session persistence race

on:
  push:
    branches:
      - agent/509-explainable-learning-retrieval

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[skip-session-race-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/509-explainable-learning-retrieval
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt
      - name: Patch and verify concurrent persistence
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/medusa-agent/src/session.rs')
          text = path.read_text()
          text = text.replace(
              '    fs,\n    path::{Path, PathBuf},\n',
              '    fs,\n    io::Write,\n    path::{Path, PathBuf},\n    sync::Mutex,\n',
              1,
          )
          text = text.replace(
              'use time::OffsetDateTime;\n',
              'use time::OffsetDateTime;\nuse ulid::Ulid;\n',
              1,
          )
          text = text.replace(
              'const MAX_DIAGNOSTICS: usize = 128;\n',
              'const MAX_DIAGNOSTICS: usize = 128;\nstatic SESSION_PERSIST_LOCK: Mutex<()> = Mutex::new(());\n',
              1,
          )
          old = '''fn persist_at(path: &Path, session: &AgentSession) -> MedusaResult<()> {
              if let Some(parent) = path.parent() {
                  fs::create_dir_all(parent)?;
              }
              let temporary = path.with_extension("json.tmp");
              fs::write(&temporary, serde_json::to_vec_pretty(session)?)?;
              fs::rename(temporary, path)?;
              Ok(())
          }
          '''
          new = '''fn persist_at(path: &Path, session: &AgentSession) -> MedusaResult<()> {
              atomic_replace(path, &serde_json::to_vec_pretty(session)?)?;
              Ok(())
          }

          fn atomic_replace(path: &Path, bytes: &[u8]) -> std::io::Result<()> {
              let _guard = SESSION_PERSIST_LOCK
                  .lock()
                  .unwrap_or_else(std::sync::PoisonError::into_inner);
              if let Some(parent) = path.parent() {
                  fs::create_dir_all(parent)?;
              }
              let file_name = path
                  .file_name()
                  .and_then(|name| name.to_str())
                  .unwrap_or("session.json");
              let temporary = path.with_file_name(format!(".{file_name}.{}.tmp", Ulid::new()));
              let result = (|| {
                  let mut file = fs::OpenOptions::new()
                      .write(true)
                      .create_new(true)
                      .open(&temporary)?;
                  file.write_all(bytes)?;
                  file.sync_all()?;
                  drop(file);
                  replace_path(&temporary, path)
              })();
              if result.is_err() {
                  let _ = fs::remove_file(&temporary);
              }
              result
          }

          #[cfg(not(windows))]
          fn replace_path(temporary: &Path, path: &Path) -> std::io::Result<()> {
              fs::rename(temporary, path)
          }

          #[cfg(windows)]
          fn replace_path(temporary: &Path, path: &Path) -> std::io::Result<()> {
              match fs::rename(temporary, path) {
                  Ok(()) => Ok(()),
                  Err(error) if path.exists() => {
                      fs::remove_file(path)?;
                      fs::rename(temporary, path)
                  }
                  Err(error) => Err(error),
              }
          }
          '''
          if old not in text:
              raise SystemExit('persist_at block not found')
          text = text.replace(old, new, 1)
          text += '''

          #[cfg(test)]
          mod persistence_tests {
              use super::*;
              use std::sync::{Arc, Barrier};

              #[test]
              fn concurrent_session_writes_leave_valid_json_without_temporary_files() {
                  const WRITERS: usize = 16;
                  let directory = tempfile::tempdir().expect("temporary directory");
                  let path = directory.path().join("session.json");
                  let barrier = Arc::new(Barrier::new(WRITERS));
                  let handles = (0..WRITERS)
                      .map(|writer| {
                          let path = path.clone();
                          let barrier = Arc::clone(&barrier);
                          std::thread::spawn(move || {
                              barrier.wait();
                              atomic_replace(
                                  &path,
                                  format!(r#"{{"writer":{writer}}}"#).as_bytes(),
                              )
                              .expect("atomic session write");
                          })
                      })
                      .collect::<Vec<_>>();
                  for handle in handles {
                      handle.join().expect("writer thread");
                  }

                  let value: serde_json::Value = serde_json::from_slice(
                      &fs::read(&path).expect("persisted session JSON"),
                  )
                  .expect("valid session JSON");
                  assert!(value["writer"].as_u64().is_some_and(|writer| writer < WRITERS as u64));

                  let temporary_files = fs::read_dir(directory.path())
                      .expect("session directory")
                      .filter_map(Result::ok)
                      .filter(|entry| {
                          let name = entry.file_name();
                          let name = name.to_string_lossy();
                          name.starts_with(".session.json.") && name.ends_with(".tmp")
                      })
                      .count();
                  assert_eq!(temporary_files, 0);
              }
          }
          '''
          path.write_text(text)
          PY
          cargo fmt --all
          cargo test -p medusa-agent concurrent_session_writes_leave_valid_json_without_temporary_files -- --exact
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/medusa-agent/src/session.rs
          git commit -m 'Prevent concurrent session persistence collisions [skip-session-race-fix]'
          git push origin HEAD:agent/509-explainable-learning-retrieval
