name: PR1175 architecture index repair

on:
  push:
    branches:
      - fix/post-simplification-ci

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Reconcile architecture authority
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          baseline_path = Path('docs/architecture/baseline.json')
          baseline = json.loads(baseline_path.read_text(encoding='utf-8'))
          crates = baseline['components']['rust_crates']
          removed = crates.pop('medusa-transaction-coordinator', None)
          if removed is None:
              raise SystemExit('baseline crate entry was already absent')
          coordination = baseline['components']['owner_groups']['coordination']
          baseline['components']['owner_groups']['coordination'] = [
              crate for crate in coordination if crate != 'medusa-transaction-coordinator'
          ]
          baseline_path.write_text(json.dumps(baseline, indent=2) + '\n', encoding='utf-8')

          owners_path = Path('docs/architecture/owners.json')
          owners = json.loads(owners_path.read_text(encoding='utf-8'))
          if owners['owners'].pop('medusa-transaction-coordinator', None) is None:
              raise SystemExit('owner entry was already absent')
          owners_path.write_text(json.dumps(owners, indent=2) + '\n', encoding='utf-8')
          PY
          python3 scripts/check-architecture-index.py
          python3 scripts/engineering-policy.py validate --policy .github/engineering-policy.json --root .
          python3 scripts/check-documentation.py

      - name: Commit reconciled authority
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/pr1175-architecture-index-repair.yml
          git config user.name "BenClawBot CI Repair"
          git config user.email "benclawbot@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: reconcile architecture index after crate retirement"
          git push origin HEAD:fix/post-simplification-ci
