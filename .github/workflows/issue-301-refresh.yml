name: Issue 301 refresh

on:
  push:
    branches:
      - agent/issue-301-transaction-safety

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-301-transaction-safety
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt
      - run: cargo fmt --all
      - run: cargo generate-lockfile
      - name: Commit generated files
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.lock crates/medusa-agent/src/transaction.rs crates/medusa-agent/src/transaction_pipeline.rs
          git commit -m "Refresh transaction pipeline formatting and lockfile"
          git push origin HEAD:agent/issue-301-transaction-safety
