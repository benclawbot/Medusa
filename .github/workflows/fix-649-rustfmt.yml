name: Fix 649 Rustfmt

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: fix-649-rustfmt-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  format:
    if: github.event.pull_request.number == 662 && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0 # 1.88.0
        with:
          components: rustfmt
      - name: Format and constrain patch
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          changed="$(git diff --name-only)"
          test "$changed" = "crates/medusa-workers/src/lib.rs"
          git diff --check
          git diff -- crates/medusa-workers/src/lib.rs
      - name: Publish formatted file
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/');
          const branch = process.env.HEAD_REF;
          const token = process.env.GITHUB_TOKEN;
          const path = 'crates/medusa-workers/src/lib.rs';
          const encodedPath = path.split('/').map(encodeURIComponent).join('/');

          async function request(url, options = {}) {
            const response = await fetch(`https://api.github.com${url}`, {
              ...options,
              headers: {
                Accept: 'application/vnd.github+json',
                Authorization: `Bearer ${token}`,
                'X-GitHub-Api-Version': '2022-11-28',
                'User-Agent': 'medusa-rustfmt-fix',
                ...(options.headers || {}),
              },
            });
            const text = await response.text();
            const data = text ? JSON.parse(text) : {};
            if (!response.ok) throw new Error(`${response.status} ${text}`);
            return data;
          }

          (async () => {
            const current = await request(
              `/repos/${owner}/${repo}/contents/${encodedPath}?ref=${encodeURIComponent(branch)}`,
            );
            const updated = await request(`/repos/${owner}/${repo}/contents/${encodedPath}`, {
              method: 'PUT',
              body: JSON.stringify({
                message: 'Apply rustfmt to transactional worker helpers',
                content: fs.readFileSync(path).toString('base64'),
                sha: current.sha,
                branch,
              }),
            });
            console.log(`published ${updated.commit.sha}`);
          })().catch((error) => {
            console.error(error.stack || error.message || String(error));
            process.exit(1);
          });
          NODE
