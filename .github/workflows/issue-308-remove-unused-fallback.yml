name: Issue 308 Remove Unused Fallback

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/issue-308-fail-closed-windows-sandbox'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-308-fail-closed-windows-sandbox
      - name: Remove dormant unsandboxed API
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('crates/medusa-agent/src/policy.rs')
          text = path.read_text()
          start = text.index('/// Runs a command without containment only after explicit approval.\n')
          end = text.index('#[cfg(target_os = "macos")]\n', start)
          text = text[:start] + text[end:]
          test_start = text.index('    #[test]\n    fn unsandboxed_execution_requires_explicit_approval()')
          test_end = text.index('    #[cfg(not(any(target_os = "linux", target_os = "macos")))]', test_start)
          text = text[:test_start] + text[test_end:]
          path.write_text(text)

          doc = Path('docs/issue-308-windows-sandbox.md')
          value = doc.read_text()
          value = value.replace(
              'A separately named `unsandboxed_command` path requires explicit approval, clears the inherited environment, and is not used by the sandboxed path.\n\n',
              'No unsandboxed fallback is exposed by the sandbox API. Unsupported platforms return before process launch.\n\n',
          )
          doc.write_text(value)
          PY
          cargo fmt --all
          cargo test -p medusa-core
          cargo test -p medusa-agent policy::tests
      - name: Commit correction and remove workflow
        run: |
          rm .github/workflows/issue-308-remove-unused-fallback.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Remove dormant unsandboxed command fallback"
          git push origin HEAD:agent/issue-308-fail-closed-windows-sandbox
