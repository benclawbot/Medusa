name: Architecture policy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: architecture-policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-ignored-runtime-cleanup:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/fix-live-preflight-dirty-state'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0
        with:
          components: rustfmt, clippy
      - name: Apply ignored runtime-state cleanup
        run: |
          git apply --check .github/agent-patches/clean-ignored-runtime-state.patch
          git apply .github/agent-patches/clean-ignored-runtime-state.patch
      - name: Validate source
        run: |
          cargo fmt --all
          cargo check --workspace --all-targets
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test -p medusa-workers --test runtime_state_cleanup
          cargo test -p medusa-agent --test session_bootstrap
          cargo test -p medusa-workers -p medusa-runtime
      - name: Commit validated source and restore workflow
        shell: bash
        run: |
          git show origin/main:.github/workflows/architecture-policy.yml > .github/workflows/architecture-policy.yml
          rm -f .github/agent-patches/clean-ignored-runtime-state.patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Discard ignored Medusa state before worker integration'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  architecture-policy:
    name: Shipped crate reachability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0 # 1.88.0
      - name: Refresh dependency lock for merged graph
        run: cargo generate-lockfile
      - name: Exercise policy fixtures
        run: python3 scripts/architecture-policy.py self-test
      - name: Enforce architecture policy
        run: |
          python3 scripts/architecture-policy.py check \
            --root . \
            --policy .github/architecture-policy.json \
            --report architecture-policy-report.md
      - name: Publish architecture report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: architecture-policy-report
          path: architecture-policy-report.md
          if-no-files-found: error
