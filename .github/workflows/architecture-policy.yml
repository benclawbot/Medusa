name: Architecture policy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  actions: read

concurrency:
  group: architecture-policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture-policy:
    name: Shipped crate reachability
    runs-on: ubuntu-latest
    steps:
      - name: Bootstrap repository for local actions
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust
      - name: Validate committed dependency authority
        uses: ./.github/actions/cargo-locked
        with:
          command: "metadata --locked --format-version 1 >/dev/null"
      - name: Exercise architecture policy fixtures
        run: python3 scripts/architecture-policy.py self-test
      - name: Exercise engineering policy fixtures
        run: python3 scripts/engineering-policy.py self-test
      - name: Exercise repository engineering contract fixtures
        run: python3 scripts/test-engineering-policy-contract.py
      - name: Validate engineering policy schema
        run: python3 scripts/engineering-policy.py validate --policy .github/engineering-policy.json --root .
      - name: Resolve required engineering checks with frozen authority
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        run: |
          set -euo pipefail
          git diff --name-only "${BASE_SHA}...${HEAD_SHA}" > /tmp/engineering-policy-changed-paths.txt
          if grep -Eq '^(\.github/engineering-policy\.json|scripts/engineering-policy\.py|\.github/workflows/architecture-policy\.yml)$' /tmp/engineering-policy-changed-paths.txt; then
            git show "${BASE_SHA}:.github/engineering-policy.json" > /tmp/engineering-policy-base.json
            git show "${BASE_SHA}:scripts/engineering-policy.py" > /tmp/engineering-policy-base.py
            python3 /tmp/engineering-policy-base.py explain \
              --policy /tmp/engineering-policy-base.json \
              --base-policy /tmp/engineering-policy-base.json \
              --root . \
              --base "${BASE_SHA}" \
              --head "${HEAD_SHA}" \
              --json | tee engineering-policy-report.json
          else
            CONDITION_ARGS=()
            if [[ -n "${MINIMAX_API_KEY:-}" ]]; then
              CONDITION_ARGS+=(--condition credentials_available_or_final_issue_certification)
            fi
            python3 scripts/engineering-policy.py explain \
              --policy .github/engineering-policy.json \
              --root . \
              --base "${BASE_SHA}" \
              --head "${HEAD_SHA}" \
              "${CONDITION_ARGS[@]}" \
              --json | tee engineering-policy-report.json
          fi
      - name: Enforce architecture policy
        run: |
          python3 scripts/architecture-policy.py check \
            --root . \
            --policy .github/architecture-policy.json \
            --report architecture-policy-report.md
      - name: Enforce sole GitHub operation authority
        run: python3 scripts/github-authority-policy.py
      - name: Enforce certified tool execution pipeline
        run: python3 scripts/check-certified-tool-pipeline.py
      - name: Enforce resolved engineering checks
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 scripts/engineering-policy.py enforce \
            --policy .github/engineering-policy.json \
            --report engineering-policy-report.json \
            --root . \
            --head "${HEAD_SHA}" \
            --satisfied architecture-policy \
            --satisfied certified-tool-pipeline \
            --satisfied engineering-policy-base \
            --timeout-seconds 600
      - name: Publish architecture report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: architecture-policy-report
          path: |
            architecture-policy-report.md
            engineering-policy-report.json
          if-no-files-found: warn
