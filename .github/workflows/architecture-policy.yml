name: Architecture policy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: architecture-policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture-policy:
    name: Shipped crate reachability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-304-turn-pipeline
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt
      - name: Refresh generated files and restore workflows
        run: |
          cargo fmt --all
          cargo generate-lockfile
          git show origin/main:.github/workflows/architecture-policy.yml > .github/workflows/architecture-policy.yml
          rm -f .github/workflows/issue-304-refresh.yml
      - name: Commit generated files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.lock crates/medusa-mcp-cache/src/result_cache.rs crates/medusa-runtime/src/turn_pipeline.rs .github/workflows/architecture-policy.yml
          git add -u .github/workflows/issue-304-refresh.yml
          git commit -m "chore: refresh issue 304 formatting and lockfile [skip ci]"
          git push origin HEAD:agent/issue-304-turn-pipeline
