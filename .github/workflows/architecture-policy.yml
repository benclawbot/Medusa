name: Architecture policy

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: architecture-policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-issue-378:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 382
    name: Apply issue 378 source fix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/378-tool-output-details
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Apply runtime patch
        shell: python
        run: |
          from pathlib import Path
          path = Path('crates/medusa-runtime/src/support.rs')
          text = path.read_text()
          replacements = [
              (
                  '        AgentUpdate::ToolOutput {\n            tool,\n            output: _,\n            is_error,\n        } => {',
                  '        AgentUpdate::ToolOutput {\n            tool,\n            output,\n            is_error,\n        } => {',
              ),
              (
                  '                    details: Vec::new(),\n                },\n                |pending| RuntimeActivity {',
                  '                    details: tool_output_details(output),\n                },\n                |pending| RuntimeActivity {',
              ),
              (
                  '                    details: Vec::new(),\n                },\n            );\n            let _ = events.send(RuntimeEvent::Activity(activity));',
                  '                    details: tool_output_details(output),\n                },\n            );\n            let _ = events.send(RuntimeEvent::Activity(activity));',
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'missing expected source fragment: {old[:50]!r}')
              text = text.replace(old, new, 1)
          marker = 'fn summarize(value: &str) -> String {\n'
          helper = '''fn tool_output_details(output: &str) -> Vec<String> {
              let output = output.trim();
              if output.is_empty() {
                  Vec::new()
              } else {
                  output.lines().map(str::to_owned).collect()
              }
          }

          '''
          if marker not in text:
              raise SystemExit('missing summarize insertion point')
          text = text.replace(marker, helper + marker, 1)
          old = '''        assert_eq!(summarize("short line"), "short line");
          assert!(summarize(&"x".repeat(150)).ends_with("..."));'''
          new = '''        assert_eq!(summarize("short line"), "short line");
          assert!(summarize(&"x".repeat(150)).ends_with("..."));
          assert!(tool_output_details("  \\n").is_empty());
          assert_eq!(
              tool_output_details("stdout line\\nstderr: command failed\\n"),
              vec!["stdout line", "stderr: command failed"]
          );'''
          if old not in text:
              raise SystemExit('missing test insertion point')
          path.write_text(text.replace(old, new, 1))
          Path('.github/fix-378-trigger').unlink(missing_ok=True)
          Path('.github/workflows/fix-378.yml').unlink(missing_ok=True)
      - run: cargo fmt --all
      - run: cargo fmt --all -- --check
      - run: cargo test -p medusa-runtime
      - name: Commit PR fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(runtime): surface tool output details"
          git push origin HEAD:fix/378-tool-output-details

  architecture-policy:
    name: Shipped crate reachability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Refresh dependency lock for merged graph
        run: cargo generate-lockfile
      - name: Exercise policy fixtures
        run: python3 scripts/architecture-policy.py self-test
      - name: Enforce architecture policy
        run: |
          python3 scripts/architecture-policy.py check \
            --root . \
            --policy .github/architecture-policy.json \
            --report architecture-policy-report.md
      - name: Publish architecture report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: architecture-policy-report
          path: architecture-policy-report.md
          if-no-files-found: error
