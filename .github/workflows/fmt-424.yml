name: Format issue 424 fix

on:
  push:
    branches:
      - agent/424-session-continuity

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/424-session-continuity
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt
      - name: Format and commit source
        run: |
          cargo fmt --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/medusa-session-continuity/src/root.rs
          git commit -m "Format continuity migration default"
          git push origin HEAD:agent/424-session-continuity
