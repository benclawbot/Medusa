name: Apply issue 656 formatting

on:
  push:
    branches:
      - codex/656-truthful-code-intelligence
    paths:
      - .github/workflows/apply-issue-656-format.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/656-truthful-code-intelligence
          fetch-depth: 0
      - name: Apply CI rustfmt patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/patches/issue-656-format/part-* | base64 --decode > /tmp/issue-656-format.patch
          git apply --check /tmp/issue-656-format.patch
          git apply /tmp/issue-656-format.patch
          rm -rf .github/patches/issue-656-format
          rm .github/workflows/apply-issue-656-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply rustfmt to code-intelligence changes"
          git push origin HEAD:codex/656-truthful-code-intelligence
