name: Apply issue 690 Clippy fix

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/issue-690-clippy-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'perf/690-bounded-speculative-implementation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0
        with:
          components: clippy
      - name: Apply scoped Clippy allowances and verify
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('crates/medusa-runtime/src/mutating_worker_coordinator.rs')
          s = p.read_text()
          for signature in ['fn promote_speculative_state(', 'fn coordinate_with_control<F>(']:
              needle = '\n' + signature
              replacement = '\n#[allow(clippy::too_many_arguments)]\n' + signature
              assert needle in s, f'missing {signature}'
              s = s.replace(needle, replacement, 1)
          p.write_text(s)
          PY
          cargo fmt --all
          cargo clippy -p medusa-runtime --all-targets -- -D warnings
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/medusa-runtime/src/mutating_worker_coordinator.rs
          git diff --cached --quiet && exit 0
          git commit -m 'fix: scope coordinator Clippy allowances'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
