name: issue803-run
on:
  push:
    branches: [agent/issue-803-staged-config]
    paths: [.github/workflows/issue803-run.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0
      - run: python .github/issue803_replay.py
