name: Integrate persistent permission modes

on:
  push:
    branches:
      - integrate/persistent-permission-modes

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: integrate/persistent-permission-modes
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0
        with:
          toolchain: 1.88.0
          components: rustfmt
      - name: Apply feature diff onto current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feat/persistent-permission-modes
          git diff b08da6d6e9ae6b5f9696860f07242cf814bc92ef..origin/feat/persistent-permission-modes -- \
            apps/medusa-desktop/src-tauri/src/config.rs \
            apps/medusa-desktop/src-tauri/src/lib.rs \
            apps/medusa-desktop/src-tauri/src/permissions.rs \
            apps/medusa-desktop/src/PermissionModeControl.tsx \
            apps/medusa-desktop/src/main.tsx \
            apps/medusa-desktop/src/permission-mode.css \
            crates/medusa-config/src/lib_root.rs \
            crates/medusa-config/src/permission_mode.rs \
            crates/medusa-runtime/src/lib.rs \
            crates/medusa-tui/src/lib.rs \
            crates/medusa-tui/src/render.rs \
            crates/medusa-tui/src/session.rs \
            > /tmp/permission-modes.patch
          git apply --3way --index /tmp/permission-modes.patch
          cargo fmt --all
      - name: Validate Rust integration
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked -p medusa-config -p medusa-runtime -p medusa-tui
          cargo test --locked -p medusa-config permission_mode
      - name: Commit integrated feature
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/integrate-persistent-permission-modes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: persistent Codex-style permission modes"
          git push origin HEAD:integrate/persistent-permission-modes
