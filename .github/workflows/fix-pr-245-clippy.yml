name: Fix PR 245 Clippy

on:
  push:
    branches:
      - agent/desktop-main-updater

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/desktop-main-updater
          fetch-depth: 0
      - name: Annotate retained legacy render helpers
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('crates/medusa-tui/src/render/support.rs')
          text = path.read_text()
          replacements = {
              '    pub(super) fn print(&self, stdout: &mut io::Stdout, width: u16) -> io::Result<()> {': '    #[allow(dead_code)]\n    pub(super) fn print(&self, stdout: &mut io::Stdout, width: u16) -> io::Result<()> {',
              'pub(super) fn print_separator(stdout: &mut io::Stdout, width: u16) -> io::Result<()> {': '#[allow(dead_code)]\npub(super) fn print_separator(stdout: &mut io::Stdout, width: u16) -> io::Result<()> {',
              'pub(super) fn print_styled_line(': '#[allow(dead_code)]\npub(super) fn print_styled_line(',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing expected block: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          cargo fmt --all
      - name: Remove one-shot workflow
        run: rm -f .github/workflows/fix-pr-245-clippy.yml
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(tui): retain legacy render helpers"
          git push origin HEAD:agent/desktop-main-updater
