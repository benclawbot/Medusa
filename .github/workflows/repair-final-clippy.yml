name: Repair Final Clippy Findings

on:
  push:
    branches:
      - agent/local-execution-bridge

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/local-execution-bridge
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt
      - name: Apply targeted lint repairs
        run: |
          python3 - <<'PY'
          from pathlib import Path

          registry = Path('crates/medusa-process-registry/src/lib.rs')
          text = registry.read_text()
          old = '''    #[must_use]\n    pub fn records(&self) -> impl Iterator<Item = &ProcessRecord> {'''
          new = '''    pub fn records(&self) -> impl Iterator<Item = &ProcessRecord> {'''
          if old not in text:
              raise SystemExit('process registry lint target not found')
          registry.write_text(text.replace(old, new, 1))

          replay = Path('crates/medusa-execution-replay/src/lib.rs')
          text = replay.read_text()
          marker = '    pub fn new(\n'
          if marker not in text:
              raise SystemExit('replay constructor not found')
          replay.write_text(text.replace(marker, '    #[allow(clippy::too_many_arguments)]\n    pub fn new(\n', 1))
          PY
          cargo fmt --all
      - name: Commit repairs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/medusa-process-registry/src/lib.rs crates/medusa-execution-replay/src/lib.rs
          git commit -m "Fix final strict Clippy findings"
          git push origin HEAD:agent/local-execution-bridge
