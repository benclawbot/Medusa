name: Apply issue 690 format fix

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/issue-690-fmt.patch'
      - '.github/workflows/issue-690-fmt.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'perf/690-bounded-speculative-implementation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Apply exact rustfmt patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .github/issue-690-fmt.patch
          git apply .github/issue-690-fmt.patch
          rm .github/issue-690-fmt.patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'style: apply rustfmt to speculation tests'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
