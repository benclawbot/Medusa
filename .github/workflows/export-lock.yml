name: Regenerate and commit lockfile

on:
  push:
    branches:
      - issue-306-adopt-testkit
    paths:
      - .github/workflows/export-lock.yml

permissions:
  contents: write

jobs:
  regenerate-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-306-adopt-testkit
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Generate workspace lockfile
        run: cargo generate-lockfile
      - name: Commit lockfile and remove helper
        run: |
          rm .github/workflows/export-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock .github/workflows/export-lock.yml
          git commit -m "Regenerate Cargo lockfile"
          git push origin HEAD:issue-306-adopt-testkit
