name: Apply final PR 339 lint fix

on:
  push:
    branches: [issue-305-explicit-capabilities]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-305-explicit-capabilities
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt,clippy
      - name: Move test-only PathBuf import
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/medusa-capabilities/src/explicit.rs')
          text = path.read_text()
          text = text.replace('    path::{Path, PathBuf},\n', '    path::Path,\n', 1)
          text = text.replace('    use std::sync::{Arc, Mutex};', '    use std::{path::PathBuf, sync::{Arc, Mutex}};', 1)
          path.write_text(text)
          PY
          cargo fmt --all
          cargo clippy -p medusa-capabilities -p medusa-cli --all-targets -- -D warnings
          cargo test -p medusa-capabilities
          rm .github/workflows/fix-pr339-import.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/medusa-capabilities/src/explicit.rs .github/workflows/fix-pr339-import.yml
          git commit -m "Move test-only capability import"
          git push origin HEAD:issue-305-explicit-capabilities
