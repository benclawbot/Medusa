name: Repair Integration Lockfile

on:
  push:
    branches:
      - agent/local-execution-bridge

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/local-execution-bridge
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Generate canonical lockfile
        run: cargo generate-lockfile
      - name: Commit lockfile
        run: |
          if git diff --quiet -- Cargo.lock; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.lock
          git commit -m "Refresh integration lockfile"
          git push origin HEAD:agent/local-execution-bridge
