name: One-shot TUI plan cache lint repair

on:
  push:
    branches:
      - fix/tui-input-divider-layout

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: fix/tui-input-divider-layout
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0
        with:
          toolchain: 1.88.0
          components: rustfmt,clippy
      - name: Factor provider plan cache type
        shell: python
        run: |
          from pathlib import Path
          path = Path('crates/medusa-tui/src/render.rs')
          text = path.read_text(encoding='utf-8')
          anchor = '''impl ProviderPlanUsageSnapshot {\n'''
          alias = '''type ProviderPlanUsageCache = std::sync::Mutex<\n    Option<(std::time::Instant, Option<ProviderPlanUsageSnapshot>)>,\n>;\n\n'''
          if text.count(anchor) != 1:
              raise SystemExit(f'expected exactly one snapshot impl anchor, found {text.count(anchor)}')
          text = text.replace(anchor, alias + anchor, 1)
          old = '''    static CACHE: OnceLock<Mutex<Option<(Instant, Option<ProviderPlanUsageSnapshot>)>>> =\n        OnceLock::new();\n'''
          new = '''    static CACHE: OnceLock<ProviderPlanUsageCache> = OnceLock::new();\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one complex cache declaration, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
      - name: Validate production lint and TUI tests
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-features --locked --lib --bins --examples -- -D warnings -D clippy::unwrap_used -D clippy::expect_used -D clippy::panic
          cargo test -p medusa-tui --locked
      - name: Commit source-only repair
        run: |
          rm .github/workflows/one-shot-tui-plan-cache-lint.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/medusa-tui/src/render.rs .github/workflows/one-shot-tui-plan-cache-lint.yml
          git commit -m "fix(tui): factor provider plan cache type"
          git push origin HEAD:fix/tui-input-divider-layout
