name: Apply read-only turn budget

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'fix/read-only-worker-turn-budget'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0
        with:
          components: rustfmt, clippy
      - name: Apply bounded teammate budget fix
        run: git apply .medusa-patches/read-only-turn-budget.patch
      - name: Format
        run: cargo fmt --all -- --check
      - name: Compile runtime targets
        run: cargo check -p medusa-runtime --all-targets
      - name: Strict runtime lint
        run: cargo clippy -p medusa-runtime --all-targets -- -D warnings
      - name: Coordinator tests
        run: cargo test -p medusa-runtime multi_agent_coordinator
      - name: Commit validated source only
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          rm .medusa-patches/read-only-turn-budget.patch
          rm .github/workflows/apply-read-only-turn-budget.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/medusa-runtime/src/multi_agent_coordinator.rs
          git add -u .medusa-patches .github/workflows
          git commit -m "fix(runtime): allow bounded read-only research depth"
          git push origin HEAD:"${HEAD_REF}"
