name: Temporary issue 858 Clippy fix

on:
  push:
    branches:
      - codex/issue-858-dead-code-migrations

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt,clippy
      - name: Narrow all audited test-only helpers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def apply(path, replacements):
              p = Path(path)
              text = p.read_text()
              for old, new in replacements:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: expected one occurrence, found {count}: {old!r}')
                  text = text.replace(old, new)
              p.write_text(text)

          apply('crates/medusa-context/src/refinement.rs', [
              ('use crate::{ContextItem, ContextKind};', '#[cfg(test)]\nuse crate::{ContextItem, ContextKind};'),
              ('    #[must_use]\n    pub fn active_for_scope(', '    #[cfg(test)]\n    #[must_use]\n    pub fn active_for_scope('),
              ('    #[must_use]\n    pub fn conflict_keys(', '    #[cfg(test)]\n    #[must_use]\n    pub fn conflict_keys('),
              ('    pub fn context_items(', '    #[cfg(test)]\n    pub fn context_items('),
              ('#[derive(Clone, Debug, Eq, PartialEq)]\npub struct RecoveryResult {', '#[cfg(test)]\n#[derive(Clone, Debug, Eq, PartialEq)]\npub struct RecoveryResult {'),
              ('    #[must_use]\n    pub fn recover(entries: &[JournalEntry]) -> RecoveryResult {', '    #[cfg(test)]\n    #[must_use]\n    pub fn recover(entries: &[JournalEntry]) -> RecoveryResult {'),
              ("fn artifact_kind_key(kind: RefinementArtifactKind) -> &'static str {", "#[cfg(test)]\nfn artifact_kind_key(kind: RefinementArtifactKind) -> &'static str {")
          ])

          apply('crates/medusa-agent/src/session/skill_outcomes.rs', [
              ('    collections::BTreeMap,\n', ''),
              ('use medusa_failure::FailureDecision;\n', 'use medusa_failure::FailureDecision;\n\n#[cfg(test)]\nuse std::collections::BTreeMap;\n'),
              ('const ACTIVE_SKILLS_ROOT:', '#[cfg(test)]\nconst ACTIVE_SKILLS_ROOT:'),
              ('const METRICS_PATH:', '#[cfg(test)]\nconst METRICS_PATH:'),
              ('const REVIEW_PATH:', '#[cfg(test)]\nconst REVIEW_PATH:'),
              ('const MIN_REVIEW_SAMPLES:', '#[cfg(test)]\nconst MIN_REVIEW_SAMPLES:'),
              ('const HEALTHY_RATE_MILLI:', '#[cfg(test)]\nconst HEALTHY_RATE_MILLI:'),
              ('const REVIEW_RATE_MILLI:', '#[cfg(test)]\nconst REVIEW_RATE_MILLI:'),
              ('#[derive(Debug, Default, Eq, PartialEq, Serialize)]\nstruct SkillEffectivenessMetric', '#[cfg(test)]\n#[derive(Debug, Default, Eq, PartialEq, Serialize)]\nstruct SkillEffectivenessMetric'),
              ('#[derive(Debug, Serialize)]\nstruct SkillEffectivenessSummary', '#[cfg(test)]\n#[derive(Debug, Serialize)]\nstruct SkillEffectivenessSummary'),
              ('#[derive(Debug, Serialize)]\nstruct ConfidencePolicy', '#[cfg(test)]\n#[derive(Debug, Serialize)]\nstruct ConfidencePolicy'),
              ('#[derive(Debug, Serialize)]\nstruct SkillReviewSummary', '#[cfg(test)]\n#[derive(Debug, Serialize)]\nstruct SkillReviewSummary'),
              ('#[derive(Debug, Serialize)]\nstruct SkillReviewRecommendation', '#[cfg(test)]\n#[derive(Debug, Serialize)]\nstruct SkillReviewRecommendation'),
              ('#[derive(Default)]\nstruct MetricAccumulator', '#[cfg(test)]\n#[derive(Default)]\nstruct MetricAccumulator'),
              ('pub(super) fn record_completed_session(', '#[cfg(test)]\npub(super) fn record_completed_session('),
              ('pub(super) fn verification_passed(', '#[cfg(test)]\npub(super) fn verification_passed('),
              ('fn rebuild_effectiveness_summary(', '#[cfg(test)]\nfn rebuild_effectiveness_summary('),
              ('fn write_review_recommendations(', '#[cfg(test)]\nfn write_review_recommendations('),
              ('fn evidence_state(', '#[cfg(test)]\nfn evidence_state('),
              ('fn calibrated_confidence_milli(', '#[cfg(test)]\nfn calibrated_confidence_milli('),
              ('fn outcome_records(', '#[cfg(test)]\nfn outcome_records('),
              ('fn ratio_milli(', '#[cfg(test)]\nfn ratio_milli('),
              ('fn average_milli(', '#[cfg(test)]\nfn average_milli(')
          ])

          apply('crates/medusa-agent/src/verification_authority_legacy.rs', [
              ('pub fn authoritative_verification_for_components(\n', '#[cfg(test)]\npub fn authoritative_verification_for_components(\n'),
              ('pub(crate) fn authoritative_verification_for_paths(\n', '#[cfg(test)]\npub(crate) fn authoritative_verification_for_paths(\n'),
              ('fn git_stdout(repo: &Path, args: &[&str]) -> Option<String> {', '#[cfg(test)]\nfn git_stdout(repo: &Path, args: &[&str]) -> Option<String> {')
          ])
          PY
          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check
      - name: Validate full workspace Clippy
        shell: bash
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Validate affected tests
        shell: bash
        run: |
          cargo test -p medusa-context --locked
          cargo test -p medusa-agent --locked session::skill_outcomes
          cargo test -p medusa-agent --locked verification_authority
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/medusa-context/src/refinement.rs \
            crates/medusa-agent/src/session/skill_outcomes.rs \
            crates/medusa-agent/src/verification_authority_legacy.rs
          git commit -m 'refactor: scope legacy helpers to tests'
          git push origin HEAD:codex/issue-858-dead-code-migrations
