name: Product Acceptance

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-smoke:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == false }}
    name: PR smoke acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0 # 1.88.0
      - name: Refresh dependency lock for the merged PR graph
        run: cargo generate-lockfile
      - name: Install Linux sandbox backend
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns
          fi
      - name: Run shared-target PR smoke acceptance
        run: python3 scripts/product-acceptance-smoke.py --output product-acceptance-smoke-artifacts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: product-acceptance-pr-smoke
          path: |
            product-acceptance-smoke-artifacts/summary.json
            product-acceptance-smoke-artifacts/*.log
          if-no-files-found: error

  full-evidence:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.draft == false &&
        (
          contains(github.event.pull_request.labels.*.name, 'final-issue-validation') ||
          contains(github.event.pull_request.body, 'Closes #') ||
          contains(github.event.pull_request.body, 'closes #') ||
          contains(github.event.pull_request.body, 'Fixes #') ||
          contains(github.event.pull_request.body, 'fixes #') ||
          contains(github.event.pull_request.body, 'Resolves #') ||
          contains(github.event.pull_request.body, 'resolves #')
        )
      )
    name: Full evidence (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0 # 1.88.0
      - name: Refresh dependency lock for the merged commit graph
        run: cargo generate-lockfile
      - name: Install Linux sandbox backend
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns
          fi
      - name: Run authoritative product acceptance suite
        run: cargo product-acceptance --output product-acceptance-artifacts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: product-acceptance-${{ runner.os }}
          path: |
            product-acceptance-artifacts/summary.json
            product-acceptance-artifacts/*.log
          if-no-files-found: error
