name: Issue 550 evidence fix

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/issue-550-evidence-fix.yml

permissions:
  contents: write

jobs:
  fix-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/complete-issue-550
          fetch-depth: 0

      - name: Replace removed generated runtime authority
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("docs/CAPABILITY-CLAIMS.json")
          text = path.read_text(encoding="utf-8")
          old = '        "crates/medusa-runtime/build_main.rs",'
          new = '        "crates/medusa-runtime/src/lib.rs",'
          if text.count(old) != 1:
              raise SystemExit(f"expected one stale capability path, found {text.count(old)}")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          python3 scripts/check-capability-evidence.py

      - name: Publish evidence correction and remove fixer
        run: |
          set -euo pipefail
          rm .github/workflows/issue-550-evidence-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/CAPABILITY-CLAIMS.json .github/workflows/issue-550-evidence-fix.yml
          git commit -m "Update multi-agent capability authority (#550)"
          git push origin HEAD:agent/complete-issue-550
