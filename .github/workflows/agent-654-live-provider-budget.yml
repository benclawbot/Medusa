name: Agent 654 Live Provider Budget

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - scripts/apply-live-provider-review-budget.py
      - .github/workflows/agent-654-live-provider-budget.yml

permissions:
  contents: write

concurrency:
  group: agent-654-live-provider-budget
  cancel-in-progress: true

jobs:
  apply-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply exact bounded budget update
        run: python3 scripts/apply-live-provider-review-budget.py
      - name: Validate resulting workflow markers
        run: |
          grep -q "timeout-minutes: 45" .github/workflows/release-gates.yml
          grep -q "LIVE_E2E_TIMEOUT_SECONDS: '2100'" .github/workflows/release-gates.yml
          git diff --check
      - name: Remove temporary migration machinery
        run: rm scripts/apply-live-provider-review-budget.py .github/workflows/agent-654-live-provider-budget.yml
      - name: Commit bounded live review budget
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Reserve live-provider time for dedicated review"
          git push origin HEAD:${{ github.head_ref }}
