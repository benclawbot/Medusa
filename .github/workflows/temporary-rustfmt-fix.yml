name: Temporary Rustfmt Fix

on:
  pull_request:
    paths:
      - '.github/workflows/temporary-rustfmt-fix.yml'
      - 'apps/medusa-desktop/src-tauri/src/config.rs'

permissions:
  contents: write

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.head_ref }}
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0
        with:
          components: rustfmt
      - name: Apply repository rustfmt
        run: cargo fmt --manifest-path apps/medusa-desktop/src-tauri/Cargo.toml
      - name: Commit only formatting changes
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- . ':(exclude)apps/medusa-desktop/src-tauri/src/config.rs' || {
            echo 'rustfmt changed unexpected files' >&2
            git diff -- . ':(exclude)apps/medusa-desktop/src-tauri/src/config.rs'
            exit 1
          }
          if git diff --quiet -- apps/medusa-desktop/src-tauri/src/config.rs; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/medusa-desktop/src-tauri/src/config.rs
          git commit -m 'Format Desktop provider catalog integration'
          git push origin "HEAD:${{ github.head_ref }}"
