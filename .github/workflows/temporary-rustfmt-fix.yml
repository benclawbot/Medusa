name: Temporary rustfmt fix

on:
  push:
    branches:
      - fix/runtime-scoped-preview-protocol

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/runtime-scoped-preview-protocol
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0
        with:
          toolchain: 1.88.0
          components: rustfmt
      - name: Format and remove temporary workflow
        run: |
          set -euo pipefail
          cargo fmt --all
          rm .github/workflows/temporary-rustfmt-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'style: apply cargo fmt' || exit 0
          git push origin HEAD:fix/runtime-scoped-preview-protocol
