name: Refresh Desktop Lock

on:
  push:
    branches:
      - codex/issue-857-cargo-machete

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: codex/issue-857-cargo-machete
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0 # 1.88.0
      - name: Regenerate desktop Cargo.lock
        shell: bash
        run: cargo metadata --manifest-path apps/medusa-desktop/src-tauri/Cargo.toml --format-version 1 >/dev/null
      - name: Commit Cargo-generated desktop lockfile
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code --quiet -- apps/medusa-desktop/src-tauri/Cargo.lock && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/medusa-desktop/src-tauri/Cargo.lock
          git commit -m "Refresh desktop Cargo.lock after dependency pruning (#857)"
          git push origin HEAD:codex/issue-857-cargo-machete
