name: Sign Rolling Artifacts

on:
  workflow_call:
    inputs:
      artifact-pattern:
        description: Actions artifact pattern containing rolling manifests and payloads
        required: true
        type: string
      output-artifact:
        description: Actions artifact name for the signed bundle
        required: true
        type: string

permissions:
  contents: read

jobs:
  sign:
    name: Sign rolling manifests with release authority
    runs-on: ubuntu-latest
    environment: release-signing-primary
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      MEDUSA_RELEASE_PRIMARY_ED25519_PRIVATE_KEY_PEM: ${{ secrets.MEDUSA_RELEASE_PRIMARY_ED25519_PRIVATE_KEY_PEM }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: ${{ inputs.artifact-pattern }}
          path: signed-bundle
          merge-multiple: true
      - name: Sign exact rolling manifest bytes
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MEDUSA_RELEASE_PRIMARY_ED25519_PRIVATE_KEY_PEM"
          private_key="$RUNNER_TEMP/medusa-rolling-ed25519.pem"
          raw_signature="$RUNNER_TEMP/medusa-rolling-signature.bin"
          trap 'rm -f "$private_key" "$raw_signature"' EXIT
          umask 077
          printf '%s\n' "$MEDUSA_RELEASE_PRIMARY_ED25519_PRIVATE_KEY_PEM" > "$private_key"
          count=0
          while IFS= read -r -d '' manifest; do
            case "$manifest" in *.sig.json) continue;; esac
            jq -e '.schema == "medusa-main-artifact-v1"' "$manifest" >/dev/null
            openssl pkeyutl -sign -rawin -inkey "$private_key" -in "$manifest" -out "$raw_signature"
            test "$(wc -c < "$raw_signature" | tr -d ' ')" = 64
            manifest_sha=$(sha256sum "$manifest" | awk '{print $1}')
            signature_hex=$(xxd -p -c 256 "$raw_signature")
            jq -cn \
              --arg schema medusa-rolling-signature-v1 \
              --arg key_id medusa-release-2026-08-primary \
              --arg algorithm Ed25519 \
              --arg manifest_sha256 "$manifest_sha" \
              --arg signature "$signature_hex" \
              '{schema:$schema,key_id:$key_id,algorithm:$algorithm,manifest_sha256:$manifest_sha256,signature:$signature}' \
              > "${manifest}.sig.json"
            count=$((count + 1))
          done < <(find signed-bundle -maxdepth 1 -type f -name '*.json' -print0 | sort -z)
          test "$count" -gt 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.output-artifact }}
          path: signed-bundle
          if-no-files-found: error
          retention-days: 7
