name: Apply PR 257 generated fixes

on:
  push:
    branches:
      - agent/durable-patch-journal

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/durable-patch-journal
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt
      - name: Format and refresh lockfile
        run: |
          cargo fmt --all
          cargo generate-lockfile
          rm .github/workflows/agent-fix-pr257.yml
      - name: Commit generated corrections
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Apply generated formatting and lockfile updates"
          git push origin HEAD:agent/durable-patch-journal
