name: Issue 691 Rustfmt

on:
  push:
    branches:
      - agent/issue-691-mutation-dag
    paths:
      - 'crates/medusa-multi-agent-scheduler/src/mutation_dag.rs'
      - '.github/workflows/issue-691-format.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/issue-691-mutation-dag
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0
        with:
          components: rustfmt
      - run: cargo fmt --all
      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/medusa-multi-agent-scheduler/src/mutation_dag.rs
          git commit -m 'style: finish issue 691 rustfmt'
          git push origin HEAD:agent/issue-691-mutation-dag
