name: Apply issue 656 final text patch
on:
  push:
    branches:
      - codex/656-typescript-semantic-production-final
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/656-typescript-semantic-production-final
      - name: Verify and apply exact patch
        run: |
          cat .medusa-issue656-final/0{0..7}.part > /tmp/issue656-final.patch
          echo '01c33a34fec411a8008b8c5290ae35ddae1f04acb1c26b638b296cf81cd733b6  /tmp/issue656-final.patch' | sha256sum --check
          git apply --check /tmp/issue656-final.patch
          git apply /tmp/issue656-final.patch
          git checkout HEAD -- .github/workflows/product-acceptance.yml .github/workflows/apply-issue656-final-text.yml
          rm -rf .medusa-issue656-final
      - name: Commit production tranche
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Complete TypeScript semantic production adapter'
          git push origin HEAD:codex/656-typescript-semantic-production-final
