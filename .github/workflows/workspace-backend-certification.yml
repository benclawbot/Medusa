name: Workspace Backend Certification

on:
  pull_request:
    paths:
      - "crates/medusa-runtime/**"
      - "crates/medusa-workers/**"
      - "crates/medusa-agent/**"
      - "crates/medusa-cli/**"
      - "crates/medusa-tui/**"
      - "crates/medusa-daemon/**"
      - "apps/medusa-desktop/**"
      - "scripts/check-workspace-surfaces.py"
      - "docs/WORKSPACES.md"
      - "docs/ARCHITECTURE.md"
      - "docs/MULTI_AGENT_EXECUTION.md"
      - "docs/PRODUCTION-EXECUTION-TRACE.md"
      - "README.md"
      - "Cargo.toml"
      - ".github/workflows/workspace-backend-certification.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: workspace-backend-certification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize-967:
    name: Materialize issue 967 fix
    if: github.head_ref == 'fix/967-verification-runtime-state'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0
      - name: Patch verification authority and regression
        shell: python
        run: |
          from pathlib import Path
          path = Path('crates/medusa-agent/src/verification_authority.rs')
          text = path.read_text()
          old = '''    let mut paths = repository_state_paths(repo, components, evidence_relative.as_deref())?;
    paths.sort();
'''
          new = '''    let mut paths = repository_state_paths(repo, components, evidence_relative.as_deref())?;
    // `.medusa` is Medusa-owned execution state. Session journals, request manifests, and
    // other runtime files can change concurrently with authoritative verification and must not
    // invalidate the product-state snapshot. Product/source paths outside this reserved runtime
    // namespace remain fully fingerprinted and still fail closed on genuine drift.
    paths.retain(|relative| {
        let normalized = relative.to_string_lossy().replace('\\\\', "/");
        normalized != ".medusa" && !normalized.starts_with(".medusa/")
    });
    paths.sort();
'''
          if old not in text:
              raise SystemExit('verification path collection anchor not found')
          text = text.replace(old, new, 1)
          marker = '''    #[test]
    fn parallel_repository_fingerprint_is_order_stable_and_content_sensitive() {
'''
          test = '''    #[test]
    fn medusa_runtime_state_does_not_destabilize_repository_fingerprint() {
        let directory = tempfile::tempdir().expect("repository");
        fs::write(directory.path().join("input.txt"), "stable\\n").expect("input");
        let component =
            ChangedComponent::new(ChangeKind::Modified, "input.txt").expect("component");
        let evidence_root = directory.path().join(".medusa/evidence");
        fs::create_dir_all(directory.path().join(".medusa/sessions")).expect("runtime state");
        fs::write(
            directory.path().join(".medusa/sessions/session.json"),
            "{\\"revision\\":1}\\n",
        )
        .expect("session state");
        let before = complete_repository_state_fingerprint(
            directory.path(),
            &evidence_root,
            &[component.clone()],
        )
        .expect("initial fingerprint");
        fs::write(
            directory.path().join(".medusa/sessions/session.json"),
            "{\\"revision\\":2}\\n",
        )
        .expect("updated session state");
        let after_runtime = complete_repository_state_fingerprint(
            directory.path(),
            &evidence_root,
            &[component.clone()],
        )
        .expect("runtime-only fingerprint");
        assert_eq!(before, after_runtime, "Medusa-owned runtime state must be excluded");
        fs::write(directory.path().join("input.txt"), "changed\\n").expect("product drift");
        let after_product = complete_repository_state_fingerprint(
            directory.path(),
            &evidence_root,
            &[component],
        )
        .expect("product fingerprint");
        assert_ne!(before, after_product, "product drift must remain authoritative");
    }

'''
          if marker not in text:
              raise SystemExit('test insertion anchor not found')
          text = text.replace(marker, test + marker, 1)
          path.write_text(text)
      - name: Format and test agent verification
        run: |
          cargo fmt --all
          cargo test -p medusa-agent --locked
      - name: Push clean product commit
        run: |
          git config user.name "benclawbot"
          git config user.email "benclawbot@gmail.com"
          git rm .github/workflows/fix-967-materialize.yml
          git checkout origin/main -- .github/workflows/workspace-backend-certification.yml
          git add crates/medusa-agent/src/verification_authority.rs .github/workflows/workspace-backend-certification.yml
          git commit -m "fix(agent): ignore Medusa runtime state in verification guard"
          git push origin HEAD:${{ github.head_ref }}

  directory-workspace:
    name: Directory workspace (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0 # 1.88.0
      - name: Test directory mutation backend
        run: cargo test -p medusa-runtime workspace_worker_manager --locked
      - name: Test public workspace lifecycle
        run: cargo test -p medusa-runtime workspace::tests --locked
      - name: Test workspace-scoped daemon paths
        run: cargo test -p medusa-daemon --test workspace_paths --locked
      - name: Verify every user surface accepts a filesystem workspace
        run: python3 scripts/check-workspace-surfaces.py

  architecture:
    name: Workspace architecture authority
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0 # 1.88.0
      - name: Validate architecture claims
        run: python3 scripts/check-product-architecture.py
      - name: Validate capability evidence
        run: python3 scripts/check-capability-evidence.py
      - name: Validate user-surface workspace claims
        run: python3 scripts/check-workspace-surfaces.py
