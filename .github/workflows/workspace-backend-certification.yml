name: Workspace Backend Certification

on:
  pull_request:
    paths:
      - "crates/medusa-runtime/**"
      - "crates/medusa-workers/**"
      - "crates/medusa-cli/**"
      - "crates/medusa-tui/**"
      - "crates/medusa-daemon/**"
      - "apps/medusa-desktop/**"
      - "scripts/check-workspace-surfaces.py"
      - "docs/WORKSPACES.md"
      - "docs/ARCHITECTURE.md"
      - "docs/MULTI_AGENT_EXECUTION.md"
      - "docs/PRODUCTION-EXECUTION-TRACE.md"
      - "README.md"
      - "Cargo.toml"
      - ".github/workflows/workspace-backend-certification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workspace-backend-certification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  directory-workspace:
    name: Directory workspace (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0 # 1.88.0
      - name: Test directory mutation backend
        run: cargo test -p medusa-runtime workspace_worker_manager --locked
      - name: Test public workspace lifecycle
        run: cargo test -p medusa-runtime workspace::tests --locked
      - name: Test workspace-scoped daemon paths
        run: cargo test -p medusa-daemon --test workspace_paths --locked
      - name: Verify every user surface accepts a filesystem workspace
        run: python3 scripts/check-workspace-surfaces.py

  architecture:
    name: Workspace architecture authority
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0 # 1.88.0
      - name: Validate architecture claims
        run: python3 scripts/check-product-architecture.py
      - name: Validate capability evidence
        run: python3 scripts/check-capability-evidence.py
      - name: Validate user-surface workspace claims
        run: python3 scripts/check-workspace-surfaces.py

  documentation-finalizer:
    name: Finalize documentation inventory
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 847 && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Regenerate inventory and remove temporary diagnostics
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git show bd32623f618a9f89ba7ecb35df1c0ce624232ee1:scripts/check-documentation.py > /tmp/check-documentation.py
          python3 /tmp/check-documentation.py --root . --write
          git show bd32623f618a9f89ba7ecb35df1c0ce624232ee1:scripts/check-documentation.py > scripts/check-documentation.py
          git show bd32623f618a9f89ba7ecb35df1c0ce624232ee1:.github/workflows/workspace-backend-certification.yml > .github/workflows/workspace-backend-certification.yml
          git config user.name "BenClawBot (AlphaOM3G1)"
          git config user.email "benclawbot@gmail.com"
          git add docs/documentation-inventory.json scripts/check-documentation.py .github/workflows/workspace-backend-certification.yml
          git diff --cached --check
          git commit -m "docs: refresh reviewed documentation inventory"
          git push origin "HEAD:${HEAD_REF}"
