name: Fix 687 Structured Patch

on:
  push:
    branches: [perf/687-structured-patch]

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: perf/687-structured-patch
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0 # 1.88.0
      - name: Add structured mutation compound tool
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/medusa-agent/src/tools/compound.rs')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '    collections::BTreeSet,\n',
              '    collections::{BTreeMap, BTreeSet},\n',
              1,
          )
          text = text.replace(
              'use medusa_intelligence::{RepositoryGraph, RepositoryGraphFreshness, ReviewImpact};',
              '''use medusa_intelligence::{
              EditMetadata, EditPreconditions, EditRange, FileSnapshot, RepositoryGraph,
              RepositoryGraphFreshness, ReviewImpact, StructuredEditPlan, StructuredFileOperation,
              StructuredTextEdit, apply_structured_transaction,
          };''',
              1,
          )
          text = text.replace(
              'use serde_json::{Value, json};',
              'use serde_json::{Value, json};\nuse sha2::{Digest, Sha256};',
              1,
          )
          marker = '\nfn source_excerpt(repo: &Path, relative: &Path) -> MedusaResult<String> {'
          insertion = r'''

          pub(crate) fn apply_structured_patch(repo: &Path, input: &Value) -> MedusaResult<String> {
              let expected_revision = input
                  .get("repository_revision")
                  .and_then(Value::as_str)
                  .map(str::trim)
                  .filter(|value| !value.is_empty())
                  .ok_or_else(|| crate::tools::invalid_tool("repository_revision must be a non-empty string"))?;
              let plan_id = input
                  .get("plan_id")
                  .and_then(Value::as_str)
                  .map(str::trim)
                  .filter(|value| !value.is_empty())
                  .ok_or_else(|| crate::tools::invalid_tool("plan_id must be a non-empty string"))?;

              let mut graph = RepositoryGraph::open(repo)?;
              if graph.freshness() != RepositoryGraphFreshness::Current
                  || graph.snapshot().repository_revision != expected_revision
              {
                  return Err(crate::tools::invalid_tool(
                      "apply_structured_patch refused repository revision drift",
                  ));
              }

              let mut plan = StructuredEditPlan::new(plan_id);
              if let Some(edits) = input.get("edits") {
                  let edits = edits
                      .as_array()
                      .ok_or_else(|| crate::tools::invalid_tool("edits must be an array"))?;
                  for edit in edits {
                      let relative = required_string(edit, "path")?;
                      let _ = safe_path(repo, relative)?;
                      let file_hash = required_string(edit, "file_hash")?.to_owned();
                      let start_byte = required_usize(edit, "start_byte")?;
                      let end_byte = required_usize(edit, "end_byte")?;
                      let replacement = required_string(edit, "replacement")?.to_owned();
                      let expected_content = edit
                          .get("expected_content")
                          .and_then(Value::as_str)
                          .map(str::to_owned);
                      plan.add_text_edit(StructuredTextEdit {
                          path: PathBuf::from(relative),
                          file_hash: Some(file_hash),
                          file_version: None,
                          range: EditRange { start_byte, end_byte },
                          replacement,
                          metadata: metadata(edit),
                          preconditions: EditPreconditions {
                              expected_content,
                              expected_symbol: None,
                              expected_ast_node: None,
                          },
                      });
                  }
              }

              if let Some(operations) = input.get("file_operations") {
                  let operations = operations.as_array().ok_or_else(|| {
                      crate::tools::invalid_tool("file_operations must be an array")
                  })?;
                  for operation in operations {
                      let kind = required_string(operation, "kind")?;
                      let structured = match kind {
                          "create" => {
                              let relative = required_string(operation, "path")?;
                              let _ = safe_path(repo, relative)?;
                              StructuredFileOperation::Create {
                                  path: PathBuf::from(relative),
                                  content: required_string(operation, "content")?.as_bytes().to_vec(),
                                  overwrite: operation.get("overwrite").and_then(Value::as_bool).unwrap_or(false),
                                  metadata: metadata(operation),
                              }
                          }
                          "delete" => {
                              let relative = required_string(operation, "path")?;
                              let _ = safe_path(repo, relative)?;
                              StructuredFileOperation::Delete {
                                  path: PathBuf::from(relative),
                                  expected_hash: Some(required_string(operation, "expected_hash")?.to_owned()),
                                  metadata: metadata(operation),
                              }
                          }
                          "rename" | "move" => {
                              let from = required_string(operation, "from")?;
                              let to = required_string(operation, "to")?;
                              let _ = safe_path(repo, from)?;
                              let _ = safe_path(repo, to)?;
                              let fields = (
                                  PathBuf::from(from),
                                  PathBuf::from(to),
                                  Some(required_string(operation, "expected_hash")?.to_owned()),
                                  operation.get("overwrite").and_then(Value::as_bool).unwrap_or(false),
                                  metadata(operation),
                              );
                              if kind == "rename" {
                                  StructuredFileOperation::Rename {
                                      from: fields.0,
                                      to: fields.1,
                                      expected_hash: fields.2,
                                      overwrite: fields.3,
                                      metadata: fields.4,
                                  }
                              } else {
                                  StructuredFileOperation::Move {
                                      from: fields.0,
                                      to: fields.1,
                                      expected_hash: fields.2,
                                      overwrite: fields.3,
                                      metadata: fields.4,
                                  }
                              }
                          }
                          _ => {
                              return Err(crate::tools::invalid_tool(
                                  "file operation kind must be create, delete, rename, or move",
                              ));
                          }
                      };
                      plan.add_file_operation(structured);
                  }
              }
              if plan.text_edits.is_empty() && plan.file_operations.is_empty() {
                  return Err(crate::tools::invalid_tool(
                      "apply_structured_patch requires at least one edit or file operation",
                  ));
              }

              let touched_paths = plan.touched_paths();
              let snapshots = snapshots_for(repo, &touched_paths)?;
              let pre_impact = graph.affected_files(&touched_paths);
              if pre_impact.freshness != RepositoryGraphFreshness::Current {
                  return Err(crate::tools::invalid_tool(
                      "apply_structured_patch refused stale dependency evidence",
                  ));
              }
              let public_api_risk = ReviewImpact::analyze(&graph.snapshot().index, &touched_paths).public_api_risk;
              let receipt = apply_structured_transaction(repo, plan, &snapshots, None)
                  .map_err(|error| crate::tools::invalid_tool(error.to_string()))?;
              let invalidated_graph_nodes = pre_impact.value;
              let refreshed_paths = graph.refresh()?;

              serde_json::to_string_pretty(&json!({
                  "repository_revision": expected_revision,
                  "transaction": receipt,
                  "changed_paths": receipt.changed_paths,
                  "before_hashes": receipt.before_hashes,
                  "after_hashes": receipt.after_hashes,
                  "public_api_risk": public_api_risk,
                  "invalidated_graph_nodes": invalidated_graph_nodes,
                  "graph_refresh_changed_paths": refreshed_paths,
                  "graph_revision": graph.snapshot().graph_revision,
                  "freshness": graph.freshness(),
                  "evidence_refs": [format!(
                      "structured-transaction:{}:{}",
                      expected_revision, receipt.transaction_id
                  )],
              }))
              .map_err(Into::into)
          }

          fn snapshots_for(
              repo: &Path,
              paths: &[PathBuf],
          ) -> MedusaResult<BTreeMap<PathBuf, FileSnapshot>> {
              let mut snapshots = BTreeMap::new();
              for relative in paths {
                  let absolute = safe_path(repo, relative.to_string_lossy().as_ref())?;
                  if !absolute.is_file() {
                      continue;
                  }
                  let bytes = fs::read(&absolute)?;
                  let content = String::from_utf8(bytes.clone()).map_err(|_| {
                      crate::tools::invalid_tool(format!(
                          "structured text target is not UTF-8: {}",
                          relative.display()
                      ))
                  })?;
                  snapshots.insert(
                      relative.clone(),
                      FileSnapshot {
                          hash: sha256(&bytes),
                          version: None,
                          content,
                          symbols: BTreeSet::new(),
                          ast_nodes: BTreeSet::new(),
                      },
                  );
              }
              Ok(snapshots)
          }

          fn sha256(bytes: &[u8]) -> String {
              format!("{:x}", Sha256::digest(bytes))
          }

          fn required_string<'a>(value: &'a Value, key: &str) -> MedusaResult<&'a str> {
              value
                  .get(key)
                  .and_then(Value::as_str)
                  .ok_or_else(|| crate::tools::invalid_tool(format!("{key} must be a string")))
          }

          fn required_usize(value: &Value, key: &str) -> MedusaResult<usize> {
              value
                  .get(key)
                  .and_then(Value::as_u64)
                  .and_then(|value| usize::try_from(value).ok())
                  .ok_or_else(|| {
                      crate::tools::invalid_tool(format!("{key} must be a non-negative integer"))
                  })
          }

          fn metadata(value: &Value) -> EditMetadata {
              EditMetadata {
                  intent: value
                      .get("intent")
                      .and_then(Value::as_str)
                      .unwrap_or("structured repository mutation")
                      .to_owned(),
                  provenance: "model:apply_structured_patch".to_owned(),
                  annotation: value
                      .get("annotation")
                      .and_then(Value::as_str)
                      .map(str::to_owned),
              }
          }
          '''
          if 'pub(crate) fn apply_structured_patch' not in text:
              if marker not in text:
                  raise SystemExit('compound insertion marker missing')
              text = text.replace(marker, insertion + marker, 1)

          test_marker = '\n    #[test]\n    fn path_inspection_is_revision_bound_and_bounded() {'
          tests = r'''

              fn head_revision(directory: &tempfile::TempDir) -> String {
                  let output = Command::new("git")
                      .args(["rev-parse", "HEAD"])
                      .current_dir(directory.path())
                      .output()
                      .expect("revision");
                  assert!(output.status.success());
                  String::from_utf8_lossy(&output.stdout).trim().to_owned()
              }

              fn file_hash(path: &Path) -> String {
                  sha256(&fs::read(path).expect("file bytes"))
              }

              #[test]
              fn structured_patch_applies_atomically_with_revision_and_hash_guards() {
                  let directory = fixture();
                  let source = directory.path().join("src/lib.rs");
                  let before = fs::read_to_string(&source).expect("source");
                  let start = before.find("42").expect("42");
                  let output = apply_structured_patch(
                      directory.path(),
                      &json!({
                          "repository_revision": head_revision(&directory),
                          "plan_id": "change-answer",
                          "edits": [{
                              "path": "src/lib.rs",
                              "file_hash": file_hash(&source),
                              "start_byte": start,
                              "end_byte": start + 2,
                              "expected_content": "42",
                              "replacement": "43",
                              "intent": "update fixture answer"
                          }]
                      }),
                  )
                  .expect("structured patch");
                  let value: Value = serde_json::from_str(&output).expect("json");
                  assert_eq!(value["transaction"]["state"], "committed");
                  assert!(value["changed_paths"].as_array().is_some_and(|paths| !paths.is_empty()));
                  assert!(fs::read_to_string(source).expect("updated").contains("43"));
              }

              #[test]
              fn structured_patch_rejects_stale_revision_hash_overlap_and_symlink_escape() {
                  let directory = fixture();
                  let source = directory.path().join("src/lib.rs");
                  let revision = head_revision(&directory);
                  let hash = file_hash(&source);

                  let stale_revision = apply_structured_patch(
                      directory.path(),
                      &json!({
                          "repository_revision": "not-the-current-revision",
                          "plan_id": "stale-revision",
                          "edits": [{"path":"src/lib.rs","file_hash":hash,"start_byte":0,"end_byte":0,"replacement":"// x\n"}]
                      }),
                  )
                  .expect_err("stale revision");
                  assert!(stale_revision.to_string().contains("revision drift"));

                  let stale_hash = apply_structured_patch(
                      directory.path(),
                      &json!({
                          "repository_revision": revision,
                          "plan_id": "stale-hash",
                          "edits": [{"path":"src/lib.rs","file_hash":"deadbeef","start_byte":0,"end_byte":0,"replacement":"// x\n"}]
                      }),
                  )
                  .expect_err("stale hash");
                  assert!(stale_hash.to_string().contains("StaleHash"));

                  let overlap = apply_structured_patch(
                      directory.path(),
                      &json!({
                          "repository_revision": head_revision(&directory),
                          "plan_id": "overlap",
                          "edits": [
                              {"path":"src/lib.rs","file_hash":file_hash(&source),"start_byte":0,"end_byte":4,"replacement":"pub"},
                              {"path":"src/lib.rs","file_hash":file_hash(&source),"start_byte":2,"end_byte":6,"replacement":"x"}
                          ]
                      }),
                  )
                  .expect_err("overlap");
                  assert!(overlap.to_string().contains("OverlappingEdits"));

                  #[cfg(unix)]
                  {
                      use std::os::unix::fs::symlink;
                      symlink("/tmp", directory.path().join("escape")).expect("symlink");
                      let escaped = apply_structured_patch(
                          directory.path(),
                          &json!({
                              "repository_revision": head_revision(&directory),
                              "plan_id": "escape",
                              "file_operations": [{"kind":"create","path":"escape/pwned.txt","content":"no"}]
                          }),
                      )
                      .expect_err("symlink escape");
                      assert!(escaped.to_string().contains("symlink"));
                  }
              }

              #[test]
              fn structured_patch_supports_create_rename_and_delete() {
                  let directory = fixture();
                  let revision = head_revision(&directory);
                  apply_structured_patch(
                      directory.path(),
                      &json!({
                          "repository_revision": revision,
                          "plan_id": "create-file",
                          "file_operations": [{"kind":"create","path":"src/new.rs","content":"pub fn new_item() {}\n"}]
                      }),
                  )
                  .expect("create");
                  let created = directory.path().join("src/new.rs");
                  assert!(created.is_file());
                  let created_hash = file_hash(&created);
                  apply_structured_patch(
                      directory.path(),
                      &json!({
                          "repository_revision": head_revision(&directory),
                          "plan_id": "rename-file",
                          "file_operations": [{"kind":"rename","from":"src/new.rs","to":"src/renamed.rs","expected_hash":created_hash}]
                      }),
                  )
                  .expect("rename");
                  let renamed = directory.path().join("src/renamed.rs");
                  assert!(renamed.is_file());
                  apply_structured_patch(
                      directory.path(),
                      &json!({
                          "repository_revision": head_revision(&directory),
                          "plan_id": "delete-file",
                          "file_operations": [{"kind":"delete","path":"src/renamed.rs","expected_hash":file_hash(&renamed)}]
                      }),
                  )
                  .expect("delete");
                  assert!(!renamed.exists());
              }
          '''
          if 'structured_patch_applies_atomically' not in text:
              if test_marker not in text:
                  raise SystemExit('test insertion marker missing')
              text = text.replace(test_marker, tests + test_marker, 1)
          path.write_text(text, encoding='utf-8')

          tools = Path('crates/medusa-agent/src/tools/mod.rs')
          text = tools.read_text(encoding='utf-8')
          anchor = '        "inspect_target" => compound::inspect_target(repo, input),\n'
          dispatch = '        "apply_structured_patch" => compound::apply_structured_patch(repo, input),\n'
          if dispatch not in text:
              if anchor not in text:
                  raise SystemExit('dispatch anchor missing')
              text = text.replace(anchor, anchor + dispatch, 1)
          tools.write_text(text, encoding='utf-8')

          registry = Path('crates/medusa-capabilities/src/registry.rs')
          text = registry.read_text(encoding='utf-8')
          anchor = '''        tool_entry(\n            ToolIdentity {\n                states,\n                name: "typescript_semantic",\n            },'''
          entry = '''        tool_entry(\n            ToolIdentity {\n                states,\n                name: "apply_structured_patch",\n            },\n            Capability::CodeIntelligence,\n            "Apply one revision-bound atomic structured repository mutation. Supports guarded byte-range updates plus create/delete/rename/move operations, requires exact repository revision and content hashes for existing files, rejects overlapping/stale/unsafe paths, and returns transaction hashes, public-API risk, invalidated graph nodes, and stable evidence references. Prefer this over whole-file rewrites when the target is known.",\n            json!({"type":"object","properties":{"repository_revision":{"type":"string"},"plan_id":{"type":"string"},"edits":{"type":"array","items":{"type":"object","properties":{"path":{"type":"string"},"file_hash":{"type":"string"},"start_byte":{"type":"integer","minimum":0},"end_byte":{"type":"integer","minimum":0},"expected_content":{"type":"string"},"replacement":{"type":"string"},"intent":{"type":"string"},"annotation":{"type":"string"}},"required":["path","file_hash","start_byte","end_byte","replacement"],"additionalProperties":false}},"file_operations":{"type":"array","items":{"type":"object","properties":{"kind":{"type":"string","enum":["create","delete","rename","move"]},"path":{"type":"string"},"from":{"type":"string"},"to":{"type":"string"},"content":{"type":"string"},"expected_hash":{"type":"string"},"overwrite":{"type":"boolean"},"intent":{"type":"string"},"annotation":{"type":"string"}},"required":["kind"],"additionalProperties":false}}},"required":["repository_revision","plan_id"],"additionalProperties":false}),\n            "medusa-agent::tools::compound::apply_structured_patch",\n            [\n                RegistryPermission::Write,\n                RegistryPermission::RepositoryMutation,\n            ],\n            true,\n        ),\n'''
          if 'name: "apply_structured_patch"' not in text:
              if anchor not in text:
                  raise SystemExit('registry anchor missing')
              text = text.replace(anchor, entry + anchor, 1)
          registry.write_text(text, encoding='utf-8')
          PY
      - name: Format
        run: cargo fmt --all -- --check || cargo fmt --all
      - name: Focused compound tests
        run: cargo test -p medusa-agent tools::compound -- --nocapture
      - name: Structured transaction tests
        run: cargo test -p medusa-intelligence structured -- --nocapture
      - name: Capability registry tests
        run: cargo test -p medusa-capabilities
      - name: Clippy changed crates
        run: cargo clippy -p medusa-agent -p medusa-intelligence -p medusa-capabilities --all-targets --all-features -- -D warnings
      - name: Remove one-shot verifier and publish verified source
        shell: bash
        run: |
          rm .github/workflows/fix-687-structured-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/medusa-agent/src/tools/compound.rs crates/medusa-agent/src/tools/mod.rs crates/medusa-capabilities/src/registry.rs .github/workflows/fix-687-structured-patch.yml
          git commit -m 'Add atomic apply_structured_patch compound tool'
          git push origin HEAD:perf/687-structured-patch
