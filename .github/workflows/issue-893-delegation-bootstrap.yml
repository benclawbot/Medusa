name: Issue 893 delegation bootstrap

on:
  push:
    branches:
      - agent/issue-893-delegation-contracts

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0
        with:
          components: rustfmt,clippy
      - name: Apply delegation contract implementation
        shell: bash
        run: |
          set -euo pipefail
          git show 96fc57a0ee23aede155470f0404dbd0f3850624a:.github/workflows/issue-893-delegation-bootstrap.yml > /tmp/original-bootstrap.yml
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('/tmp/original-bootstrap.yml').read_text()
          marker = "          cat > /tmp/issue893.py <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n          python3 /tmp/issue893.py", start)
          script = textwrap.dedent(source[start:end])
          old = '''if text.count(needle) != 1:
              raise SystemExit(f"expected one normal coordinate call, got {text.count(needle)}")
          text = text.replace(
'''
          new = '''if text.count(needle) < 1:
              raise SystemExit("missing normal coordinate call")
          text = text.replace(
'''
          if old not in script:
              raise SystemExit('normal coordinate assertion anchor not found')
          Path('/tmp/issue893.py').write_text(script.replace(old, new, 1))
          PY
          python3 /tmp/issue893.py
          cargo fmt --all
          cargo check -p medusa-agent -p medusa-runtime --all-targets --locked
          cargo test -p medusa-agent delegation --locked
          cargo test -p medusa-agent worker_execution --locked
          cargo test -p medusa-runtime multi_agent_coordinator --locked
          cargo test -p medusa-runtime mutating_worker_coordinator --locked
      - name: Commit validated implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/issue-893-delegation-bootstrap.yml .github/workflows/issue-893-bootstrap-repair.yml
          git add crates/medusa-agent crates/medusa-runtime
          git diff --cached --check
          git commit -m "Persist immutable worker delegation contracts"
          git push origin HEAD:${{ github.ref_name }}
