name: Issue 893 delegation bootstrap

on:
  push:
    branches:
      - agent/issue-893-delegation-contracts

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0
        with:
          components: rustfmt,clippy
      - name: Apply delegation contract implementation
        shell: bash
        run: |
          set -euo pipefail
          git show 96fc57a0ee23aede155470f0404dbd0f3850624a:.github/workflows/issue-893-delegation-bootstrap.yml > /tmp/original-bootstrap.yml
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('/tmp/original-bootstrap.yml').read_text()
          marker = "          cat > /tmp/issue893.py <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n          python3 /tmp/issue893.py", start)
          script = textwrap.dedent(source[start:end])
          first = 'if text.count(needle) != 1:'
          second = 'raise SystemExit(f"expected one normal coordinate call, got {text.count(needle)}")'
          if first not in script or second not in script:
              raise SystemExit('normal coordinate assertion anchor not found')
          script = script.replace(first, 'if text.count(needle) < 1:', 1)
          script = script.replace(second, 'raise SystemExit("missing normal coordinate call")', 1)
          Path('/tmp/issue893.py').write_text(script)
          PY
          python3 /tmp/issue893.py
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/medusa-agent/src/engine.rs')
          text = path.read_text()
          old = '\n'.join([
              '                journal_certified_tool_execution(',
              '                    session,',
              '                    &approval.tool_use_id,',
              '                    &approval.tool,',
              '                    &approval.input,',
              '                    execution.receipt,',
              '                )?;',
          ])
          new = '\n'.join([
              '                journal_certified_tool_execution(',
              '                    session,',
              '                    &approval.tool_use_id,',
              '                    &approval.tool,',
              '                    &approval.input,',
              '                    execution.receipt,',
              '                    &self.execution_policy,',
              '                )?;',
          ])
          if old not in text:
              raise SystemExit('approved tool receipt call anchor not found')
          path.write_text(text.replace(old, new, 1))
          PY
          cargo fmt --all
          cargo check -p medusa-agent -p medusa-runtime --all-targets --locked
          cargo test -p medusa-agent delegation --locked
          cargo test -p medusa-agent worker_execution --locked
          cargo test -p medusa-runtime multi_agent_coordinator --locked
          cargo test -p medusa-runtime mutating_worker_coordinator --locked
      - name: Commit validated implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/issue-893-delegation-bootstrap.yml
          git add crates/medusa-agent crates/medusa-runtime
          git diff --cached --check
          git commit -m "Persist immutable worker delegation contracts"
          git push origin HEAD:${{ github.ref_name }}
