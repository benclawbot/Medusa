name: Issue 308 Format Windows Backend

on:
  push:
    branches:
      - agent/issue-308-native-windows-appcontainer

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-308-native-windows-appcontainer
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Format workspace
        run: cargo fmt --all
      - name: Commit formatting
        run: |
          rm .github/workflows/issue-308-format-windows-backend.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/medusa-agent/src/policy.rs crates/medusa-agent/src/windows_sandbox.rs .github/workflows/issue-308-format-windows-backend.yml
          git commit -m "Format native Windows sandbox backend"
          git push origin HEAD:agent/issue-308-native-windows-appcontainer
