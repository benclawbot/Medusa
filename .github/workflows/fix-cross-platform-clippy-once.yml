name: Fix Cross Platform Clippy Once

on:
  push:
    branches:
      - ux/action-based-recovery
    paths:
      - '.github/workflows/fix-cross-platform-clippy-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref_name }}
      - name: Apply cross-platform command mutability fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/medusa-workers/src/lib.rs')
          text = path.read_text()
          old = '''fn hidden_command(program: impl AsRef<std::ffi::OsStr>) -> Command {\n    let mut command = Command::new(program);\n    #[cfg(windows)]\n    command.creation_flags(0x0800_0000);\n    command\n}\n'''
          new = '''fn hidden_command(program: impl AsRef<std::ffi::OsStr>) -> Command {\n    let program = program.as_ref();\n    #[cfg(windows)]\n    let mut command = Command::new(program);\n    #[cfg(not(windows))]\n    let command = Command::new(program);\n    #[cfg(windows)]\n    command.creation_flags(0x0800_0000);\n    command\n}\n'''
          if text.count(old) != 1:
              raise SystemExit('expected hidden_command pattern not found exactly once')
          path.write_text(text.replace(old, new))
          PY
      - name: Commit fixed source through GitHub contents API
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          path='crates/medusa-workers/src/lib.rs'
          sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=$GITHUB_REF_NAME" --jq .sha)"
          content="$(base64 -w0 "$path")"
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$path" \
            -f message='fix(workers): satisfy cross-platform clippy' \
            -f content="$content" \
            -f sha="$sha" \
            -f branch="$GITHUB_REF_NAME"
