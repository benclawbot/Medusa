name: Materialize issue 475 v2

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/materialize_issue_475.py
      - .github/materialize_issue_475_capabilities.py
      - .github/materialize_issue_475_tests.py
      - .github/workflows/materialize-issue-475-v2.yml

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'issue-475-openai-image-input'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-475-openai-image-input
          fetch-depth: 0
      - name: Apply provider change
        run: |
          python3 .github/materialize_issue_475.py
          python3 .github/materialize_issue_475_capabilities.py
          python3 .github/materialize_issue_475_tests.py
      - name: Format
        run: cargo fmt --all
      - name: Provider tests
        run: cargo test -p medusa-provider
      - name: Provider clippy
        run: cargo clippy -p medusa-provider --all-targets -- -D warnings
      - name: Commit validated source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/medusa-provider/src/lib.rs crates/medusa-provider/tests/openai_provider.rs
          git rm .github/issue-475-openai-image-input.patch .github/materialize_issue_475.py .github/materialize_issue_475_capabilities.py .github/materialize_issue_475_tests.py .github/workflows/materialize-issue-475.yml .github/workflows/materialize-issue-475-v2.yml
          git commit -m "Add OpenAI image input support"
          git push origin HEAD:issue-475-openai-image-input
