name: Issue 890 negative finalize
on:
  push:
    branches: [codex/issue-890-model-request-policy]
    paths:
      - scripts/issue890_relax_error_text.py
      - .github/workflows/issue-890-negative-finalize.yml
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-890-model-request-policy
          fetch-depth: 0
      - run: python3 scripts/issue890_relax_error_text.py
      - run: cargo fmt --all
      - run: rm scripts/issue890_relax_error_text.py .github/workflows/issue-890-negative-finalize.yml
      - name: Commit clean source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Stabilize request authority persistence regression"
          git push origin HEAD:codex/issue-890-model-request-policy
      - name: Effective request acceptance
        run: cargo test -p medusa-agent --test effective_request_manifest --locked
      - name: Workspace clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Provider tests
        run: cargo test -p medusa-provider --locked
      - name: Runtime tests
        run: cargo test -p medusa-runtime --locked
