name: Apply issue 349 lifecycle patch

on:
  push:
    branches:
      - agent/issue-349-authoritative-lifecycle
    paths:
      - .github/issue-349.patch
      - .github/workflows/issue-349-bootstrap.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt
      - name: Apply reviewed source patch
        run: |
          git apply --check .github/issue-349.patch
          git apply .github/issue-349.patch
          cargo fmt --all
      - name: Remove bootstrap files and commit source changes
        run: |
          rm .github/issue-349.patch .github/workflows/issue-349-bootstrap.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Route headless sessions through runtime lifecycle"
          git push
