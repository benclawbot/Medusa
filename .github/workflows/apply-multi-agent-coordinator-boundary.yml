name: Apply multi-agent coordinator boundary

on:
  push:
    branches:
      - agent/multi-agent-coordinator-boundary
    paths:
      - .github/patches/multi-agent-coordinator-boundary.patch
      - .github/workflows/apply-multi-agent-coordinator-boundary.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/multi-agent-coordinator-boundary
          fetch-depth: 0
      - name: Apply prepared patch
        run: |
          git apply --check .github/patches/multi-agent-coordinator-boundary.patch
          git apply .github/patches/multi-agent-coordinator-boundary.patch
          rm .github/patches/multi-agent-coordinator-boundary.patch
          rm .github/workflows/apply-multi-agent-coordinator-boundary.yml
      - name: Format
        run: cargo fmt --all
      - name: Check workspace
        run: cargo check --workspace --all-features
      - name: Lint affected crates
        run: cargo clippy -p medusa-agent -p medusa-multi-agent-scheduler --all-targets --all-features -- -D warnings
      - name: Test affected crates
        run: cargo test -p medusa-agent -p medusa-multi-agent-scheduler --all-features
      - name: Commit validated changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Wire role-bound team coordination"
          git push origin HEAD:agent/multi-agent-coordinator-boundary
