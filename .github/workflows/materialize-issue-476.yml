name: Materialize issue 476

on:
  push:
    branches:
      - agent/issue-476-desktop-image-ux
    paths:
      - tools/issue-476-desktop-image-ux.patch
      - .github/workflows/materialize-issue-476.yml

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-476-desktop-image-ux
          fetch-depth: 0
      - name: Apply focused desktop patch
        shell: bash
        run: |
          set -euo pipefail
          patch --batch --forward -p4 < tools/issue-476-desktop-image-ux.patch
          rm tools/issue-476-desktop-image-ux.patch
          rm .github/workflows/materialize-issue-476.yml
      - name: Commit materialized source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/medusa-desktop/src/App.tsx \
            apps/medusa-desktop/src/medusa-desktop.css \
            apps/medusa-desktop/src/runtime.ts \
            tools/issue-476-desktop-image-ux.patch \
            .github/workflows/materialize-issue-476.yml
          git commit -m "Desktop: add first-class screenshot attachment UX"
          git push origin HEAD:agent/issue-476-desktop-image-ux
