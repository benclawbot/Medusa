name: Apply source formatting fix

on:
  push:
    branches:
      - feat/persistent-permission-modes

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/persistent-permission-modes
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0
        with:
          toolchain: 1.88.0
          components: rustfmt
      - name: Format updater source
        run: cargo fmt --all
      - name: Commit formatting
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/medusa-update/src/source.rs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style: format updater path test"
          git push origin HEAD:feat/persistent-permission-modes
