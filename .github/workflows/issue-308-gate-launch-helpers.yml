name: Issue 308 Gate Launch Helpers

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/issue-308-fail-closed-windows-sandbox'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-308-fail-closed-windows-sandbox
      - name: Gate process launch support to sandbox backends
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('crates/medusa-agent/src/policy.rs')
          text = path.read_text()
          old = '''use std::{
              fs,
              path::{Component, Path, PathBuf},
              process::{Command, Output, Stdio},
              thread,
              time::{Duration, Instant},
          };
          '''.replace('              ', '    ')
          new = '''use std::{
              fs,
              path::{Component, Path, PathBuf},
              process::Output,
          };

          #[cfg(any(target_os = "linux", target_os = "macos"))]
          use std::{
              process::{Command, Stdio},
              thread,
              time::{Duration, Instant},
          };
          '''.replace('              ', '    ')
          if old not in text:
              raise SystemExit('import anchor missing')
          text = text.replace(old, new, 1)
          text = text.replace(
              'const SHELL_COMMAND_TIMEOUT: Duration = Duration::from_secs(120);\n',
              '#[cfg(any(target_os = "linux", target_os = "macos"))]\nconst SHELL_COMMAND_TIMEOUT: Duration = Duration::from_secs(120);\n',
              1,
          )
          text = text.replace(
              'fn output_with_timeout(command: &mut Command, description: &str) -> MedusaResult<Output> {\n',
              '#[cfg(any(target_os = "linux", target_os = "macos"))]\nfn output_with_timeout(command: &mut Command, description: &str) -> MedusaResult<Output> {\n',
              1,
          )
          path.write_text(text)
          PY
          cargo fmt --all
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test -p medusa-core
          cargo test -p medusa-agent policy::tests
      - name: Commit correction and remove workflow
        run: |
          rm .github/workflows/issue-308-gate-launch-helpers.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Gate sandbox launch helpers by platform"
          git push origin HEAD:agent/issue-308-fail-closed-windows-sandbox
