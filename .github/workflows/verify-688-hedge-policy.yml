name: Verify 688 Hedge Policy

on:
  push:
    branches: [perf/688-bounded-hedging]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0
        with:
          components: rustfmt,clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Strict Clippy
        run: cargo clippy -p medusa-provider --all-targets --all-features -- -D warnings
      - name: Provider tests
        run: cargo test -p medusa-provider -- --nocapture
