name: Materialize durable continuity commands

on:
  pull_request:
    branches:
      - main
    paths:
      - validation/materialize_569_continuity_commands.py
      - .github/workflows/materialize-569-continuity-commands.yml

permissions:
  contents: write

concurrency:
  group: materialize-569-continuity-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/569-continuity-commands'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0 # stable
      - name: Materialize reviewed continuity commands
        run: python3 validation/materialize_569_continuity_commands.py
      - name: Format and validate continuity commands
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test -p medusa-session-continuity
          cargo test -p medusa-runtime attachment
          cargo clippy -p medusa-session-continuity -p medusa-runtime --all-targets --all-features -- -D warnings
      - name: Commit source-only result
        run: |
          git rm .github/workflows/materialize-569-continuity-commands.yml
          git rm validation/materialize_569_continuity_commands.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/medusa-session-continuity/src/root.rs
          git add crates/medusa-runtime/src/attachment/session.rs
          git commit -m "Add durable continuity client commands"
          git push origin HEAD:${{ github.head_ref }}
