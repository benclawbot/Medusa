name: Fix phase 1 visibility

on:
  push:
    branches: [agent/full-system-audit-readme]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/full-system-audit-readme
      - name: Make helper visible to crate tests
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/medusa-agent/src/engine.rs')
          text = path.read_text()
          old = 'fn parallel_tool_limit(configured_workers: u16) -> usize {'
          new = 'pub(crate) fn parallel_tool_limit(configured_workers: u16) -> usize {'
          if old not in text:
              raise SystemExit('parallel_tool_limit signature not found')
          path.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/fix-phase1-visibility.yml
      - name: Commit correction
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/medusa-agent/src/engine.rs .github/workflows/fix-phase1-visibility.yml
          git commit -m "Expose parallel limit to crate tests"
          git push origin HEAD:agent/full-system-audit-readme
