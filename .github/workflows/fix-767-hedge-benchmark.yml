name: Fix PR 767 hedge benchmark
on: push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: perf/688-hedge-p95-acceptance
          fetch-depth: 0
      - run: python3 scripts/fix_767_hedge_benchmark.py
      - run: |
          rustup component add rustfmt
          cargo fmt --all
          git diff --check
          git config user.name benclawbot
          git config user.email 259942410+benclawbot@users.noreply.github.com
          git add crates/medusa-provider/src/hedge_runtime.rs
          git diff --cached --quiet && exit 1
          git commit -m 'test: enforce measured hedge p95 improvement [patch-767]'
          git push origin HEAD:perf/688-hedge-p95-acceptance
