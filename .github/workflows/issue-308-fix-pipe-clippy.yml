name: Issue 308 Fix Pipe Clippy

on:
  push:
    branches:
      - agent/issue-308-native-windows-appcontainer

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-308-native-windows-appcontainer
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Apply complete current diagnostic fix
        shell: python
        run: |
          from pathlib import Path
          path = Path('crates/medusa-process-containment/src/appcontainer.rs')
          text = path.read_text()
          old = 'CreatePipe(&mut read, &mut write, &mut attributes, 0)'
          new = 'CreatePipe(&mut read, &mut write, &attributes, 0)'
          if old not in text:
              raise SystemExit('CreatePipe diagnostic anchor missing')
          path.write_text(text.replace(old, new, 1))
      - name: Normalize
        run: |
          cargo check -p medusa-agent --all-targets
          cargo fmt --all
      - name: Commit correction
        run: |
          rm .github/workflows/issue-308-fix-pipe-clippy.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/medusa-process-containment/src/appcontainer.rs .github/workflows/issue-308-fix-pipe-clippy.yml
          git commit -m "Fix Windows pipe security attribute lint"
          git push origin HEAD:agent/issue-308-native-windows-appcontainer
