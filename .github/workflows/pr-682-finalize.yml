name: PR 682 Finalize

on:
  push:
    branches:
      - agent/654-dedicated-parent-reviewer
    paths:
      - scripts/pr-682-finalize.py
      - .github/workflows/pr-682-finalize.yml

permissions:
  contents: write

concurrency:
  group: pr-682-finalize
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/654-dedicated-parent-reviewer
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0
        with:
          components: clippy,rustfmt
      - name: Apply, validate, commit, and self-clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 scripts/pr-682-finalize.py
