name: Temporary Desktop Lock Refresh

on:
  pull_request:
    paths:
      - '.github/workflows/temporary-desktop-lock-refresh.yml'
      - 'apps/medusa-desktop/src-tauri/Cargo.lock'
      - 'apps/medusa-desktop/src-tauri/Cargo.toml'
      - 'crates/**/Cargo.toml'

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.head_ref }}
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0
      - name: Refresh Desktop dependency resolution in the ephemeral runner
        run: cargo metadata --manifest-path apps/medusa-desktop/src-tauri/Cargo.toml --format-version 1 >/dev/null
      - name: Prove the refreshed lock is authoritative
        run: cargo metadata --manifest-path apps/medusa-desktop/src-tauri/Cargo.toml --locked --format-version 1 >/dev/null
      - name: Commit refreshed Desktop lock when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- apps/medusa-desktop/src-tauri/Cargo.lock; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/medusa-desktop/src-tauri/Cargo.lock
          git commit -m 'Refresh Desktop Cargo.lock'
          git push origin "HEAD:${{ github.head_ref }}"
