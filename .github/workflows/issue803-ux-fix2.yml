name: issue803-ux-fix2

on:
  push:
    branches:
      - agent/issue-803-staged-config
    paths:
      - .github/workflows/issue803-ux-fix2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0
      - name: Apply staged UX and renderer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/issue803-ux.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(source) if line.strip() == 'run: |') + 1
          block = []
          for line in source[start:]:
              if line.startswith('          '):
                  block.append(line[10:])
              elif not line.strip():
                  block.append('')
              else:
                  break
          script = '\n'.join(block) + '\n'
          script = script.replace('cargo fmt --all', 'python /tmp/patch_render.py\ncargo fmt --all', 1)
          script = script.replace(
              'rm .github/workflows/issue803-ux.yml',
              'rm .github/workflows/issue803-ux.yml .github/workflows/issue803-ux-fix.yml .github/workflows/issue803-ux-fix2.yml',
              1,
          )
          Path('/tmp/issue803-ux.sh').write_text(script)
          PY
          cat >/tmp/patch_render.py <<'PY'
          from pathlib import Path
          p = Path('crates/medusa-tui/src/render.rs')
          text = p.read_text()
          old = '''        app::SettingsPage::BaseUrl => "Base URL",
        app::SettingsPage::Status => "Status",
    };
'''
          new = '''        app::SettingsPage::BaseUrl => "Base URL",
        app::SettingsPage::Status => "Status",
        app::SettingsPage::Review => "Review changes",
    };
'''
          if old not in text:
              raise SystemExit('missing settings page-name match')
          text = text.replace(old, new, 1)
          marker = '''    if page == app::SettingsPage::BaseUrl {
'''
          review = '''    if page == app::SettingsPage::Review {
        let review = modal.settings_review_lines();
        if review.is_empty() {
            lines.push(StyledLine::new("No staged changes.", Color::Grey));
        } else {
            lines.push(StyledLine::new("Pending non-secret changes:", Color::White));
            for change in review {
                lines.push(StyledLine::new(format!("  {change}"), Color::Grey));
            }
            lines.push(StyledLine::new(
                "Enter applies all staged changes atomically · Esc returns without applying.",
                Color::DarkGrey,
            ));
        }
        return lines;
    }
'''
          if marker not in text:
              raise SystemExit('missing base-url renderer marker')
          p.write_text(text.replace(marker, review + marker, 1))
          PY
          bash /tmp/issue803-ux.sh
