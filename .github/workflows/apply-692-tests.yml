name: Apply 692 durability tests

on:
  push:
    branches:
      - agent/issue-692-journal-runtime-performance
    paths:
      - .github/workflows/apply-692-tests.yml
      - .github/scripts/apply-692-tests.py

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-692-journal-runtime-performance
          fetch-depth: 0
      - name: Apply durability tests
        run: python .github/scripts/apply-692-tests.py
      - name: Verify journal tests
        run: |
          cargo fmt --all
          cargo test -p medusa-agent journal::tests
      - name: Commit tested tranche
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/medusa-agent/src/journal.rs
          git diff --cached --check
          git commit -m 'test: certify batched journal durability and lock isolation'
          git push origin HEAD:agent/issue-692-journal-runtime-performance

# rerun after benchmark evidence commit
