              ('            submission: Arc::new(Mutex::new(SubmissionState::default())),\n        }\n    }\n\n    pub fn submit', '            submission: Arc::new(Mutex::new(SubmissionState::default())),\n            event_sender: event_tx,\n            team_control: TeamControlPlane::default(),\n        }\n    }\n\n    pub fn submit'),
              ('    pub fn run_command(&self, command: SlashCommand) -> Result<(), RuntimeError> {\n        let mut submission = lock_submission(&self.submission);', '''    pub fn run_command(&self, command: SlashCommand) -> Result<(), RuntimeError> {
        if let SlashCommand::Team(command) = &command {
            let snapshot = match command {
                crate::commands::TeamCommand::Show => self.team_control.snapshot(),
                crate::commands::TeamCommand::Steer { worker_id, instruction } => self
                    .team_control
                    .steer(worker_id, instruction)
                    .map_err(RuntimeError::agent)?,
                crate::commands::TeamCommand::StopWorker { worker_id } => self
                    .team_control
                    .stop_worker(worker_id)
                    .map_err(RuntimeError::agent)?,
                crate::commands::TeamCommand::StopTeam => self
                    .team_control
                    .stop_team()
                    .map_err(RuntimeError::agent)?,
            };
            let _ = self.event_sender.send(RuntimeEvent::Team(snapshot));
            return Ok(());
        }
        let mut submission = lock_submission(&self.submission);'''),
