name: Apply team observability and steering

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/team-observability-steering'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/team-observability-steering
          fetch-depth: 0
      - name: Apply source changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def edit(path, edits):
              p = Path(path)
              s = p.read_text()
              for old, new in edits:
                  count = s.count(old)
                  if count != 1:
                      raise SystemExit(f"{path}: expected one anchor, found {count}: {old[:100]!r}")
                  s = s.replace(old, new, 1)
              p.write_text(s)

