name: Temporary issue 860 replay digest migration

on:
  push:
    branches: [codex/issue-860-replay-digest-panic-safety]

permissions:
  contents: write

concurrency:
  group: fix-860-replay-digest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0
        with:
          components: rustfmt,clippy
      - name: Apply infallible canonical replay digest contract
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          git checkout FETCH_HEAD -- crates/medusa-improvement/src/correction_loop.rs
          python3 scripts/fix-860-replay-digest.py
          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check
      - name: Validate production panic contract
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test-production-panic-exemptions.py
          python3 scripts/check-production-panic-exemptions.py
          cargo clippy -p medusa-improvement --all-features --locked --lib -- \
            -D clippy::unwrap_used \
            -D clippy::expect_used \
            -D clippy::panic
      - name: Validate replay tests
        shell: bash
        run: cargo test -p medusa-improvement --locked regression_replay
      - name: Validate unchanged public build contract
        shell: bash
        run: cargo check -p medusa-improvement --lib --locked
      - name: Commit source migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/medusa-improvement/src/lib.rs \
                  crates/medusa-improvement/src/regression_replay.rs \
                  crates/medusa-improvement/src/correction_loop.rs
          git commit -m 'fix: make replay digest hashing infallible'
          git push
