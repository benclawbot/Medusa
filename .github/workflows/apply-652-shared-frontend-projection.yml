name: Apply phase 6 frontend projection

on:
  push:
    branches:
      - agent/652-shared-frontend-projection

permissions:
  contents: write

concurrency:
  group: apply-652-shared-frontend-projection
  cancel-in-progress: true

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out migration branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/652-shared-frontend-projection
          fetch-depth: 0

      - name: Install repository Rust toolchain
        uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0
        with:
          components: rustfmt, clippy

      - name: Apply canonical frontend projection migration
        run: python .github/scripts/apply_652_projection.py

      - name: Format changed Rust sources
        run: cargo fmt --all

      - name: Validate focused crates
        run: |
          cargo test -p medusa-protocol --all-targets --locked
          cargo test -p medusa-runtime --all-targets --locked
          cargo test -p medusa-cli --all-targets --locked
          cargo test -p medusa-daemon --all-targets --locked

      - name: Lint focused crates
        run: cargo clippy -p medusa-protocol -p medusa-runtime -p medusa-cli -p medusa-daemon --all-targets --locked -- -D warnings

      - name: Validate architecture governance
        run: |
          python scripts/check-architecture-index.py
          python scripts/architecture-policy.py check --root . --policy .github/architecture-policy.json --report /tmp/architecture-policy-report.md
          git diff --check

      - name: Commit validated migration slice
        run: |
          rm .github/scripts/apply_652_projection.py
          rm .github/workflows/apply-652-shared-frontend-projection.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Migrate headless frontend to canonical event projection"
          git push origin HEAD:agent/652-shared-frontend-projection
