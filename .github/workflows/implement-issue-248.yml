name: Implement issue 248

on:
  push:
    branches:
      - agent/tui-expandable-activity-details-v2

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tui-expandable-activity-details-v2
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt
      - name: Apply coordinated TUI detail toggle
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('.')

          runtime = root / 'crates/medusa-tui/src/runtime.rs'
          text = runtime.read_text()
          text = text.replace('const MAX_PRESENTED_ACTIVITY_DETAILS: usize = 6;\n\n', '')
          text = text.replace(
              '    compact_activity_details(&mut activity.details);\n',
              '    activity.details.retain(|detail| !detail.trim().is_empty());\n',
          )
          text = re.sub(
              r'\nfn compact_activity_details\(details: &mut Vec<String>\) \{.*?\n\}\n',
              '\n',
              text,
              flags=re.S,
          )
          text = text.replace(
              '    fn verbose_activity_details_are_compacted() {',
              '    fn verbose_activity_details_are_retained() {',
          )
          text = text.replace(
              '        assert_eq!(activity.details.len(), MAX_PRESENTED_ACTIVITY_DETAILS);\n'
              '        assert_eq!(activity.details[4], "line 5");\n'
              '        assert_eq!(activity.details[5], "… 5 more lines");',
              '        assert_eq!(activity.details.len(), 10);\n'
              '        assert_eq!(activity.details[4], "line 5");\n'
              '        assert_eq!(activity.details[9], "line 10");',
          )
          runtime.write_text(text)

          app = root / 'crates/medusa-tui/src/app.rs'
          text = app.read_text()
          text = text.replace(
              '    pub task_list_visible: bool,\n',
              '    pub task_list_visible: bool,\n    pub activity_details_expanded: bool,\n',
              1,
          )
          text = text.replace(
              '            task_list_visible: true,\n',
              '            task_list_visible: true,\n            activity_details_expanded: false,\n',
              1,
          )
          toggle_anchor = '''            if key.code == KeyCode::Char('t') && key.modifiers.contains(KeyModifiers::CONTROL) {
                self.task_list_visible = !self.task_list_visible;
                return Ok(AppAction::Redraw);
            }
'''
          toggle_replacement = toggle_anchor + '''            if key.code == KeyCode::Char('e') && key.modifiers.contains(KeyModifiers::CONTROL) {
                self.activity_details_expanded = !self.activity_details_expanded;
                return Ok(AppAction::Redraw);
            }
'''
          if toggle_anchor not in text:
              raise SystemExit('Ctrl+T anchor not found')
          text = text.replace(toggle_anchor, toggle_replacement, 1)
          text = text.replace(
              '        self.task_list_visible = true;\n        self.question_modal = None;\n',
              '        self.task_list_visible = true;\n        self.activity_details_expanded = false;\n        self.question_modal = None;\n',
              1,
          )
          app.write_text(text)

          support = root / 'crates/medusa-tui/src/render/support.rs'
          text = support.read_text()
          text = text.replace(
              '            TranscriptEntry::Activity(activity) => lines.extend(activity_lines(activity)),',
              '            TranscriptEntry::Activity(activity) => {\n                lines.extend(activity_lines(activity, app.activity_details_expanded));\n            }',
          )
          text = text.replace(
              'pub(crate) fn activity_lines(activity: &TranscriptActivity) -> Vec<StyledLine> {',
              'pub(crate) fn activity_lines(\n    activity: &TranscriptActivity,\n    expanded: bool,\n) -> Vec<StyledLine> {',
              1,
          )
          text = text.replace(
              '''        lines.extend(
            activity
                .details
                .iter()
                .map(|detail| StyledLine::new(format!("  └ {detail}"), Color::DarkGrey)),
        );''',
              '''        lines.extend(
            presented_activity_details(&activity.details, expanded)
                .into_iter()
                .map(|detail| StyledLine::new(format!("  └ {detail}"), Color::DarkGrey)),
        );''',
              1,
          )
          helper = '''
const MAX_PRESENTED_ACTIVITY_DETAILS: usize = 6;

fn presented_activity_details(details: &[String], expanded: bool) -> Vec<String> {
    let mut rows = details
        .iter()
        .filter(|detail| !detail.trim().is_empty())
        .cloned()
        .collect::<Vec<_>>();
    if expanded || rows.len() <= MAX_PRESENTED_ACTIVITY_DETAILS {
        return rows;
    }

    let omitted = rows.len() - (MAX_PRESENTED_ACTIVITY_DETAILS - 1);
    rows.truncate(MAX_PRESENTED_ACTIVITY_DETAILS - 1);
    rows.push(format!("… {omitted} more lines"));
    rows
}

'''
          anchor = 'pub(crate) fn activity_lines('
          if anchor not in text:
              raise SystemExit('activity_lines anchor not found')
          text = text.replace(anchor, helper + anchor, 1)
          tests = '''
#[cfg(test)]
mod activity_detail_tests {
    use super::presented_activity_details;

    #[test]
    fn compact_activity_details_show_five_rows_and_omitted_count() {
        let details = (1..=10).map(|line| format!("line {line}")).collect::<Vec<_>>();
        let rows = presented_activity_details(&details, false);
        assert_eq!(rows.len(), 6);
        assert_eq!(rows[4], "line 5");
        assert_eq!(rows[5], "… 5 more lines");
    }

    #[test]
    fn expanded_activity_details_show_every_non_blank_row() {
        let details = vec!["line 1".to_owned(), "  ".to_owned(), "line 2".to_owned()];
        assert_eq!(
            presented_activity_details(&details, true),
            vec!["line 1".to_owned(), "line 2".to_owned()]
        );
    }
}
'''
          if 'mod activity_detail_tests' not in text:
              text += tests
          support.write_text(text)

          app_tests = root / 'crates/medusa-tui/src/app/tests.rs'
          text = app_tests.read_text()
          tests = '''

#[test]
fn ctrl_e_toggles_activity_detail_expansion_and_new_session_resets_it() {
    let repository = tempdir().expect("temporary repository");
    let mut app = AppState::new(
        repository.path().to_path_buf(),
        "details-toggle",
        "",
        Arc::new(FakeClipboard(ClipboardContent::Empty)),
    )
    .expect("create app");

    assert!(!app.activity_details_expanded);
    assert_eq!(
        app.handle_event(Event::Key(KeyEvent::new(
            KeyCode::Char('e'),
            KeyModifiers::CONTROL,
        )))
        .expect("toggle details"),
        AppAction::Redraw
    );
    assert!(app.activity_details_expanded);

    app.clear_for_new_session();
    assert!(!app.activity_details_expanded);
}
'''
          if 'ctrl_e_toggles_activity_detail_expansion' not in text:
              text += tests
          app_tests.write_text(text)

          for path in (root / 'crates/medusa-tui/src').rglob('*.rs'):
              text = path.read_text()
              if 'ctrl+t' not in text or 'ctrl+e details' in text:
                  continue
              updated = text.replace('ctrl+t tasks', 'ctrl+t tasks · ctrl+e details')
              if updated != text:
                  path.write_text(updated)

          workflow = root / '.github/workflows/implement-issue-248.yml'
          workflow.unlink()
      - name: Format
        run: cargo fmt --all
      - name: Test focused TUI crate
        run: cargo test -p medusa-tui
      - name: Commit implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat(tui): toggle expanded activity details"
          git push origin HEAD:agent/tui-expandable-activity-details-v2
