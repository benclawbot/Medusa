name: Start anywhere validation

on:
  pull_request:
    paths:
      - "validation/start-anywhere.patch"
      - ".github/workflows/start-anywhere-validation.yml"
      - "crates/medusa-runtime/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Apply patch and test runtime
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Apply uploaded-source patch
        shell: bash
        run: git apply --check validation/start-anywhere.patch && git apply validation/start-anywhere.patch
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --all --check
      - name: Runtime tests
        run: cargo test -p medusa-runtime
      - name: Runtime clippy
        run: cargo clippy -p medusa-runtime --all-targets -- -D warnings
