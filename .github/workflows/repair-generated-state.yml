name: Repair generated state

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/main-build-regressions-20260904'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust
      - name: Apply deterministic repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          cargo = Path('Cargo.toml')
          text = cargo.read_text()
          text = text.replace('    "crates/medusa-goal",\n', '')
          cargo.write_text(text)

          tui_cargo = Path('crates/medusa-tui/Cargo.toml')
          text = tui_cargo.read_text()
          text = text.replace('\n[lib]\npath = "src/lib_root.rs"\n', '')
          tui_cargo.write_text(text)

          tui_lib = Path('crates/medusa-tui/src/lib.rs')
          text = tui_lib.read_text()
          if 'pub mod setup;' not in text:
              marker = 'pub mod runtime;\n'
              if marker not in text:
                  raise SystemExit('TUI module marker not found')
              text = text.replace(marker, marker + 'pub mod setup;\n', 1)
              tui_lib.write_text(text)
          PY
          rm -f crates/medusa-tui/src/lib_root.rs
          rm -rf crates/medusa-goal

          # Refresh both Cargo authorities after the manifest changes.
          cargo metadata --format-version 1 >/dev/null
          cargo metadata --manifest-path apps/medusa-desktop/src-tauri/Cargo.toml --format-version 1 >/dev/null
          cargo fmt --all

          # This workflow is intentionally self-deleting; normal CI validates the pushed repair.
          rm -f .github/workflows/repair-generated-state.yml

      - name: Commit generated repair
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: repair simplification regressions and generated state'
          git push origin "HEAD:${HEAD_BRANCH}"
