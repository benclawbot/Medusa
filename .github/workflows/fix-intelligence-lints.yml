name: Fix intelligence lints and lock

on:
  push:
    branches:
      - agent/restore-rustfmt-baseline

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt
      - name: Apply focused lint fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          module_graph = Path('crates/medusa-intelligence/src/module_graph.rs')
          text = module_graph.read_text().replace(
              "            (!root.is_empty())\n                .then(|| vec![root.to_owned()])\n                .unwrap_or_default()",
              "            if root.is_empty() {\n                Vec::new()\n            } else {\n                vec![root.to_owned()]\n            }",
          )
          module_graph.write_text(text)

          symbols = Path('crates/medusa-intelligence/src/symbol_table.rs')
          text = symbols.read_text()
          text = text.replace(
              'use std::{collections::BTreeMap, path::PathBuf};',
              'use std::{\n    collections::BTreeMap,\n    path::{Path, PathBuf},\n};',
          )
          text = text.replace(
              "fn ancestors<'a>(\n    document: &'a RustAstDocument,\n    node_id: usize,\n) -> impl Iterator<Item = &'a RustAstNode>",
              "fn ancestors(\n    document: &RustAstDocument,\n    node_id: usize,\n) -> impl Iterator<Item = &RustAstNode>",
          )
          text = text.replace(
              'fn stable_id(path: &PathBuf, kind: RustSymbolKind, qualified_name: &str) -> RustSymbolId',
              'fn stable_id(path: &Path, kind: RustSymbolKind, qualified_name: &str) -> RustSymbolId',
          )
          symbols.write_text(text)
          PY
          cargo fmt --all
          cargo check --workspace --all-features
      - name: Commit lint fixes and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/medusa-intelligence Cargo.lock
          git commit -m "fix: satisfy intelligence lints and refresh lockfile"
          git push
