name: Browser Dispatch Hardening Certification

on:
  pull_request:
    paths:
      - "browser/**"
      - "crates/medusa-agent/**"
      - "crates/medusa-browser-client/**"
      - "crates/medusa-browserd/**"
      - ".github/workflows/browser-dispatch-hardening-certification.yml"
  push:
    branches: [main]
    paths:
      - "browser/**"
      - "crates/medusa-agent/**"
      - "crates/medusa-browser-client/**"
      - "crates/medusa-browserd/**"
      - ".github/workflows/browser-dispatch-hardening-certification.yml"

permissions:
  contents: read

jobs:
  browser-dispatch-hardening:
    name: Browser hardening (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0
        with:
          toolchain: 1.88.0
      - name: Refresh merged dependency lock
        run: cargo generate-lockfile
      - name: Build browser sidecar
        run: cargo build -p medusa-browserd --bin medusa-browserd --locked
      - name: Resolve browser sidecar path
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            echo "BROWSERD_PATH=$GITHUB_WORKSPACE/target/debug/medusa-browserd.exe" >> "$GITHUB_ENV"
          else
            echo "BROWSERD_PATH=$GITHUB_WORKSPACE/target/debug/medusa-browserd" >> "$GITHUB_ENV"
          fi
      - name: Prove deadlines, reset, framing, and correlation
        run: cargo test -p medusa-agent --test browser_dispatch_hardening --locked
