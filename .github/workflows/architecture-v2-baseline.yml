name: Architecture v2 Baseline

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: architecture-v2-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.draft == false &&
        contains(github.event.pull_request.labels.*.name, 'final-issue-validation')
      )
    name: Baseline (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0 # 1.88.0
      - name: Test architecture drift guard
        run: python scripts/test-architecture-index.py
      - name: Validate living architecture index
        run: python scripts/check-architecture-index.py
      - name: Test browser status drift guard
        run: python scripts/test-browser-status.py
      - name: Validate browser status authorities
        run: python scripts/check-browser-status.py
      - name: Validate transactional mutation ordering
        run: python scripts/check-mutation-lifecycle.py
      - name: Validate evidence and verification authority
        run: python scripts/check-evidence-authority.py
      - name: Build real production CLI entrypoint
        run: cargo build --bin medusa
      - name: Run production entrypoint and known-failure conformance
        shell: bash
        run: |
          set -euo pipefail
          binary=target/debug/medusa
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            binary=target/debug/medusa.exe
          fi
          python scripts/architecture-conformance.py --all --binary "$binary" --json
