name: Materialize durable session attachments

on:
  push:
    branches:
      - agent/durable-session-attachments
    paths:
      - .github/workflows/materialize-durable-session-attachments.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/durable-session-attachments
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0
        with:
          toolchain: 1.85.0
          components: rustfmt,clippy
      - name: Write and validate implementation
        shell: bash
        run: |
          set -euo pipefail
          decode() { echo "$2" | base64 -d | gzip -d > "$1"; }
          decode /tmp/continuity.diff ''
          decode /tmp/runtime.diff ''
          patch --batch --forward -p0 < /tmp/continuity.diff
          patch --batch --forward -p0 < /tmp/runtime.diff
          mkdir -p crates/medusa-runtime/src docs/architecture
          decode crates/medusa-runtime/src/session_broker.rs ''
          decode docs/architecture/durable-session-attachments.md ''
          cargo fmt --all
          cargo test -p medusa-session-continuity -p medusa-runtime --lib
          rm .github/workflows/materialize-durable-session-attachments.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/medusa-session-continuity/src/root.rs crates/medusa-runtime/src/lib.rs crates/medusa-runtime/src/session_broker.rs docs/architecture/durable-session-attachments.md .github/workflows/materialize-durable-session-attachments.yml
          git commit -m "Wire durable session attachments and replay"
          git push origin HEAD:agent/durable-session-attachments
