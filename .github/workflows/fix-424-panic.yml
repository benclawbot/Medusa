name: Fix 424 panic audit

on:
  push:
    branches:
      - agent/424-session-continuity
    paths:
      - .github/workflows/fix-424-panic.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/424-session-continuity
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt
      - name: Apply fail-closed migration default
        shell: python
        run: |
          from pathlib import Path
          path = Path("crates/medusa-session-continuity/src/root.rs")
          source = path.read_text()
          old = '''            object.entry("task").or_insert_with(|| {
              serde_json::to_value(AuthoritativeTaskState::default()).expect("serializable")
          });'''
          new = '''            object.entry("task").or_insert_with(|| {
              serde_json::json!({
                  "plan_state": null,
                  "active_step": null,
                  "attention_required": false,
                  "approvals": [],
                  "checkpoints": [],
                  "recovery_state": null,
                  "verification_evidence": [],
                  "file_changes": [],
                  "completion_status": null
              })
          });'''
          if old not in source:
              raise SystemExit("expected migration default was not found")
          path.write_text(source.replace(old, new))
      - name: Format and verify
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check
      - name: Commit source fix and remove bootstrap
        run: |
          rm .github/workflows/fix-424-panic.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/medusa-session-continuity/src/root.rs .github/workflows/fix-424-panic.yml
          git commit -m "Remove continuity migration panic path"
          git push origin HEAD:agent/424-session-continuity
