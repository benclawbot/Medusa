name: Repair solution selection Clippy

on:
  push:
    branches:
      - agent/issue-505-solution-selection

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-505-solution-selection
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - name: Collapse policy condition
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/medusa-improvement/src/solution_selection.rs')
          s = p.read_text()
          old = '''    if contains_any(&text, &["safety", "permission", "must never", "invariant"]) {
        if solution_type == SolutionType::HarnessPolicy {
            value += 100;
            reasons.push("the lesson requires an enforceable invariant".to_owned());
        }
    }
'''
          new = '''    if contains_any(&text, &["safety", "permission", "must never", "invariant"])
        && solution_type == SolutionType::HarnessPolicy
    {
        value += 100;
        reasons.push("the lesson requires an enforceable invariant".to_owned());
    }
'''
          if old not in s:
              raise SystemExit('policy condition not found')
          p.write_text(s.replace(old, new))
          PY
      - name: Validate fix
        run: |
          cargo fmt --all --check
          cargo clippy -p medusa-improvement --all-targets --all-features -- -D warnings
          cargo test -p medusa-improvement solution_selection::tests --lib
      - name: Commit repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/medusa-improvement/src/solution_selection.rs
          git diff --cached --quiet && exit 0
          git commit -m "fix: satisfy solution selection Clippy"
          git push origin HEAD:agent/issue-505-solution-selection
