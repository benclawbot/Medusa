name: Agent source export

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Collect patch targets
        run: |
          mkdir -p source-export/crates/medusa-runtime/src
          mkdir -p source-export/crates/medusa-multi-agent-scheduler/src
          cp crates/medusa-runtime/src/lib.rs source-export/crates/medusa-runtime/src/
          cp crates/medusa-runtime/src/production_orchestrator.rs source-export/crates/medusa-runtime/src/
          cp crates/medusa-runtime/src/multi_agent_coordinator.rs source-export/crates/medusa-runtime/src/
          cp crates/medusa-runtime/src/mutating_worker_coordinator.rs source-export/crates/medusa-runtime/src/
          cp crates/medusa-runtime/src/mutating_worker_coordinator_support.rs source-export/crates/medusa-runtime/src/
          cp crates/medusa-runtime/src/mutating_worker_coordinator_tests.rs source-export/crates/medusa-runtime/src/
          cp crates/medusa-runtime/src/mutation_transaction.rs source-export/crates/medusa-runtime/src/
          cp crates/medusa-runtime/src/mutation_transaction_state.rs source-export/crates/medusa-runtime/src/
          cp crates/medusa-runtime/src/lib_wrapper.rs source-export/crates/medusa-runtime/src/
          cp crates/medusa-runtime/Cargo.toml source-export/crates/medusa-runtime/
          cp crates/medusa-multi-agent-scheduler/src/lib.rs source-export/crates/medusa-multi-agent-scheduler/src/
          cp crates/medusa-multi-agent-scheduler/Cargo.toml source-export/crates/medusa-multi-agent-scheduler/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-690-source-export
          path: source-export
          if-no-files-found: error
