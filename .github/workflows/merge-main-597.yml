name: Merge main into Telegram supervision

on:
  pull_request:
    types: [synchronize]
    paths:
      - ".github/workflows/merge-main-597.yml"

permissions:
  contents: write

concurrency:
  group: merge-main-597-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  merge-main:
    if: github.head_ref == 'agent/568-supervised-telegram-runtime'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/568-supervised-telegram-runtime
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Merge current main without retaining bootstrap
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          git merge --no-commit --no-ff origin/main
          git rm .github/workflows/merge-main-597.yml
          git commit -m "Merge main into Telegram supervision"
          git push origin HEAD:agent/568-supervised-telegram-runtime
