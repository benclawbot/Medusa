name: Apply issue 690 final rustfmt

on:
  pull_request:
    branches: [main]
    paths:
      - 'crates/medusa-multi-agent-scheduler/**'
      - '.github/workflows/issue-690-final-fmt.yml'

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'perf/690-bounded-speculative-implementation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0
      - name: Apply repository rustfmt
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/medusa-multi-agent-scheduler/src/lib.rs
          git diff --cached --quiet && exit 0
          git commit -m 'style: apply final rustfmt for issue 690'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
