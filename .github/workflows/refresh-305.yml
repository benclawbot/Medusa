name: Refresh issue 305 branch

on:
  pull_request:
    types: [reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  refresh:
    if: github.head_ref == 'issue-305-explicit-capabilities'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-305-explicit-capabilities
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt
      - name: Format, refresh lock, test, and remove workflow
        run: |
          cargo fmt --all
          cargo generate-lockfile
          cargo test -p medusa-capabilities
          rm .github/workflows/refresh-305.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/medusa-capabilities Cargo.lock .github/workflows/refresh-305.yml
          git commit -m "Format and validate explicit capabilities"
          git push origin HEAD:issue-305-explicit-capabilities
