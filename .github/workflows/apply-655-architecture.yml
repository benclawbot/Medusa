name: Apply 655 Architecture Baseline

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply architecture records
        run: python3 scripts/apply-655-architecture.py
      - name: Validate generated architecture records
        run: |
          python3 -m json.tool docs/architecture/baseline.json >/dev/null
          python3 scripts/check-architecture-index.py
      - name: Commit architecture records
        shell: bash
        run: |
          set -euo pipefail
          git rm scripts/apply-655-architecture.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/architecture/baseline.json docs/architecture/INDEX.md .github/CODEOWNERS
          git commit -m "Certify the verified prebuilt update architecture"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
