name: Run issue 248 implementation

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/run-issue-248.yml'
      - '.github/workflows/implement-issue-248.yml'
      - '.github/scripts/run_issue_248.py'

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tui-expandable-activity-details-v2
          fetch-depth: 1
      - name: Apply coordinated source transformation
        run: python .github/scripts/run_issue_248.py
      - name: Upload transformation traceback
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: issue248-traceback
          path: issue248-error.txt
          if-no-files-found: error
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt
      - name: Format
        run: cargo fmt --all
      - name: Test focused TUI crate
        run: cargo test -p medusa-tui
      - name: Commit implementation
        run: |
          rm -f .github/workflows/run-issue-248.yml .github/workflows/implement-issue-248.yml .github/scripts/run_issue_248.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat(tui): toggle expanded activity details"
          git push origin HEAD:agent/tui-expandable-activity-details-v2
