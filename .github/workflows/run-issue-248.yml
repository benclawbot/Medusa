name: Run issue 248 implementation

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/run-issue-248.yml'
      - '.github/workflows/implement-issue-248.yml'

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tui-expandable-activity-details-v2
          fetch-depth: 1
      - name: Extract and run implementation script
        shell: python
        run: |
          from pathlib import Path

          workflow = Path('.github/workflows/implement-issue-248.yml').read_text().splitlines()
          start = workflow.index('        run: |') + 1
          end = workflow.index('      - name: Format')
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in workflow[start:end]) + '\n'
          Path('/tmp/implement_issue_248.py').write_text(script)
          exec(compile(script, '/tmp/implement_issue_248.py', 'exec'))
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt
      - name: Format
        run: cargo fmt --all
      - name: Test focused TUI crate
        run: cargo test -p medusa-tui
      - name: Commit implementation
        run: |
          rm -f .github/workflows/run-issue-248.yml .github/workflows/implement-issue-248.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat(tui): toggle expanded activity details"
          git push origin HEAD:agent/tui-expandable-activity-details-v2
