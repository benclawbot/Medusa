name: Run issue 248 implementation

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/run-issue-248.yml'
      - '.github/scripts/implement_issue_248.py'

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tui-expandable-activity-details-v2
          fetch-depth: 1
      - name: Apply coordinated source transformation
        run: python .github/scripts/implement_issue_248.py
      - name: Update activity renderer test call
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('crates/medusa-tui/src/lib.rs')
          text = path.read_text()
          pattern = re.compile(
              r'(let lines = activity_lines\(&TranscriptActivity \{\s*'
              r'id: None,\s*'
              r'kind,\s*'
              r'title: "High-level step"\.to_owned\(\),\s*'
              r'details: vec!\["argument: private detail"\.to_owned\(\)\],\s*'
              r'\})(\);)'
          )
          updated, count = pattern.subn(r'\1, false\2', text, count=1)
          if count != 1:
              raise SystemExit('activity_lines test call anchor not found')
          path.write_text(updated)
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt
      - name: Format
        run: cargo fmt --all
      - name: Test focused TUI crate
        shell: bash
        run: |
          set -o pipefail
          cargo test -p medusa-tui 2>&1 | tee issue248-test.log
      - name: Upload focused test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: issue248-test-log
          path: issue248-test.log
      - name: Commit implementation
        run: |
          rm -f .github/workflows/run-issue-248.yml .github/workflows/implement-issue-248.yml .github/scripts/run_issue_248.py .github/scripts/implement_issue_248.py issue248-error.txt issue248-test.log
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat(tui): toggle expanded activity details"
          git push origin HEAD:agent/tui-expandable-activity-details-v2
