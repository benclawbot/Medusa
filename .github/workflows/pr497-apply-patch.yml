name: Apply PR 497 serializer fix

on:
  push:
    branches:
      - fix/openai-tool-result-message-sequencing

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/openai-tool-result-message-sequencing
          fetch-depth: 0
      - name: Apply serializer fix
        shell: python
        run: |
          from pathlib import Path

          path = Path('crates/medusa-provider/src/lib.rs')
          text = path.read_text()
          old = '''            let mut wire = json!({"role": role, "content": content});
            if !tool_calls.is_empty() {
                wire["tool_calls"] = Value::Array(tool_calls);
            }
            messages.push(wire);
'''
          new = '''            if !text.is_empty() || !content_parts.is_empty() || !tool_calls.is_empty() {
                let mut wire = json!({"role": role, "content": content});
                if !tool_calls.is_empty() {
                    wire["tool_calls"] = Value::Array(tool_calls);
                }
                messages.push(wire);
            }
'''
          if new in text:
              print('Serializer fix already present')
          elif old in text:
              path.write_text(text.replace(old, new, 1))
          else:
              raise SystemExit('Expected serializer block not found')
      - name: Commit patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/medusa-provider/src/lib.rs
          git diff --cached --check
          git commit -m "Fix OpenAI tool-result message sequencing"
          git push origin HEAD:fix/openai-tool-result-message-sequencing
