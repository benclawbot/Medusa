name: Apply issue 569 durable-event patch

on:
  push:
    branches:
      - agent/runtime-durable-controller-events
    paths:
      - .github/issue-569-durable-events.patch
      - .github/workflows/apply-issue-569-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply reviewed patch
        run: |
          set -euo pipefail
          git apply --check .github/issue-569-durable-events.patch
          git apply .github/issue-569-durable-events.patch
          rm .github/issue-569-durable-events.patch
          rm .github/workflows/apply-issue-569-patch.yml
      - name: Commit source changes
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Record durable controller events"
          git push origin HEAD:${GITHUB_REF_NAME}
