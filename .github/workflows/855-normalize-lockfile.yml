name: Issue 855 lockfile normalization

on:
  push:
    branches:
      - codex/855-remove-external-github
    paths:
      - .github/workflows/855-normalize-lockfile.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: codex/855-remove-external-github
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0 # 1.88.0
      - name: Normalize generated lockfile
        run: cargo metadata --format-version 1 >/dev/null
      - name: Commit generated lockfile only
        run: |
          set -euo pipefail
          git diff -- Cargo.lock
          git add Cargo.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Normalize Cargo.lock after removing external GitHub adapter"
          git push origin HEAD:codex/855-remove-external-github
