name: Fix 770 runtime repair phase
on: push
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[runtime-repair-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: perf/688-final-phase-budgets-main
          fetch-depth: 0
      - run: python3 scripts/fix_770_runtime_repair_phase.py
      - run: |
          rustup component add rustfmt
          cargo fmt --all
          git diff --check
          cargo test -p medusa-agent phase_budget_tests -- --nocapture
          cargo test -p medusa-runtime --lib -- --nocapture
          cargo clippy -p medusa-agent -p medusa-runtime --all-targets --all-features -- -D warnings
          git config user.name benclawbot
          git config user.email 259942410+benclawbot@users.noreply.github.com
          git add crates/medusa-agent/src/engine.rs crates/medusa-runtime/src/lib.rs
          git diff --cached --quiet && exit 1
          git commit -m 'fix: route production retries through repair phase [runtime-repair-patch]'
          git push origin HEAD:perf/688-final-phase-budgets-main
