name: Agent 466 direct fix

on:
  push:
    branches:
      - agent/466-mutation-provenance

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/466-mutation-provenance
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - name: Patch authoritative-only fingerprinting
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('crates/medusa-agent/src/transaction.rs')
          text = path.read_text()
          text = text.replace(
              '    let repository_before = repository_fingerprint(repo)?;\n    let mut resolved = Vec::with_capacity(mutations.len());\n',
              '    let repository_before = if context.is_some() {\n        Some(repository_fingerprint(repo)?)\n    } else {\n        None\n    };\n    let mut resolved = Vec::with_capacity(mutations.len());\n',
              1,
          )
          text = text.replace(
              '    if let Some(context) = context {\n        let repository_after = repository_fingerprint(repo)?;\n',
              '    if let Some(context) = context {\n        let repository_before = repository_before.ok_or_else(|| {\n            provenance_boundary_error("authoritative mutation fingerprint is unavailable")\n        })?;\n        let repository_after = repository_fingerprint(repo)?;\n',
              1,
          )
          path.write_text(text)
          PY
          cargo fmt --all
          rm .github/workflows/agent-466-direct-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/medusa-agent/src/transaction.rs .github/workflows/agent-466-direct-fix.yml
          git commit -m "fix: fingerprint only authoritative repository mutations"
          git push origin HEAD:agent/466-mutation-provenance
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - run: RUSTDOCFLAGS='-D warnings' cargo doc --workspace --all-features --no-deps
