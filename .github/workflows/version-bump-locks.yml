name: Prepare 1.0.1 metadata

on:
  push:
    branches:
      - agent/release-1.0.1-preparation
    paths:
      - .github/workflows/version-bump-locks.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/medusa-desktop/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0 # 1.88.0
      - name: Update synchronized version metadata and lockfiles
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"expected version marker not found in {path}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once("Cargo.toml", '[workspace.package]\nversion = "1.0.0"', '[workspace.package]\nversion = "1.0.1"')
          replace_once("apps/medusa-desktop/src-tauri/Cargo.toml", 'version = "1.0.0"', 'version = "1.0.1"')
          replace_once("apps/medusa-desktop/package.json", '"version": "1.0.0"', '"version": "1.0.1"')
          replace_once("apps/medusa-desktop/src-tauri/tauri.conf.json", '"version": "1.0.0"', '"version": "1.0.1"')

          lock = Path("apps/medusa-desktop/package-lock.json")
          text = lock.read_text(encoding="utf-8")
          old1 = '"name": "medusa-desktop",\n  "version": "1.0.0"'
          new1 = '"name": "medusa-desktop",\n  "version": "1.0.1"'
          old2 = '"name": "medusa-desktop",\n      "version": "1.0.0"'
          new2 = '"name": "medusa-desktop",\n      "version": "1.0.1"'
          if old1 not in text or old2 not in text:
              raise SystemExit("expected desktop package-lock version markers not found")
          text = text.replace(old1, new1, 1).replace(old2, new2, 1)
          lock.write_text(text, encoding="utf-8")

          def bump_local_medusa_packages(path: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              parts = text.split("[[package]]")
              changed = 0
              for i in range(1, len(parts)):
                  block = parts[i]
                  name_match = re.search(r'^name = "([^"]+)"$', block, re.MULTILINE)
                  if not name_match:
                      continue
                  name = name_match.group(1)
                  if not name.startswith("medusa"):
                      continue
                  if re.search(r'^source = ', block, re.MULTILINE):
                      continue
                  if 'version = "1.0.0"' in block:
                      parts[i] = block.replace('version = "1.0.0"', 'version = "1.0.1"', 1)
                      changed += 1
              if changed == 0:
                  raise SystemExit(f"no local Medusa packages updated in {path}")
              p.write_text("[[package]]".join(parts), encoding="utf-8")

          bump_local_medusa_packages("Cargo.lock")
          bump_local_medusa_packages("apps/medusa-desktop/src-tauri/Cargo.lock")
          PY
      - name: Validate lockfile authority
        run: |
          set -euo pipefail
          cargo metadata --locked --format-version 1 >/dev/null
          cargo metadata --locked --format-version 1 --manifest-path apps/medusa-desktop/src-tauri/Cargo.toml >/dev/null
          cd apps/medusa-desktop
          npm ci --ignore-scripts
      - name: Validate release metadata and policy
        run: |
          set -euo pipefail
          python3 scripts/release-evidence.py validate-tag --root . --tag v1.0.1
          python3 scripts/release-workflow-policy.py self-test
          python3 scripts/release-workflow-policy.py check --root .
      - name: Commit prepared metadata
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/version-bump-locks.yml
          mapfile -t changed < <(git status --porcelain | sed 's/^...//')
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 8
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock \
            apps/medusa-desktop/package.json \
            apps/medusa-desktop/package-lock.json \
            apps/medusa-desktop/src-tauri/Cargo.toml \
            apps/medusa-desktop/src-tauri/Cargo.lock \
            apps/medusa-desktop/src-tauri/tauri.conf.json \
            .github/workflows/version-bump-locks.yml
          git commit -m "Bump Medusa to 1.0.1"
          git push origin HEAD:agent/release-1.0.1-preparation
