name: Reliability Benchmarks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
    paths:
      - 'benchmarks/**'
      - 'scripts/reliability-benchmark.py'
      - 'scripts/test-reliability-benchmark.py'
      - 'scripts/orchestration-benchmark.py'
      - 'scripts/test-orchestration-benchmark.py'
      - 'scripts/coding-harness-benchmark.py'
      - 'scripts/test-coding-harness-benchmark.py'
      - 'scripts/compare-coding-harness-benchmarks.py'
      - 'scripts/test-compare-coding-harness-benchmarks.py'
      - 'docs/BENCHMARKS.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scoring-contract:
    name: Benchmark scoring contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate deterministic scoring fixtures
        run: |
          python3 scripts/test-reliability-benchmark.py
          python3 scripts/test-orchestration-benchmark.py
          python3 scripts/test-coding-harness-benchmark.py
          python3 scripts/test-compare-coding-harness-benchmarks.py

  coding-harness-pr:
    name: Same-model coding harness baseline
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      contains(github.event.pull_request.labels.*.name, 'final-issue-validation')
    runs-on: ubuntu-latest
    # Two bounded acceptance trials plus the workspace warm-up and evidence upload.
    timeout-minutes: 45
    steps:
      - name: Bootstrap repository for local actions
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: medusa-pr-build
          add-job-id-key: "false"
      - name: Validate committed dependency authority
        uses: ./.github/actions/cargo-locked
        with:
          command: "metadata --locked --format-version 1 >/dev/null"
      - name: Install Linux sandbox backend
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns
          fi
      - name: Build product acceptance runner and warm test targets
        run: |
          cargo build --locked -p medusa-cli --bin medusa-product-acceptance
          cargo test --workspace --locked --no-run
      - name: Run production coding harness baseline
        env:
          MEDUSA_BENCHMARK_COMMIT: ${{ github.sha }}
          MEDUSA_PRODUCT_ACCEPTANCE_BIN: target/debug/medusa-product-acceptance
          MEDUSA_ACCEPTANCE_TIMEOUT_SECONDS: '600'
        run: python3 scripts/coding-harness-benchmark.py
      - name: Upload coding harness evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coding-harness-benchmark-${{ github.sha }}
          path: |
            target/coding-harness-benchmark/coding-harness-benchmark.json
            target/coding-harness-benchmark/coding-harness-benchmark.md
            target/coding-harness-benchmark/acceptance-1/summary.json
            target/coding-harness-benchmark/acceptance-2/summary.json

  deterministic-runtime:
    name: Deterministic runtime benchmark
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # This job runs the warm-up plus three two-trial acceptance benchmarks.
    # Keep enough bounded headroom for the two 600-second reliability trials,
    # orchestration, coding-harness, setup, and evidence upload.
    timeout-minutes: 60
    steps:
      - name: Bootstrap repository for local actions
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: medusa-pr-build
          add-job-id-key: "false"
      - name: Validate committed dependency authority
        uses: ./.github/actions/cargo-locked
        with:
          command: "metadata --locked --format-version 1 >/dev/null"
      - name: Install Linux sandbox backend
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns
          fi
      - name: Build product acceptance runner and warm test targets
        run: |
          cargo build --locked -p medusa-cli --bin medusa-product-acceptance
          cargo test --workspace --locked --no-run
      - name: Run release-blocking reliability benchmark
        env:
          MEDUSA_BENCHMARK_COMMIT: ${{ github.sha }}
          MEDUSA_PRODUCT_ACCEPTANCE_BIN: target/debug/medusa-product-acceptance
          MEDUSA_ACCEPTANCE_TIMEOUT_SECONDS: '600'
        run: python3 scripts/reliability-benchmark.py
      - name: Run end-to-end orchestration benchmark
        env:
          MEDUSA_BENCHMARK_COMMIT: ${{ github.sha }}
        run: python3 scripts/orchestration-benchmark.py
      - name: Run same-model coding harness benchmark
        env:
          MEDUSA_BENCHMARK_COMMIT: ${{ github.sha }}
        run: python3 scripts/coding-harness-benchmark.py
      - name: Upload benchmark evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: reliability-benchmark-${{ github.sha }}
          path: |
            target/reliability-benchmark
            target/orchestration-benchmark
            target/coding-harness-benchmark/coding-harness-benchmark.json
            target/coding-harness-benchmark/coding-harness-benchmark.md
            target/coding-harness-benchmark/acceptance-1/summary.json
            target/coding-harness-benchmark/acceptance-2/summary.json
