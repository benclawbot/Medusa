name: Reliability Benchmarks

on:
  pull_request:
    paths:
      - 'benchmarks/**'
      - 'scripts/reliability-benchmark.py'
      - 'scripts/test-reliability-benchmark.py'
      - 'scripts/orchestration-benchmark.py'
      - 'scripts/test-orchestration-benchmark.py'
      - 'docs/BENCHMARKS.md'
      - '.github/workflows/reliability-benchmarks.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scoring-contract:
    name: Benchmark scoring contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate deterministic scoring fixtures
        run: |
          python3 scripts/test-reliability-benchmark.py
          python3 scripts/test-orchestration-benchmark.py

  deterministic-runtime:
    name: Deterministic runtime benchmark
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0 # 1.88.0
      - name: Validate committed dependency authority
        run: cargo metadata --locked --format-version 1 >/dev/null
      - name: Install Linux sandbox backend
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns
          fi
      - name: Run release-blocking reliability benchmark
        env:
          MEDUSA_BENCHMARK_COMMIT: ${{ github.sha }}
        run: python3 scripts/reliability-benchmark.py
      - name: Run end-to-end orchestration benchmark
        env:
          MEDUSA_BENCHMARK_COMMIT: ${{ github.sha }}
        run: python3 scripts/orchestration-benchmark.py
      - name: Upload benchmark evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: reliability-benchmark-${{ github.sha }}
          path: |
            target/reliability-benchmark
            target/orchestration-benchmark
