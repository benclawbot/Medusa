name: Bootstrap Desktop Release

on:
  push:
    branches: [main]
    paths:
      - ".github/release-bootstrap-desktop-v1.0.0"

permissions:
  contents: read

concurrency:
  group: bootstrap-desktop-v1.0.0
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }} desktop
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            bundles: deb,appimage
          - os: macos-latest
            platform: macos
            bundles: app,dmg
          - os: windows-2022
            platform: windows
            bundles: nsis
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/medusa-desktop/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0 # 1.88.0
      - name: Install desktop dependencies
        working-directory: apps/medusa-desktop
        run: npm ci
      - name: Prepare verified Tauri Linux bundler tools
        if: runner.os == 'Linux'
        run: python scripts/prepare-tauri-linux-tools.py --cache-dir "$HOME/.cache/tauri"
      - name: Build desktop bundles
        working-directory: apps/medusa-desktop
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: npm run tauri:build -- --bundles ${{ matrix.bundles }}
      - name: Validate desktop bundles
        run: >-
          python scripts/desktop-package-smoke.py
          --root apps/medusa-desktop/src-tauri/target/release/bundle
          --platform ${{ matrix.platform }}
          --manifest desktop-package-${{ matrix.platform }}.json
      - name: Assemble Unix assets
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          if [[ "${{ matrix.platform }}" == "linux" ]]; then
            cp "$(find apps/medusa-desktop/src-tauri/target/release/bundle -type f -name '*.deb' -print -quit)" release-assets/medusa-desktop-linux.deb
            cp "$(find apps/medusa-desktop/src-tauri/target/release/bundle -type f -name '*.AppImage' -print -quit)" release-assets/medusa-desktop-linux.AppImage
          else
            cp "$(find apps/medusa-desktop/src-tauri/target/release/bundle -type f -name '*.dmg' -print -quit)" release-assets/medusa-desktop-macos.dmg
            app=$(find apps/medusa-desktop/src-tauri/target/release/bundle -type d -name '*.app' -print -quit)
            ditto -c -k --sequesterRsrc --keepParent "$app" release-assets/medusa-desktop-macos-app.zip
          fi
          cp desktop-package-${{ matrix.platform }}.json release-assets/
      - name: Assemble Windows assets
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force release-assets | Out-Null
          $installers = @(Get-ChildItem apps/medusa-desktop/src-tauri/target/release/bundle -Recurse -File -Filter *.exe)
          if ($installers.Count -ne 1) { throw "expected one NSIS installer, found $($installers.Count)" }
          Copy-Item $installers[0].FullName release-assets/medusa-desktop-windows.exe
          Copy-Item desktop-package-windows.json release-assets/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-release-${{ matrix.platform }}-${{ github.sha }}
          path: release-assets
          if-no-files-found: error
          retention-days: 30

  publish-draft:
    name: Create permanent GitHub draft release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: desktop-release-*-${{ github.sha }}
          path: release-assets
          merge-multiple: true
      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum * > SHA256SUMS
      - name: Attest desktop assets
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: release-assets/*
      - name: Create draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: desktop-v1.0.0
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "release $RELEASE_TAG already exists" >&2
            exit 2
          fi
          gh release create "$RELEASE_TAG" release-assets/* \
            --draft \
            --target "$GITHUB_SHA" \
            --title "Medusa Desktop 1.0.0" \
            --notes "Unsigned desktop preview rebuilt from main after #615. Includes Linux .deb/AppImage, macOS DMG/app ZIP, Windows NSIS installer, package manifests, checksums, and GitHub attestations."
