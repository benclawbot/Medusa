name: Issue 874 diagnose 2

on:
  push:
    branches:
      - codex/issue-874-coding-trajectory

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply and validate hardening
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > /tmp/issue874.py
          if ! python3 /tmp/issue874.py > /tmp/issue874.out 2>&1; then
            cp /tmp/issue874.out .github/issue-874-hardening-error2.txt
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add .github/issue-874-hardening-error2.txt
            git commit -m 'ci: capture issue 874 hardening failure 2'
            git push origin HEAD:codex/issue-874-coding-trajectory
            exit 1
          fi
          cargo fmt --all
          cargo test -p medusa-agent --locked coding_trajectory -- --nocapture
          cargo test -p medusa-agent --locked compaction_v2 -- --nocapture
          cargo test -p medusa-agent --locked verification_contract -- --nocapture
          cargo clippy -p medusa-agent --all-features --locked -- -D warnings
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/issue-874-hardening.yml .github/workflows/issue-874-diagnose.yml .github/workflows/issue-874-diagnose2.yml
          git rm -f .github/issue-874-hardening-error.txt .github/issue-874-hardening-error2.txt
          git add crates/medusa-agent/src/coding_trajectory.rs crates/medusa-agent/src/verification_contract.rs crates/medusa-agent/src/engine.rs
          git commit -m 'feat(agent): harden durable trajectory authority'
          git push origin HEAD:codex/issue-874-coding-trajectory
