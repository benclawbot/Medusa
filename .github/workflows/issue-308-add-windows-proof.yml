name: Issue 308 Add Windows Proof

on:
  push:
    branches:
      - agent/issue-308-native-windows-appcontainer

permissions:
  contents: write

jobs:
  add-proof:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-308-native-windows-appcontainer
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Add behavioral Windows proof
        shell: python
        run: |
          from pathlib import Path
          source = Path('crates/medusa-process-containment/src/appcontainer.rs')
          text = source.read_text()
          text = text.replace(
              'SetInformationJobObject,\n',
              'SetInformationJobObject, TerminateJobObject,\n',
              1,
          )
          anchor = '''    let stdout = read_all(stdout_read.0)?;
    let stderr = read_all(stderr_read.0)?;
'''
          replacement = '''    // The primary command owns the lifecycle. Terminate any descendants before collecting
    // output so inherited pipe handles cannot outlive the containment boundary.
    if unsafe { TerminateJobObject(job.0, exit_code) } == 0 {
        return Err(io::Error::last_os_error());
    }
    let stdout = read_all(stdout_read.0)?;
    let stderr = read_all(stderr_read.0)?;
'''
          if anchor not in text:
              raise SystemExit('post-wait output anchor missing')
          text = text.replace(anchor, replacement, 1)
          old_tests = text[text.index('#[cfg(test)]\nmod tests {'):]
          tests = r'''#[cfg(test)]
mod tests {
    use std::{process::Command, thread, time::Duration};

    use super::*;
    use crate::process_is_alive;

    #[test]
    fn environment_does_not_inherit_secrets() {
        unsafe { std::env::set_var("MEDUSA_TEST_SECRET", "must-not-leak") };
        let directory = tempfile::tempdir().expect("temporary repository");
        let block = environment_block(directory.path()).expect("environment block");
        let decoded = String::from_utf16_lossy(&block);
        assert!(!decoded.contains("MEDUSA_TEST_SECRET"));
        assert!(decoded.contains("MEDUSA_NETWORK=disabled"));
        unsafe { std::env::remove_var("MEDUSA_TEST_SECRET") };
    }

    #[test]
    fn command_line_quotes_arguments() {
        let line = wide_command_line(Path::new("C:\\Program Files\\tool.exe"), &["a b".into()]);
        let decoded = String::from_utf16_lossy(&line);
        assert!(decoded.starts_with("\"C:\\Program Files\\tool.exe\""));
        assert!(decoded.contains("\"a b\""));
    }

    #[test]
    fn appcontainer_allows_repository_write_and_strips_parent_secret() {
        let repository = tempfile::tempdir().expect("temporary repository");
        unsafe { std::env::set_var("MEDUSA_TEST_SECRET", "must-not-leak") };
        let output = run_appcontainer(
            repository.path(),
            "cmd.exe",
            &[
                "/D".into(),
                "/C".into(),
                "if defined MEDUSA_TEST_SECRET (exit /b 7) else (echo contained>inside.txt)".into(),
            ],
        )
        .expect("AppContainer command");
        unsafe { std::env::remove_var("MEDUSA_TEST_SECRET") };
        assert!(output.status.success(), "stderr: {}", String::from_utf8_lossy(&output.stderr));
        assert_eq!(
            std::fs::read_to_string(repository.path().join("inside.txt"))
                .expect("inside write"),
            "contained\r\n"
        );
    }

    #[test]
    fn appcontainer_denies_read_and_write_outside_repository() {
        let repository = tempfile::tempdir().expect("temporary repository");
        let outside = tempfile::tempdir().expect("outside directory");
        let secret = outside.path().join("secret.txt");
        std::fs::write(&secret, "outside-secret").expect("outside fixture");
        let escaped = outside.path().join("escaped.txt");
        let command = format!(
            "type \"{}\" >nul 2>&1 || (echo blocked>\"{}\" & exit /b 9)",
            secret.display(),
            escaped.display()
        );
        let output = run_appcontainer(
            repository.path(),
            "cmd.exe",
            &["/D".into(), "/C".into(), command],
        )
        .expect("contained command launched");
        assert!(!output.status.success(), "outside read unexpectedly succeeded");
        assert!(!escaped.exists(), "outside write unexpectedly succeeded");
    }

    #[test]
    fn appcontainer_has_no_network_capability() {
        let repository = tempfile::tempdir().expect("temporary repository");
        let output = run_appcontainer(
            repository.path(),
            "curl.exe",
            &[
                "--silent".into(),
                "--show-error".into(),
                "--connect-timeout".into(),
                "2".into(),
                "--max-time".into(),
                "4".into(),
                "https://example.com".into(),
            ],
        )
        .expect("contained curl launched");
        assert!(!output.status.success(), "network access unexpectedly succeeded");
    }

    #[test]
    fn job_terminates_spawned_grandchild_when_primary_exits() {
        let repository = tempfile::tempdir().expect("temporary repository");
        let executable = std::env::current_exe().expect("current test executable");
        let output = run_appcontainer(
            repository.path(),
            executable.to_str().expect("unicode test executable"),
            &[
                "helper_spawn_grandchild".into(),
                "--ignored".into(),
                "--nocapture".into(),
                "--test-threads=1".into(),
            ],
        )
        .expect("contained helper launched");
        assert!(output.status.success(), "stderr: {}", String::from_utf8_lossy(&output.stderr));
        let stdout = String::from_utf8_lossy(&output.stdout);
        let pid = stdout
            .lines()
            .find_map(|line| line.strip_prefix("MEDUSA_CHILD_PID="))
            .and_then(|value| value.trim().parse::<u32>().ok())
            .expect("grandchild PID in helper output");
        thread::sleep(Duration::from_millis(250));
        assert!(!process_is_alive(pid), "grandchild escaped the Job Object");
    }

    #[test]
    #[ignore = "AppContainer process-tree helper"]
    fn helper_spawn_grandchild() {
        let executable = std::env::current_exe().expect("current test executable");
        let child = Command::new(executable)
            .args([
                "helper_sleep_grandchild",
                "--ignored",
                "--nocapture",
                "--test-threads=1",
            ])
            .spawn()
            .expect("spawn grandchild");
        println!("MEDUSA_CHILD_PID={}", child.id());
    }

    #[test]
    #[ignore = "AppContainer process-tree helper"]
    fn helper_sleep_grandchild() {
        thread::sleep(Duration::from_secs(60));
    }
}
'''
          source.write_text(text[:-len(old_tests)] + tests)

          workflow = Path('.github/workflows/daemon.yml')
          text = workflow.read_text()
          text = text.replace(
              'cargo clippy -p medusa-daemon -p medusa-tui --all-targets',
              'cargo clippy -p medusa-daemon -p medusa-tui -p medusa-process-containment --all-targets',
          )
          text = text.replace(
              'cargo test -p medusa-daemon -p medusa-tui --locked',
              'cargo test -p medusa-daemon -p medusa-tui -p medusa-process-containment --locked',
          )
          workflow.write_text(text)
      - name: Normalize and validate non-Windows graph
        run: |
          cargo check -p medusa-agent --all-targets
          cargo fmt --all
      - name: Commit proof
        run: |
          rm .github/workflows/issue-308-add-windows-proof.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/medusa-process-containment/src/appcontainer.rs .github/workflows/daemon.yml .github/workflows/issue-308-add-windows-proof.yml
          git commit -m "Add Windows AppContainer behavioral proof"
          git push origin HEAD:agent/issue-308-native-windows-appcontainer
