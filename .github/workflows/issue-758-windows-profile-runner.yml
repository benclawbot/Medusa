name: Issue 758 Windows profile runner

on:
  push:
    branches:
      - agent/issue-758-analysis-workspace

permissions:
  contents: write

jobs:
  integrate:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Apply production patch
        shell: python
        run: |
          from pathlib import Path
          text = Path('.github/workflows/issue-758-windows-profile-integrator.yml').read_text()
          marker = '      - name: Patch Windows production path\n        shell: python\n        run: |\n'
          block = text.split(marker, 1)[1].split('      - name: Format\n', 1)[0]
          source = '\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines())
          exec(compile(source, 'issue758_windows_integration', 'exec'))
      - name: Format
        run: cargo fmt --all
      - name: Check Windows source
        run: cargo check -p medusa-process-containment -p medusa-agent -p medusa-runtime --locked
      - name: Test Windows tracker and containment
        run: cargo test -p medusa-agent analysis_process_tracker --locked -- --nocapture
      - name: Clippy
        run: cargo clippy -p medusa-process-containment -p medusa-agent -p medusa-runtime --locked --all-targets -- -D warnings
      - name: Commit production source
        shell: bash
        run: |
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add crates/medusa-process-containment/src/base_container.rs crates/medusa-process-containment/src/lib.rs crates/medusa-agent/src/policy.rs crates/medusa-agent/src/windows_sandbox.rs crates/medusa-runtime/src/analysis_contained.rs
            git commit -m "feat(containment): track and bound Windows analysis processes"
            git push
          fi
