name: Fix 650 Evidence Preview v2

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: fix-650-evidence-preview-v2-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fix:
    if: github.event.pull_request.number == 663 && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0 # 1.88.0
        with:
          components: rustfmt, clippy
      - name: Add bounded evidence previews
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/fix-650-evidence-preview.py
          cargo fmt --all
          changed="$(git diff --name-only)"
          test "$changed" = "crates/medusa-agent/src/verification_authority.rs"
          git diff --check
      - name: Validate evidence compatibility
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p medusa-agent fixture_bug_fix_survives_restart_with_exact_evidence --lib --locked
          cargo test -p medusa-agent command_preview_is_bounded_and_redacts_secret_like_lines --lib --locked
          cargo test -p medusa-agent verification_authority --lib --locked
          cargo test -p medusa-agent --lib --locked
          cargo clippy -p medusa-evidence -p medusa-agent -p medusa-runtime --all-targets --locked -- -D warnings
          python3 scripts/check-evidence-authority.py
      - name: Publish validated evidence preview
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/');
          const branch = process.env.HEAD_REF;
          const token = process.env.GITHUB_TOKEN;
          const path = 'crates/medusa-agent/src/verification_authority.rs';
          const encoded = path.split('/').map(encodeURIComponent).join('/');
          async function request(url, options = {}) {
            const response = await fetch(`https://api.github.com${url}`, {
              ...options,
              headers: {
                Accept: 'application/vnd.github+json',
                Authorization: `Bearer ${token}`,
                'X-GitHub-Api-Version': '2022-11-28',
                'User-Agent': 'medusa-evidence-preview-fix-v2',
              },
            });
            const text = await response.text();
            const data = text ? JSON.parse(text) : {};
            if (!response.ok) throw new Error(`${response.status} ${text}`);
            return data;
          }
          (async () => {
            const current = await request(`/repos/${owner}/${repo}/contents/${encoded}?ref=${encodeURIComponent(branch)}`);
            const updated = await request(`/repos/${owner}/${repo}/contents/${encoded}`, {
              method: 'PUT',
              body: JSON.stringify({
                message: 'Preserve bounded verification evidence across restart',
                content: fs.readFileSync(path).toString('base64'),
                sha: current.sha,
                branch,
              }),
            });
            console.log(`published ${updated.commit.sha}`);
          })().catch((error) => {
            console.error(error.stack || String(error));
            process.exit(1);
          });
          NODE
