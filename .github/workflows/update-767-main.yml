name: Update PR 767 with main
on: push
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: perf/688-hedge-p95-acceptance
          fetch-depth: 0
      - run: |
          git config user.name benclawbot
          git config user.email 259942410+benclawbot@users.noreply.github.com
          git fetch origin main
          git merge --no-edit origin/main
          git push origin HEAD:perf/688-hedge-p95-acceptance
