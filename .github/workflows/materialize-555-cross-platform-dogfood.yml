name: Materialize cross-platform dogfood gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "validation/dogfood-payload-*.txt"
      - ".github/workflows/materialize-555-cross-platform-dogfood.yml"

permissions:
  contents: write

concurrency:
  group: materialize-555-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize:
    if: github.head_ref == 'agent/555-cross-platform-dogfood'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/555-cross-platform-dogfood
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Verify and materialize production files
        shell: python
        run: |
          import base64
          import hashlib
          import io
          import tarfile
          from pathlib import Path

          root = Path.cwd()
          encoded = "".join(
              (root / f"validation/dogfood-payload-{index:02d}.txt").read_text()
              for index in range(3)
          )
          payload = base64.b64decode(encoded, validate=True)
          expected = "a7925aad07780531eb5b325d8f4fe1930546aca962c4aea03cb1c74423886702"
          actual = hashlib.sha256(payload).hexdigest()
          if actual != expected:
              raise SystemExit(f"dogfood payload hash mismatch: {actual}")
          with tarfile.open(fileobj=io.BytesIO(payload), mode="r:gz") as archive:
              archive.extractall(root, filter="data")
      - name: Validate materialized contract
        run: |
          python -m py_compile scripts/live-coding-e2e.py scripts/live-dogfood-report.py scripts/test-live-dogfood.py
          python scripts/test-live-dogfood.py
      - name: Commit production files and remove bootstrap
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/live-coding-e2e.py scripts/live-coding-e2e.sh scripts/live-dogfood-report.py scripts/test-live-dogfood.py docs/LIVE-PROVIDER-DOGFOOD.md .github/workflows/live-provider-dogfood.yml
          git rm .github/workflows/materialize-555-cross-platform-dogfood.yml
          git rm validation/dogfood-payload-00.txt validation/dogfood-payload-01.txt validation/dogfood-payload-02.txt
          git commit -m "Add cross-platform live product dogfood gate"
          git push origin HEAD:agent/555-cross-platform-dogfood
