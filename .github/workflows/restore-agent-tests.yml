name: Restore medusa-agent tests

on:
  push:
    branches:
      - agent/restore-medusa-agent-tests

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0
      - name: Restore lost tests and acceptance selector
        shell: bash
        run: |
          set -euo pipefail
          git show 258e78afeedeffc6c5ff13ff27fa718802a7de6c:crates/medusa-agent/src/lib.rs > crates/medusa-agent/src/lib.rs
          git show 258e78afeedeffc6c5ff13ff27fa718802a7de6c:scripts/product-acceptance-smoke.py > scripts/product-acceptance-smoke.py
          python - <<'PY'
          from pathlib import Path
          path = Path('crates/medusa-agent/src/lib.rs')
          text = path.read_text()
          text = text.replace(
              'mod approval;\npub mod compaction_v2;',
              'mod approval;\npub mod branch_summary;\npub mod compaction_v2;',
              1,
          )
          needle = '''pub use approval::{
              ApprovalDecision, ApprovalGrant, ApprovalReceipt, ApprovalScope, RollbackOutcome,
              RollbackReceipt,
          };
          '''
          replacement = needle + '''pub use branch_summary::{
              BranchAnchor, BranchSummaryRecord, DeterministicBranchMetadata, capture_restore_abandonment,
              common_ancestor,
          };
          '''
          if needle not in text:
              raise SystemExit('approval export anchor not found')
          text = text.replace(needle, replacement, 1)
          path.write_text(text)
          PY
      - name: Format
        run: cargo fmt --all -- --check
      - name: Recover interruption resume acceptance test
        run: cargo test -p medusa-agent fixture_bug_fix_survives_restart_with_exact_evidence --locked -- --nocapture
      - name: Check affected crates
        run: cargo check -p medusa-agent -p medusa-runtime --locked
      - name: Clippy affected crates
        run: cargo clippy -p medusa-agent -p medusa-runtime --all-targets --all-features --locked -- -D warnings
      - name: Commit restored tests
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/medusa-agent/src/lib.rs scripts/product-acceptance-smoke.py
          if git diff --cached --quiet; then
            echo 'No source changes to commit'
            exit 0
          fi
          git commit -m 'Restore medusa-agent regression tests'
          git push origin HEAD:agent/restore-medusa-agent-tests
