name: Verify 687 Tool Timing Telemetry
on:
  push:
    branches: [perf/687-tool-timing-telemetry]
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  verify-source:
    if: github.event_name == 'push' || github.head_ref == 'perf/687-tool-timing-telemetry'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: perf/687-tool-timing-telemetry
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0
        with:
          components: rustfmt, clippy
      - name: Apply durable tool timing telemetry
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              s = p.read_text()
              assert s.count(old) >= count, f"anchor missing in {path}: {old[:160]!r}"
              p.write_text(s.replace(old, new, count))

          protocol = 'crates/medusa-protocol/src/lib.rs'
          replace(
              protocol,
              '''    ToolExecutionCompleted {\n        tool: String,\n        exit_code: Option<i32>,\n    },\n    FileTransactionCommitted {\n''',
              '''    ToolExecutionCompleted {\n        tool: String,\n        exit_code: Option<i32>,\n    },\n    ToolExecutionTimingRecorded {\n        tool_use_id: String,\n        tool: String,\n        queue_duration_ns: u64,\n        execution_duration_ns: u64,\n        expected_duration_ms: u64,\n        concurrency_cost: u16,\n        cached: bool,\n    },\n    FileTransactionCommitted {\n''',
          )
          replace(
              protocol,
              '''    #[test]\n    fn tampering_is_detected() {\n''',
              '''    #[test]\n    fn tool_execution_timing_round_trips() {\n        let event = EventEnvelope::new(\n            2,\n            SessionId::new(),\n            Actor::Coordinator,\n            CorrelationId::new(),\n            EventPayload::ToolExecutionTimingRecorded {\n                tool_use_id: "tool-1".to_owned(),\n                tool: "fs_read".to_owned(),\n                queue_duration_ns: 125,\n                execution_duration_ns: 500,\n                expected_duration_ms: 10,\n                concurrency_cost: 1,\n                cached: false,\n            },\n            None,\n            OffsetDateTime::UNIX_EPOCH,\n        )\n        .expect("timing event");\n        let json = serde_json::to_string(&event).expect("serialize timing event");\n        assert_eq!(\n            serde_json::from_str::<EventEnvelope>(&json).expect("deserialize timing event"),\n            event\n        );\n    }\n\n    #[test]\n    fn tampering_is_detected() {\n''',
          )

          engine = 'crates/medusa-agent/src/engine.rs'
          replace(
              engine,
              '''fn audited_tool_name(name: &str, input: &serde_json::Value) -> String {\n    if name == "desktop_commander" {\n        if let Some(tool) = input.get("tool").and_then(serde_json::Value::as_str) {\n            return format!("desktop_commander:{tool}");\n        }\n    }\n    name.to_owned()\n}\n\n''',
              '''fn audited_tool_name(name: &str, input: &serde_json::Value) -> String {\n    if name == "desktop_commander" {\n        if let Some(tool) = input.get("tool").and_then(serde_json::Value::as_str) {\n            return format!("desktop_commander:{tool}");\n        }\n    }\n    name.to_owned()\n}\n\n#[derive(Clone, Copy, Debug, Eq, PartialEq)]\nstruct ToolExecutionTiming {\n    queue_duration_ns: u64,\n    execution_duration_ns: u64,\n    cached: bool,\n}\n\nfn duration_ns(duration: std::time::Duration) -> u64 {\n    duration.as_nanos().min(u128::from(u64::MAX)) as u64\n}\n\n''',
          )
          replace(
              engine,
              '''        let mut assistant_blocks = Vec::new();\n        let mut assistant_text = Vec::new();\n        let mut calls = VecDeque::new();\n''',
              '''        let mut assistant_blocks = Vec::new();\n        let mut assistant_text = Vec::new();\n        let mut calls = VecDeque::new();\n        let mut tool_requested_at = BTreeMap::<String, std::time::Instant>::new();\n''',
          )
          replace(
              engine,
              '''                ResponseBlock::ToolUse { id, name, input } => {\n                    assistant_blocks.push(MessageBlock::ToolUse {\n                        id: id.clone(),\n                        name: name.clone(),\n                        input: input.clone(),\n                    });\n                    calls.push_back((id, name, input));\n                }\n''',
              '''                ResponseBlock::ToolUse { id, name, input } => {\n                    assistant_blocks.push(MessageBlock::ToolUse {\n                        id: id.clone(),\n                        name: name.clone(),\n                        input: input.clone(),\n                    });\n                    tool_requested_at.insert(id.clone(), std::time::Instant::now());\n                    calls.push_back((id, name, input));\n                }\n''',
          )
          replace(
              engine,
              '''                let repo = session.repo.as_path();\n                let cache = &safe_tool_cache;\n                let cancellation = Arc::clone(&self.cancellation);\n                map_parallel_ordered(batch, |(id, name, input)| {\n                    let cached = crate::tool_dag::dedup_key(&name, &input)\n                        .and_then(|key| cache.get(&key).cloned());\n                    let result = cached.map_or_else(\n                        || execute_tool_cancellable(repo, &name, &input, cancellation.as_ref()),\n                        Ok,\n                    );\n                    (id, name, input, result)\n                })?\n''',
              '''                let repo = session.repo.as_path();\n                let cache = &safe_tool_cache;\n                let requested_at = &tool_requested_at;\n                let cancellation = Arc::clone(&self.cancellation);\n                map_parallel_ordered(batch, |(id, name, input)| {\n                    let started = std::time::Instant::now();\n                    let queue_duration_ns = requested_at\n                        .get(&id)\n                        .map(|requested| duration_ns(started.duration_since(*requested)))\n                        .unwrap_or_default();\n                    let cached_output = crate::tool_dag::dedup_key(&name, &input)\n                        .and_then(|key| cache.get(&key).cloned());\n                    let cached = cached_output.is_some();\n                    let result = cached_output.map_or_else(\n                        || execute_tool_cancellable(repo, &name, &input, cancellation.as_ref()),\n                        Ok,\n                    );\n                    let timing = ToolExecutionTiming {\n                        queue_duration_ns,\n                        execution_duration_ns: duration_ns(started.elapsed()),\n                        cached,\n                    };\n                    (id, name, input, result, Some(timing))\n                })?\n''',
          )
          replace(
              engine,
              '''                let result = if let Some(reason) =\n                    self.execution_policy.denial_reason(&name, &input)\n                {\n''',
              '''                let started = std::time::Instant::now();\n                let queue_duration_ns = tool_requested_at\n                    .get(&id)\n                    .map(|requested| duration_ns(started.duration_since(*requested)))\n                    .unwrap_or_default();\n                let mut measured = false;\n                let mut cached = false;\n                let result = if let Some(reason) =\n                    self.execution_policy.denial_reason(&name, &input)\n                {\n''',
          )
          for anchor in [
              '''                } else if name == "update_plan" {\n                    append_observed(\n''',
              '''                } else if name == "ask_user_question" {\n                    append_observed(\n''',
              '''                } else if self\n                    .team_context\n                    .as_ref()\n                    .is_some_and(|team| team.handles(&name))\n                {\n                    append_observed(\n''',
              '''                } else if name == "desktop_commander" && tool_allowed(self.config.agent.mode, &name)\n                {\n                    append_observed(\n''',
          ]:
              replace(engine, anchor, anchor.replace('                    append_observed(\n', '                    measured = true;\n                    append_observed(\n'))
          replace(
              engine,
              '''                } else if tool_allowed(self.config.agent.mode, &name) {\n                    if let Some(output) = crate::tool_dag::dedup_key(&name, &input)\n                        .and_then(|key| safe_tool_cache.get(&key).cloned())\n                    {\n                        Ok(output)\n                    } else {\n''',
              '''                } else if tool_allowed(self.config.agent.mode, &name) {\n                    measured = true;\n                    if let Some(output) = crate::tool_dag::dedup_key(&name, &input)\n                        .and_then(|key| safe_tool_cache.get(&key).cloned())\n                    {\n                        cached = true;\n                        Ok(output)\n                    } else {\n''',
          )
          replace(
              engine,
              '''                };\n                vec![(id, name, input, result)]\n            };\n\n            let repository_revision_after_mutation = executed\n                .iter()\n                .any(|(_, name, input, result)| {\n''',
              '''                };\n                let timing = measured.then(|| ToolExecutionTiming {\n                    queue_duration_ns,\n                    execution_duration_ns: duration_ns(started.elapsed()),\n                    cached,\n                });\n                vec![(id, name, input, result, timing)]\n            };\n\n            let repository_revision_after_mutation = executed\n                .iter()\n                .any(|(_, name, input, result, _)| {\n''',
          )
          replace(
              engine,
              '''                .filter_map(|(_, name, input, result)| {\n''',
              '''                .filter_map(|(_, name, input, result, _)| {\n''',
          )
          replace(
              engine,
              '''                (id, name, input, Err(error))\n''',
              '''                (id, name, input, Err(error), None)\n''',
              count=2,
          )
          replace(
              engine,
              '''            for (id, name, input, result) in executed {\n''',
              '''            for (id, name, input, result, timing) in executed {\n''',
          )
          replace(
              engine,
              '''                append_observed(\n                    session,\n                    EventPayload::ToolExecutionCompleted {\n                        tool: event_tool,\n                        exit_code,\n                    },\n                    &mut observer,\n                )?;\n''',
              '''                append_observed(\n                    session,\n                    EventPayload::ToolExecutionCompleted {\n                        tool: event_tool.clone(),\n                        exit_code,\n                    },\n                    &mut observer,\n                )?;\n                if let Some(timing) = timing {\n                    let profile = crate::tool_dag::profile(&name, &input);\n                    append_observed(\n                        session,\n                        EventPayload::ToolExecutionTimingRecorded {\n                            tool_use_id: id.clone(),\n                            tool: event_tool,\n                            queue_duration_ns: timing.queue_duration_ns,\n                            execution_duration_ns: timing.execution_duration_ns,\n                            expected_duration_ms: profile.expected_duration_ms,\n                            concurrency_cost: profile.concurrency_cost,\n                            cached: timing.cached,\n                        },\n                        &mut observer,\n                    )?;\n                }\n''',
          )
          PY
      - name: Format
        run: cargo fmt --all -- --check || (cargo fmt --all && cargo fmt --all -- --check)
      - name: Protocol tests
        run: cargo test -p medusa-protocol -- --nocapture
      - name: Agent library tests
        run: cargo test -p medusa-agent --lib -- --nocapture
      - name: Clippy
        run: cargo clippy -p medusa-protocol -p medusa-agent --all-targets --all-features -- -D warnings
      - name: Publish verified source only
        if: github.event_name == 'pull_request'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/medusa-protocol/src/lib.rs crates/medusa-agent/src/engine.rs
          git commit -m 'Record actual tool DAG execution timing'
          git push origin HEAD:perf/687-tool-timing-telemetry
