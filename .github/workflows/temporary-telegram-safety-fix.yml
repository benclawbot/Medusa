name: Temporary Telegram safety fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0 # 1.88.0
        with:
          components: rustfmt,clippy
      - name: Apply replay-safety patch
        shell: bash
        run: |
          base64 --decode > /tmp/telegram-safety.patch <<'PATCH'
                    PATCH
          if git apply --check /tmp/telegram-safety.patch; then
            git apply /tmp/telegram-safety.patch
          elif git apply --reverse --check /tmp/telegram-safety.patch; then
            echo "patch already applied"
          else
            echo "patch does not apply cleanly" >&2
            exit 1
          fi
      - name: Apply canonical formatting
        shell: bash
        run: cargo fmt --all
      - name: Validate Telegram gateway
        shell: bash
        run: |
          cargo clippy -p medusa-daemon --all-targets --all-features -- -D warnings
          cargo test -p medusa-daemon telegram
      - name: Commit safety fixes
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "fix: make Telegram replay and approvals fail closed"
          git push origin "HEAD:${HEAD_BRANCH}"
