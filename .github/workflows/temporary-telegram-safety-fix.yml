name: Temporary Telegram safety fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0 # 1.88.0
        with:
          components: rustfmt,clippy
      - name: Apply replay-safety changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise SystemExit(f"expected source fragment not found: {label}")
              return text.replace(old, new, 1)

          callback = Path("crates/medusa-daemon/src/telegram/callback.rs")
          text = callback.read_text()
          if "for record in self.records.values_mut()" not in text:
              text = replace_once(
                  text,
                  '''        let record = self
                      .records
                      .get_mut(nonce)
                      .ok_or(TelegramGatewayError::InvalidCallback)?;
                  if record.user_id != identity.user_id
                      || record.chat_id != identity.chat_id
                      || record.topic_id != identity.topic_id
                  {
                      return Err(TelegramGatewayError::CallbackIdentityMismatch);
                  }
                  if record.consumed_at.is_some() {
                      return Err(TelegramGatewayError::CallbackAlreadyResolved);
                  }
                  if record.expires_at < now {
                      return Err(TelegramGatewayError::CallbackExpired);
                  }
                  record.consumed_at = Some(now);
                  let resolved = ResolvedCallback {
                      nonce: record.nonce.clone(),
                      session_id: record.session_id.clone(),
                      turn_id: record.turn_id.clone(),
                      approval_id: record.approval_id.clone(),
                      decision: record.decision,
                  };
          ''',
                  '''        let record = self
                      .records
                      .get(nonce)
                      .ok_or(TelegramGatewayError::InvalidCallback)?;
                  if record.user_id != identity.user_id
                      || record.chat_id != identity.chat_id
                      || record.topic_id != identity.topic_id
                  {
                      return Err(TelegramGatewayError::CallbackIdentityMismatch);
                  }
                  if record.consumed_at.is_some() {
                      return Err(TelegramGatewayError::CallbackAlreadyResolved);
                  }
                  if record.expires_at <= now {
                      return Err(TelegramGatewayError::CallbackExpired);
                  }
                  let resolved = ResolvedCallback {
                      nonce: record.nonce.clone(),
                      session_id: record.session_id.clone(),
                      turn_id: record.turn_id.clone(),
                      approval_id: record.approval_id.clone(),
                      decision: record.decision,
                  };
          ''',
                  "callback resolution lookup",
              )
              text = replace_once(
                  text,
                  '''            session_id: Some(resolved.session_id),
                      turn_id: resolved.turn_id,
                      timestamp: now,
                      command: FrontendCommand::ResolveApproval {
                          approval_id: resolved.approval_id,
                          decision: resolved.decision,
                      },
                  };
                  envelope
                      .validate()
                      .map_err(|error| TelegramGatewayError::Protocol(error.to_owned()))?;
                  Ok(envelope)
          ''',
                  '''            session_id: Some(resolved.session_id.clone()),
                      turn_id: resolved.turn_id.clone(),
                      timestamp: now,
                      command: FrontendCommand::ResolveApproval {
                          approval_id: resolved.approval_id.clone(),
                          decision: resolved.decision,
                      },
                  };
                  envelope
                      .validate()
                      .map_err(|error| TelegramGatewayError::Protocol(error.to_owned()))?;
                  for record in self.records.values_mut() {
                      if record.user_id == identity.user_id
                          && record.chat_id == identity.chat_id
                          && record.topic_id == identity.topic_id
                          && record.session_id == resolved.session_id
                          && record.turn_id == resolved.turn_id
                          && record.approval_id == resolved.approval_id
                      {
                          record.consumed_at = Some(now);
                      }
                  }
                  Ok(envelope)
          ''',
                  "callback sibling consumption",
              )
              text = replace_once(
                  text,
                  '''        assert!(matches!(
                      store.resolve(&identity(), &buttons[0].callback_data, now),
                      Err(TelegramGatewayError::CallbackAlreadyResolved)
                  ));
          ''',
                  '''        assert!(matches!(
                      store.resolve(&identity(), &buttons[0].callback_data, now),
                      Err(TelegramGatewayError::CallbackAlreadyResolved)
                  ));
                  assert!(matches!(
                      store.resolve(&identity(), &buttons[1].callback_data, now),
                      Err(TelegramGatewayError::CallbackAlreadyResolved)
                  ));
          ''',
                  "callback sibling regression test",
              )
              callback.write_text(text)

          renderer = Path("crates/medusa-daemon/src/telegram/render.rs")
          text = renderer.read_text()
          if "struct RenderedEvent" not in text:
              text = replace_once(
                  text,
                  "use serde::{Deserialize, Serialize};\nuse time::{Duration, OffsetDateTime};",
                  "use serde::{Deserialize, Serialize};\nuse sha2::{Digest, Sha256};\nuse time::{Duration, OffsetDateTime};",
                  "renderer digest import",
              )
              text = replace_once(
                  text,
                  '''#[derive(Clone, Debug, Deserialize, Serialize)]
          pub struct TelegramRenderer {
          ''',
                  '''#[derive(Clone, Debug, Deserialize, Eq, PartialEq, Serialize)]
          struct RenderedEvent {
              event_id: String,
              fingerprint: String,
          }

          #[derive(Clone, Debug, Deserialize, Serialize)]
          pub struct TelegramRenderer {
          ''',
                  "rendered event state",
              )
              text = replace_once(
                  text,
                  "    cursor_events: BTreeMap<u64, String>,",
                  "    cursor_events: BTreeMap<u64, RenderedEvent>,",
                  "renderer cursor state",
              )
              text = replace_once(
                  text,
                  '''        if self.already_rendered(envelope)? {
                      return Ok(Vec::new());
                  }
          ''',
                  '''        let fingerprint = event_fingerprint(envelope)?;
                  if self.already_rendered(envelope, &fingerprint)? {
                      return Ok(Vec::new());
                  }
          ''',
                  "renderer fingerprint validation",
              )
              text = replace_once(
                  text,
                  '''            FrontendEvent::AssistantTextDelta { text } => {
                      self.preview.push_str(text);
                      if self.should_flush(now) {
                          actions.extend(self.flush_preview(true, now)?);
                      }
                  }
          ''',
                  '''            FrontendEvent::AssistantTextDelta { text } => {
                      let previous_len = self.preview.len();
                      self.preview.push_str(text);
                      if self.should_flush(now) {
                          match self.flush_preview(true, now) {
                              Ok(flushed) => actions.extend(flushed),
                              Err(error) => {
                                  self.preview.truncate(previous_len);
                                  return Err(error);
                              }
                          }
                      }
                  }
          ''',
                  "renderer preview rollback",
              )
              text = replace_once(
                  text,
                  '''            FrontendEvent::Usage { .. }
                      | FrontendEvent::AssistantInterim { .. }
                      | FrontendEvent::Progress { .. } => {}
                  }
                  Ok(actions)
              }

              fn already_rendered(
                  &mut self,
                  envelope: &FrontendEventEnvelope,
              ) -> Result<bool, TelegramGatewayError> {
                  if let Some(existing) = self.cursor_events.get(&envelope.cursor) {
                      if existing == &envelope.event_id {
                          return Ok(true);
                      }
                      return Err(TelegramGatewayError::CursorConflict(envelope.cursor));
                  }
                  if self
                      .cursor_events
                      .last_key_value()
                      .is_some_and(|(cursor, _)| envelope.cursor < *cursor)
                  {
                      return Err(TelegramGatewayError::StaleCursor(envelope.cursor));
                  }
                  self.cursor_events
                      .insert(envelope.cursor, envelope.event_id.clone());
                  while self.cursor_events.len() > MAX_REPLAY_RECORDS {
                      let Some(first) = self
                          .cursor_events
                          .first_key_value()
                          .map(|(cursor, _)| *cursor)
                      else {
                          break;
                      };
                      self.cursor_events.remove(&first);
                  }
                  Ok(false)
              }
          ''',
                  '''            FrontendEvent::Usage { .. }
                      | FrontendEvent::AssistantInterim { .. }
                      | FrontendEvent::Progress { .. } => {}
                  }
                  self.record_rendered(envelope, fingerprint);
                  Ok(actions)
              }

              fn already_rendered(
                  &self,
                  envelope: &FrontendEventEnvelope,
                  fingerprint: &str,
              ) -> Result<bool, TelegramGatewayError> {
                  if let Some(existing) = self.cursor_events.get(&envelope.cursor) {
                      if existing.event_id == envelope.event_id && existing.fingerprint == fingerprint {
                          return Ok(true);
                      }
                      return Err(TelegramGatewayError::CursorConflict(envelope.cursor));
                  }
                  if self
                      .cursor_events
                      .last_key_value()
                      .is_some_and(|(cursor, _)| envelope.cursor < *cursor)
                  {
                      return Err(TelegramGatewayError::StaleCursor(envelope.cursor));
                  }
                  Ok(false)
              }

              fn record_rendered(&mut self, envelope: &FrontendEventEnvelope, fingerprint: String) {
                  self.cursor_events.insert(
                      envelope.cursor,
                      RenderedEvent {
                          event_id: envelope.event_id.clone(),
                          fingerprint,
                      },
                  );
                  while self.cursor_events.len() > MAX_REPLAY_RECORDS {
                      let Some(first) = self
                          .cursor_events
                          .first_key_value()
                          .map(|(cursor, _)| *cursor)
                      else {
                          break;
                      };
                      self.cursor_events.remove(&first);
                  }
              }
          ''',
                  "renderer commit-after-render",
              )
              text = replace_once(
                  text,
                  '''fn preview_slot(index: usize) -> Result<TelegramMessageSlot, TelegramGatewayError> {
          ''',
                  '''fn event_fingerprint(
              envelope: &FrontendEventEnvelope,
          ) -> Result<String, TelegramGatewayError> {
              let encoded = serde_json::to_vec(envelope)
                  .map_err(|error| TelegramGatewayError::Protocol(error.to_string()))?;
              Ok(hex::encode(Sha256::digest(encoded)))
          }

          fn preview_slot(index: usize) -> Result<TelegramMessageSlot, TelegramGatewayError> {
          ''',
                  "renderer fingerprint helper",
              )
              text = replace_once(
                  text,
                  '''        let mut conflict = started.clone();
                  conflict.event_id = "other-event".to_owned();
                  assert!(matches!(
                      renderer.render(&conflict, conflict.timestamp),
                      Err(TelegramGatewayError::CursorConflict(1))
                  ));
          ''',
                  '''        let mut conflict = started.clone();
                  conflict.event_id = "other-event".to_owned();
                  assert!(matches!(
                      renderer.render(&conflict, conflict.timestamp),
                      Err(TelegramGatewayError::CursorConflict(1))
                  ));

                  let mut altered = started.clone();
                  altered.event = FrontendEvent::SubmissionAccepted;
                  assert!(matches!(
                      renderer.render(&altered, altered.timestamp),
                      Err(TelegramGatewayError::CursorConflict(1))
                  ));
          ''',
                  "renderer conflicting payload test",
              )
              renderer.write_text(text)
          PY
      - name: Apply canonical formatting
        shell: bash
        run: cargo fmt --all
      - name: Validate Telegram gateway
        shell: bash
        run: |
          cargo clippy -p medusa-daemon --all-targets --all-features -- -D warnings
          cargo test -p medusa-daemon telegram
      - name: Commit safety fixes
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "fix: make Telegram replay and approvals fail closed"
          git push origin "HEAD:${HEAD_BRANCH}"
