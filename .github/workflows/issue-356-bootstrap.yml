name: Issue 356 Bootstrap

on:
  push:
    branches:
      - agent/issue-356-nonfatal-diagnostics

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt
      - name: Apply source patch
        run: git apply .github/issue-356.patch
      - name: Format workspace
        run: cargo fmt --all
      - name: Remove bootstrap files
        run: rm .github/issue-356.patch .github/issue-356-trigger .github/workflows/issue-356-bootstrap.yml
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Surface non-fatal subsystem diagnostics"
          git push origin HEAD:agent/issue-356-nonfatal-diagnostics
