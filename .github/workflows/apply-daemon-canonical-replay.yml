name: Apply daemon canonical replay

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: apply-daemon-canonical-replay-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ github.event.pull_request.head.ref == 'agent/652-daemon-canonical-replay' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/652-daemon-canonical-replay
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0 # 1.88.0
        with:
          components: clippy,rustfmt
      - name: Apply verified daemon replay patch
        run: python3 .github/scripts/apply-daemon-canonical-replay.py
      - name: Validate canonical Telegram migration
        run: python3 .github/scripts/fix-daemon-canonical-replay.py
      - name: Format
        run: cargo fmt --all
      - name: Validate focused crates
        run: cargo test -p medusa-protocol -p medusa-runtime -p medusa-daemon --all-targets --locked
      - name: Lint focused crates
        run: cargo clippy -p medusa-protocol -p medusa-runtime -p medusa-daemon --all-targets --locked -- -D warnings
      - name: Validate architecture index
        run: python3 scripts/check-architecture-index.py
      - name: Remove one-shot generator
        run: |
          rm -f .github/scripts/apply-daemon-canonical-replay.py
          rm -f .github/scripts/fix-daemon-canonical-replay.py
          rm -f .github/scripts/subprocess.py
          rm -rf .github/scripts/__pycache__
          rm -f .github/workflows/apply-daemon-canonical-replay.yml
      - name: Commit generated implementation
        run: |
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Project daemon replay through canonical frontend events"
          git push origin HEAD:agent/652-daemon-canonical-replay
