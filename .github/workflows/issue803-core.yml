name: issue803-core

on:
  push:
    branches:
      - agent/issue-803-staged-config
    paths:
      - .github/workflows/issue803-core.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0
      - name: Integrate staged configuration authority
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'missing patch context in {path}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1))

          replace(
              'crates/medusa-config/src/lib.rs',
              'mod provider_profiles;\n',
              'mod provider_profiles;\nmod staged_profile;\n',
          )
          replace(
              'crates/medusa-config/src/lib.rs',
              'pub use provider_profiles::{\n    ProviderProfileCatalog, ProviderProfileSnapshot, ProviderProfileSummary, ProviderProfileUpdate,\n};\n',
              'pub use provider_profiles::{\n    ProviderProfileCatalog, ProviderProfileSnapshot, ProviderProfileSummary, ProviderProfileUpdate,\n};\npub use staged_profile::{\n    ProviderProfileDiffEntry, ProviderProfileHistoryEntry, ProviderProfileSection,\n    StagedProviderProfile,\n};\n',
          )

          replace(
              'crates/medusa-config/src/provider_profiles.rs',
              '    configuration_state::{\n        ConfigurationApplyTiming, ConfigurationChangeOrigin, ConfigurationChanged,\n        ConfigurationStateGuard, ConfigurationStateStore,\n    },\n};\n',
              '    configuration_state::{\n        ConfigurationApplyTiming, ConfigurationChangeOrigin, ConfigurationChanged,\n        ConfigurationStateGuard, ConfigurationStateStore,\n    },\n    staged_profile::{\n        begin_pending_transaction, finish_pending_transaction, reconcile_pending_transaction,\n        record_known_good,\n    },\n};\n',
          )
          replace(
              'crates/medusa-config/src/provider_profiles.rs',
              'pub struct ProviderProfileUpdate {\n    guard: ConfigurationStateGuard,\n',
              'pub struct ProviderProfileUpdate {\n    root: PathBuf,\n    guard: ConfigurationStateGuard,\n',
          )
          replace(
              'crates/medusa-config/src/provider_profiles.rs',
              '''        profile.validate()?;\n        self.store.save(profile)?;\n        match self.guard.commit(\n            self.active_profile.clone(),\n            changed_keys,\n            origin,\n            apply_timing,\n        ) {\n            Ok(change) => Ok(change),\n            Err(error) => {\n                restore_profile(&self.store, self.existed, &self.previous).map_err(|rollback| {\n                    store_error(format!(\n                        "commit configuration metadata: {error}; rollback failed: {rollback}"\n                    ))\n                })?;\n                Err(error)\n            }\n        }\n''',
              '''        profile.validate()?;\n        record_known_good(\n            &self.root,\n            self.guard.revision(),\n            &self.active_profile,\n            &self.previous,\n        )?;\n        begin_pending_transaction(\n            &self.root,\n            self.guard.revision(),\n            &self.active_profile,\n            self.existed,\n            &self.previous,\n            profile,\n        )?;\n        self.store.save(profile)?;\n        match self.guard.commit(\n            self.active_profile.clone(),\n            changed_keys,\n            origin,\n            apply_timing,\n        ) {\n            Ok(change) => {\n                finish_pending_transaction(&self.root)?;\n                Ok(change)\n            }\n            Err(error) => {\n                restore_profile(&self.store, self.existed, &self.previous).map_err(|rollback| {\n                    store_error(format!(\n                        "commit configuration metadata: {error}; rollback failed: {rollback}"\n                    ))\n                })?;\n                finish_pending_transaction(&self.root)?;\n                Err(error)\n            }\n        }\n''',
          )
          replace(
              'crates/medusa-config/src/provider_profiles.rs',
              '    pub fn revision(&self) -> MedusaResult<u64> {\n        self.state_store().revision()\n    }\n\n    pub fn last_change(&self) -> MedusaResult<Option<ConfigurationChanged>> {\n        self.state_store().last_change()\n    }\n\n    pub fn snapshot(&self) -> MedusaResult<ProviderProfileSnapshot> {\n        let guard = self.state_store().acquire()?;\n',
              '    pub fn revision(&self) -> MedusaResult<u64> {\n        reconcile_pending_transaction(&self.root)?;\n        self.state_store().revision()\n    }\n\n    pub fn last_change(&self) -> MedusaResult<Option<ConfigurationChanged>> {\n        reconcile_pending_transaction(&self.root)?;\n        self.state_store().last_change()\n    }\n\n    pub fn snapshot(&self) -> MedusaResult<ProviderProfileSnapshot> {\n        reconcile_pending_transaction(&self.root)?;\n        let guard = self.state_store().acquire()?;\n',
          )
          replace(
              'crates/medusa-config/src/provider_profiles.rs',
              '''    ) -> MedusaResult<ProviderProfileUpdate> {\n        let guard = self.state_store().acquire()?;\n        guard.check_expected(expected_revision)?;\n        let active_profile = self.active_name()?;\n        let store = self.store_for_name(&active_profile);\n        let existed = store.path().is_file();\n        let previous = store.load()?;\n        Ok(ProviderProfileUpdate {\n            guard,\n''',
              '''    ) -> MedusaResult<ProviderProfileUpdate> {\n        reconcile_pending_transaction(&self.root)?;\n        let guard = self.state_store().acquire()?;\n        guard.check_expected(expected_revision)?;\n        let active_profile = self.active_name()?;\n        let store = self.store_for_name(&active_profile);\n        let existed = store.path().is_file();\n        let previous = store.load()?;\n        Ok(ProviderProfileUpdate {\n            root: self.root.clone(),\n            guard,\n''',
          )
          PY
          cargo fmt --all
          cargo test -p medusa-config
          rm .github/workflows/issue803-core.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/medusa-config .github/workflows/issue803-core.yml
          git commit -m "Integrate staged configuration persistence"
          git push origin HEAD:${GITHUB_REF_NAME}
