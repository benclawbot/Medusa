name: Apply validated MiniMax fix
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Fetch and apply source patch
        run: |
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/benclawbot/Medusa/fix/minimax-m3-openai-cancellation/.github/minimax-m3-openai-cancellation.patch \
            --output /tmp/minimax.patch
          git apply /tmp/minimax.patch
          python - <<'PY'
          from pathlib import Path
          path = Path('crates/medusa-runtime/build_main.rs')
          text = path.read_text()
          old = 'AgentEngine::new(provider, config)'
          new = 'AgentEngine::new_with_cancellation(provider, config, Arc::clone(cancel))'
          if old not in text:
              raise SystemExit('runtime build generator anchor not found')
          path.write_text(text.replace(old, new))
          PY
      - name: Format
        run: cargo fmt --all
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test workspace
        run: cargo test --workspace --all-features
      - name: Commit validated source
        run: |
          rm .github/workflows/apply-minimax-fix-v2.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Fix MiniMax M3 OpenAI routing and request cancellation"
          git push origin HEAD:${{ github.head_ref }}
