name: Apply validated MiniMax fix
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Fetch and apply source patch
        run: |
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/benclawbot/Medusa/fix/minimax-m3-openai-cancellation/.github/minimax-m3-openai-cancellation.patch \
            --output /tmp/minimax.patch
          git apply /tmp/minimax.patch
          python - <<'PY'
          from pathlib import Path
          path = Path('crates/medusa-runtime/build_main.rs')
          text = path.read_text()
          replacements = [
              (
                  'AgentEngine::new(provider, config)',
                  'AgentEngine::new_with_cancellation(provider, config, Arc::clone(cancel))',
              ),
              (
                  '"step_with_observer_and_context(&mut session, skill_context.as_deref(), |update| {"',
                  '"                skill_context.as_deref(),\\n                |update| {"',
              ),
              (
                  '"step_with_observer_and_context(&mut session, Some(skill_context.as_str()), |update| {"',
                  '"                Some(skill_context.as_str()),\\n                |update| {"',
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'runtime build generator anchor not found: {old}')
              text = text.replace(old, new)
          path.write_text(text)
          PY
      - name: Format
        run: cargo fmt --all
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        shell: bash
        run: |
          set +e
          cargo clippy --workspace --all-targets --all-features --message-format short -- -D warnings >clippy.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            grep -E '(^error|: error|warning:|could not compile)' clippy.log | tail -n 160 >clippy-diagnostics.txt || true
            tail -n 200 clippy.log >>clippy-diagnostics.txt
          fi
          exit "$status"
      - name: Upload Clippy diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: minimax-v2-clippy-diagnostics
          path: clippy-diagnostics.txt
      - name: Test workspace
        run: cargo test --workspace --all-features
