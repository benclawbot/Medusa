name: PR1175 stale CLI test repair

on:
  push:
    branches:
      - fix/post-simplification-ci

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-rust
      - name: Remove coverage for retired skill dependency commands
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/medusa-cli/tests/operational_entrypoint_coverage.rs')
          text = path.read_text(encoding='utf-8')
          start = text.find('    fn write_skill(')
          if start < 0:
              raise SystemExit('stale skill dependency fixture not found')
          tail = text[start:]
          marker = '    #[test]\n    fn skills_dependency_commands_cover_inspect_validate_lock_and_verify()'
          if marker not in tail:
              raise SystemExit('stale skill dependency coverage test not found')
          if not text.rstrip().endswith('}'):
              raise SystemExit('unexpected module shape')
          path.write_text(text[:start].rstrip() + '\n}\n', encoding='utf-8')
          PY
          cargo fmt --all

      - name: Validate CLI repair
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy -p medusa-cli --all-targets --locked -- -D warnings
          cargo test -p medusa-cli --locked

      - name: Commit repaired state
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/pr1175-cli-stale-test-repair.yml
          git config user.name "BenClawBot CI Repair"
          git config user.email "benclawbot@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "test: remove coverage for retired skill dependency commands"
          git push origin HEAD:fix/post-simplification-ci
