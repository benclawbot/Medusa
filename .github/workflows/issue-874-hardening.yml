    let lower = value.to_ascii_lowercase();
    if lower.contains("compile") || lower.contains("error[e") {
        "compile"
    } else if lower.contains("test") || lower.contains("assert") {
        "test"
    } else if lower.contains("lint") || lower.contains("clippy") || lower.contains("fmt") {
        "quality_gate"
    } else if lower.contains("policy") || lower.contains("denied") {
        "policy"
    } else if lower.contains("timeout") || lower.contains("cancel") {
