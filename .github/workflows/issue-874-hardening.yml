          test_insert = r'''

    #[test]
    fn failed_repair_history_survives_restart_and_verification() {
        let repo = tempfile::tempdir().expect("repo");
        let session = session(repo.path());
        record_verification(&session, &["test failed: regression".to_owned()], false)
            .expect("failed verification");
        record_mutation(&session, &["src/lib.rs".to_owned()]).expect("repair mutation");
        let before = load(&session).expect("load").expect("state");
        assert_eq!(before.repair_attempts.len(), 1);
        assert_eq!(before.repair_attempts[0].outcome, "pending_verification");
        record_verification(&session, &["test passed: regression".to_owned()], true)
            .expect("passed verification");
        let after = load(&session).expect("reload").expect("state");
        assert_eq!(after.repair_attempts[0].outcome, "verified");
        assert!(after.failures.iter().all(|failure| failure.resolved));
    }

    #[test]
    fn deterministic_tool_failure_is_referenced_and_rejected_on_repeat() {
        let repo = tempfile::tempdir().expect("repo");
        let session = session(repo.path());
        let input = serde_json::json!({"path": "src/lib.rs"});
        record_tool_result(
            &session,
            "fs_read",
            &input,
            Some(".medusa/artifacts/read-1"),
            "error: missing symbol",
            true,
        )
        .expect("first result");
        record_tool_result(
            &session,
            "fs_read",
            &input,
            Some(".medusa/artifacts/read-2"),
            "error: missing symbol",
            true,
        )
        .expect("repeat result");
        let state = load(&session).expect("load").expect("state");
        assert_eq!(state.external_evidence.len(), 1);
        assert_eq!(state.disproved_hypotheses.len(), 1);
        assert_eq!(state.rejected_alternatives.len(), 1);
        assert!(state.external_evidence.values().all(|evidence| evidence.artifact_ref.is_some()));
    }

    #[test]
    fn repository_drift_invalidates_plan_paths_and_verification() {
        let repo = tempfile::tempdir().expect("repo");
        std::process::Command::new("git")
            .arg("init")
            .arg(repo.path())
            .status()
            .expect("git init");
        std::process::Command::new("git")
            .arg("-C")
            .arg(repo.path())
            .args(["config", "user.email", "medusa@example.invalid"])
            .status()
            .expect("git email");
        std::process::Command::new("git")
            .arg("-C")
            .arg(repo.path())
            .args(["config", "user.name", "Medusa Test"])
            .status()
            .expect("git name");
        fs::write(repo.path().join("tracked.txt"), "one").expect("write");
        std::process::Command::new("git")
            .arg("-C")
            .arg(repo.path())
            .args(["add", "."])
            .status()
            .expect("git add");
        std::process::Command::new("git")
            .arg("-C")
            .arg(repo.path())
            .args(["commit", "-m", "initial"])
            .status()
            .expect("git commit");
        let session = session(repo.path());
        record_mutation(&session, &["tracked.txt".to_owned()]).expect("mutation");
        record_verification(&session, &["unit-tests=passed".to_owned()], true)
            .expect("verify");
        fs::write(repo.path().join("tracked.txt"), "external drift").expect("drift");
        refresh_and_render(&session).expect("refresh");
        let state = load(&session).expect("load").expect("state");
        assert!(state.repository_drift_detected);
        assert!(!state.plan_valid_for_repository);
        assert!(state.stale_paths.contains("tracked.txt"));
        assert!(state.verification_receipts.is_empty());
    }

