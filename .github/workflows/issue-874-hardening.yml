          insert = '''
pub(crate) fn record_tool_result(
    session: &AgentSession,
    tool: &str,
    input: &serde_json::Value,
    artifact_ref: Option<&str>,
    raw_content: &str,
    is_error: bool,
) -> MedusaResult<()> {
    let mut state = load(session)?.unwrap_or(CodingTrajectoryState::new(session)?);
    let input_json = serde_json::to_string(input).map_err(json_error)?;
    let signature = hash_bytes(format!("{tool}:{input_json}").as_bytes());
    let digest = hash_bytes(raw_content.as_bytes());
    let evidence_id = format!("tool:{signature}:{digest}");
    state.evidence_refs.insert(evidence_id.clone());
    state.external_evidence.insert(
        evidence_id.clone(),
        TrajectoryEvidenceRef {
            digest: digest.clone(),
            tool: tool.to_owned(),
            artifact_ref: artifact_ref.map(str::to_owned),
            is_error,
        },
    );
    if let Some(path) = input.get("path").and_then(serde_json::Value::as_str) {
        state
            .relevant_paths
            .insert(path.replace('\\\\', "/"), format!("observed by {tool}"));
    }
    if let Some(previous_digest) = state.observed_tool_calls.insert(signature.clone(), digest.clone()) {
        if previous_digest == digest && is_error {
            state.disproved_hypotheses.insert(signature.clone());
            push_unique(
                &mut state.rejected_alternatives,
                format!("repeat {tool} call {signature} reproduced the same deterministic failure"),
                128,
            );
        }
    }
    if is_error {
        state.record_failure(&format!("{tool}: {}", bounded(raw_content, 1200)));
    }
    while state.external_evidence.len() > MAX_EVIDENCE_REFS {
        if let Some(first) = state.external_evidence.keys().next().cloned() {
            state.external_evidence.remove(&first);
        } else {
            break;
        }
    }
    persist(session, &state)
}

