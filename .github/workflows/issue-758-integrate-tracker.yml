name: Issue 758 integrate process tracker

on:
  push:
    branches:
      - agent/issue-758-analysis-workspace

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Integrate tracker
        shell: python
        run: |
          from pathlib import Path

          lib = Path('crates/medusa-agent/src/lib.rs')
          s = lib.read_text()
          if 'mod analysis_process_tracker;' not in s:
              s = s.replace('pub mod analysis_host;\n', 'pub mod analysis_host;\nmod analysis_process_tracker;\n', 1)
          lib.write_text(s)

          policy = Path('crates/medusa-agent/src/policy.rs')
          s = policy.read_text()
          marker = '#[cfg(any(target_os = "linux", target_os = "macos"))]\nuse medusa_process_containment::OwnedProcessTree;\n'
          if 'use crate::analysis_process_tracker::AnalysisProcessTracker;' not in s:
              s = s.replace(marker, marker + '\n#[cfg(any(target_os = "linux", target_os = "macos"))]\nuse crate::analysis_process_tracker::AnalysisProcessTracker;\n', 1)
          s = s.replace(
              'output_with_timeout(&mut command, "Linux bubblewrap sandbox", cancellation)',
              'output_with_timeout(\n            &mut command,\n            "Linux bubblewrap sandbox",\n            cancellation,\n            &root,\n            program,\n            args,\n        )',
          )
          s = s.replace(
              'output_with_timeout(&mut command, "macOS sandbox-exec sandbox", cancellation)',
              'output_with_timeout(\n            &mut command,\n            "macOS sandbox-exec sandbox",\n            cancellation,\n            &root,\n            program,\n            args,\n        )',
          )
          start = s.index('#[cfg(any(target_os = "linux", target_os = "macos"))]\nfn output_with_timeout(')
          end = s.index('\n#[cfg(not(any(target_os = "linux", target_os = "macos", windows)))]\nfn sandbox_unavailable', start)
          replacement = '''#[cfg(any(target_os = "linux", target_os = "macos"))]
fn output_with_timeout(
    command: &mut Command,
    description: &str,
    cancellation: &AtomicBool,
    root: &Path,
    program: &str,
    args: &[String],
) -> MedusaResult<Output> {
    command.stdout(Stdio::piped()).stderr(Stdio::piped());
    let mut tree = OwnedProcessTree::spawn(command).map_err(|error| {
        MedusaError::new(
            ErrorCode::DependencyUnavailable,
            ErrorCategory::Environment,
            format!("{description} unavailable: {error}"),
        )
    })?;
    let mut process_tracker = if root
        .to_string_lossy()
        .contains("/analysis-workspace-v1/")
    {
        Some(AnalysisProcessTracker::started(
            root,
            program,
            args,
            tree.ownership_receipt(),
        )?)
    } else {
        None
    };
    let stdout = tree.take_stdout().ok_or_else(|| {
        MedusaError::new(
            ErrorCode::InternalInvariant,
            ErrorCategory::Internal,
            format!("{description} stdout pipe was unavailable"),
        )
    })?;
    let stderr = tree.take_stderr().ok_or_else(|| {
        MedusaError::new(
            ErrorCode::InternalInvariant,
            ErrorCategory::Internal,
            format!("{description} stderr pipe was unavailable"),
        )
    })?;
    let stdout_reader = thread::spawn(move || {
        let mut pipe = stdout;
        let mut bytes = Vec::new();
        pipe.read_to_end(&mut bytes).map(|_| bytes)
    });
    let stderr_reader = thread::spawn(move || {
        let mut pipe = stderr;
        let mut bytes = Vec::new();
        pipe.read_to_end(&mut bytes).map(|_| bytes)
    });
    let started = Instant::now();
    loop {
        if cancellation.load(Ordering::Acquire) {
            let _ = tree.terminate();
            let _ = tree.wait();
            if let Some(tracker) = process_tracker.take() {
                let _ = tracker.failed("analysis execution cancelled");
            }
            return Err(cancelled_command(description));
        }
        if let Some(status) = tree.try_wait()? {
            if let Some(tracker) = process_tracker.take() {
                tracker.exited(status.code())?;
            }
            let stdout = stdout_reader.join().map_err(|_| {
                MedusaError::new(
                    ErrorCode::ToolExecutionFailed,
                    ErrorCategory::Execution,
                    format!("{description} stdout reader terminated unexpectedly"),
                )
            })??;
            let stderr = stderr_reader.join().map_err(|_| {
                MedusaError::new(
                    ErrorCode::ToolExecutionFailed,
                    ErrorCategory::Execution,
                    format!("{description} stderr reader terminated unexpectedly"),
                )
            })??;
            return Ok(Output {
                status,
                stdout,
                stderr,
            });
        }
        if started.elapsed() >= SHELL_COMMAND_TIMEOUT {
            let _ = tree.terminate();
            let _ = tree.wait();
            if let Some(tracker) = process_tracker.take() {
                let _ = tracker.failed("analysis execution timed out");
            }
            return Err(MedusaError::new(
                ErrorCode::ToolExecutionFailed,
                ErrorCategory::Execution,
                format!(
                    "{description} timed out after {} seconds",
                    SHELL_COMMAND_TIMEOUT.as_secs()
                ),
            ));
        }
        thread::sleep(Duration::from_millis(50));
    }
}
'''
          s = s[:start] + replacement + s[end:]
          policy.write_text(s)
      - name: Format
        run: cargo fmt --all
      - name: Check
        run: cargo check -p medusa-agent -p medusa-runtime -p medusa-process-containment --locked
      - name: Test tracker
        run: cargo test -p medusa-agent analysis_process_tracker --locked -- --nocapture
      - name: Commit production source
        shell: bash
        run: |
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add Cargo.lock crates/medusa-agent/src/lib.rs crates/medusa-agent/src/policy.rs crates/medusa-agent/src/analysis_process_tracker.rs crates/medusa-agent/Cargo.toml
            git commit -m "feat(agent): track contained analysis processes durably"
            git push
          fi
