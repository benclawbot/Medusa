name: Apply 692 journal hot-path tranche

on:
  push:
    branches:
      - agent/issue-692-journal-runtime-performance
    paths:
      - .github/workflows/apply-692-journal-hotpath.yml
      - .github/scripts/apply-692-journal-hotpath.py

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-692-journal-runtime-performance
          fetch-depth: 0
      - name: Apply exact journal hot-path patch
        run: python .github/scripts/apply-692-journal-hotpath.py
      - name: Format and targeted verification
        run: |
          cargo fmt --all
          cargo test -p medusa-agent journal::tests
      - name: Commit tested source tranche
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/medusa-agent/src/journal.rs
          git diff --cached --check
          git commit -m 'perf: batch durable journal commits and shard locks'
          git push origin HEAD:agent/issue-692-journal-runtime-performance
