name: Materialize runtime durability doctor

on:
  pull_request:
    branches:
      - main
    paths:
      - docs/EXECUTION-DURABILITY.md
      - docs/session-continuity.md
      - validation/materialize_569_runtime_doctor.py
      - .github/workflows/materialize-569-runtime-doctor.yml

permissions:
  contents: write

concurrency:
  group: materialize-569-runtime-doctor-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/569-runtime-doctor-docs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0 # stable
      - name: Materialize reviewed doctor wiring
        run: python3 validation/materialize_569_runtime_doctor.py
      - name: Format and validate runtime diagnostics
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test -p medusa-cli runtime_doctor
          cargo test -p medusa-runtime execution_history
          cargo test -p medusa-runtime checkpoint_store
          cargo clippy -p medusa-cli -p medusa-runtime --all-targets --all-features -- -D warnings
          test -s docs/EXECUTION-DURABILITY.md
          test -s docs/session-continuity.md
      - name: Commit source-only result
        run: |
          git rm .github/workflows/materialize-569-runtime-doctor.yml
          git rm validation/materialize_569_runtime_doctor.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/medusa-cli/src/main.rs
          git add docs/EXECUTION-DURABILITY.md
          git add docs/session-continuity.md
          git commit -m "Add runtime durability doctor evidence"
          git push origin HEAD:${{ github.head_ref }}
