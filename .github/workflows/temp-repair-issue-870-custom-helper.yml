name: Temporary repair issue 870 custom helper
on:
  push:
    branches: [codex/issue-870-desktop-onboarding]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/issue-870-desktop-onboarding
      - name: Make generated Rust formatting authoritative
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/temp-issue-870-custom-endpoint.yml')
          s = p.read_text()
          old = '          cargo fmt --all -- --check\n          cargo test --lib'
          new = '          cargo fmt --all\n          cargo fmt --all -- --check\n          cargo test --lib'
          if old not in s:
              raise SystemExit('format validation anchor not found')
          p.write_text(s.replace(old, new, 1))
          PY
          rm .github/workflows/temp-repair-issue-870-custom-helper.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/temp-issue-870-custom-endpoint.yml .github/workflows/temp-repair-issue-870-custom-helper.yml
          git commit -m "Fix custom endpoint validation formatting"
          git push origin HEAD:codex/issue-870-desktop-onboarding
