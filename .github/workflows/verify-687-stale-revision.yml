name: Verify 687 Stale Revision Pruning
on:
  push:
    branches: [perf/687-stale-revision-pruning]
permissions:
  contents: write
jobs:
  verify-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0
        with:
          components: rustfmt, clippy
      - name: Apply stale revision pruning
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              s = p.read_text()
              assert s.count(old) >= count, f"anchor missing in {path}: {old[:100]!r}"
              p.write_text(s.replace(old, new, count))

          path = 'crates/medusa-agent/src/tool_dag.rs'
          anchor = '''pub(crate) fn dedup_key(name: &str, input: &Value) -> Option<String> {\n    profile(name, input).dedup_key\n}\n'''
          addition = anchor + '''\npub(crate) fn invalidates_repository_revision(name: &str, input: &Value) -> bool {\n    profile(name, input).resources.iter().any(|resource| {\n        resource.key == "repository" && resource.access == ResourceAccess::Write\n    })\n}\n\npub(crate) fn drain_stale_revision_calls<I>(\n    queue: &mut VecDeque<(I, String, Value)>,\n    current_revision: &str,\n) -> Vec<(I, String, Value)> {\n    let mut stale = Vec::new();\n    let mut retained = VecDeque::new();\n    for (id, name, input) in std::mem::take(queue) {\n        let expected = input\n            .get("repository_revision")\n            .and_then(Value::as_str)\n            .map(str::trim)\n            .filter(|value| !value.is_empty());\n        if expected.is_some_and(|expected| expected != current_revision) {\n            stale.push((id, name, input));\n        } else {\n            retained.push_back((id, name, input));\n        }\n    }\n    *queue = retained;\n    stale\n}\n'''
          replace(path, anchor, addition)

          test_anchor = '''    #[test]\n    fn non_idempotent_calls_never_have_dedup_keys() {\n'''
          tests = '''    #[test]\n    fn stale_revision_calls_are_pruned_without_touching_matching_or_unbound_work() {\n        let mut queue = queued_calls(&[\n            ("verify_impacted", json!({"repository_revision":"old","paths":["a.rs"]})),\n            ("verify_impacted", json!({"repository_revision":"current","paths":["b.rs"]})),\n            ("web_fetch", json!({"url":"https://example.com"})),\n            ("apply_structured_patch", json!({"repository_revision":"older","plan_id":"p","edits":[]})),\n        ]);\n        let stale = drain_stale_revision_calls(&mut queue, "current");\n        assert_eq!(\n            stale.iter().map(|(_, name, _)| name.as_str()).collect::<Vec<_>>(),\n            vec!["verify_impacted", "apply_structured_patch"]\n        );\n        assert_eq!(\n            queue.iter().map(|(_, name, _)| name.as_str()).collect::<Vec<_>>(),\n            vec!["verify_impacted", "web_fetch"]\n        );\n    }\n\n    #[test]\n    fn scheduler_profiles_identify_repository_revision_invalidators() {\n        assert!(invalidates_repository_revision(\n            "apply_structured_patch",\n            &json!({"repository_revision":"r"})\n        ));\n        assert!(invalidates_repository_revision(\n            "shell_run",\n            &json!({"program":"cargo","args":["fmt"]})\n        ));\n        assert!(!invalidates_repository_revision(\n            "inspect_target",\n            &json!({"path":"src/lib.rs"})\n        ));\n        assert!(!invalidates_repository_revision(\n            "verify_impacted",\n            &json!({"repository_revision":"r","paths":["src/lib.rs"]})\n        ));\n    }\n\n'''
          replace(path, test_anchor, tests + test_anchor)

          path = 'crates/medusa-agent/src/engine.rs'
          anchor = '''fn dependency_failure_error(name: &str) -> MedusaError {\n'''
          helpers = '''fn refreshed_repository_revision(repo: &Path) -> Option<String> {\n    let mut graph = medusa_intelligence::RepositoryGraph::open(repo).ok()?;\n    if graph.freshness() != medusa_intelligence::RepositoryGraphFreshness::Current {\n        graph.refresh().ok()?;\n    }\n    (graph.freshness() == medusa_intelligence::RepositoryGraphFreshness::Current)\n        .then(|| graph.snapshot().repository_revision.clone())\n}\n\nfn stale_revision_error(name: &str, current_revision: &str) -> MedusaError {\n    let mut error = MedusaError::new(\n        ErrorCode::DependencyUnavailable,\n        ErrorCategory::Execution,\n        format!("tool {name} was cancelled because its repository revision became stale"),\n    );\n    error.context.insert(\n        "stale_repository_revision".into(),\n        serde_json::Value::Bool(true),\n    );\n    error.context.insert(\n        "current_repository_revision".into(),\n        serde_json::Value::String(current_revision.to_owned()),\n    );\n    error\n}\n\n'''
          replace(path, anchor, helpers + anchor)

          anchor = '''            let failed_dependencies = executed\n'''
          prefix = '''            let repository_revision_after_mutation = executed\n                .iter()\n                .any(|(_, name, input, result)| {\n                    result.is_ok()\n                        && crate::tool_dag::invalidates_repository_revision(name, input)\n                })\n                .then(|| refreshed_repository_revision(&session.repo))\n                .flatten();\n\n'''
          replace(path, anchor, prefix + anchor)

          anchor = '''            let mut executed = executed;\n            executed.extend(blocked.into_iter().map(|(id, name, input)| {\n                let error = dependency_failure_error(&name);\n                (id, name, input, Err(error))\n            }));\n\n            for (id, name, input, result) in executed {\n'''
          replacement = '''            let mut executed = executed;\n            executed.extend(blocked.into_iter().map(|(id, name, input)| {\n                let error = dependency_failure_error(&name);\n                (id, name, input, Err(error))\n            }));\n            if let Some(current_revision) = repository_revision_after_mutation {\n                let stale = crate::tool_dag::drain_stale_revision_calls(\n                    &mut calls,\n                    &current_revision,\n                );\n                executed.extend(stale.into_iter().map(|(id, name, input)| {\n                    let error = stale_revision_error(&name, &current_revision);\n                    (id, name, input, Err(error))\n                }));\n            }\n\n            for (id, name, input, result) in executed {\n'''
          replace(path, anchor, replacement)
          PY
      - name: Format
        run: cargo fmt --all -- --check || (cargo fmt --all && cargo fmt --all -- --check)
      - name: Tool DAG tests
        run: cargo test -p medusa-agent tool_dag -- --nocapture
      - name: Agent library tests
        run: cargo test -p medusa-agent --lib -- --nocapture
      - name: Clippy
        run: cargo clippy -p medusa-agent --all-targets --all-features -- -D warnings
      - name: Publish verified source only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/medusa-agent/src/tool_dag.rs crates/medusa-agent/src/engine.rs
          git commit -m 'Prune stale revision-bound DAG work before execution'
          git push origin HEAD:perf/687-stale-revision-pruning
