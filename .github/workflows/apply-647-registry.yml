name: Apply 647 Capability Registry

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: apply-647-registry-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.number == 660 && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0 # 1.88.0
        with:
          components: rustfmt, clippy
      - name: Apply registry migration
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply-647-registry.py
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("crates/medusa-capabilities/src/registry.rs")
          text = path.read_text(encoding="utf-8")
          pattern = re.compile(r'(?m)^(?P<call>\s*)tool_entry\(\n(?P<arg>\s*)states,\n(?P=arg)"(?P<name>[^"]+)",')

          def replace_call(match: re.Match[str]) -> str:
              return (
                  f'{match.group("call")}tool_entry(\n'
                  f'{match.group("arg")}ToolIdentity {{ states, name: "{match.group("name")}" }},'
              )

          text, count = pattern.subn(replace_call, text)
          if count == 0:
              raise RuntimeError("tool identity migration found no registry calls")

          old = '''fn tool_entry<const N: usize>(
              states: &BTreeMap<Capability, CapabilityState>,
              name: &str,
              capability: Capability,
              description: &str,
              input_schema: Value,
              handler: &str,
              permissions: [RegistryPermission; N],
              requires_approval: bool,
          ) -> RegistryEntry {
              let state = states.get(&capability).cloned().unwrap_or(CapabilityState {
          '''
          new = '''struct ToolIdentity<'a> {
              states: &'a BTreeMap<Capability, CapabilityState>,
              name: &'a str,
          }

          fn tool_entry<const N: usize>(
              identity: ToolIdentity<'_>,
              capability: Capability,
              description: &str,
              input_schema: Value,
              handler: &str,
              permissions: [RegistryPermission; N],
              requires_approval: bool,
          ) -> RegistryEntry {
              let ToolIdentity { states, name } = identity;
              let state = states.get(&capability).cloned().unwrap_or(CapabilityState {
          '''
          if text.count(old) != 1:
              raise RuntimeError("tool identity signature migration did not match exactly once")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Refresh locked dependency graph
        run: cargo check -p medusa-capabilities -p medusa-extensions -p medusa-agent -p medusa-cli
      - name: Validate truthful registry
        shell: bash
        run: |
          set -euo pipefail
          {
            cargo fmt --all
            cargo fmt --all -- --check
            cargo test -p medusa-capabilities -p medusa-extensions --all-targets --locked
            cargo test -p medusa-agent --lib --locked
            cargo test -p medusa-cli --bin medusa-capabilities --locked
            cargo clippy -p medusa-capabilities -p medusa-extensions -p medusa-agent -p medusa-cli --all-targets --locked -- -D warnings
            python3 scripts/architecture-conformance.py --known-failures --json
            python3 scripts/check-architecture-index.py
          } 2>&1 | tee registry-validation.log
      - name: Upload registry validation log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: registry-validation-${{ github.sha }}
          path: registry-validation.log
          if-no-files-found: error
          retention-days: 2
      - name: Commit validated registry migration
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-647-registry.yml scripts/apply-647-registry.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            Cargo.lock \
            crates/medusa-agent/src/engine.rs \
            crates/medusa-agent/src/engine_support.rs \
            crates/medusa-agent/src/tools/mod.rs \
            crates/medusa-capabilities/src/registry.rs \
            crates/medusa-cli/src/capabilities.rs \
            docs/architecture/INDEX.md \
            docs/architecture/baseline.json \
            scripts/architecture-conformance.py
          git commit -m "Migrate production surfaces to the truthful capability registry"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
