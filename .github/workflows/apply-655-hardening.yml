name: Apply 655 Updater Hardening

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0 # 1.88.0
        with:
          components: rustfmt
      - name: Apply fail-closed hardening
        run: python3 scripts/apply-655-hardening.py
      - name: Format and validate focused crates
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo test -p medusa-update --all-targets --locked
      - name: Commit hardened updater
        shell: bash
        run: |
          set -euo pipefail
          git rm scripts/apply-655-hardening.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/medusa-update/src/manifest.rs crates/medusa-update/src/github.rs crates/medusa-update/src/install.rs crates/medusa-update/src/lib.rs
          git commit -m "Harden signed manifest parsing and bounded downloads"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
