name: Apply 655 Updater Hardening

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0 # 1.88.0
        with:
          components: rustfmt
      - name: Apply fail-closed hardening and compatibility
        run: |
          set -euo pipefail
          python3 scripts/apply-655-hardening.py
          python3 scripts/apply-655-compatibility.py
          python3 scripts/apply-655-integration-fix.py
      - name: Format and validate focused crates
        shell: bash
        run: |
          set -o pipefail
          {
            cargo fmt --all
            cargo test -p medusa-update --all-targets --locked
            cargo test -p medusa-cli --bin medusa --locked update_command
          } 2>&1 | tee focused-updater-tests.log
      - name: Upload focused test log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: focused-updater-tests-${{ github.sha }}
          path: focused-updater-tests.log
          if-no-files-found: error
          retention-days: 2
      - name: Commit hardened updater
        shell: bash
        run: |
          set -euo pipefail
          git rm \
            scripts/apply-655-hardening.py \
            scripts/apply-655-compatibility.py \
            scripts/apply-655-integration-fix.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            crates/medusa-update/src/manifest.rs \
            crates/medusa-update/src/github.rs \
            crates/medusa-update/src/install.rs \
            crates/medusa-update/src/lib.rs \
            crates/medusa-update/src/model.rs \
            crates/medusa-update/tests/update_manager_coverage.rs \
            crates/medusa-cli/src/update_command.rs
          git commit -m "Harden signed updates and preserve updater compatibility"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
