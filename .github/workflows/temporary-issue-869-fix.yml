name: Temporary issue 869 fix

on:
  push:
    branches:
      - codex/issue-869-model-registry

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/issue-869-model-registry
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0
        with:
          toolchain: 1.88.0
          components: rustfmt
      - name: Format Rust
        run: cargo fmt --all
      - name: Refresh Desktop lockfile
        working-directory: apps/medusa-desktop/src-tauri
        run: cargo metadata --format-version 1 >/dev/null
      - name: Commit generated changes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/medusa-config/src/lib_root.rs crates/medusa-config/src/model_registry.rs crates/medusa-provider/src/model_discovery.rs apps/medusa-desktop/src-tauri/Cargo.lock
          git commit -m "Format model registry and refresh Desktop lockfile"
          git push origin HEAD:codex/issue-869-model-registry
