name: Fix 688 repair phase routing
on: push
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[repair-phase-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: perf/688-repair-phase-routing
          fetch-depth: 0
      - run: python3 scripts/fix_688_repair_phase.py
      - run: |
          rustup component add rustfmt
          cargo fmt --all
          git diff --check
          cargo test -p medusa-agent explicit_repair_phase_reaches_provider_entrypoint -- --nocapture
          cargo clippy -p medusa-agent --all-targets --all-features -- -D warnings
          git config user.name benclawbot
          git config user.email 259942410+benclawbot@users.noreply.github.com
          git add crates/medusa-agent/src/engine.rs
          git diff --cached --quiet && exit 1
          git commit -m 'fix: route replans through repair provider phase [repair-phase-patch]'
          git push origin HEAD:perf/688-repair-phase-routing
