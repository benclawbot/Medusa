name: Issue 304 refresh

on:
  push:
    branches:
      - agent/issue-304-turn-memory-pipeline

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-304-turn-memory-pipeline
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt
      - run: cargo fmt --all
      - run: cargo generate-lockfile
      - name: Commit generated artifacts
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.lock crates/medusa-runtime/src/turn_pipeline.rs
          git commit -m "Refresh turn pipeline formatting and lockfile"
          git push origin HEAD:agent/issue-304-turn-memory-pipeline
