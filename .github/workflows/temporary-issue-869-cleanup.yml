name: Temporary issue 869 cleanup

on:
  push:
    branches:
      - codex/issue-869-model-registry

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/issue-869-model-registry
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0
        with:
          toolchain: 1.88.0
          components: rustfmt
      - name: Apply lint fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('crates/medusa-config/src/model_registry.rs')
          s = p.read_text()
          s = s.replace('use std::collections::{BTreeMap, BTreeSet};', 'use std::collections::BTreeMap;')
          s = s.replace('    #[must_use]\n    pub fn recommended(&self) -> impl Iterator<Item = &ModelMetadata> {', '    pub fn recommended(&self) -> impl Iterator<Item = &ModelMetadata> {')
          s = s.replace('mod tests {\n    use super::*;', 'mod tests {\n    use std::collections::BTreeSet;\n\n    use super::*;')
          p.write_text(s)
          PY
          cargo fmt --all
          cargo fmt --manifest-path apps/medusa-desktop/src-tauri/Cargo.toml
      - name: Commit fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/medusa-config/src/model_registry.rs apps/medusa-desktop/src-tauri/src/model_registry.rs apps/medusa-desktop/src-tauri/src/lib.rs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix model registry lint and Desktop formatting"
          git push origin HEAD:codex/issue-869-model-registry
