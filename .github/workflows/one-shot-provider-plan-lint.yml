name: One-shot provider plan lint repair

on:
  push:
    branches:
      - fix/tui-input-divider-layout

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: fix/tui-input-divider-layout
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0
        with:
          toolchain: 1.88.0
          components: rustfmt,clippy
      - name: Make parser test-only
        shell: python
        run: |
          from pathlib import Path
          path = Path('crates/medusa-provider/src/plan_usage.rs')
          text = path.read_text(encoding='utf-8')
          old = 'pub(crate) fn parse_provider_plan_usage(\n'
          new = '#[cfg(test)]\npub(crate) fn parse_provider_plan_usage(\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one parser declaration, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
      - name: Validate provider and TUI
        run: |
          cargo fmt --all -- --check
          cargo clippy -p medusa-provider --all-features --locked --lib --bins --examples -- -D warnings
          cargo test -p medusa-provider --locked
          cargo test -p medusa-tui --locked
      - name: Commit source-only repair
        run: |
          rm .github/workflows/one-shot-provider-plan-lint.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/medusa-provider/src/plan_usage.rs .github/workflows/one-shot-provider-plan-lint.yml
          git commit -m "fix(provider): scope plan parser to tests"
          git push origin HEAD:fix/tui-input-divider-layout
