name: Materialize desktop runtime cleanup

on:
  pull_request:
    types: [synchronize]
    paths:
      - "validation/materialize_574_desktop_runtime_cleanup.py"
      - ".github/workflows/materialize-574-desktop-runtime-cleanup.yml"

permissions:
  contents: write

concurrency:
  group: materialize-574-cleanup-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize:
    if: github.head_ref == 'agent/574-desktop-shared-config'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/574-desktop-shared-config
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/medusa-desktop/package-lock.json
      - name: Materialize cleanup
        run: python3 validation/materialize_574_desktop_runtime_cleanup.py
      - name: Validate desktop cleanup
        working-directory: apps/medusa-desktop
        run: |
          npm ci
          npm run typecheck
          npm test -- --run
          npm run build
      - name: Commit product files and remove bootstrap
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/medusa-desktop/src/App.tsx apps/medusa-desktop/src/App.test.tsx
          git rm .github/workflows/materialize-574-desktop-runtime-cleanup.yml
          git rm validation/materialize_574_desktop_runtime_cleanup.py
          git commit -m "Close failed desktop runtime initialization"
          git push origin HEAD:agent/574-desktop-shared-config
