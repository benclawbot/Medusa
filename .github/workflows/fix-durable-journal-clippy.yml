name: Fix durable journal Clippy

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/fix-durable-journal-clippy.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.ref == 'agent/durable-session-journal-clean' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/durable-session-journal-clean
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply focused Clippy fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('crates/medusa-agent/src/journal.rs')
          source = path.read_text()
          replacements = [
              ('event: EventEnvelope,', 'event: Box<EventEnvelope>,'),
              ('event: event.clone(),', 'event: Box::new(event.clone()),'),
              (
                  'JournalRecord::Event { event } => {\n'
                  '                validate_event(session_id, &events, &event, &mut event_ids)?;\n'
                  '                events.push(event);\n'
                  '            }',
                  'JournalRecord::Event { event } => {\n'
                  '                validate_event(session_id, &events, &event, &mut event_ids)?;\n'
                  '                events.push(*event);\n'
                  '            }',
              ),
          ]
          expected = [1, 2, 1]
          for (old, new), count in zip(replacements, expected):
              actual = source.count(old)
              if actual != count:
                  raise SystemExit(f'expected {count} occurrences of {old!r}, found {actual}')
              source = source.replace(old, new)
          path.write_text(source)
          PY
          cargo fmt --all
          git rm .github/workflows/fix-durable-journal-clippy.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/medusa-agent/src/journal.rs
          git commit -m "Box durable journal event records"
          git push origin HEAD:agent/durable-session-journal-clean
