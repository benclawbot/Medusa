name: Issue 302 lock refresh

on:
  push:
    branches:
      - issue-302-runtime-supervision
    paths:
      - .github/workflows/issue-302-refresh-lock.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-302-runtime-supervision
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Refresh and commit lockfile
        run: |
          cargo generate-lockfile
          rm .github/workflows/issue-302-refresh-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock .github/workflows/issue-302-refresh-lock.yml
          git commit -m "Refresh lockfile for runtime supervision"
          git push origin HEAD:issue-302-runtime-supervision
