name: Materialize team observability

on:
  pull_request_target:
    types: [reopened, synchronize, ready_for_review]

permissions:
  contents: read

jobs:
  materialize:
    if: >-
      github.event.pull_request.number == 556 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/team-observability-steering'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/team-observability-steering
          fetch-depth: 0
          persist-credentials: false
      - name: Execute staged source edits
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/apply-team-observability.yml').read_text().splitlines()
          start = next(index for index, line in enumerate(workflow) if "python3 - <<'PY'" in line) + 1
          end = next(index for index in range(start, len(workflow)) if workflow[index].strip() == 'PY')
          source = '\n'.join(line[10:] if line.startswith('          ') else line for line in workflow[start:end]) + '\n'
          exec(compile(source, 'team-observability-materializer.py', 'exec'), {})
          PY
          rm -f .github/workflows/apply-team-observability.yml
          rm -f .github/workflows/bootstrap-team-observability.yml
          rm -f .github/team-observability-trigger
      - name: Format and validate
        run: |
          cargo fmt --all
          python3 scripts/check-product-architecture.py
          python3 scripts/check-capability-evidence.py
          git diff --check
          cargo check --workspace --all-targets
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test -p medusa-runtime -p medusa-tui -p medusa-desktop-adapter
          npm --prefix apps/medusa-desktop test -- --run
      - name: Package validated source
        shell: bash
        run: |
          git diff --name-only --diff-filter=ACMRT origin/main...HEAD > materialized-files.txt
          git diff --name-only --diff-filter=D origin/main...HEAD > materialized-deletions.txt
          tar -czf team-observability-source.tar.gz --files-from materialized-files.txt
          git rev-parse HEAD > materialized-parent.txt
          sha256sum team-observability-source.tar.gz > materialized-sha256.txt
      - name: Upload validated source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: team-observability-source
          path: |
            team-observability-source.tar.gz
            materialized-files.txt
            materialized-deletions.txt
            materialized-parent.txt
            materialized-sha256.txt
          if-no-files-found: error
