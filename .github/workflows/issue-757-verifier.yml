name: Issue 757 trigger dispatch verifier

on:
  push:
    branches:
      - agent/issue-757-scheduled-session-actions

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Complete source wiring
        shell: python
        run: |
          from pathlib import Path
          p = Path('crates/medusa-runtime/src/scheduled_actions.rs')
          s = p.read_text()
          s = s.replace('use serde_json::{Value, json};', 'use serde_json::json;')
          p.write_text(s)

          lib = Path('crates/medusa-runtime/src/lib.rs')
          text = lib.read_text()
          marker = 'pub mod review;\n'
          modules = ''
          if 'pub mod scheduled_actions;' not in text:
              modules += 'pub mod scheduled_actions;\n'
          if 'pub mod wakeup_action_bridge;' not in text:
              modules += 'pub mod wakeup_action_bridge;\n'
          if modules:
              text = text.replace(marker, marker + modules, 1)
          lib.write_text(text)
      - name: Format and refresh lock
        run: |
          cargo fmt --all
          cargo check -p medusa-runtime
      - name: Locked affected crate check
        run: cargo check -p medusa-runtime --locked
      - name: Test durable trigger dispatch
        run: cargo test -p medusa-runtime scheduled_actions --locked -- --nocapture
      - name: Test production wakeup bridge
        run: cargo test -p medusa-runtime wakeup_action_bridge --locked -- --nocapture
      - name: Clippy
        run: cargo clippy -p medusa-runtime --locked --all-targets -- -D warnings
      - name: Commit verified source
        run: |
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add Cargo.lock crates/medusa-runtime/src/scheduled_actions.rs crates/medusa-runtime/src/lib.rs crates/medusa-runtime/src/wakeup_action_bridge.rs
            git commit -m "feat(runtime): verify wakeup session action bridge"
            git push
          fi
