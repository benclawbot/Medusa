name: Format PR 607

on:
  push:
    branches:
      - agent/568-durable-media-groups

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/568-durable-media-groups
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0
        with:
          toolchain: 1.88.0
          components: rustfmt
      - run: cargo fmt --all
      - name: Commit formatter output
        run: |
          if git diff --quiet -- crates/medusa-daemon/src/telegram/runtime.rs; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/medusa-daemon/src/telegram/runtime.rs
          git commit -m "Format durable Telegram media groups"
          git push origin HEAD:agent/568-durable-media-groups
