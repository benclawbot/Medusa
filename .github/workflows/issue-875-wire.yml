name: Issue 875 repository context wiring

on:
  push:
    branches:
      - codex/issue-875-evidence-ranked-context

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Wire production context and validate
        shell: bash
        run: |
          python3 .github/issue-875-wire.py
          cargo fmt --all
          cargo test -p medusa-runtime --locked repository_context -- --nocapture
          cargo clippy -p medusa-runtime --all-targets --locked -- -D warnings
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/issue-875-wire.yml .github/issue-875-wire.py
          git add crates/medusa-runtime/src/lib.rs crates/medusa-runtime/src/repository_context.rs
          git commit -m 'feat(runtime): rank repository context before model turns'
          git push origin HEAD:codex/issue-875-evidence-ranked-context
