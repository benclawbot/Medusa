name: Apply read-only worker budget fix

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.event.pull_request.head.ref == 'agent/fix-readonly-worker-budget'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0
        with:
          components: rustfmt, clippy
      - name: Apply bounded worker regression fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/medusa-runtime/src/multi_agent_coordinator.rs')
          source = path.read_text()
          old = 'const WORKER_TURN_LIMIT: u32 = 6;'
          new = 'const WORKER_TURN_LIMIT: u32 = 12;'
          if source.count(old) != 1:
              raise SystemExit('expected exactly one read-only worker turn limit')
          path.write_text(source.replace(old, new, 1))
          PY
      - name: Format
        run: cargo fmt --all
      - name: Check workspace
        run: cargo check --workspace --all-targets
      - name: Strict Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Runtime tests
        run: cargo test -p medusa-runtime
      - name: Commit validated source and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/apply-readonly-worker-budget-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/medusa-runtime/src/multi_agent_coordinator.rs .github/workflows/apply-readonly-worker-budget-fix.yml
          git commit -m 'Allow bounded read-only workers to complete live tasks'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
