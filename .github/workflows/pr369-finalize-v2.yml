name: PR 369 finalizer v2

on:
  pull_request_target:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  finish:
    if: github.event.pull_request.number == 369 && github.event.label.name == 'finish-pr369-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/353-oauth-gateway-preflight
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply review fixes
        shell: python
        run: |
          from pathlib import Path

          wrapper = Path('crates/medusa-cli/src/wrapper.rs')
          text = wrapper.read_text()
          old = '''    if let Err(error) = oauth_preflight::run_if_needed(&args) {
              eprintln!(
                  "{}",
                  serde_json::to_string_pretty(&error).unwrap_or_else(|_| error.to_string())
              );
              std::process::exit(1);
          }
          legacy::entry();
          '''
          if old not in text:
              raise SystemExit('wrapper preflight block not found')
          wrapper.write_text(text.replace(old, '    legacy::entry();\n'))

          main = Path('crates/medusa-cli/src/main.rs')
          text = main.read_text()
          text = text.replace('use medusa_config::Config;', 'use super::oauth_preflight;\nuse medusa_config::Config;')
          old = '''    let Some(command) = cli.command else {
              ensure_first_run()?;
              ensure_selected_runtime()?;
              let mut options = TuiOptions::for_repo(repo);
          '''
          new = '''    let Some(command) = cli.command else {
              ensure_first_run()?;
              ensure_selected_runtime()?;
              let overrides = cli.overrides.iter().cloned().collect::<BTreeMap<_, _>>();
              let config = Config::load_layers(None, None, &BTreeMap::new(), &overrides)?;
              oauth_preflight::run_if_needed(&config)?;
              let mut options = TuiOptions::for_repo(repo);
          '''
          if old not in text:
              raise SystemExit('interactive routing block not found')
          text = text.replace(old, new)
          old = '''        CommandKind::Run { objective } => {
              ensure_selected_runtime()?;
              let runtime = RuntimeController::start_with_config(repo, config);
          '''
          new = '''        CommandKind::Run { objective } => {
              ensure_selected_runtime()?;
              oauth_preflight::run_if_needed(&config)?;
              let runtime = RuntimeController::start_with_config(repo, config);
          '''
          if old not in text:
              raise SystemExit('run routing block not found')
          text = text.replace(old, new)
          old = '''        CommandKind::Resume { session } => {
              ensure_selected_runtime()?;
              let runtime = RuntimeController::start_resumed_with_config(repo, &session, config)
          '''
          new = '''        CommandKind::Resume { session } => {
              ensure_selected_runtime()?;
              oauth_preflight::run_if_needed(&config)?;
              let runtime = RuntimeController::start_resumed_with_config(repo, &session, config)
          '''
          if old not in text:
              raise SystemExit('resume routing block not found')
          main.write_text(text.replace(old, new))

          preflight = Path('crates/medusa-cli/src/oauth_preflight.rs')
          text = preflight.read_text()
          text = text.replace('''use std::{
              env, fs,
              net::{SocketAddr, TcpStream},
              path::PathBuf,
              process::Command,
              time::Duration,
          };

          use medusa_core::{ErrorCategory, ErrorCode, MedusaError, MedusaResult};
          ''', '''use std::{
              env,
              net::{SocketAddr, TcpStream},
              process::Command,
              time::Duration,
          };

          use medusa_config::Config;
          use medusa_core::{ErrorCategory, ErrorCode, MedusaError, MedusaResult};
          ''')
          start = text.index('#[derive(Debug, Default, Deserialize)]')
          end = text.index('fn preflight_disabled()')
          replacement = '''#[derive(Debug, PartialEq)]
          struct PreflightReport {
              model: String,
              tool_calling: &'static str,
              streaming: &'static str,
              cancellation: &'static str,
          }

          fn requires_preflight(config: &Config) -> bool {
              config.model.provider == "openai-oauth"
          }

          pub(crate) fn run_if_needed(config: &Config) -> MedusaResult<()> {
              if !requires_preflight(config) {
                  return Ok(());
              }
              if preflight_disabled() {
                  eprintln!(
                      "ChatGPT OAuth gateway preflight is disabled by {PREFLIGHT_ENV}; model, tool-calling, streaming, and cancellation compatibility are unverified."
                  );
                  return Ok(());
              }

              ensure_gateway_running()?;
              let base_url = config.model.base_url.as_deref().unwrap_or(DEFAULT_GATEWAY);
              let client = Client::builder()
                  .connect_timeout(Duration::from_secs(2))
                  .timeout(Duration::from_secs(15))
                  .build()
                  .map_err(gateway_transport_error)?;
              let report = probe_gateway(&client, base_url, &config.model.name)?;
              eprintln!(
                  "ChatGPT OAuth gateway verified: model={}, tool_calling={}, streaming={}, cancellation={}.",
                  report.model, report.tool_calling, report.streaming, report.cancellation
              );
              Ok(())
          }

          '''
          text = text[:start] + replacement + text[end:]
          text = text.replace('use serde::Deserialize;\n', '')
          old = '''    #[test]
              fn only_coding_sessions_trigger_preflight() {
                  assert!(is_coding_session(&[]));
                  assert!(is_coding_session(&["run".into(), "fix tests".into()]));
                  assert!(is_coding_session(&["--prompt".into(), "fix tests".into()]));
                  assert!(!is_coding_session(&["doctor".into()]));
                  assert!(!is_coding_session(&["config".into()]));
              }

          '''
          new = '''    #[test]
              fn only_oauth_provider_requires_preflight() {
                  let mut config = Config::default();
                  assert!(!requires_preflight(&config));
                  config.model.provider = "openai-oauth".into();
                  assert!(requires_preflight(&config));
              }

          '''
          if old not in text:
              raise SystemExit('preflight routing test not found')
          preflight.write_text(text.replace(old, new))
      - name: Format and regenerate lockfile
        run: |
          cargo fmt --all
          cargo generate-lockfile
      - name: Validate
        run: |
          cargo fmt --all -- --check
          cargo clippy -p medusa-cli --all-targets --locked -- -D warnings
          cargo test -p medusa-cli --locked
      - name: Commit fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/medusa-cli/src/wrapper.rs crates/medusa-cli/src/main.rs crates/medusa-cli/src/oauth_preflight.rs Cargo.lock
          git commit -m "fix: address OAuth preflight review feedback"
          git push origin HEAD:fix/353-oauth-gateway-preflight
