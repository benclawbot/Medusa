name: Apply continuity resume and lint fixes

on:
  push:
    branches:
      - agent/fix-continuity-resume-lints
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-continuity-resume-lints
      - name: Apply source changes
        shell: python
        run: |
          from pathlib import Path

          history = Path('crates/medusa-runtime/src/execution_history.rs')
          text = history.read_text()
          start = text.index('pub(crate) fn verify_resumed_session(')
          end = text.index('\npub fn inspect(', start)
          replacement = '''pub(crate) fn verify_resumed_session(
              repo: &Path,
              session: &AgentSession,
          ) -> Result<(), RuntimeError> {
              let session_id = session.id.to_string();
              let journal_events =
                  replay_events(repo, &session_id, 0).map_err(RuntimeError::agent)?;
              let expected = trace(&session_id, &journal_events)?;
              let actual = trace(&session_id, &session.events)?;
              let replay =
                  medusa_execution_replay::verify(&expected, &actual).map_err(RuntimeError::agent)?;
              replay.validate().map_err(RuntimeError::agent)?;
              if !replay.equivalent {
                  let first = replay
                      .divergences
                      .first()
                      .map(|divergence| format!("{:?}:{}", divergence.kind, divergence.subject))
                      .unwrap_or_else(|| "unknown divergence".to_owned());
                  return Err(RuntimeError::agent(format!(
                      "canonical journal replay diverged for session {} at {first}",
                      session.id
                  )));
              }
              Ok(())
          }
          '''
          text = text[:start] + replacement + text[end + 1:]

          test = '''
              #[test]
              fn malformed_optional_continuity_does_not_block_resume_verification() {
                  let repository = tempfile::tempdir().expect("repository");
                  let engine = AgentEngine::new(UnusedProvider, Config::default());
                  let session = engine
                      .create_session(repository.path(), "Resume canonical journal".to_owned())
                      .expect("session");
                  let continuity = repository
                      .path()
                      .join(".medusa/continuity")
                      .join(format!("{}.json", session.id));
                  std::fs::create_dir_all(continuity.parent().expect("continuity parent"))
                      .expect("continuity directory");
                  std::fs::write(&continuity, b"{malformed").expect("malformed continuity");

                  let restored = load_session(repository.path(), &session.id.to_string())
                      .expect("journal-backed session");
                  verify_resumed_session(repository.path(), &restored)
                      .expect("optional continuity must not block resume verification");
                  assert!(inspect(repository.path(), &session.id.to_string()).is_err());
              }
          '''
          if 'malformed_optional_continuity_does_not_block_resume_verification' not in text:
              head, tail = text.rsplit('\n}', 1)
              text = head + test + '\n}' + tail
          history.write_text(text)

          for manifest in [
              Path('crates/medusa-browser-client/Cargo.toml'),
              Path('crates/medusa-browserd/Cargo.toml'),
          ]:
              manifest_text = manifest.read_text().rstrip()
              if '[lints]' not in manifest_text:
                  manifest_text += '\n\n[lints]\nworkspace = true'
              manifest.write_text(manifest_text + '\n')

          Path('.github/workflows/agent-fix-continuity-resume-lints.yml').unlink()
      - name: Format and validate focused changes
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test --locked -p medusa-runtime execution_history
          cargo clippy --locked -p medusa-browser-client -p medusa-browserd --all-targets -- -D warnings
      - name: Commit source changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/medusa-runtime/src/execution_history.rs crates/medusa-browser-client/Cargo.toml crates/medusa-browserd/Cargo.toml .github/workflows/agent-fix-continuity-resume-lints.yml
          git commit -m "Fix optional continuity resume verification and lint inheritance"
          git push origin HEAD:agent/fix-continuity-resume-lints
