name: Apply daemon wire frontend contract

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: apply-daemon-wire-frontend-contract
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ github.event.pull_request.head.ref == 'agent/652-daemon-wire-frontend-contract' }}
    runs-on: ubuntu-latest
    steps:
      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust
      - name: Disambiguate verified server signature anchor
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path(".github/scripts/apply-daemon-wire-frontend-contract.py")
          text = path.read_text(encoding="utf-8")
          old = '''def replace_once(text: str, old: str, new: str, path: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement anchor, found {count}")
              return text.replace(old, new, 1)
          '''
          replacement = '''def replace_once(text: str, old: str, new: str, path: str) -> str:
              count = text.count(old)
              ambiguous_server_signature = (
                  "    processes: &Arc<ProcessRegistry>,\\n"
                  "    shutdown: &Arc<AtomicU8>,\\n"
              )
              if (
                  path.endswith("crates/medusa-daemon/src/server.rs")
                  and old == ambiguous_server_signature
                  and count == 2
              ):
                  return text.replace(old, new, 1)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement anchor, found {count}")
              return text.replace(old, new, 1)
          '''
          if text.count(old) != 1:
              raise SystemExit(
                  f"expected one generator replace_once definition, found {text.count(old)}"
              )
          path.write_text(text.replace(old, replacement, 1), encoding="utf-8")
          PY
      - name: Apply verified daemon wire patch
        run: python3 .github/scripts/apply-daemon-wire-frontend-contract.py
      - name: Format
        run: cargo fmt --all
      - name: Validate focused crates
        run: cargo test -p medusa-protocol -p medusa-runtime -p medusa-daemon --all-targets --locked
      - name: Lint focused crates
        run: cargo clippy -p medusa-protocol -p medusa-runtime -p medusa-daemon --all-targets --locked -- -D warnings
      - name: Validate architecture index
        run: python3 scripts/check-architecture-index.py
      - name: Remove one-shot generator
        run: |
          rm .github/scripts/apply-daemon-wire-frontend-contract.py
          rm -f .github/scripts/pathlib.py .github/scripts/daemon-wire-rerun.txt
          find .github/scripts/__pycache__ -maxdepth 1 -name 'pathlib*.pyc' -delete 2>/dev/null || true
          rmdir .github/scripts/__pycache__ 2>/dev/null || true
          rm .github/workflows/apply-daemon-wire-frontend-contract.yml
      - name: Commit generated implementation
        run: |
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Expose frontend commands through daemon protocol v2"
          git push origin HEAD:agent/652-daemon-wire-frontend-contract
