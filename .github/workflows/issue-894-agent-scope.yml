name: Issue 894 transactional agent scope

on:
  push:
    branches:
      - agent/issue-894-agent-scopes

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0
        with:
          components: rustfmt,clippy
      - name: Apply integration
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/issue-894-agent-scope.py
          python3 scripts/issue-894-request-replay-fix.py
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo check -p medusa-agent -p medusa-runtime --all-targets --locked
          cargo clippy -p medusa-agent -p medusa-runtime --all-targets --all-features --locked -- -D warnings
          cargo test -p medusa-agent agent_scope --locked
          cargo test -p medusa-agent engine --locked
          cargo test -p medusa-runtime multi_agent_coordinator --locked
          cargo test -p medusa-runtime mutating_worker_coordinator --locked
      - name: Commit validated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/issue-894-agent-scope.yml scripts/issue-894-agent-scope.py scripts/issue-894-request-replay-fix.py
          git add crates/medusa-agent crates/medusa-runtime
          git diff --cached --check
          git commit -m "Add transactional agent runtime scopes"
          git push origin HEAD:${{ github.ref_name }}
