name: CI

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fix-568:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/568-complete-telegram'
    name: Fix macOS loopback response handling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0 # 1.88.0
        with:
          components: rustfmt,clippy
      - name: Patch, verify, restore workflow, and publish
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/medusa-daemon/tests/telegram_network_coverage.rs')
          source = path.read_text()
          old_http = '''    let mut response = String::new();
              stream.read_to_string(&mut response).expect("read response");
              response
          }

          fn raw_http_request(address: SocketAddr, request: &str) -> String {
          '''
          new_http = '''    read_http_response(&mut stream)
          }

          fn raw_http_request(address: SocketAddr, request: &str) -> String {
          '''
          if source.count(old_http) != 1:
              raise SystemExit('normal HTTP response block did not match exactly')
          source = source.replace(old_http, new_http, 1)
          old_raw = '''    let mut response = String::new();
              stream
                  .read_to_string(&mut response)
                  .expect("read raw response");
              response
          }

          fn assert_status(response: &str, status: u16) {
          '''
          new_raw = '''    read_http_response(&mut stream)
          }

          fn read_http_response(stream: &mut TcpStream) -> String {
              let mut response = Vec::new();
              let mut chunk = [0_u8; 4_096];
              loop {
                  match stream.read(&mut chunk) {
                      Ok(0) => break,
                      Ok(read) => response.extend_from_slice(&chunk[..read]),
                      Err(error)
                          if error.kind() == std::io::ErrorKind::ConnectionReset
                              && !response.is_empty() =>
                      {
                          break;
                      }
                      Err(error) => panic!("read HTTP response: {error}"),
                  }
              }
              String::from_utf8(response).expect("UTF-8 HTTP response")
          }

          fn assert_status(response: &str, status: u16) {
          '''
          if source.count(old_raw) != 1:
              raise SystemExit('raw HTTP response block did not match exactly')
          path.write_text(source.replace(old_raw, new_raw, 1))
          PY
          cargo fmt --all
          cargo test -p medusa-daemon --test telegram_network_coverage --all-features -- --nocapture
          cargo clippy -p medusa-daemon --all-targets --all-features -- -D warnings
          git checkout origin/main -- .github/workflows/ci.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/medusa-daemon/tests/telegram_network_coverage.rs .github/workflows/ci.yml
          git diff --cached --check
          git commit -m 'Handle macOS loopback response resets in tests'
          EXPECTED_HEAD='${{ github.event.pull_request.head.sha }}'
          REMOTE_HEAD="$(git ls-remote origin refs/heads/agent/568-complete-telegram | cut -f1)"
          test "$REMOTE_HEAD" = "$EXPECTED_HEAD"
          git push --force-with-lease=refs/heads/agent/568-complete-telegram:$EXPECTED_HEAD origin HEAD:refs/heads/agent/568-complete-telegram
