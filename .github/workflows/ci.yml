name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  fix-pr329:
    if: github.head_ref == 'agent/issue-300-runtime-lifecycle'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply Clippy fix and restore CI
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/medusa-runtime/src/lifecycle.rs')
          text = path.read_text()
          old = 'use medusa_execution_orchestrator::{Checkpoint, ExecutionStage, ExecutionState};'
          new = 'use medusa_execution_orchestrator::{ExecutionStage, ExecutionState};'
          if old not in text:
              raise SystemExit('expected import not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git fetch --no-tags origin main
          git checkout origin/main -- .github/workflows/ci.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/medusa-runtime/src/lifecycle.rs .github/workflows/ci.yml
          git commit -m "Remove unused lifecycle checkpoint import"
          git push origin HEAD:${{ github.head_ref }}
