name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  materialize-pr-496:
    if: github.head_ref == 'agent/tui-image-attachments' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply TUI image controls
        shell: bash
        run: |
          set -euo pipefail
          patch --batch --forward -p1 < tools/pr-496-tui-image-controls.patch
          cargo fmt --all
          git fetch --no-tags --depth=1 origin main
          git checkout FETCH_HEAD -- .github/workflows/ci.yml
          rm -f tools/pr-496-tui-image-controls.patch
      - name: Commit source implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/medusa-tui/src/app.rs .github/workflows/ci.yml tools/pr-496-tui-image-controls.patch
          git commit -m 'TUI: wire image attachment controls' || exit 0
          git push origin HEAD:${{ github.head_ref }}
