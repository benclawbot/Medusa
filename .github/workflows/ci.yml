name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  issue-892-source-fix:
    name: Issue 892 source fix
    if: github.event_name == 'pull_request' && github.head_ref == 'codex/issue-892-worker-message-delivery' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/issue-892-worker-message-delivery
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0
        with:
          components: rustfmt
      - name: Make session-action replay revision independent
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          path = Path('crates/medusa-agent/src/team.rs')
          text = path.read_text()
          old = '''    let mut session = load(repo, session_id)?;
    let action_id = deterministic_action_id(session_id, idempotency_key);
    let action = SessionAction {
        action_id: action_id.clone(),
        idempotency_key: idempotency_key.to_owned(),
        source: format!("team:{sender}:{recipient}"),
        target_session_id: session_id.to_owned(),
        expected_session_revision: session.events.last().map_or(0, |event| event.sequence),
        kind: SessionActionKind::Steer,
        delivery_policy: SessionActionDeliveryPolicy::NextSafeTurnBoundary,
        wake_policy: SessionActionWakePolicy::OnBoundary,
        payload: json!({
            "text": body,
            "team": {
                "sender": sender,
                "recipient": recipient,
            }
        }),
    };
    if let Some(existing) = session
        .events
        .iter()
        .find_map(|event| match &event.payload {
            EventPayload::SessionActionAccepted { action }
                if action.idempotency_key == idempotency_key =>
            {
                Some(action)
            }
            _ => None,
        })
    {
        if existing == &action {
            return Ok(existing.action_id.clone());
        }
        return Err(invalid(
            "team instruction idempotency key was reused for a different session action",
        ));
    }
'''
          new = '''    let mut session = load(repo, session_id)?;
    let action_id = deterministic_action_id(session_id, idempotency_key);
    let source = format!("team:{sender}:{recipient}");
    let payload = json!({
        "text": body,
        "team": {
            "sender": sender,
            "recipient": recipient,
        }
    });
    if let Some(existing) = session
        .events
        .iter()
        .find_map(|event| match &event.payload {
            EventPayload::SessionActionAccepted { action }
                if action.idempotency_key == idempotency_key =>
            {
                Some(action)
            }
            _ => None,
        })
    {
        let same_instruction = existing.action_id == action_id
            && existing.source == source
            && existing.target_session_id == session_id
            && existing.kind == SessionActionKind::Steer
            && existing.delivery_policy == SessionActionDeliveryPolicy::NextSafeTurnBoundary
            && existing.wake_policy == SessionActionWakePolicy::OnBoundary
            && existing.payload == payload;
        if same_instruction {
            return Ok(existing.action_id.clone());
        }
        return Err(invalid(
            "team instruction idempotency key was reused for a different session action",
        ));
    }
    let action = SessionAction {
        action_id: action_id.clone(),
        idempotency_key: idempotency_key.to_owned(),
        source,
        target_session_id: session_id.to_owned(),
        expected_session_revision: session.events.last().map_or(0, |event| event.sequence),
        kind: SessionActionKind::Steer,
        delivery_policy: SessionActionDeliveryPolicy::NextSafeTurnBoundary,
        wake_policy: SessionActionWakePolicy::OnBoundary,
        payload,
    };
'''
          if old not in text:
              raise SystemExit('expected admit_team_instruction block not found')
          path.write_text(text.replace(old, new, 1))
          PY
          cargo fmt --all
          git fetch --no-tags origin main
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/medusa-agent/src/team.rs .github/workflows/ci.yml
          git diff --cached --check
          git commit -m 'Make team instruction replay revision independent'
          git push origin HEAD:codex/issue-892-worker-message-delivery

  quality:
    name: Workspace quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate repository artifact hygiene
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test-repository-artifacts.py
          python3 scripts/check-repository-artifacts.py
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0 # 1.88.0
        with:
          components: rustfmt,clippy
      - name: Validate committed dependency authority
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --locked --format-version 1 >/dev/null
          git diff --exit-code -- Cargo.lock
      - name: Check formatting
        shell: bash
        run: |
          set -o pipefail
          cargo fmt --all -- --check 2>&1 | tee rustfmt.log
      - name: Capture rustfmt patch
        if: failure()
        shell: bash
        run: |
          cargo fmt --all
          git diff -- . ':!Cargo.lock' > rustfmt.patch
      - name: Upload rustfmt diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rustfmt-diagnostics
          path: |
            rustfmt.log
            rustfmt.patch
          if-no-files-found: ignore
      - name: Validate unsafe boundary policy
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test-unsafe-boundary.py
          python3 scripts/check-unsafe-boundary.py
          cargo check -p medusa-process-containment --all-targets --locked
      - name: Clippy
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings 2>&1 | tee clippy.log
      - name: Upload Clippy diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: clippy-diagnostics
          path: clippy.log
          if-no-files-found: ignore
      - name: Production panic audit
        id: production_panic_audit
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/test-production-panic-exemptions.py
          python3 scripts/check-production-panic-exemptions.py
          cargo clippy --workspace --all-features --locked --lib --bins --examples -- \
            -D clippy::unwrap_used \
            -D clippy::expect_used \
            -D clippy::panic \
            2>&1 | tee production-panic-audit.log
      - name: Upload production panic diagnostics
        if: failure() && steps.production_panic_audit.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-panic-audit-diagnostics
          path: production-panic-audit.log
          if-no-files-found: error
      - name: Full workspace tests
        id: workspace_tests
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace --all-features --locked -- --nocapture 2>&1 | tee workspace-tests.log
      - name: Upload workspace test diagnostics
        if: failure() && steps.workspace_tests.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b540449e92b4886f43607fa02 # v4
        with:
          name: workspace-test-diagnostics
          path: workspace-tests.log
          if-no-files-found: error
      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --locked --no-deps
      - name: Assert authoritative validation preserved Cargo.lock
        run: git diff --exit-code -- Cargo.lock

  supply-chain:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0 # 1.88.0
      - uses: taiki-e/install-action@065d6a08a14e61e89fb0a4c10eecdbdef39c7d8e # v2
        with:
          tool: cargo-deny,cargo-audit
      - name: Install pinned cargo-machete
        shell: bash
        run: cargo install cargo-machete --version 0.9.2 --locked
      - name: Reject unused direct dependencies
        id: cargo_machete
        shell: bash
        run: |
          set -o pipefail
          cargo machete 2>&1 | tee cargo-machete.log
      - name: Upload cargo-machete diagnostics
        if: failure() && steps.cargo_machete.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cargo-machete-diagnostics
          path: cargo-machete.log
          if-no-files-found: error
      - name: Validate committed dependency authority
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --locked --format-version 1 >/dev/null
          git diff --exit-code -- Cargo.lock
          python3 scripts/check-lockfile-authority.py
          python3 scripts/test-lockfile-authority.py
      - name: Validate deterministic release evidence
        run: |
          python3 scripts/release-evidence.py self-test
          python3 scripts/release-evidence.py sbom --root . --output release-sbom-ci.json
      - name: Parse tag-only release workflow YAML
        shell: bash
        run: |
          ruby -e 'require "yaml"; YAML.safe_load_file(".github/workflows/publish-release.yml", aliases: true)'
      - name: Measure current dependency graph
        id: dependency_metrics_current
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/dependency-metrics.py measure \
            --root . \
            --output dependency-current.json \
            2>&1 | tee dependency-metrics.log
      - name: Compare pull request dependency graph with base
        id: dependency_metrics_compare
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -o pipefail
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          git worktree add ../dependency-base FETCH_HEAD
          cargo metadata --manifest-path ../dependency-base/Cargo.toml --locked --format-version 1 >/dev/null
          python3 scripts/dependency-metrics.py measure \
            --root ../dependency-base \
            --output dependency-base.json \
            2>&1 | tee -a dependency-metrics.log
          python3 scripts/dependency-metrics.py compare \
            --base dependency-base.json \
            --current dependency-current.json \
            --output dependency-comparison.md \
            2>&1 | tee -a dependency-metrics.log
          cat dependency-comparison.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload dependency metrics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-metrics
          path: |
            dependency-base.json
            dependency-current.json
            dependency-comparison.md
            release-sbom-ci.json
          if-no-files-found: ignore
      - name: Upload dependency metrics diagnostics
        if: failure() && (steps.dependency_metrics_current.outcome == 'failure' || steps.dependency_metrics_compare.outcome == 'failure')
        uses: actions/upload-artifact@ea165f8d65b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-metrics-diagnostics
          path: dependency-metrics.log
          if-no-files-found: error
      - name: Cargo deny
        id: cargo_deny
        shell: bash
        run: |
          set -o pipefail
          cargo deny check advisories sources 2>&1 | tee cargo-deny.log
      - name: Upload cargo-deny diagnostics
        if: failure() && steps.cargo_deny.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b540449e92b4886f43607fa02 # v4
        with:
          name: cargo-deny-diagnostics
          path: cargo-deny.log
          if-no-files-found: error
      - name: Cargo audit
        id: cargo_audit
        shell: bash
        run: |
          set -o pipefail
          cargo audit 2>&1 | tee cargo-audit.log
      - name: Upload cargo-audit diagnostics
        if: failure() && steps.cargo_audit.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b540449e92b4886f43607fa02 # v4
        with:
          name: cargo-audit-diagnostics
          path: cargo-audit.log
          if-no-files-found: error
      - name: Assert supply-chain validation preserved Cargo.lock
        run: git diff --exit-code -- Cargo.lock
