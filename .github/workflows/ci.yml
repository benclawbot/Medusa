name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  format-source:
    if: github.head_ref == 'agent/424-session-continuity'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/424-session-continuity
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt
      - name: Format source
        run: cargo fmt --all
      - name: Commit formatted source through contents API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          path=crates/medusa-session-continuity/src/root.rs
          sha=$(gh api repos/${{ github.repository }}/contents/$path?ref=agent/424-session-continuity --jq .sha)
          content=$(base64 -w0 "$path")
          gh api --method PUT repos/${{ github.repository }}/contents/$path \
            -f message='Format continuity migration default' \
            -f branch='agent/424-session-continuity' \
            -f sha="$sha" \
            -f content="$content"
