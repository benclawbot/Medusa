name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair-issue-568:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/568-complete-telegram'
    name: Materialize issue 568 source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/568-complete-telegram
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0 # 1.88.0
        with:
          components: rustfmt
      - name: Integrate Telegram transport source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          runtime = Path('crates/medusa-daemon/src/telegram/runtime.rs')
          source = runtime.read_text()

          def replace_once(old: str, new: str) -> None:
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'expected one runtime match, found {count}: {old[:80]!r}')
              source = source.replace(old, new, 1)

          replace_once(
              '''};

const DEFAULT_TRANSIENT_BACKOFF''',
              '''};
use super::text_fragments::{
    PendingTextFragmentState, is_text_fragment_candidate, merge_text_fragment,
};

const DEFAULT_TRANSIENT_BACKOFF'''
          )
          replace_once(
              '''    media_group_path: PathBuf,
    pending_media_groups: PendingMediaGroupState,
}''',
              '''    media_group_path: PathBuf,
    pending_media_groups: PendingMediaGroupState,
    pending_text_fragments: PendingTextFragmentState,
}'''
          )
          replace_once(
              '''        let pending_media_groups = load_media_group_state(&media_group_path)?;
        Ok(Self {
            client,
            service,
            config,
            media_group_path,
            pending_media_groups,
        })''',
              '''        let pending_media_groups = load_media_group_state(&media_group_path)?;
        let pending_text_fragments = PendingTextFragmentState::load()?;
        Ok(Self {
            client,
            service,
            config,
            media_group_path,
            pending_media_groups,
            pending_text_fragments,
        })'''
          )
          replace_once(
              '''        let mut outcomes = Vec::new();
        self.flush_due_media_groups(OffsetDateTime::now_utc(), &mut outcomes)?;

        let timeout_seconds = if self.pending_media_groups.groups.is_empty() {
''',
              '''        let mut outcomes = Vec::new();
        self.flush_due_media_groups(OffsetDateTime::now_utc(), &mut outcomes)?;
        self.flush_due_text_fragments(OffsetDateTime::now_utc(), &mut outcomes)?;

        let timeout_seconds = if self.pending_media_groups.groups.is_empty()
            && self.pending_text_fragments.is_empty()
        {
'''
          )
          replace_once(
              '''                TelegramTransportUpdate::Message { update_id, message } => {
                    self.flush_conversation_media_groups(&message, &mut outcomes)?;
                    self.process_messages(update_id, &[message], &mut outcomes)?;
                }
''',
              '''                TelegramTransportUpdate::Message { update_id, message }
                    if is_text_fragment_candidate(&message) =>
                {
                    self.queue_text_fragment(update_id, message, OffsetDateTime::now_utc())?;
                }
                TelegramTransportUpdate::Message { update_id, message } => {
                    self.flush_conversation_text_fragments(&message, &mut outcomes)?;
                    self.flush_conversation_media_groups(&message, &mut outcomes)?;
                    self.process_messages(update_id, &[message], &mut outcomes)?;
                }
'''
          )
          replace_once(
              '''        self.flush_due_media_groups(OffsetDateTime::now_utc(), &mut outcomes)?;
        self.service
''',
              '''        self.flush_due_media_groups(OffsetDateTime::now_utc(), &mut outcomes)?;
        self.flush_due_text_fragments(OffsetDateTime::now_utc(), &mut outcomes)?;
        self.service
'''
          )
          marker = '''    fn inbound_batch(
        &self,
        messages: &[TelegramBotMessage],
'''
          methods = '''    fn queue_text_fragment(
        &mut self,
        update_id: i64,
        message: TelegramBotMessage,
        now: OffsetDateTime,
    ) -> Result<(), TelegramRuntimeError> {
        let previous = self.pending_text_fragments.clone();
        self.pending_text_fragments.insert(update_id, message, now)?;
        if let Err(error) = self.pending_text_fragments.persist() {
            self.pending_text_fragments = previous;
            return Err(error);
        }
        if let Err(error) = self.service.acknowledge_transport_update(update_id) {
            self.pending_text_fragments = previous;
            self.pending_text_fragments.persist()?;
            return Err(error.into());
        }
        Ok(())
    }

    fn flush_due_text_fragments(
        &mut self,
        now: OffsetDateTime,
        outcomes: &mut Vec<TelegramServiceOutcome>,
    ) -> Result<(), TelegramRuntimeError> {
        for key in self.pending_text_fragments.due_keys(now)? {
            self.flush_text_fragment(&key, outcomes)?;
        }
        Ok(())
    }

    fn flush_conversation_text_fragments(
        &mut self,
        next: &TelegramBotMessage,
        outcomes: &mut Vec<TelegramServiceOutcome>,
    ) -> Result<(), TelegramRuntimeError> {
        for key in self.pending_text_fragments.conversation_keys(next) {
            self.flush_text_fragment(&key, outcomes)?;
        }
        Ok(())
    }

    fn flush_text_fragment(
        &mut self,
        key: &str,
        outcomes: &mut Vec<TelegramServiceOutcome>,
    ) -> Result<(), TelegramRuntimeError> {
        let Some(group) = self.pending_text_fragments.get(key).cloned() else {
            return Ok(());
        };
        let message = merge_text_fragment(&group)?;
        match self.process_messages(group.highest_update_id, &[message], outcomes) {
            Ok(()) => {
                self.pending_text_fragments.remove(key);
                self.pending_text_fragments.persist()?;
                Ok(())
            }
            Err(error) if error.is_rejected_media() => {
                self.pending_text_fragments.remove(key);
                self.pending_text_fragments.persist()?;
                Ok(())
            }
            Err(error) => Err(error),
        }
    }

'''
          if source.count(marker) != 1:
              raise SystemExit('runtime inbound marker missing')
          source = source.replace(marker, methods + marker, 1)
          replace_once(
              '''    #[error("Telegram media group exceeds the supported message count")]
    MediaGroupTooLarge,
''',
              '''    #[error("Telegram media group exceeds the supported message count")]
    MediaGroupTooLarge,
    #[error("Telegram text-fragment state is invalid")]
    InvalidTextFragmentState,
    #[error("too many pending Telegram text-fragment groups")]
    TooManyPendingTextFragments,
    #[error("Telegram text-fragment group exceeds the supported size")]
    TextFragmentGroupTooLarge,
'''
          )
          replace_once(
              '''                | Self::MediaGroupTooLarge
                | Self::RejectedMedia(_)
''',
              '''                | Self::MediaGroupTooLarge
                | Self::InvalidTextFragmentState
                | Self::TooManyPendingTextFragments
                | Self::TextFragmentGroupTooLarge
                | Self::RejectedMedia(_)
'''
          )
          runtime.write_text(source)

          bot_api = Path('crates/medusa-daemon/src/telegram/bot_api/mod.rs')
          source = bot_api.read_text()
          source = source.replace('mod types;\n', 'mod operations;\nmod types;\n', 1)
          source = source.replace(
              'pub use types::{\n',
              'pub use operations::{\n    TelegramBotCommand, TelegramOutboundFile, TelegramWebhookInfo,\n};\npub use types::{\n',
              1,
          )
          bot_api.write_text(source)

          telegram = Path('crates/medusa-daemon/src/telegram/mod.rs')
          source = telegram.read_text()
          source = source.replace('mod text_fragments;\n', 'mod text_fragments;\nmod webhook;\n', 1)
          source = source.replace(
              'pub use service::{\n',
              'pub use webhook::{TelegramWebhookConfig, TelegramWebhookError, TelegramWebhookServer};\npub use service::{\n',
              1,
          )
          telegram.write_text(source)

          operations = Path('crates/medusa-daemon/src/telegram/bot_api/operations.rs')
          source = operations.read_text()
          source = source.replace('use std::fmt::Write as _;\n\n', '')
          source = source.replace('        write!(&mut String::new(), "").ok();\n', '')
          operations.write_text(source)
          PY
          cargo fmt --all
          git fetch origin main --depth=1
          git checkout FETCH_HEAD -- .github/workflows/ci.yml
          rm -f .github/workflows/apply-568-transport.yml
      - name: Commit materialized source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/medusa-daemon/src/telegram .github/workflows
          git commit -m "Integrate Telegram transport completion"
          git push origin HEAD:agent/568-complete-telegram

  quality:
    name: Workspace quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0 # 1.88.0
        with:
          components: rustfmt,clippy
      - name: Refresh dependency lock for the merged PR graph
        run: cargo generate-lockfile
      - name: Check formatting
        shell: bash
        run: |
          set -o pipefail
          cargo fmt --all -- --check 2>&1 | tee rustfmt.log
      - name: Capture rustfmt patch
        if: failure()
        shell: bash
        run: |
          cargo fmt --all
          git diff -- . ':!Cargo.lock' > rustfmt.patch
      - name: Upload rustfmt diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rustfmt-diagnostics
          path: |
            rustfmt.log
            rustfmt.patch
          if-no-files-found: ignore
      - name: Clippy
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings 2>&1 | tee clippy.log
      - name: Upload Clippy diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: clippy-diagnostics
          path: clippy.log
          if-no-files-found: ignore
      - name: Production panic audit
        id: production_panic_audit
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --workspace --all-features --locked --lib --bins --examples -- \
            -D clippy::unwrap_used \
            -D clippy::expect_used \
            -D clippy::panic \
            2>&1 | tee production-panic-audit.log
      - name: Upload production panic diagnostics
        if: failure() && steps.production_panic_audit.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-panic-audit-diagnostics
          path: production-panic-audit.log
          if-no-files-found: error
      - name: Full workspace tests
        id: workspace_tests
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace --all-features --locked -- --nocapture 2>&1 | tee workspace-tests.log
      - name: Upload workspace test diagnostics
        if: failure() && steps.workspace_tests.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: workspace-test-diagnostics
          path: workspace-tests.log
          if-no-files-found: error
      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --locked --no-deps

  supply-chain:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0 # 1.88.0
      - uses: taiki-e/install-action@065d6a08a14e61e89fb0a4c10eecdbdef39c7d8e # v2
        with:
          tool: cargo-deny,cargo-audit
      - name: Refresh dependency lock for the merged PR graph
        run: cargo generate-lockfile
      - name: Validate deterministic release evidence
        run: |
          python3 scripts/release-evidence.py self-test
          python3 scripts/release-evidence.py sbom --root . --output release-sbom-ci.json
      - name: Parse tag-only release workflow YAML
        shell: bash
        run: |
          ruby -e 'require "yaml"; YAML.safe_load_file(".github/workflows/publish-release.yml", aliases: true)'
      - name: Measure current dependency graph
        id: dependency_metrics_current
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/dependency-metrics.py measure \
            --root . \
            --output dependency-current.json \
            2>&1 | tee dependency-metrics.log
      - name: Compare pull request dependency graph with base
        id: dependency_metrics_compare
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -o pipefail
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          git worktree add ../dependency-base FETCH_HEAD
          cargo generate-lockfile --manifest-path ../dependency-base/Cargo.toml
          python3 scripts/dependency-metrics.py measure \
            --root ../dependency-base \
            --output dependency-base.json \
            2>&1 | tee -a dependency-metrics.log
          python3 scripts/dependency-metrics.py compare \
            --base dependency-base.json \
            --current dependency-current.json \
            --output dependency-comparison.md \
            2>&1 | tee -a dependency-metrics.log
          cat dependency-comparison.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload dependency metrics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-metrics
          path: |
            dependency-base.json
            dependency-current.json
            dependency-comparison.md
            release-sbom-ci.json
          if-no-files-found: ignore
      - name: Upload dependency metrics diagnostics
        if: failure() && (steps.dependency_metrics_current.outcome == 'failure' || steps.dependency_metrics_compare.outcome == 'failure')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-metrics-diagnostics
          path: dependency-metrics.log
          if-no-files-found: error
      - name: Cargo deny
        id: cargo_deny
        shell: bash
        run: |
          set -o pipefail
          cargo deny check advisories sources 2>&1 | tee cargo-deny.log
      - name: Upload cargo-deny diagnostics
        if: failure() && steps.cargo_deny.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cargo-deny-diagnostics
          path: cargo-deny.log
          if-no-files-found: error
      - name: Cargo audit
        id: cargo_audit
        shell: bash
        run: |
          set -o pipefail
          cargo audit 2>&1 | tee cargo-audit.log
      - name: Upload cargo-audit diagnostics
        if: failure() && steps.cargo_audit.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cargo-audit-diagnostics
          path: cargo-audit.log
          if-no-files-found: error
