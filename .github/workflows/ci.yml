name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  fix-pr329:
    if: github.head_ref == 'agent/issue-300-runtime-lifecycle'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt
      - name: Integrate canonical module and restore CI
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          lib = Path('crates/medusa-runtime/src/lib.rs')
          text = lib.read_text()
          marker = 'pub mod commands;\n'
          if 'pub mod lifecycle;' not in text:
              if marker not in text:
                  raise SystemExit('commands module marker not found')
              text = text.replace(marker, marker + 'pub mod lifecycle;\n', 1)
              lib.write_text(text)
          cargo = Path('crates/medusa-runtime/Cargo.toml')
          cargo_text = cargo.read_text()
          cargo_text = cargo_text.replace('\n[lib]\npath = "src/runtime_lib.rs"\n', '\n', 1)
          cargo.write_text(cargo_text)
          PY
          rm -f crates/medusa-runtime/src/runtime_lib.rs
          cargo fmt --all
          cargo generate-lockfile
          git fetch --no-tags origin main
          git checkout origin/main -- .github/workflows/ci.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.lock crates/medusa-runtime/Cargo.toml crates/medusa-runtime/src/lib.rs crates/medusa-runtime/src/lifecycle.rs crates/medusa-runtime/src/runtime_lib.rs .github/workflows/ci.yml
          git commit -m "Integrate lifecycle through canonical runtime module"
          git push origin HEAD:${{ github.head_ref }}
