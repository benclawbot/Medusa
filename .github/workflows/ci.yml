name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  format-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt
      - name: Format source
        run: cargo fmt --all
      - name: Upload formatted source
        uses: actions/upload-artifact@v4
        with:
          name: issue-424-formatted-root
          path: crates/medusa-session-continuity/src/root.rs
          if-no-files-found: error
