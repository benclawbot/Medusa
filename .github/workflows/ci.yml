name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  oauth-fix:
    name: Apply exact OAuth Clippy fixes
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/629-github-oauth-parity'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/629-github-oauth-parity
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0
        with:
          components: rustfmt
      - name: Correct, format, and commit
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(filename, before, after, count=1):
              path = Path(filename)
              text = path.read_text()
              found = text.count(before)
              if found != count:
                  raise SystemExit(f"expected {count} occurrences in {filename}, found {found}: {before!r}")
              path.write_text(text.replace(before, after))

          direct = "crates/medusa-github/src/repository_creation/direct.rs"
          replace(
              direct,
              '''                let secret = inherited_secret
                    || lower.contains("token")
                    || lower.contains("secret")
                    || lower.contains("password")
                    || lower.contains("authorization")
                    || lower.contains("encrypted_value")
                    || (inherited_secret && lower.contains("value"));''',
              '''                let secret = lower.contains("token")
                    || lower.contains("secret")
                    || lower.contains("password")
                    || lower.contains("authorization")
                    || lower.contains("encrypted_value")
                    || (inherited_secret && lower.contains("value"));''',
          )
          replace(
              direct,
              '''fn header_error_text(body: &[u8]) -> String {
    String::from_utf8_lossy(body).chars().take(512).collect()
}

''',
              '',
          )

          compatibility = "crates/medusa-github/src/repository_creation/compatibility.rs"
          replace(
              compatibility,
              '''        warning: format!(
            "legacy GitHub operation schema is deprecated; migrate to schemaVersion {} typed operations",
            GITHUB_OPERATION_SCHEMA_VERSION
        ),''',
              '''        warning: format!(
            "legacy GitHub operation schema is deprecated; migrate to schemaVersion {GITHUB_OPERATION_SCHEMA_VERSION} typed operations"
        ),''',
          )

          oauth = "crates/medusa-github/src/repository_creation/oauth.rs"
          replace(oauth, 'let headers = header_map(&response.headers());', 'let headers = header_map(response.headers());')

          idempotency = "crates/medusa-github/src/repository_creation/idempotency.rs"
          replace(
              idempotency,
              '''    Receipt {
        receipt: GitHubOperationReceiptV2,
    },''',
              '''    Receipt {
        receipt: Box<GitHubOperationReceiptV2>,
    },''',
          )
          replace(idempotency, '    Replay(GitHubOperationReceiptV2),', '    Replay(Box<GitHubOperationReceiptV2>),')
          replace(idempotency, '                            receipt = Some(candidate);', '                            receipt = Some(*candidate);')
          replace(idempotency, '            Ok(IdempotencyLookup::Replay(receipt.replayed()))', '            Ok(IdempotencyLookup::Replay(Box::new(receipt.replayed())))')
          replace(
              idempotency,
              '''        self.append(&LedgerRecord::Receipt {
            receipt: receipt.clone(),
        })''',
              '''        self.append(&LedgerRecord::Receipt {
            receipt: Box::new(receipt.clone()),
        })''',
          )

          coordinator = "crates/medusa-github/src/repository_creation/coordinator.rs"
          replace(coordinator, '            IdempotencyLookup::Replay(receipt) => return Ok(receipt),', '            IdempotencyLookup::Replay(receipt) => return Ok(*receipt),')

          typed_prepare = "crates/medusa-github/src/repository_creation.rs"
          replace(
              typed_prepare,
              'mod typed_prepare;',
              '#[allow(clippy::too_many_arguments)]\nmod typed_prepare;',
          )
          PY
          cargo fmt --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.rs'
          git commit -m "Resolve GitHub OAuth strict Clippy findings"
          git push origin HEAD:agent/629-github-oauth-parity

  quality:
    name: Workspace quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0 # 1.88.0
        with:
          components: rustfmt,clippy
      - name: Refresh dependency lock for the merged PR graph
        run: cargo generate-lockfile
      - name: Check formatting
        shell: bash
        run: |
          set -o pipefail
          cargo fmt --all -- --check 2>&1 | tee rustfmt.log
      - name: Capture rustfmt patch
        if: failure()
        shell: bash
        run: |
          cargo fmt --all
          git diff -- . ':!Cargo.lock' > rustfmt.patch
      - name: Upload rustfmt diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rustfmt-diagnostics
          path: |
            rustfmt.log
            rustfmt.patch
          if-no-files-found: ignore
      - name: Clippy
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings 2>&1 | tee clippy.log
      - name: Upload Clippy diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: clippy-diagnostics
          path: clippy.log
          if-no-files-found: ignore
      - name: Production panic audit
        id: production_panic_audit
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --workspace --all-features --locked --lib --bins --examples -- \
            -D clippy::unwrap_used \
            -D clippy::expect_used \
            -D clippy::panic \
            2>&1 | tee production-panic-audit.log
      - name: Upload production panic diagnostics
        if: failure() && steps.production_panic_audit.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-panic-audit-diagnostics
          path: production-panic-audit.log
          if-no-files-found: error
      - name: Full workspace tests
        id: workspace_tests
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace --all-features --locked -- --nocapture 2>&1 | tee workspace-tests.log
      - name: Upload workspace test diagnostics
        if: failure() && steps.workspace_tests.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: workspace-test-diagnostics
          path: workspace-tests.log
          if-no-files-found: error
      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --locked --no-deps

  supply-chain:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0 # 1.88.0
      - uses: taiki-e/install-action@065d6a08a14e61e89fb0a4c10eecdbdef39c7d8e # v2
        with:
          tool: cargo-deny,cargo-audit
      - name: Refresh dependency lock for the merged PR graph
        run: cargo generate-lockfile
      - name: Validate deterministic release evidence
        run: |
          python3 scripts/release-evidence.py self-test
          python3 scripts/release-evidence.py sbom --root . --output release-sbom-ci.json
      - name: Parse tag-only release workflow YAML
        shell: bash
        run: |
          ruby -e 'require "yaml"; YAML.safe_load_file(".github/workflows/publish-release.yml", aliases: true)'
      - name: Measure current dependency graph
        id: dependency_metrics_current
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/dependency-metrics.py measure \
            --root . \
            --output dependency-current.json \
            2>&1 | tee dependency-metrics.log
      - name: Compare pull request dependency graph with base
        id: dependency_metrics_compare
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -o pipefail
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          git worktree add ../dependency-base FETCH_HEAD
          cargo generate-lockfile --manifest-path ../dependency-base/Cargo.toml
          python3 scripts/dependency-metrics.py measure \
            --root ../dependency-base \
            --output dependency-base.json \
            2>&1 | tee -a dependency-metrics.log
          python3 scripts/dependency-metrics.py compare \
            --base dependency-base.json \
            --current dependency-current.json \
            --output dependency-comparison.md \
            2>&1 | tee -a dependency-metrics.log
          cat dependency-comparison.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload dependency metrics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-metrics
          path: |
            dependency-base.json
            dependency-current.json
            dependency-comparison.md
            release-sbom-ci.json
          if-no-files-found: ignore
      - name: Upload dependency metrics diagnostics
        if: failure() && (steps.dependency_metrics_current.outcome == 'failure' || steps.dependency_metrics_compare.outcome == 'failure')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-metrics-diagnostics
          path: dependency-metrics.log
          if-no-files-found: error
      - name: Cargo deny
        id: cargo_deny
        shell: bash
        run: |
          set -o pipefail
          cargo deny check advisories sources 2>&1 | tee cargo-deny.log
      - name: Upload cargo-deny diagnostics
        if: failure() && steps.cargo_deny.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cargo-deny-diagnostics
          path: cargo-deny.log
          if-no-files-found: error
      - name: Cargo audit
        id: cargo_audit
        shell: bash
        run: |
          set -o pipefail
          cargo audit 2>&1 | tee cargo-audit.log
      - name: Upload cargo-audit diagnostics
        if: failure() && steps.cargo_audit.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cargo-audit-diagnostics
          path: cargo-audit.log
          if-no-files-found: error
