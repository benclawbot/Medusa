name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap-issue-474:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/issue-474-provider-image-contract'
    name: Apply issue 474 fix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt,clippy
      - name: Apply provider image capability contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/medusa-provider/src/lib.rs')
          text = path.read_text()
          replacements = [
              (
                  '''pub struct OpenAiProvider {\n    client: Client,\n''',
                  '''pub struct OpenAiProvider {\n    client: Client,\n    provider: String,\n''',
              ),
              (
                  '''        Ok(Self {\n            client: shared_http_client()?,\n            base_url: base_url.trim_end_matches('/').to_owned(),\n''',
                  '''        Ok(Self {\n            client: shared_http_client()?,\n            provider: config.model.provider.clone(),\n            base_url: base_url.trim_end_matches('/').to_owned(),\n''',
              ),
              (
                  '''    fn request_body(&self, request: &ModelRequest) -> Value {\n        let mut messages = vec![json!({"role": "system", "content": request.system})];\n''',
                  '''    fn request_body(&self, request: &ModelRequest) -> MedusaResult<Value> {\n        self.validate_request(request)?;\n        let mut messages = vec![json!({"role": "system", "content": request.system})];\n''',
              ),
              (
                  '''                    MessageBlock::Image { .. } => {}\n''',
                  '''                    MessageBlock::Image { .. } => return Err(self.unsupported_image_error()),\n''',
              ),
              (
                  '''        json!({\n            "model": self.model,\n            "messages": messages,\n            "tools": tools,\n            "max_tokens": request.max_tokens,\n            "temperature": f64::from(request.temperature_milli) / 1000.0,\n            "stream": false\n        })\n    }\n}\n\nimpl ModelProvider for OpenAiProvider {\n''',
                  '''        Ok(json!({\n            "model": self.model,\n            "messages": messages,\n            "tools": tools,\n            "max_tokens": request.max_tokens,\n            "temperature": f64::from(request.temperature_milli) / 1000.0,\n            "stream": false\n        }))\n    }\n\n    fn validate_request(&self, request: &ModelRequest) -> MedusaResult<()> {\n        if !request.tools.is_empty() && !self.capabilities.tool_calling {\n            return Err(MedusaError::new(\n                ErrorCode::DependencyUnavailable,\n                ErrorCategory::Validation,\n                "selected route does not support tool calling",\n            ));\n        }\n        if request\n            .messages\n            .iter()\n            .flat_map(|message| &message.content)\n            .any(|block| matches!(block, MessageBlock::Image { .. }))\n        {\n            return Err(self.unsupported_image_error());\n        }\n        Ok(())\n    }\n\n    fn unsupported_image_error(&self) -> MedusaError {\n        let mut error = MedusaError::new(\n            ErrorCode::DependencyUnavailable,\n            ErrorCategory::Validation,\n            format!(\n                "provider route does not support image input: provider={} model={} endpoint={}",\n                self.provider, self.model, self.base_url\n            ),\n        );\n        error\n            .context\n            .insert("provider".to_owned(), Value::from(self.provider.clone()));\n        error\n            .context\n            .insert("model".to_owned(), Value::from(self.model.clone()));\n        error\n            .context\n            .insert("endpoint".to_owned(), Value::from(self.base_url.clone()));\n        error\n            .context\n            .insert("content_type".to_owned(), Value::from("image"));\n        error\n    }\n}\n\nimpl ModelProvider for OpenAiProvider {\n''',
              ),
              (
                  '''    fn complete(&self, request: &ModelRequest) -> MedusaResult<ModelResponse> {\n        if !request.tools.is_empty() && !self.capabilities.tool_calling {\n            return Err(MedusaError::new(\n                ErrorCode::DependencyUnavailable,\n                ErrorCategory::Validation,\n                "selected route does not support tool calling",\n            ));\n        }\n        let endpoint = format!("{}/chat/completions", self.base_url);\n        let mut builder = self\n            .client\n            .post(&endpoint)\n            .json(&self.request_body(request));\n''',
                  '''    fn complete(&self, request: &ModelRequest) -> MedusaResult<ModelResponse> {\n        self.validate_request(request)?;\n        let body = self.request_body(request)?;\n        let endpoint = format!("{}/chat/completions", self.base_url);\n        let mut builder = self.client.post(&endpoint).json(&body);\n''',
              ),
              (
                  '''    #[test]\n    fn rate_limit_is_retryable() {\n''',
                  '''    #[test]\n    fn openai_rejects_images_before_request_serialization() {\n        let provider = OpenAiProvider {\n            client: Client::new(),\n            provider: "openai-compatible".to_owned(),\n            base_url: "https://example.invalid/v1".to_owned(),\n            api_key: None,\n            model: "text-only-test".to_owned(),\n            capabilities: ProviderCapabilities::default(),\n        };\n        let request = ModelRequest {\n            system: String::new(),\n            messages: vec![Message {\n                role: Role::User,\n                content: vec![MessageBlock::Image {\n                    source: ImageSource::Base64 {\n                        media_type: "image/png".to_owned(),\n                        data: "AAEC".to_owned(),\n                    },\n                    alt_text: None,\n                }],\n            }],\n            tools: Vec::new(),\n            max_tokens: 32,\n            temperature_milli: 0,\n        };\n\n        let error = provider.request_body(&request).expect_err("image must be rejected");\n        assert_eq!(error.category, ErrorCategory::Validation);\n        assert_eq!(\n            error.context.get("provider"),\n            Some(&Value::from("openai-compatible"))\n        );\n        assert_eq!(\n            error.context.get("model"),\n            Some(&Value::from("text-only-test"))\n        );\n        assert_eq!(\n            error.context.get("content_type"),\n            Some(&Value::from("image"))\n        );\n    }\n\n    #[test]\n    fn rate_limit_is_retryable() {\n''',
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'missing expected source fragment: {old[:100]!r}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          cargo fmt --all
      - name: Validate provider implementation
        run: |
          cargo test -p medusa-provider
          cargo clippy -p medusa-provider --all-targets -- -D warnings
      - name: Commit implementation and restore CI
        shell: bash
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/ci.yml
          rm -f scripts/sitecustomize.py scripts/fnmatch.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/medusa-provider/src/lib.rs .github/workflows/ci.yml scripts/sitecustomize.py scripts/fnmatch.py
          git commit -m "Enforce provider image capability contract"
          git push origin HEAD:${{ github.head_ref }}

  quality:
    name: Workspace quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt,clippy
      - name: Refresh dependency lock for the merged PR graph
        run: cargo generate-lockfile
      - name: Check formatting
        shell: bash
        run: |
          set -o pipefail
          cargo fmt --all -- --check 2>&1 | tee rustfmt.log
      - name: Capture rustfmt patch
        if: failure()
        shell: bash
        run: |
          cargo fmt --all
          git diff -- . ':!Cargo.lock' > rustfmt.patch
      - name: Upload rustfmt diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rustfmt-diagnostics
          path: |
            rustfmt.log
            rustfmt.patch
          if-no-files-found: ignore
      - name: Clippy
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings 2>&1 | tee clippy.log
      - name: Upload Clippy diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: clippy-diagnostics
          path: clippy.log
          if-no-files-found: ignore
      - name: Production panic audit
        id: production_panic_audit
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --workspace --all-features --locked --lib --bins --examples -- \
            -D clippy::unwrap_used \
            -D clippy::expect_used \
            -D clippy::panic \
            2>&1 | tee production-panic-audit.log
      - name: Upload production panic diagnostics
        if: failure() && steps.production_panic_audit.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: production-panic-audit-diagnostics
          path: production-panic-audit.log
          if-no-files-found: error
      - name: Full workspace tests
        id: workspace_tests
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace --all-features --locked -- --nocapture 2>&1 | tee workspace-tests.log
      - name: Upload workspace test diagnostics
        if: failure() && steps.workspace_tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: workspace-test-diagnostics
          path: workspace-tests.log
          if-no-files-found: error
      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --locked --no-deps

  supply-chain:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-audit
      - name: Refresh dependency lock for the merged PR graph
        run: cargo generate-lockfile
      - name: Validate deterministic release evidence
        run: |
          python3 scripts/release-evidence.py self-test
          python3 scripts/release-evidence.py sbom --root . --output release-sbom-ci.json
      - name: Parse tag-only release workflow YAML
        shell: bash
        run: |
          ruby -e 'require "yaml"; YAML.safe_load_file(".github/workflows/publish-release.yml", aliases: true)'
      - name: Measure current dependency graph
        id: dependency_metrics_current
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/dependency-metrics.py measure \
            --root . \
            --output dependency-current.json \
            2>&1 | tee dependency-metrics.log
      - name: Compare pull request dependency graph with base
        id: dependency_metrics_compare
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -o pipefail
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          git worktree add ../dependency-base FETCH_HEAD
          cargo generate-lockfile --manifest-path ../dependency-base/Cargo.toml
          python3 scripts/dependency-metrics.py measure \
            --root ../dependency-base \
            --output dependency-base.json \
            2>&1 | tee -a dependency-metrics.log
          python3 scripts/dependency-metrics.py compare \
            --base dependency-base.json \
            --current dependency-current.json \
            --output dependency-comparison.md \
            2>&1 | tee -a dependency-metrics.log
          cat dependency-comparison.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload dependency metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-metrics
          path: |
            dependency-base.json
            dependency-current.json
            dependency-comparison.md
            release-sbom-ci.json
          if-no-files-found: ignore
      - name: Upload dependency metrics diagnostics
        if: failure() && (steps.dependency_metrics_current.outcome == 'failure' || steps.dependency_metrics_compare.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: dependency-metrics-diagnostics
          path: dependency-metrics.log
          if-no-files-found: error
      - name: Cargo deny
        id: cargo_deny
        shell: bash
        run: |
          set -o pipefail
          cargo deny check advisories sources 2>&1 | tee cargo-deny.log
      - name: Upload cargo-deny diagnostics
        if: failure() && steps.cargo_deny.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: cargo-deny-diagnostics
          path: cargo-deny.log
          if-no-files-found: error
      - name: Cargo audit
        id: cargo_audit
        shell: bash
        run: |
          set -o pipefail
          cargo audit 2>&1 | tee cargo-audit.log
      - name: Upload cargo-audit diagnostics
        if: failure() && steps.cargo_audit.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: cargo-audit-diagnostics
          path: cargo-audit.log
          if-no-files-found: error
