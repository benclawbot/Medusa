name: CI

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fix-568:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/568-complete-telegram'
    name: Fix buffered Telegram cursor handling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0 # 1.88.0
        with:
          components: rustfmt,clippy
      - name: Patch, verify, restore workflow, and publish
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/fix-568-buffered-cursors.py
          cargo fmt --all
          cargo test -p medusa-daemon acknowledged_buffered_message_preserves_newer_transport_and_binding_cursors --all-features -- --nocapture
          cargo clippy -p medusa-daemon --all-targets --all-features -- -D warnings
          rm scripts/fix-568-buffered-cursors.py
          git checkout origin/main -- .github/workflows/ci.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/medusa-daemon/src/telegram/runtime.rs crates/medusa-daemon/src/telegram/service.rs scripts/fix-568-buffered-cursors.py .github/workflows/ci.yml
          git diff --cached --check
          git commit -m 'Preserve cursors for buffered Telegram submissions'
          EXPECTED_HEAD='${{ github.event.pull_request.head.sha }}'
          REMOTE_HEAD="$(git ls-remote origin refs/heads/agent/568-complete-telegram | cut -f1)"
          test "$REMOTE_HEAD" = "$EXPECTED_HEAD"
          git push --force-with-lease=refs/heads/agent/568-complete-telegram:$EXPECTED_HEAD origin HEAD:refs/heads/agent/568-complete-telegram
