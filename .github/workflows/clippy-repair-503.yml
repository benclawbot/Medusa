name: Clippy repair 503

on:
  push:
    branches:
      - agent/issue-503-correction-signals

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-503-correction-signals
      - name: Rewrite rejected method chain
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/medusa-improvement/src/correction_signals/mod.rs')
          text = path.read_text()
          old = '''    let ambiguity = (scope == CandidateScope::Unresolved)
        .then(|| vec!["durable scope cannot be inferred safely from this turn alone".to_owned()])
        .unwrap_or_default();'''
          new = '''    let ambiguity = if scope == CandidateScope::Unresolved {
        vec!["durable scope cannot be inferred safely from this turn alone".to_owned()]
    } else {
        Vec::new()
    };'''
          if old not in text:
              raise SystemExit('expected expression not found')
          path.write_text(text.replace(old, new, 1))
          PY
          cargo fmt --all
      - name: Commit repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/medusa-improvement/src/correction_signals/mod.rs
          git commit -m "fix: clarify unresolved-scope branch"
          git push origin HEAD:agent/issue-503-correction-signals
