name: Apply TUI structured activity display

on:
  push:
    branches:
      - feat/tui-structured-activity-display
    paths:
      - scripts/apply-tui-structured-activity-display.py
      - .github/workflows/apply-tui-structured-activity-display.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tui-structured-activity-display
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt
      - name: Apply exact renderer patch
        run: python3 scripts/apply-tui-structured-activity-display.py
      - name: Format changed Rust sources
        run: cargo fmt -- crates/medusa-tui/src/render/support.rs crates/medusa-tui/src/lib.rs
      - name: Run focused TUI tests
        run: cargo test -p medusa-tui tool_and_assistant_activities_render_without_detail_rows structured_activity_groups_and_lifecycle_labels_render
      - name: Commit patched renderer
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/medusa-tui/src/render/support.rs crates/medusa-tui/src/lib.rs
          git commit -m "feat(tui): structure activity and verification display"
          git push origin HEAD:feat/tui-structured-activity-display
