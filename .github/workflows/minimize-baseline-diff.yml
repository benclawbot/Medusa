name: Minimize baseline diff

on:
  push:
    branches: [fix/main-build-regressions-20260904]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/main-build-regressions-20260904
          fetch-depth: 0
      - name: Restore canonical formatting with minimal removals
        shell: bash
        run: |
          set -euo pipefail
          git show origin/main:docs/architecture/baseline.json > docs/architecture/baseline.json
          python3 - <<'PY'
          from pathlib import Path
          path = Path('docs/architecture/baseline.json')
          text = path.read_text()
          replacements = {
              '      "medusa-goal": "preserve",\n': '',
              '"medusa-world-model", "medusa-goal", "medusa-progress"': '"medusa-world-model", "medusa-progress"',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'expected baseline fragment not found: {old!r}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          python3 scripts/check-architecture-index.py
          python3 scripts/architecture-policy.py check --root . --policy .github/architecture-policy.json --report /tmp/architecture-policy-report.md
          rm -f .github/workflows/minimize-baseline-diff.yml
      - name: Commit minimal baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'chore: minimize architecture baseline diff'
          git push origin HEAD:fix/main-build-regressions-20260904
