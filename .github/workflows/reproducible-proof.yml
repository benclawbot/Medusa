name: Reproducible Safety Proof

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reproducible-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Refresh dependency lock for the merged PR graph
        run: cargo generate-lockfile
      - name: Install production sandbox backend
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns
          fi
      - name: Run reproducible safety and recovery proof
        run: cargo medusa-proof --output medusa-proof-artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: medusa-proof-Linux
          path: |
            medusa-proof-artifacts/medusa-proof.json
            medusa-proof-artifacts/acceptance/summary.json
            medusa-proof-artifacts/acceptance/*.log
          if-no-files-found: error
