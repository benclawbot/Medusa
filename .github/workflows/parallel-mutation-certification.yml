name: Parallel Mutation Certification

on:
  pull_request:
    paths:
      - 'crates/medusa-runtime/**'
      - 'crates/medusa-multi-agent-scheduler/**'
      - 'crates/medusa-workers/**'
      - 'benchmarks/performance/baselines/parallel-mutation-v1.json'
      - 'scripts/performance/certify_parallel_mutation.py'
      - '.github/workflows/parallel-mutation-certification.yml'
  schedule:
    - cron: '23 4 * * 4'
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  certify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: Linux
          - os: macos-latest
            platform: macOS
          - os: windows-latest
            platform: Windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0
      - name: Execute parallel mutation certification
        shell: bash
        run: >-
          python scripts/performance/certify_parallel_mutation.py
          --platform '${{ matrix.platform }}'
          --output parallel-mutation-certification.json
      - name: Validate performance evidence
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('parallel-mutation-certification.json').read_text(encoding='utf-8'))
          assert report['verified_success'] is True
          assert report['verification_coverage'] == 1.0
          assert report['parallel_wall_time_reduction_ratio'] >= 0.25
          assert report['decomposable_fixture_conflict_rate_ratio'] == 0.0
          assert report['deterministic_integration_verified'] is True
          assert report['fallback_and_scope_invalidation_verified'] is True
          assert report['staging_recovery_verified'] is True
          assert report['runtime_metrics_verified'] is True
          assert report['rollback_and_worker_cleanup_verified'] is True
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: parallel-mutation-certification-${{ matrix.platform }}
          path: parallel-mutation-certification.json
          if-no-files-found: error
          retention-days: 30
