name: Issue 754 CI fix

on:
  push:
    paths:
      - .github/workflows/issue-754-ci-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/issue-754-compaction-manifest-v2
      - name: Update stale V1 compaction assertion
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path("crates/medusa-agent/src/lib.rs")
          text = p.read_text()
          scope = text.index('fn compacting_and_updating_a_goal_changes_durable_session_context()')
          start = text.index('        assert_eq!(session.messages.len(), 1);', scope)
          end = text.index('        assert!(\n            session.events.iter().any', start)
          replacement = (
              '        assert!(session.messages.len() >= 2);\n'
              '        let durable_messages = serde_json::to_string(&session.messages).expect("serialize messages");\n'
              '        assert!(durable_messages.contains("[medusa-compaction-v2]"));\n'
              '        assert!(durable_messages.contains("keep the API decision"));\n'
              '        assert!(durable_messages.contains("follow-up context"));\n'
          )
          p.write_text(text[:start] + replacement + text[end:])
          PY
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0
      - run: cargo generate-lockfile
      - run: cargo fmt --all
      - name: Run corrected regression
        run: cargo test -p medusa-agent compacting_and_updating_a_goal_changes_durable_session_context --locked -- --nocapture
      - name: Commit corrected regression
        run: |
          git config user.name 'BenClawBot (AlphaOM3G1)'
          git config user.email 'benclawbot@gmail.com'
          git add crates/medusa-agent/src/lib.rs
          git commit -m 'test: update compaction v2 durable context assertion'
          git push origin HEAD:agent/issue-754-compaction-manifest-v2
