name: Issue 754 CI fix

on:
  push:
    paths:
      - '.github/workflows/issue-754-ci-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/issue-754-compaction-manifest-v2
      - name: Update stale V1 compaction assertion
        shell: python
        run: |
          from pathlib import Path
          p = Path('crates/medusa-agent/src/lib.rs')
          text = p.read_text()
          old = '''        assert_eq!(session.objective, "new durable goal");
        assert_eq!(session.messages.len(), 1);
        assert!(matches!(
            &session.messages[0].content[0],
            medusa_provider::MessageBlock::Text { text }
                if text.contains("keep the API decision") && text.contains("follow-up context")
        ));
'''
          new = '''        assert_eq!(session.objective, "new durable goal");
        assert!(session.messages.len() >= 2);
        let durable_messages = serde_json::to_string(&session.messages).expect("serialize messages");
        assert!(durable_messages.contains("[medusa-compaction-v2]"));
        assert!(durable_messages.contains("keep the API decision"));
        assert!(durable_messages.contains("follow-up context"));
'''
          if old not in text:
              raise SystemExit('stale V1 assertion block not found')
          p.write_text(text.replace(old, new, 1))
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0 # 1.88.0
      - run: cargo generate-lockfile
      - run: cargo fmt --all
      - name: Run corrected regression
        run: cargo test -p medusa-agent compacting_and_updating_a_goal_changes_durable_session_context --locked -- --nocapture
      - name: Commit corrected regression
        run: |
          git config user.name 'BenClawBot (AlphaOM3G1)'
          git config user.email 'benclawbot@gmail.com'
          git add crates/medusa-agent/src/lib.rs
          git commit -m 'test: update compaction v2 durable context assertion'
          git push origin HEAD:agent/issue-754-compaction-manifest-v2
