name: Temporary issue 869 authority

on:
  push:
    branches:
      - codex/issue-869-model-registry

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/issue-869-model-registry
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0
        with:
          toolchain: 1.88.0
          components: rustfmt
      - name: Integrate shared model authority
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('crates/medusa-config/src/model_registry.rs')
          s = p.read_text()
          s = s.replace(
              '        Ok(models) if supports_discovery => (models, ModelAvailability::Available, false),\n        Ok(_) => (&[][..], ModelAvailability::Unsupported, false),',
              '        Ok(models) => (models, ModelAvailability::Available, false),'
          )
          p.write_text(s)

          p = Path('crates/medusa-config/src/provider_catalog.rs')
          s = p.read_text()
          start = s.index('pub fn provider_model_options(')
          end = s.index('\n}\n\n/// Applies the catalog defaults', start) + 2
          replacement = '''pub fn provider_model_options(\n    provider: &str,\n    current_model: &str,\n    discovered: &[String],\n) -> Vec<String> {\n    let discovered = discovered\n        .iter()\n        .map(|id| crate::DiscoveredModel {\n            id: id.clone(),\n            display_name: None,\n        })\n        .collect::<Vec<_>>();\n    crate::model_registry(provider, current_model, Ok(&discovered), None, 0)\n        .models\n        .into_iter()\n        .map(|model| model.id)\n        .collect()\n}'''
          s = s[:start] + replacement + s[end:]
          p.write_text(s)

          p = Path('crates/medusa-provider/src/openai.rs')
          s = p.read_text()
          s = s.replace('use medusa_config::Config;', 'use medusa_config::{Config, model_capabilities};')
          old = '''        let image_input = config.model.provider.eq_ignore_ascii_case("openai")\n            || config.model.auth.eq_ignore_ascii_case("chatgpt-oauth");'''
          new = '''        let registry_capabilities =\n            model_capabilities(&config.model.provider, &config.model.name);\n        let image_input = registry_capabilities.image_input;'''
          if old not in s:
              raise SystemExit('OpenAI image capability block not found')
          s = s.replace(old, new)
          s = s.replace(
              '                tool_calling: config.model.tool_calling,\n                streaming: config.model.streaming,',
              '                tool_calling: config.model.tool_calling && registry_capabilities.tool_calling,\n                streaming: config.model.streaming && registry_capabilities.streaming,'
          )
          p.write_text(s)
          PY
          cargo fmt --all
          cargo fmt --manifest-path apps/medusa-desktop/src-tauri/Cargo.toml
      - name: Commit integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/medusa-config/src/model_registry.rs crates/medusa-config/src/provider_catalog.rs crates/medusa-provider/src/openai.rs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Route model consumers through canonical registry"
          git push origin HEAD:codex/issue-869-model-registry
