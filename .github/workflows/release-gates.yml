name: Release Gates

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  final-issue-validation:
    name: Final issue validation requested
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.draft == false &&
        contains(github.event.pull_request.labels.*.name, 'final-issue-validation')
      )
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Running exhaustive release validation for an issue-closing merge.'

  coverage:
    needs: final-issue-validation
    name: Workspace coverage >= 75%
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0 # 1.88.0
        with:
          components: llvm-tools-preview
      - name: Validate committed dependency authority
        run: cargo metadata --locked --format-version 1 >/dev/null
      - uses: taiki-e/install-action@065d6a08a14e61e89fb0a4c10eecdbdef39c7d8e # v2
        with:
          tool: cargo-llvm-cov
      - name: Run complete workspace coverage suite
        shell: bash
        env:
          MEDUSA_ALLOW_INSECURE_PROVIDER_HTTP: "1"
        run: |
          set -o pipefail
          cargo llvm-cov --workspace --all-features --locked --lcov --output-path coverage.lcov --fail-under-lines 75 2>&1 | tee coverage.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coverage-diagnostics
          path: |
            coverage.log
            coverage.lcov
          if-no-files-found: warn

  adversarial-regression:
    needs: final-issue-validation
    name: Named adversarial regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0 # 1.88.0
      - name: Validate committed dependency authority
        run: cargo metadata --locked --format-version 1 >/dev/null
      - name: Install Linux sandbox backend
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns
          fi
      - name: Parent path escape is denied
        run: cargo test -p medusa-agent parent_path_escape_is_denied --locked -- --nocapture
      - name: Symlink escape is denied
        run: cargo test -p medusa-agent symlink_escape_is_denied --locked -- --nocapture
      - name: Dangerous shell commands are denied
        run: cargo test -p medusa-agent dangerous_shell_commands_are_denied --locked -- --nocapture
      - name: Sandbox blocks network and external writes
        run: cargo test -p medusa-agent sandbox_blocks_network_and_external_writes --locked -- --nocapture
      - name: Patch apply uses guarded transaction
        run: cargo test -p medusa-agent patch_apply_tool_uses_guarded_transaction --locked -- --nocapture
      - name: Parallel feature fixture merges and verifies
        run: cargo test -p medusa-workers parallel_feature_fixture_merges_and_verifies --locked -- --nocapture
      - name: Conflicting workers abort cleanly
        run: cargo test -p medusa-workers conflicting_workers_abort_cleanly --locked -- --nocapture
      - name: Malicious MCP cannot read secrets or redefine policy
        run: cargo test -p medusa-extensions malicious_mcp_cannot_read_secret_or_redefine_policy --locked -- --nocapture
      - name: Operational events redact credentials
        run: cargo test -p medusa-hardening operational_events_redact_credentials --locked -- --nocapture
      - name: Arbitrary archive paths never escape
        run: cargo test -p medusa-hardening arbitrary_archive_paths_never_escape --locked -- --nocapture

  fuzz-smoke:
    needs: final-issue-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0 # 1.88.0
      - run: bash scripts/fuzz-smoke.sh

  chaos-and-migrations:
    needs: final-issue-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0 # 1.88.0
      - run: bash scripts/chaos-smoke.sh
      - run: cargo test -p medusa-hardening clean_install_upgrade_and_rollback_are_byte_exact --locked -- --exact

  package-smoke:
    needs: final-issue-validation
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0 # 1.88.0
      - name: Validate committed dependency authority
        run: cargo metadata --locked --format-version 1
      - name: Build release package
        run: cargo build --release --locked --bin medusa --bin medusa-recall --bin medusa-github-operation
      - name: Smoke test package on Unix
        if: runner.os != 'Windows'
        run: bash scripts/package-smoke.sh
      - name: Smoke test package on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binary = 'target/release/medusa.exe'
          $recall = 'target/release/medusa-recall.exe'
          $githubOperation = 'target/release/medusa-github-operation.exe'
          & $binary --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $binary --help | Select-String 'Autonomous coding agent'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $recall --help | Select-String 'medusa-recall'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $recall --help | Select-String 'search'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $githubOperation --help | Select-String 'medusa-github-operation'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $githubOperation --help | Select-String 'interchangeable backend'

  security:
    needs: final-issue-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0 # 1.88.0
      - uses: taiki-e/install-action@065d6a08a14e61e89fb0a4c10eecdbdef39c7d8e # v2
        with:
          tool: cargo-deny,cargo-audit
      - run: cargo deny check advisories sources
      - run: cargo audit
      - run: cargo test -p medusa-extensions malicious_mcp_cannot_read_secret_or_redefine_policy --locked -- --exact
      - run: cargo test -p medusa-hardening operational_events_redact_credentials --locked -- --exact

  docs-and-schema:
    needs: final-issue-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0 # 1.88.0
      - run: RUSTDOCFLAGS='-D warnings' cargo doc --workspace --all-features --locked --no-deps
      - run: python3 scripts/release-evidence.py self-test
      - run: test -s README.md
      - run: test -s CONTRIBUTING.md
      - run: test -s docs/RELEASE.md
      - run: test -s docs/COMPATIBILITY.md
      - run: test -s docs/DESKTOP-DISTRIBUTION.md
      - run: test -s docs/OBSERVABILITY.md
      - run: test -s docs/SECURITY-HARDENING.md

  live-minimax-coding-e2e:
    needs: final-issue-validation
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
      LIVE_E2E_TIMEOUT_SECONDS: '1500'
      LIVE_E2E_HEARTBEAT_SECONDS: '60'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0 # 1.88.0
      - name: Validate committed dependency authority
        run: cargo metadata --locked --format-version 1 >/dev/null
      - name: Install Linux sandbox backend
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Require configured live-test secret
        shell: bash
        run: |
          if [[ -z "${MINIMAX_API_KEY:-}" ]]; then
            echo 'MINIMAX_API_KEY repository secret is required for the final live coding gate.' >&2
            exit 2
          fi
      - name: Mask live credential defensively
        shell: bash
        run: echo "::add-mask::$MINIMAX_API_KEY"
      - name: Run one autonomous session with three independent validations
        shell: bash
        run: bash scripts/live-coding-e2e.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: live-minimax-coding-evidence
          path: live-e2e-artifacts
          if-no-files-found: warn
