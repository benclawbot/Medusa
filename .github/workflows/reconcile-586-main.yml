name: Reconcile checkpoint recovery projection with main

on:
  push:
    branches:
      - agent/569-checkpoint-recovery-projection
    paths:
      - .github/workflows/reconcile-586-main.yml

permissions:
  contents: write

concurrency:
  group: reconcile-586-main
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.repository == 'benclawbot/Medusa'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: agent/569-checkpoint-recovery-projection
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0 # stable
      - name: Merge current main and preserve recovery projection wiring
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ]; then
            unresolved="$(git diff --name-only --diff-filter=U)"
            test "$unresolved" = "crates/medusa-runtime/src/lib.rs"
            git checkout --theirs crates/medusa-runtime/src/lib.rs
            python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/medusa-runtime/src/lib.rs')
          source = path.read_text()
          module = 'mod recovery_projection;\nmod recovery_tui;'
          if module not in source:
              target = 'mod recovery_tui;'
              if source.count(target) != 1:
                  raise SystemExit('recovery module insertion target changed')
              source = source.replace(target, module, 1)
          refresh = '        crate::recovery_projection::refresh(repo, session_id)?;\n'
          if refresh not in source:
              target = '        let checkpoint_id = checkpoint.checkpoint.fingerprint;\n'
              if source.count(target) != 1:
                  raise SystemExit('recovery refresh insertion target changed')
              source = source.replace(target, target + refresh, 1)
          path.write_text(source)
          PY
            git add crates/medusa-runtime/src/lib.rs
          fi
          test -z "$(git diff --name-only --diff-filter=U)"
      - name: Validate reconciled recovery projection
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test -p medusa-runtime recovery_projection
          cargo test -p medusa-runtime execution_history
          cargo clippy -p medusa-runtime --all-targets --all-features -- -D warnings
      - name: Commit source-only reconciliation
        run: |
          git rm .github/workflows/reconcile-586-main.yml
          git add crates/medusa-runtime/src/lib.rs crates/medusa-runtime/src/recovery_projection.rs
          git commit -m "Reconcile recovery projection with current main"
          git push origin HEAD:agent/569-checkpoint-recovery-projection
