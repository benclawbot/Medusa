name: Agent 466 final preflight

on:
  push:
    branches:
      - agent/466-mutation-provenance

permissions:
  contents: write

jobs:
  fix-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/466-mutation-provenance
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - name: Remove unused journal grouping API
        shell: python
        run: |
          from pathlib import Path
          path = Path('crates/medusa-agent/src/mutation_provenance.rs')
          text = path.read_text()
          text = text.replace('use std::{\n    collections::BTreeMap,\n    fs,\n', 'use std::{\n    fs,\n')
          block = '''\n    #[must_use]\n    pub fn by_path(&self) -> BTreeMap<&str, Vec<&MutationRecord>> {\n        let mut grouped = BTreeMap::<&str, Vec<&MutationRecord>>::new();\n        for record in &self.records {\n            grouped.entry(&record.path).or_default().push(record);\n        }\n        grouped\n    }\n'''
          if block not in text:
              raise SystemExit('expected by_path block not found')
          path.write_text(text.replace(block, ''))
      - name: Format
        run: cargo fmt --all
      - name: Remove helper workflow
        run: rm .github/workflows/agent-466-final-preflight.yml
      - name: Commit source cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/medusa-agent/src/mutation_provenance.rs .github/workflows/agent-466-final-preflight.yml
          git commit -m "fix: remove unused mutation journal grouping API"
          git push origin HEAD:agent/466-mutation-provenance
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test --workspace --all-features
      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps
