name: Issue 974 PR materialize

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Extract and apply materializer
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/issue-974-materialize.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(source) if "python3 - <<'PY'" in line) + 1
          end = next(i for i in range(start, len(source)) if source[i].strip() == 'PY')
          body = '\n'.join(line[10:] if line.startswith('          ') else line for line in source[start:end]) + '\n'
          Path('/tmp/materialize.py').write_text(body)
          PY
          python3 /tmp/materialize.py
      - name: Format and test
        run: |
          cargo fmt --all
          git diff --check
          cargo check -p medusa-tui
          cargo test -p medusa-config --locked
          cargo test -p medusa-tui --locked
          cargo check -p medusa-runtime -p medusa-tui --locked
          cargo clippy -p medusa-config -p medusa-runtime -p medusa-tui --all-targets -- -D warnings
      - name: Commit materialized fix
        shell: bash
        run: |
          rm -f .github/workflows/issue-974-materialize.yml .github/workflows/issue-974-pr-materialize.yml .github/issue-974-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(tui): make OAuth model configuration provider-aware"
          git push origin HEAD:agent/974-provider-aware-tui
