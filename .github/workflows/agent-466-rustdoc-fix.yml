name: Agent 466 rustdoc fix

on:
  push:
    branches:
      - agent/466-mutation-provenance

permissions:
  contents: write

jobs:
  fix-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/466-mutation-provenance
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - name: Fix private rustdoc link
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('crates/medusa-agent/src/transaction.rs')
          text = path.read_text()
          old = '/// [`apply_atomic_with_context`]. Legacy callers remain safe, but their writes are explicitly\n'
          new = '/// `apply_atomic_with_context`. Legacy callers remain safe, but their writes are explicitly\n'
          if old not in text:
              raise SystemExit('expected rustdoc link not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Format
        run: cargo fmt --all
      - name: Remove helper workflow
        run: rm .github/workflows/agent-466-rustdoc-fix.yml
      - name: Commit source fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/medusa-agent/src/transaction.rs .github/workflows/agent-466-rustdoc-fix.yml
          git commit -m "fix: avoid private rustdoc link"
          git push origin HEAD:agent/466-mutation-provenance
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test --workspace --all-features
      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps
