name: Patch PR 598 failure evidence

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/patch-pr-598-hardening.yml

permissions:
  contents: write

concurrency:
  group: patch-pr-598-hardening
  cancel-in-progress: false

jobs:
  patch:
    if: github.head_ref == 'agent/555-cross-platform-dogfood'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/555-cross-platform-dogfood
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Normalize method spacing
        shell: python
        run: |
          from pathlib import Path

          path = Path("scripts/live-coding-e2e.py")
          text = path.read_text(encoding="utf-8")
          old = "        return binary\n    def run_agent(self) -> None:\n"
          new = "        return binary\n\n    def run_agent(self) -> None:\n"
          if text.count(old) != 1:
              raise SystemExit("expected exactly one method-spacing boundary")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
      - name: Validate contract and regression
        run: |
          python -m py_compile scripts/live-coding-e2e.py scripts/live-dogfood-report.py scripts/test-live-dogfood.py
          python scripts/test-live-dogfood.py
      - name: Commit production change
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/live-coding-e2e.py
          git diff --cached --check
          git commit -m "Normalize live dogfood harness formatting"
          git push origin HEAD:agent/555-cross-platform-dogfood
