name: Apply first-run UX fixes

on:
  push:
    branches:
      - agent/fix-install-first-run

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact source fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} matches, found {count}")
              p.write_text(text.replace(old, new))

          # Do not consume the first key that dismisses the welcome screen.
          replace_exact(
              "crates/medusa-tui/src/session.rs",
              """            if app.dismiss_welcome_for_event(&terminal_event) {\n                continue;\n            }\n""",
              """            app.dismiss_welcome_for_event(&terminal_event);\n""",
              expected=2,
          )

          # Preserve a failed prompt for retry without deleting it from the transcript.
          replace_exact(
              "crates/medusa-tui/src/app.rs",
              """    pub fn restore_rejected_submission(&mut self, draft: PromptDraft) -> io::Result<()> {\n        if matches!(self.transcript.last(), Some(TranscriptEntry::User(existing)) if existing == &draft)\n        {\n            self.transcript.pop();\n        }\n        let cursor = draft.text.len();\n        self.composer = ComposerState { draft, cursor };\n        self.persist_draft()\n    }\n""",
              """    pub fn restore_rejected_submission(&mut self, draft: PromptDraft) -> io::Result<()> {\n        if matches!(self.transcript.last(), Some(TranscriptEntry::User(existing)) if existing == &draft)\n        {\n            self.transcript.pop();\n        }\n        self.restore_failed_submission(draft)\n    }\n\n    pub fn restore_failed_submission(&mut self, draft: PromptDraft) -> io::Result<()> {\n        let cursor = draft.text.len();\n        self.composer = ComposerState { draft, cursor };\n        self.persist_draft()\n    }\n""",
          )

          # Gate model-dependent prompts before the composer is cleared.
          replace_exact(
              "crates/medusa-tui/src/app.rs",
              """                let submitted = self.composer.draft.clone();\n                if submitted.attachments.is_empty() && submitted.text.trim() == \"/\" {\n""",
              """                let submitted = self.composer.draft.clone();\n                let submitted_text = submitted.text.trim();\n                let is_command = submitted.attachments.is_empty() && submitted_text.starts_with('/');\n                if !self.credential_configured && !is_command {\n                    self.model_modal = Some(ModelModal::new(\n                        self.model_label.as_deref(),\n                        self.effort_label.as_deref(),\n                        self.credential_configured,\n                    ));\n                    self.status = \"model configuration required before sending\".to_owned();\n                    self.transcript.push(TranscriptEntry::System(\n                        \"Configure a model/provider before sending this message. Your draft has been kept.\"\n                            .to_owned(),\n                    ));\n                    return Ok(AppAction::Redraw);\n                }\n                if submitted.attachments.is_empty() && submitted_text == \"/\" {\n""",
          )

          # On asynchronous failure restore the last submitted prompt if the composer is empty.
          replace_exact(
              "crates/medusa-tui/src/session.rs",
              """            RuntimeEvent::Failed(error) => {\n                app.record_activity(TranscriptActivity {\n                    id: None,\n                    kind: TranscriptActivityKind::Error,\n                    title: \"Task failed\".to_owned(),\n                    details: vec![error],\n                });\n                app.status = \"agent failed\".to_owned();\n                app.finish_run();\n            }\n""",
              """            RuntimeEvent::Failed(error) => {\n                let retry_draft = if app.composer.draft.text.is_empty()\n                    && app.composer.draft.attachments.is_empty()\n                {\n                    app.transcript.iter().rev().find_map(|entry| match entry {\n                        TranscriptEntry::User(draft) => Some(draft.clone()),\n                        _ => None,\n                    })\n                } else {\n                    None\n                };\n                app.record_activity(TranscriptActivity {\n                    id: None,\n                    kind: TranscriptActivityKind::Error,\n                    title: \"Task failed\".to_owned(),\n                    details: vec![error],\n                });\n                app.status = if retry_draft.is_some() {\n                    \"agent failed; draft restored\".to_owned()\n                } else {\n                    \"agent failed\".to_owned()\n                };\n                app.finish_run();\n                if let Some(draft) = retry_draft {\n                    app.restore_failed_submission(draft)?;\n                }\n            }\n""",
          )

          # Render system/daemon messages as real wrapped rows instead of one clipped row.
          replace_exact(
              "crates/medusa-tui/src/render/support.rs",
              """            TranscriptEntry::System(message) => {\n                previous_activity_group = None;\n                lines.push(system_line(message));\n            }\n""",
              """            TranscriptEntry::System(message) => {\n                previous_activity_group = None;\n                lines.extend(system_lines(message, width));\n            }\n""",
          )
          replace_exact(
              "crates/medusa-tui/src/render/support.rs",
              """pub(super) fn system_line(message: &str) -> StyledLine {\n    if message.starts_with(\"error:\") {\n        StyledLine::new(format!(\"● {message}\"), Color::Red)\n    } else if message.starts_with(\"evidence:\") {\n        StyledLine::new(format!(\"● {message}\"), Color::Blue)\n    } else if message.starts_with(\"step:\") {\n        StyledLine::new(format!(\"● {message}\"), Color::Yellow)\n    } else if message.contains(\"cancelled\") {\n        StyledLine::new(format!(\"● {message}\"), Color::DarkYellow)\n    } else {\n        StyledLine::new(format!(\"● {message}\"), Color::Green)\n    }\n}\n""",
              """pub(super) fn system_lines(message: &str, width: u16) -> Vec<StyledLine> {\n    let color = if message.starts_with(\"error:\") {\n        Color::Red\n    } else if message.starts_with(\"evidence:\") {\n        Color::Blue\n    } else if message.starts_with(\"step:\") {\n        Color::Yellow\n    } else if message.contains(\"cancelled\") {\n        Color::DarkYellow\n    } else {\n        Color::Green\n    };\n    let marker = \"● \";\n    let marker_width = marker.chars().count();\n    let content_width = usize::from(width).saturating_sub(marker_width).max(1);\n    let mut rows = Vec::new();\n    for source_line in message.split('\\n') {\n        if source_line.is_empty() {\n            rows.push(String::new());\n            continue;\n        }\n        let chars = source_line.chars().collect::<Vec<_>>();\n        rows.extend(\n            chars\n                .chunks(content_width)\n                .map(|chunk| chunk.iter().collect::<String>()),\n        );\n    }\n    if rows.is_empty() {\n        rows.push(String::new());\n    }\n    rows.into_iter()\n        .enumerate()\n        .map(|(index, row)| {\n            StyledLine::with_marker(\n                if index == 0 { marker } else { \"  \" },\n                color,\n                row,\n                color,\n            )\n        })\n        .collect()\n}\n""",
          )

          # Make prebuilt release installation the normal user path; source compilation stays a dev option.
          readme = Path("README.md")
          text = readme.read_text()
          old = """### Install the CLI from `main`\n\nThis source-install command itself uses Git:\n\n```bash\ncargo install --git https://github.com/benclawbot/Medusa.git --locked medusa-cli\n```\n\nConfirm installation:\n\n```bash\nmedusa --version\nmedusa doctor\n```\n\n### Install from a local checkout\n"""
          new = """### Install the CLI\n\nThe normal install path downloads the current prebuilt release, so it does not compile the Rust workspace. The installer shows only download progress and launches Medusa in the same terminal when installation completes.\n\nLinux/macOS:\n\n```bash\ncurl -fsSL https://raw.githubusercontent.com/benclawbot/Medusa/main/install.sh | sh\n```\n\nWindows PowerShell:\n\n```powershell\nirm https://raw.githubusercontent.com/benclawbot/Medusa/main/install.ps1 | iex\n```\n\nFor development or source-only installation, use Cargo explicitly:\n\n```bash\ncargo install --git https://github.com/benclawbot/Medusa.git --locked medusa-cli --quiet\n```\n\n### Install from a local checkout\n"""
          if text.count(old) != 1:
              raise SystemExit("README.md: installation section did not match expected text")
          readme.write_text(text.replace(old, new))
          PY

      - name: Format
        run: cargo fmt --all -- --check

      - name: TUI regression suite
        run: cargo test -p medusa-tui

      - name: Treat medusa-agent warnings as errors
        env:
          RUSTFLAGS: -Dwarnings
        run: cargo check -p medusa-agent --all-targets

      - name: Commit verified fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/agent-fix-install-first-run.yml
          git add crates/medusa-tui/src/app.rs crates/medusa-tui/src/session.rs crates/medusa-tui/src/render/support.rs README.md install.sh install.ps1
          git commit -m "fix: harden install and first-run messaging UX [skip ci]"
          git push origin HEAD:agent/fix-install-first-run
