name: Export rustfmt source

on:
  push:
    branches:
      - agent/629-github-oauth-parity

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/629-github-oauth-parity
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0
        with:
          toolchain: stable
          components: rustfmt
      - name: Normalize and commit Rust source
        run: |
          cargo fmt --all
          if git diff --quiet; then
            echo "Rust source is already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.rs'
          git commit -m "Format GitHub OAuth implementation"
          git push origin HEAD:agent/629-github-oauth-parity
