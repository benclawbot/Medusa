name: Issue 758 final verifier

on:
  push:
    branches:
      - agent/issue-758-analysis-workspace

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux sandbox backend
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Check production source
        run: cargo check -p medusa-process-containment -p medusa-agent -p medusa-runtime --locked
      - name: Test persistent workspace
        run: cargo test -p medusa-runtime analysis_workspace --locked -- --nocapture
      - name: Test contained backend
        run: cargo test -p medusa-runtime --test analysis_workspace_containment --locked -- --nocapture
      - name: Test process ownership
        run: cargo test -p medusa-process-containment process_tree --locked -- --nocapture
      - name: Test host contract
        run: cargo test -p medusa-agent analysis_host --locked -- --nocapture
      - name: Test production delegation admission
        run: cargo test -p medusa-runtime analysis_tool --locked -- --nocapture
      - name: Test durable analysis process tracker
        run: cargo test -p medusa-agent analysis_process_tracker --locked -- --nocapture
      - name: Clippy
        run: cargo clippy -p medusa-process-containment -p medusa-agent -p medusa-runtime --locked --all-targets -- -D warnings
