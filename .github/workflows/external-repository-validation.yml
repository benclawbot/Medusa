name: External Repository Validation

on:
  pull_request:
    paths:
      - 'validation/external-repositories/**'
      - 'scripts/external-validation.py'
      - 'docs/EXTERNAL-REPOSITORY-VALIDATION.md'
      - '.github/workflows/external-repository-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    name: Validate external repository contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate manifests and corpus coverage
        run: python3 scripts/external-validation.py validate
      - name: Run deterministic report self-test
        run: python3 scripts/external-validation.py self-test
