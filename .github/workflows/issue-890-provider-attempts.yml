name: Issue 890 provider attempt audit patch

on:
  push:
    branches:
      - codex/issue-890-model-request-policy
    paths:
      - scripts/issue890_provider_attempts.py
      - .github/workflows/issue-890-provider-attempts.yml

permissions:
  contents: write

jobs:
  apply-and-check:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-890-model-request-policy
          fetch-depth: 0
      - name: Apply provider attempt audit patch
        run: python3 scripts/issue890_provider_attempts.py
      - name: Format Rust
        run: cargo fmt --all
      - name: Remove one-shot tooling
        run: rm scripts/issue890_provider_attempts.py .github/workflows/issue-890-provider-attempts.yml
      - name: Commit audited source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Audit physical provider attempts"
          git push origin HEAD:codex/issue-890-model-request-policy
      - name: Clippy full workspace
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Provider retry/failover tests
        run: cargo test -p medusa-provider manager::tests::retryable_primary_failure_falls_back_and_caches_response --locked
      - name: Effective request tests
        run: cargo test -p medusa-agent effective_request --locked
