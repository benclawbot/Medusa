name: Materialize checkpoint restore lineage

on:
  pull_request:
    branches:
      - agent/569-checkpoint-recovery-projection
    paths:
      - crates/medusa-runtime/src/checkpoint_payload.rs
      - crates/medusa-runtime/src/recovery_projection.rs
      - validation/materialize_569_restore_lineage.py
      - validation/fix_569_checkpoint_payload_tests.py
      - .github/workflows/materialize-569-restore-lineage.yml

permissions:
  contents: write

concurrency:
  group: materialize-569-restore-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/569-checkpoint-restore-lineage'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0 # stable
      - name: Materialize reviewed restore wiring
        run: |
          python3 validation/materialize_569_restore_lineage.py
          python3 validation/fix_569_checkpoint_payload_tests.py
      - name: Format and validate restore lineage
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test -p medusa-protocol -p medusa-recovery-coordinator -p medusa-runtime checkpoint_payload
          cargo test -p medusa-runtime
          cargo clippy -p medusa-protocol -p medusa-recovery-coordinator -p medusa-runtime --all-targets --all-features -- -D warnings
      - name: Commit source-only result
        run: |
          git rm .github/workflows/materialize-569-restore-lineage.yml
          git rm validation/materialize_569_restore_lineage.py
          git rm validation/fix_569_checkpoint_payload_tests.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/medusa-protocol/src/lib.rs
          git add crates/medusa-runtime/src/lib.rs
          git add crates/medusa-runtime/src/checkpoint_store.rs
          git add crates/medusa-runtime/src/checkpoint_payload.rs
          git add crates/medusa-runtime/src/execution_history.rs
          git add crates/medusa-runtime/src/recovery_projection.rs
          git add crates/medusa-runtime/src/recovery_tui.rs
          git commit -m "Add checkpoint restore previews and lineage"
          git push origin HEAD:${{ github.head_ref }}
