name: Fix PR329 review findings

on:
  pull_request:

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt
      - name: Apply review fixes and remove helper
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          orchestrator = Path('crates/medusa-execution-orchestrator/src/lib.rs')
          text = orchestrator.read_text()
          needle = '''    pub fn resume(checkpoint: Checkpoint) -> Result<Self, &'static str> {
        checkpoint.validate()?;
        let next = checkpoint
            .completed_stage
            .next()
            .ok_or("cannot resume after completion")?;
        let mut state = Self {
            execution_id: checkpoint.execution_id.clone(),
            current_stage: next,
            snapshot_fingerprint: checkpoint.snapshot_fingerprint.clone(),
            attempt: checkpoint.attempt.saturating_add(1),
            checkpoints: vec![checkpoint],
            failures: Vec::new(),
            fingerprint: String::new(),
        };
        state.refresh()?;
        Ok(state)
    }
'''
          replacement = needle + '''
    pub fn resume_from_history(checkpoints: Vec<Checkpoint>) -> Result<Self, &'static str> {
        if checkpoints.is_empty() {
            return Err("cannot resume from empty checkpoint history");
        }
        for checkpoint in &checkpoints {
            checkpoint.validate()?;
        }
        if checkpoints.windows(2).any(|pair| {
            pair[0].execution_id != pair[1].execution_id
                || pair[0].snapshot_fingerprint != pair[1].snapshot_fingerprint
                || pair[0].completed_stage >= pair[1].completed_stage
        }) {
            return Err("checkpoint history is inconsistent or out of order");
        }
        let latest = checkpoints
            .last()
            .cloned()
            .ok_or("cannot resume from empty checkpoint history")?;
        let mut state = Self::resume(latest)?;
        state.checkpoints = checkpoints;
        state.refresh()?;
        Ok(state)
    }
'''
          if 'pub fn resume_from_history' not in text:
              if needle not in text:
                  raise SystemExit('orchestrator resume block not found')
              orchestrator.write_text(text.replace(needle, replacement, 1))

          runtime = Path('crates/medusa-runtime/src/lifecycle.rs')
          text = runtime.read_text()
          old_resume = '''        let latest = durable
            .state
            .checkpoints
            .last()
            .cloned()
            .ok_or(LifecycleError::NoCheckpoint)?;
        durable.state = ExecutionState::resume(latest).map_err(LifecycleError::InvalidState)?;
        durable.resumed = true;
'''
          new_resume = '''        if !durable.state.checkpoints.is_empty() {
            durable.state = ExecutionState::resume_from_history(
                durable.state.checkpoints.clone(),
            )
            .map_err(LifecycleError::InvalidState)?;
        }
        durable.resumed = true;
'''
          if old_resume not in text:
              raise SystemExit('runtime resume block not found')
          text = text.replace(old_resume, new_resume, 1)

          old_restore = '''        if preview.confirmation_token != confirmation_token {
            return Err(LifecycleError::RestoreNotConfirmed);
        }
        let checkpoint = self
            .current
            .state
            .checkpoints
            .iter()
            .find(|checkpoint| checkpoint.fingerprint == preview.checkpoint_fingerprint)
            .cloned()
            .ok_or_else(|| {
                LifecycleError::UnknownCheckpoint(preview.checkpoint_fingerprint.clone())
            })?;
        let mut candidate = self.current.clone();
        candidate.state =
            ExecutionState::resume(checkpoint).map_err(LifecycleError::InvalidState)?;
        candidate.resumed = true;
        self.save_candidate(candidate)?;
        Ok(self.protocol_event(Some(preview.snapshot.fingerprint.clone())))
'''
          new_restore = '''        let expected = self.preview_time_travel(&preview.checkpoint_fingerprint)?;
        if preview != &expected || expected.confirmation_token != confirmation_token {
            return Err(LifecycleError::RestoreNotConfirmed);
        }
        let checkpoint_index = self
            .current
            .state
            .checkpoints
            .iter()
            .position(|checkpoint| checkpoint.fingerprint == expected.checkpoint_fingerprint)
            .ok_or_else(|| {
                LifecycleError::UnknownCheckpoint(expected.checkpoint_fingerprint.clone())
            })?;
        let history = self.current.state.checkpoints[..=checkpoint_index].to_vec();
        let mut candidate = self.current.clone();
        candidate.state = ExecutionState::resume_from_history(history)
            .map_err(LifecycleError::InvalidState)?;
        candidate.resumed = true;
        self.save_candidate(candidate)?;
        Ok(self.protocol_event(Some(expected.snapshot.fingerprint)))
'''
          if old_restore not in text:
              raise SystemExit('runtime restore block not found')
          text = text.replace(old_restore, new_restore, 1)

          test_anchor = '''    #[test]
    fn deterministic_replay_matches_stage_order_and_artifacts() {
'''
          tests = '''    #[test]
    fn resumes_before_first_checkpoint() {
        let storage = MemoryStorage::default();
        let service = ExecutionLifecycleService::start(
            storage.clone(),
            "run-initial",
            artifact("snapshot"),
        )
        .unwrap();
        drop(service);

        let resumed = ExecutionLifecycleService::resume(storage, "run-initial").unwrap();
        assert_eq!(resumed.state().current_stage, ExecutionStage::Snapshot);
        assert!(resumed.state().checkpoints.is_empty());
        assert!(resumed.protocol_event(None).resumed);
    }

    #[test]
    fn resume_preserves_full_checkpoint_history() {
        let storage = MemoryStorage::default();
        let mut service = ExecutionLifecycleService::start(
            storage.clone(),
            "run-history",
            artifact("snapshot"),
        )
        .unwrap();
        for stage in [
            ExecutionStage::Snapshot,
            ExecutionStage::Context,
            ExecutionStage::Memory,
        ] {
            service
                .complete_stage(stage, vec![artifact(&format!("{stage:?}"))])
                .unwrap();
        }
        let trace_before = service.stage_trace().unwrap();
        drop(service);

        let resumed = ExecutionLifecycleService::resume(storage, "run-history").unwrap();
        assert_eq!(resumed.state().checkpoints.len(), 3);
        assert_eq!(resumed.stage_trace().unwrap(), trace_before);
    }

'''
          if 'fn resumes_before_first_checkpoint' not in text:
              if test_anchor not in text:
                  raise SystemExit('test anchor not found')
              text = text.replace(test_anchor, tests + test_anchor, 1)

          tamper_anchor = '''        service
            .confirm_restore(&preview, &preview.confirmation_token)
            .unwrap();
'''
          tamper_replacement = '''        let mut tampered = preview.clone();
        tampered.snapshot = FullSnapshot::new(HistoricalState {
            execution_id: "run-3".to_owned(),
            sequence: 1,
            values: BTreeMap::from([("tampered".to_owned(), "true".to_owned())]),
        });
        assert_eq!(
            service
                .confirm_restore(&tampered, &preview.confirmation_token)
                .unwrap_err(),
            LifecycleError::RestoreNotConfirmed
        );
        service
            .confirm_restore(&preview, &preview.confirmation_token)
            .unwrap();
'''
          if 'let mut tampered = preview.clone();' not in text:
              if tamper_anchor not in text:
                  raise SystemExit('restore test anchor not found')
              text = text.replace(tamper_anchor, tamper_replacement, 1)
          runtime.write_text(text)
          PY
          cargo fmt --all
          rm .github/workflows/fix-pr329-review.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/medusa-execution-orchestrator/src/lib.rs crates/medusa-runtime/src/lifecycle.rs .github/workflows/fix-pr329-review.yml
          git commit -m 'Address lifecycle resume and provenance review'
          git push origin HEAD:${{ github.head_ref }}
