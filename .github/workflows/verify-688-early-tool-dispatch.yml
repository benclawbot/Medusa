name: Verify 688 Early Tool Dispatch

on:
  push:
    branches: [perf/688-early-tool-dispatch-v2]

permissions:
  contents: write

concurrency:
  group: verify-688-early-tool-dispatch-v2
  cancel-in-progress: true

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: perf/688-early-tool-dispatch-v2
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0
        with:
          components: rustfmt,clippy
      - name: Apply early tool dispatch
        run: python3 .github/scripts/apply-688-early-tool-dispatch.py
      - name: Format
        run: cargo fmt --all
      - name: Focused Clippy
        run: cargo clippy -p medusa-agent -p medusa-provider -p medusa-runtime --all-targets --all-features -- -D warnings
      - name: Focused tests
        run: cargo test -p medusa-agent -p medusa-provider -p medusa-runtime -- --nocapture
      - name: Commit verified source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/medusa-agent/src/engine.rs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Dispatch safe tools from streaming provider events"
          git push origin HEAD:perf/688-early-tool-dispatch-v2
