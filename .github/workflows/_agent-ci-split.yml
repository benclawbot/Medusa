name: Agent CI split

on:
  push:
    branches:
      - agent/ci-pr-main-split

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/ci-pr-main-split
      - name: Split PR and main validation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              '.github/workflows/ci.yml': [
                  ("on:\n  push:\n    branches: [main]\n  pull_request:\n", "on:\n  pull_request:\n"),
              ],
              '.github/workflows/quickstart-smoke.yml': [
                  ("  push:\n    branches: [main]\n", ""),
              ],
              '.github/workflows/refactor-guardrails.yml': [
                  ("  push:\n    branches: [main]\n    paths:\n      - 'Cargo.toml'\n      - 'crates/**'\n      - 'apps/**'\n      - 'README.md'\n      - 'scripts/check-workflow-hygiene.sh'\n      - 'scripts/test-workflow-hygiene.sh'\n      - 'scripts/check-capability-evidence.py'\n      - 'scripts/test-capability-evidence.py'\n      - 'scripts/check-documentation.py'\n      - 'scripts/test-documentation.py'\n      - 'scripts/check-release-keyring.py'\n      - 'scripts/test-release-keyring.py'\n      - 'scripts/prepare-tauri-linux-tools.py'\n      - 'scripts/test-prepare-tauri-linux-tools.py'\n      - 'release/keys/**'\n      - 'docs/**'\n      - '.github/workflows/**'\n", ""),
              ],
              '.github/workflows/reliability-benchmarks.yml': [
                  ("  push:\n    branches: [main]\n    paths:\n      - 'benchmarks/**'\n      - 'scripts/reliability-benchmark.py'\n      - 'scripts/test-reliability-benchmark.py'\n      - 'scripts/orchestration-benchmark.py'\n      - 'scripts/test-orchestration-benchmark.py'\n      - 'scripts/coding-harness-benchmark.py'\n      - 'scripts/test-coding-harness-benchmark.py'\n      - 'scripts/compare-coding-harness-benchmarks.py'\n      - 'scripts/test-compare-coding-harness-benchmarks.py'\n      - 'crates/**'\n      - 'Cargo.toml'\n      - 'Cargo.lock'\n      - '.cargo/**'\n      - '.github/workflows/reliability-benchmarks.yml'\n", ""),
              ],
              '.github/workflows/external-repository-validation.yml': [
                  ("  push:\n    branches: [main]\n", ""),
              ],
          }

          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text()
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'expected trigger block not found in {filename}')
                  text = text.replace(old, new, 1)
              path.write_text(text)
          PY
      - name: Validate workflow YAML and hygiene
        shell: bash
        run: |
          set -euo pipefail
          for f in .github/workflows/ci.yml .github/workflows/quickstart-smoke.yml .github/workflows/refactor-guardrails.yml .github/workflows/reliability-benchmarks.yml .github/workflows/external-repository-validation.yml .github/workflows/architecture-policy.yml; do
            ruby -e 'require "yaml"; YAML.safe_load_file(ARGV[0], aliases: true)' "$f"
          done
          bash scripts/test-workflow-hygiene.sh
          rm .github/workflows/_agent-ci-split.yml
          bash scripts/check-workflow-hygiene.sh
      - name: Commit verified split
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows
          git commit -m "Run full validation before merge only"
          git push origin HEAD:agent/ci-pr-main-split
