name: Materialize issue 569 runtime event coverage

on:
  push:
    branches:
      - agent/569-runtime-durable-event-coverage
    paths:
      - .github/workflows/materialize-569.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply reviewed source patch
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .github/materialization/569.patch.gz.b64 | gzip --decompress > /tmp/569.patch
          git apply --check /tmp/569.patch
          git apply /tmp/569.patch
          rm .github/materialization/569.patch.gz.b64
          rmdir .github/materialization
          rm .github/workflows/materialize-569.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Wire durable RuntimeController events"
          git push
