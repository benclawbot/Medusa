name: Package 649 Validated Source

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: package-649-validated-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  package:
    if: github.event.pull_request.number == 662 && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Regenerate validated source
        run: python3 scripts/run-649-migration.py
      - name: Package exact source tree
        shell: bash
        run: |
          set -euo pipefail
          tar -czf validated-transaction-source.tar.gz \
            .github/workflows/architecture-v2-baseline.yml \
            crates/medusa-workers/src/lib.rs \
            crates/medusa-runtime/src/lib.rs \
            crates/medusa-runtime/src/multi_agent_coordinator.rs \
            crates/medusa-runtime/src/mutation_transaction.rs \
            crates/medusa-runtime/src/mutating_worker_coordinator.rs \
            crates/medusa-runtime/src/mutating_worker_coordinator_support.rs \
            crates/medusa-runtime/src/mutating_worker_coordinator_tests.rs \
            docs/architecture/INDEX.md \
            docs/architecture/baseline.json \
            scripts/architecture-conformance.py \
            scripts/check-architecture-index.py \
            scripts/check-mutation-lifecycle.py
          tar -tzf validated-transaction-source.tar.gz
      - name: Upload validated source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validated-transaction-source-${{ github.sha }}
          path: validated-transaction-source.tar.gz
          if-no-files-found: error
          retention-days: 2
      - name: Publish validated non-workflow files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/');
          const branch = process.env.HEAD_REF;
          const token = process.env.GITHUB_TOKEN;
          const paths = [
            'crates/medusa-workers/src/lib.rs',
            'crates/medusa-runtime/src/lib.rs',
            'crates/medusa-runtime/src/multi_agent_coordinator.rs',
            'crates/medusa-runtime/src/mutation_transaction.rs',
            'crates/medusa-runtime/src/mutating_worker_coordinator.rs',
            'crates/medusa-runtime/src/mutating_worker_coordinator_support.rs',
            'crates/medusa-runtime/src/mutating_worker_coordinator_tests.rs',
            'docs/architecture/INDEX.md',
            'docs/architecture/baseline.json',
            'scripts/architecture-conformance.py',
            'scripts/check-architecture-index.py',
            'scripts/check-mutation-lifecycle.py',
          ];

          async function request(path, options = {}) {
            const response = await fetch(`https://api.github.com${path}`, {
              ...options,
              headers: {
                Accept: 'application/vnd.github+json',
                Authorization: `Bearer ${token}`,
                'X-GitHub-Api-Version': '2022-11-28',
                'User-Agent': 'medusa-transaction-migration',
                ...(options.headers || {}),
              },
            });
            const text = await response.text();
            const data = text ? JSON.parse(text) : {};
            return { response, data, text };
          }

          (async () => {
            for (const path of paths) {
              const encodedPath = path.split('/').map(encodeURIComponent).join('/');
              const desired = fs.readFileSync(path);
              const currentResult = await request(
                `/repos/${owner}/${repo}/contents/${encodedPath}?ref=${encodeURIComponent(branch)}`,
              );
              let current = null;
              if (currentResult.response.ok) {
                current = currentResult.data;
                const existing = Buffer.from((current.content || '').replace(/\n/g, ''), 'base64');
                if (existing.equals(desired)) {
                  console.log(`unchanged ${path}`);
                  continue;
                }
              } else if (currentResult.response.status !== 404) {
                throw new Error(
                  `GET ${path}: ${currentResult.response.status} ${currentResult.text}`,
                );
              }

              const body = {
                message: `Publish validated source: ${path}`,
                content: desired.toString('base64'),
                branch,
              };
              if (current?.sha) body.sha = current.sha;
              const update = await request(`/repos/${owner}/${repo}/contents/${encodedPath}`, {
                method: 'PUT',
                body: JSON.stringify(body),
              });
              if (!update.response.ok) {
                throw new Error(`PUT ${path}: ${update.response.status} ${update.text}`);
              }
              console.log(`published ${path} at ${update.data.commit.sha}`);
            }
          })().catch((error) => {
            console.error(error.stack || error.message || String(error));
            process.exit(1);
          });
          NODE
