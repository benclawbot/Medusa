name: Format PR 245

on:
  push:
    branches:
      - agent/desktop-main-updater

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/desktop-main-updater
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Apply canonical workspace formatting
        run: cargo fmt --all
      - name: Remove one-shot formatter workflow
        run: rm -f .github/workflows/format-pr-245.yml
      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: apply canonical workspace formatting"
          git push origin HEAD:agent/desktop-main-updater
