name: Reconcile continuity commands with main

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/reconcile-589-main.yml

permissions:
  contents: write

concurrency:
  group: reconcile-589-main
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/569-continuity-commands'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0 # stable
      - name: Merge current main
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          git merge --no-commit --no-ff origin/main
          test -z "$(git diff --name-only --diff-filter=U)"
      - name: Validate reconciled continuity commands
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test -p medusa-session-continuity
          cargo test -p medusa-runtime attachment
          cargo test -p medusa-runtime execution_history
          cargo clippy -p medusa-session-continuity -p medusa-runtime --all-targets --all-features -- -D warnings
      - name: Commit source-only reconciliation
        run: |
          git rm .github/workflows/reconcile-589-main.yml
          git add crates/medusa-session-continuity/src/root.rs crates/medusa-runtime/src/attachment/session.rs
          git commit -m "Reconcile continuity commands with current main"
          git push origin HEAD:${{ github.head_ref }}
