name: Fix 688 phase-aware routing
on: push
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[phase-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: perf/688-phase-aware-routing
          fetch-depth: 0
      - run: python3 scripts/fix_688_phase_routing.py
      - run: |
          rustup component add rustfmt
          cargo fmt --all
          git diff --check
          cargo test -p medusa-provider execution_phase_can_change_route_order_without_changing_measurements -- --nocapture
          cargo clippy -p medusa-provider -p medusa-agent --all-targets --all-features -- -D warnings
          git config user.name benclawbot
          git config user.email 259942410+benclawbot@users.noreply.github.com
          git add crates/medusa-provider/src/contracts.rs crates/medusa-provider/src/lib.rs crates/medusa-provider/src/route_latency.rs crates/medusa-provider/src/manager.rs crates/medusa-agent/src/engine.rs
          git diff --cached --quiet && exit 1
          git commit -m 'feat: add phase-aware provider routing [phase-patch]'
          git push origin HEAD:perf/688-phase-aware-routing
