name: Format PR 659

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: format-pr-659-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  format:
    if: github.event.pull_request.number == 659 && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0 # 1.88.0
        with:
          components: rustfmt, clippy
      - name: Format and validate updater
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test -p medusa-update --all-targets --locked
          cargo test -p medusa-cli --bin medusa --locked update_command
          cargo clippy -p medusa-update -p medusa-cli --all-targets --locked -- -D warnings
      - name: Commit validated formatting
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/format-659.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/medusa-update/src/manifest.rs
          git commit -m "Format verified updater manifest"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
