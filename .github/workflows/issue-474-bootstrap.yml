          new = '''    fn request_body(&self, request: &ModelRequest) -> MedusaResult<Value> {
        self.validate_request(request)?;
        let mut messages = vec![json!({"role": "system", "content": request.system})];
'''
          assert old in text, 'OpenAI request_body signature changed'
