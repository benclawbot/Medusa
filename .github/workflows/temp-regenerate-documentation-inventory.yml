name: Temporary regenerate documentation inventory

on:
  push:
    branches:
      - fix/immutable-stable-release-publication

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/immutable-stable-release-publication
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Regenerate reviewed documentation inventory
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check-documentation.py --write
          git add docs/documentation-inventory.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Regenerate documentation inventory"
          git push origin HEAD:fix/immutable-stable-release-publication
