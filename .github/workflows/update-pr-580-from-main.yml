name: Update PR 580 from main

on:
  push:
    branches:
      - agent/tui-config-command
    paths:
      - .github/workflows/update-pr-580-from-main.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/tui-config-command
      - name: Merge current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if git merge-base --is-ancestor origin/main HEAD; then
            rm .github/workflows/update-pr-580-from-main.yml
            git add -A
            git commit -m "Remove completed PR 580 update workflow"
            git push origin HEAD:agent/tui-config-command
            exit 0
          fi
          if ! git merge --no-commit --no-ff origin/main; then
            git status --short
            exit 1
          fi
          rm .github/workflows/update-pr-580-from-main.yml
          git add -A
          git commit -m "Merge current main into TUI configuration command"
          git push origin HEAD:agent/tui-config-command
