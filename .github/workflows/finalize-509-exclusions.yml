name: Finalize issue 509 exclusions

on:
  push:
    branches:
      - agent/509-explainable-learning-retrieval

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[skip-finalize-509]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/509-explainable-learning-retrieval
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt
      - name: Apply and verify bounded exclusion matching
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/medusa-improvement/src/retrieval.rs')
          text = path.read_text()
          start = text.index('fn explicitly_excluded(')
          end = text.index('\nfn equal_scope_conflict', start)
          replacement = '''fn explicitly_excluded(learning: &ScopedLearning, context: &TaskContext) -> bool {
              let learning_terms = expanded_terms(&format!(
                  "{} {} {}",
                  learning.id, learning.conflict_key, learning.generalized_rule
              ));
              context.explicit_exclusions.iter().any(|excluded| {
                  learning_terms
                      .iter()
                      .any(|term| bounded_word_variant(excluded, term))
              }) || !learning
                  .applicability
                  .excluded_contexts
                  .is_disjoint(&context.scope.context_tags)
          }

          fn bounded_word_variant(left: &str, right: &str) -> bool {
              if left == right {
                  return true;
              }
              let (shorter, longer) = if left.len() <= right.len() {
                  (left, right)
              } else {
                  (right, left)
              };
              if shorter.len() < 4 {
                  return false;
              }
              longer
                  .strip_prefix(shorter)
                  .is_some_and(|suffix| matches!(suffix, "s" | "es" | "ed" | "ing"))
          }
          '''
          path.write_text(text[:start] + replacement + text[end:])
          PY
          cargo fmt --all
          cargo test -p medusa-improvement retrieval::tests::nearby_non_applicable_task_is_suppressed
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/medusa-improvement/src/retrieval.rs
          git commit -m 'Handle bounded learned-behavior exclusion variants [skip-finalize-509]'
          git push origin HEAD:agent/509-explainable-learning-retrieval
