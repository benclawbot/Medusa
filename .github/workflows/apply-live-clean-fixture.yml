name: Apply clean live release fixture

on:
  pull_request:
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/fix-readonly-worker-budget'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Make live merged-graph fixture clean
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/release-gates.yml')
          source = path.read_text()
          old = """      - name: Refresh dependency lock for the merged PR graph
        run: cargo generate-lockfile
      - name: Install Linux sandbox backend
"""
          new = """      - name: Refresh dependency lock for the merged PR graph
        run: cargo generate-lockfile
      - name: Commit the generated lockfile in the ephemeral live fixture
        shell: bash
        run: |
          git config user.name 'Medusa Release Gate'
          git config user.email 'release-gate@medusa.invalid'
          git add Cargo.lock
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh lockfile for live merged graph'
          fi
      - name: Install Linux sandbox backend
"""
          if source.count(old) != 1:
              raise SystemExit('expected exactly one live dependency-lock anchor')
          path.write_text(source.replace(old, new, 1))
          PY
      - name: Validate workflow syntax shape
        run: |
          grep -q 'Commit the generated lockfile in the ephemeral live fixture' .github/workflows/release-gates.yml
          git diff --check
      - name: Commit source-only workflow fix
        shell: bash
        run: |
          rm .github/workflows/apply-live-clean-fixture.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/release-gates.yml .github/workflows/apply-live-clean-fixture.yml
          git commit -m 'Keep the live coding fixture clean after lock refresh'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
