name: Apply issue 656 final corrections v2

on:
  push:
    branches:
      - agent/656-final-corrections-v2
    paths:
      - .github/trigger-656-final-v2

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/656-final-corrections-v2
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0
        with:
          components: rustfmt,clippy
      - name: Apply corrections
        run: python3 .github/apply-656-final-v2.py
      - name: Format and validate diff
        run: |
          cargo fmt --all
          git diff --check
      - name: Verify focused contracts
        run: |
          cargo test -p medusa-capabilities code_intelligence_tools_have_a_dedicated_truthful_capability --locked
          cargo test -p medusa-intelligence --all-features --locked typescript_workspace -- --nocapture
          cargo clippy -p medusa-capabilities -p medusa-intelligence --all-targets --all-features --locked -- -D warnings
      - name: Commit corrections
        run: |
          rm -f .github/trigger-656-final-v2 .github/apply-656-final-v2.py
          git config user.name 'Medusa CI'
          git config user.email 'actions@users.noreply.github.com'
          git add -u
          git commit -m 'Fix final code-intelligence permission and workspace filtering gaps'
          git push origin HEAD:agent/656-final-corrections-v2
