name: Fix MCP included source comment

on:
  push:
    branches:
      - issue-304-turn-memory-pipeline

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-304-turn-memory-pipeline
          fetch-depth: 0
      - name: Fix included source comment and remove workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('crates/medusa-mcp-cache/src/lib.rs')
          text = path.read_text()
          text = text.replace('//! Durable MCP schema cache and deterministic lazy connection planning.', '// Durable MCP schema cache and deterministic lazy connection planning.', 1)
          path.write_text(text)
          PY
          rm .github/workflows/fix-mcp-doc-304.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/medusa-mcp-cache/src/lib.rs .github/workflows/fix-mcp-doc-304.yml
          git commit -m "Fix MCP cache included source comment"
          git push origin HEAD:issue-304-turn-memory-pipeline
