name: Issue 890 acceptance completion

on:
  push:
    branches:
      - codex/issue-890-model-request-policy
    paths:
      - scripts/issue890_acceptance.py
      - .github/workflows/issue-890-acceptance.yml

permissions:
  contents: write

jobs:
  complete-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-890-model-request-policy
          fetch-depth: 0
      - name: Apply acceptance patch
        run: python3 scripts/issue890_acceptance.py
      - name: Format Rust
        run: cargo fmt --all
      - name: Remove one-shot tooling
        run: |
          rm -f scripts/issue890_acceptance.py .github/workflows/issue-890-acceptance.yml
          rm -f scripts/issue890_attempt_hook_alias.py .github/workflows/issue-890-attempt-hook-alias.yml
      - name: Commit acceptance source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete effective request audit authority"
          git push origin HEAD:codex/issue-890-model-request-policy
      - name: Clippy full workspace
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Effective request integration tests
        run: cargo test -p medusa-agent --test effective_request_manifest --locked
      - name: Provider retry/failover tests
        run: cargo test -p medusa-provider manager::tests::retryable_primary_failure_falls_back_and_caches_response --locked
      - name: CLI request-audit build
        run: cargo check -p medusa-cli --locked
