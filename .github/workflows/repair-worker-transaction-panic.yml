name: Repair Worker Transaction Panic Audit

on:
  push:
    branches:
      - agent/local-execution-bridge

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/local-execution-bridge
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt
      - name: Propagate transaction serialization errors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/medusa-worker-transaction/src/lib.rs')
          text = path.read_text()
          text = text.replace(
              '        ));\n        Ok(Self {',
              '        ))?;\n        Ok(Self {',
              1,
          )
          text = text.replace(
              '        decision,\n    ));\n    Ok(TransactionValidation {',
              '        decision,\n    ))?;\n    Ok(TransactionValidation {',
              1,
          )
          text = text.replace(
              'fn fingerprint<T: Serialize>(value: &T) -> String {\n    let bytes = serde_json::to_vec(value).expect("serializing transaction data cannot fail");\n    hex::encode(Sha256::digest(bytes))\n}',
              'fn fingerprint<T: Serialize>(value: &T) -> Result<String, &\'static str> {\n    let bytes = serde_json::to_vec(value).map_err(|_| "transaction serialization failed")?;\n    Ok(hex::encode(Sha256::digest(bytes)))\n}',
              1,
          )
          path.write_text(text)
          PY
          cargo fmt --all
      - name: Commit repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/medusa-worker-transaction/src/lib.rs
          git commit -m "Propagate transaction serialization errors"
          git push origin HEAD:agent/local-execution-bridge
