name: Package 650 Evidence Architecture

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: package-650-evidence-architecture-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  package:
    if: github.event.pull_request.number == 663 && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Generate and validate architecture source
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply-650-architecture.py
          python3 scripts/test-architecture-index.py
          python3 scripts/check-architecture-index.py
          python3 scripts/check-mutation-lifecycle.py
          python3 scripts/check-evidence-authority.py
          python3 scripts/architecture-conformance.py --known-failures --json
          tar -czf validated-evidence-architecture.tar.gz \
            .github/workflows/architecture-v2-baseline.yml \
            docs/architecture/INDEX.md \
            docs/architecture/baseline.json \
            docs/architecture/owners.json \
            scripts/architecture-conformance.py \
            scripts/check-architecture-index.py \
            scripts/check-evidence-authority.py
          tar -tzf validated-evidence-architecture.tar.gz
      - name: Upload validated architecture source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validated-evidence-architecture-${{ github.sha }}
          path: validated-evidence-architecture.tar.gz
          if-no-files-found: error
          retention-days: 2
