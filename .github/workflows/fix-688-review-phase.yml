name: Fix 688 review phase routing
on: push
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[review-phase-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: perf/688-review-phase-routing
          fetch-depth: 0
      - run: python3 scripts/fix_688_review_phase.py
      - run: |
          rustup component add rustfmt
          cargo fmt --all
          git diff --check
          cargo test -p medusa-agent provider_phase_tracks_production_agent_mode -- --nocapture
          cargo clippy -p medusa-agent --all-targets --all-features -- -D warnings
          git config user.name benclawbot
          git config user.email 259942410+benclawbot@users.noreply.github.com
          git add crates/medusa-agent/src/engine.rs crates/medusa-agent/src/engine_support.rs
          git diff --cached --quiet && exit 1
          git commit -m 'fix: route review mode through high-risk provider policy [review-phase-patch]'
          git push origin HEAD:perf/688-review-phase-routing
