name: Fix 688 external provider forwarding
on: push
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[external-provider-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: perf/688-review-phase-routing
          fetch-depth: 0
      - run: python3 scripts/fix_688_external_provider_forwarding.py
      - run: |
          rustup component add rustfmt
          cargo fmt --all
          git diff --check
          cargo test -p medusa-external-provider -- --nocapture
          cargo clippy -p medusa-external-provider -p medusa-runtime -p medusa-agent --all-targets --all-features -- -D warnings
          git config user.name benclawbot
          git config user.email 259942410+benclawbot@users.noreply.github.com
          git add crates/medusa-external-provider/src/lib.rs
          git diff --cached --quiet && exit 1
          git commit -m 'fix: preserve provider phase and streaming through runtime facade [external-provider-patch]'
          git push origin HEAD:perf/688-review-phase-routing
