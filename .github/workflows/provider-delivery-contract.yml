name: Provider Delivery Contract

on:
  pull_request:
    paths:
      - 'crates/medusa-cli/src/config_command.rs'
      - 'crates/medusa-cli/src/provider_diagnostic.rs'
      - 'crates/medusa-config/src/provider_catalog.rs'
      - 'crates/medusa-runtime/src/support.rs'
      - 'docs/PROVIDER-DELIVERY.md'
      - 'docs/PROVIDER-SUPPORT.md'
      - 'docs/provider-delivery-contract.json'
      - 'docs/provider-support.json'
      - 'examples/**/*.toml'
      - 'scripts/check-provider-delivery.py'
      - 'scripts/check-provider-support.py'
      - 'scripts/live-coding-e2e.py'
      - '.github/workflows/provider-delivery-contract.yml'
  push:
    branches: [main]
    paths:
      - 'crates/medusa-cli/src/config_command.rs'
      - 'crates/medusa-cli/src/provider_diagnostic.rs'
      - 'crates/medusa-config/src/provider_catalog.rs'
      - 'crates/medusa-runtime/src/support.rs'
      - 'docs/PROVIDER-DELIVERY.md'
      - 'docs/PROVIDER-SUPPORT.md'
      - 'docs/provider-delivery-contract.json'
      - 'docs/provider-support.json'
      - 'examples/**/*.toml'
      - 'scripts/check-provider-delivery.py'
      - 'scripts/check-provider-support.py'
      - 'scripts/live-coding-e2e.py'
      - '.github/workflows/provider-delivery-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: provider-delivery-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Provider choices and claims remain fail-closed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate provider delivery contract
        run: |
          python3 scripts/check-provider-delivery.py
          python3 scripts/check-provider-support.py
