name: Fix PR 762 runtime
on: push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: issue-752-durable-session-actions
          fetch-depth: 0
      - run: python3 scripts/fix_762_runtime.py
      - run: |
          rustup component add rustfmt
          cargo fmt --all
          git diff --check
          git config user.name benclawbot
          git config user.email 259942410+benclawbot@users.noreply.github.com
          git add crates/medusa-runtime/src/frontend.rs
          git diff --cached --quiet && exit 1
          git commit -m 'fix: resolve durable session action recovery races [patch-762]'
          git push origin HEAD:issue-752-durable-session-actions
