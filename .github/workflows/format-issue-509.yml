name: Format issue 509

on:
  push:
    branches:
      - agent/509-explainable-learning-retrieval

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[skip-format-509]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/509-explainable-learning-retrieval
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt
      - name: Format workspace and commit
        run: |
          cargo fmt --all
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/medusa-improvement/src/retrieval.rs crates/medusa-runtime/src/learning_retrieval.rs crates/medusa-runtime/build_main.rs crates/medusa-runtime/src/prompt.rs
          git commit -m 'Format issue 509 changes [skip-format-509]'
          git push origin HEAD:agent/509-explainable-learning-retrieval
