name: Temporary issue 873 verification contract integration

on:
  push:
    branches:
      - codex/issue-873-verification-contract

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: codex/issue-873-verification-contract
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0
        with:
          components: rustfmt, clippy
      - name: Wire verification contract into production coding loop
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'anchor not found in {path}: {old[:120]!r}')
              if text.count(old) != 1:
                  raise SystemExit(f'anchor not unique in {path}: {text.count(old)} matches')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          lib = Path('crates/medusa-agent/src/lib.rs')
          replace_once(
              lib,
              'mod verification;\nmod verification_authority;\n',
              'mod verification;\nmod verification_authority;\nmod verification_contract;\n',
          )

          contract = Path('crates/medusa-agent/src/verification_contract.rs')
          replace_once(
              contract,
              '''pub(crate) fn completion_ready(repo: &Path, session_id: &str) -> MedusaResult<bool> {\n    let Some(contract) = load_contract(repo, session_id)? else {\n        return Ok(false);\n    };\n    contract.completion_ready(repo)\n}\n\npub(crate) fn unresolved_summary''',
              '''pub(crate) fn completion_ready(repo: &Path, session_id: &str) -> MedusaResult<bool> {\n    let Some(contract) = load_contract(repo, session_id)? else {\n        return Ok(false);\n    };\n    contract.completion_ready(repo)\n}\n\npub(crate) fn mark_persisted_unavailable(\n    repo: &Path,\n    session_id: &str,\n    reason: &str,\n) -> MedusaResult<VerificationContract> {\n    let mut contract = load_contract(repo, session_id)?.ok_or_else(|| {\n        invalid("coding mutation reached unavailable verification without a verification contract")\n    })?;\n    for check in &mut contract.checks {\n        if check.requirement == VerificationRequirement::Required\n            && !matches!(\n                check.resolution,\n                VerificationResolution::Passed\n                    | VerificationResolution::ExplicitlyWaived\n                    | VerificationResolution::Superseded\n            )\n        {\n            check.resolution = VerificationResolution::Unavailable;\n            check.receipt_scope_fingerprint = None;\n        }\n    }\n    contract.constraints.push(VerificationConstraint {\n        source: "verification_authority".to_owned(),\n        requested_scope: contract.changed_paths.iter().cloned().collect(),\n        reason: reason.to_owned(),\n    });\n    contract.authoritative_passed = false;\n    contract.completion_identity = None;\n    persist_contract(repo, &contract)?;\n    Ok(contract)\n}\n\npub(crate) fn unresolved_summary''',
          )

          engine = Path('crates/medusa-agent/src/engine.rs')
          replace_once(
              engine,
              '''            let failed_dependencies = executed\n                .iter()\n''',
              '''            let verification_mutation_paths = executed\n                .iter()\n                .filter(|(_, name, input, result, _)| {\n                    result.is_ok() && crate::tool_dag::invalidates_repository_revision(name, input)\n                })\n                .filter_map(|(_, name, input, _, _)| {\n                    matches!(name.as_str(), "fs_write" | "fs_create_dir")\n                        .then(|| input.get("path").and_then(serde_json::Value::as_str))\n                        .flatten()\n                        .filter(|path| !Path::new(path).is_absolute())\n                        .map(|path| path.replace('\\\\', "/"))\n                })\n                .collect::<Vec<_>>();\n            if repository_revision_after_mutation.is_some() {\n                crate::verification_contract::refresh_persisted_after_mutation(\n                    &session.repo,\n                    session.id.as_str(),\n                    &verification_mutation_paths,\n                    self.config.model.max_output_tokens,\n                )?;\n            }\n\n            let failed_dependencies = executed\n                .iter()\n''',
          )
          replace_once(
              engine,
              '''            let changed_paths = successful_mutation_paths(session);\n            prepare_paths_for_verification(&session.repo, &changed_paths)?;\n            let mut verification =\n                authoritative_verification_for_paths(&session.repo, &changed_paths)?;\n''',
              '''            let changed_paths = successful_mutation_paths(session);\n            prepare_paths_for_verification(&session.repo, &changed_paths)?;\n            crate::verification_contract::refresh_persisted_after_mutation(\n                &session.repo,\n                session.id.as_str(),\n                &changed_paths,\n                self.config.model.max_output_tokens,\n            )?;\n            let mut verification = match authoritative_verification_for_paths(\n                &session.repo,\n                &changed_paths,\n            ) {\n                Ok(verification) => verification,\n                Err(error) => {\n                    crate::verification_contract::mark_persisted_unavailable(\n                        &session.repo,\n                        session.id.as_str(),\n                        &error.to_string(),\n                    )?;\n                    let evidence = vec![format!("verification_unavailable={error}")];\n                    append_observed(\n                        session,\n                        EventPayload::VerificationCompleted {\n                            passed: false,\n                            evidence: evidence.clone(),\n                        },\n                        &mut observer,\n                    )?;\n                    session.evidence.extend(evidence.clone());\n                    session.messages.push(Message {\n                        role: Role::User,\n                        content: vec![MessageBlock::Text {\n                            text: format!(\n                                "Required verification is unavailable. The coding task remains incomplete. Evidence:\\n{}",\n                                evidence.join("\\n")\n                            ),\n                        }],\n                    });\n                    session.updated_at = OffsetDateTime::now_utc();\n                    persist(session)?;\n                    return Ok(StepOutcome::TurnComplete);\n                }\n            };\n''',
          )
          replace_once(
              engine,
              '''            session.evidence.extend(verification.evidence.clone());\n            if verification.passed && plan_is_complete(session) {\n''',
              '''            session.evidence.extend(verification.evidence.clone());\n            let contract = crate::verification_contract::apply_persisted_authoritative_summary(\n                &session.repo,\n                session.id.as_str(),\n                &verification.evidence,\n                verification.passed,\n            )?;\n            let contract_ready = contract.completion_ready(&session.repo)?\n                && crate::verification_contract::completion_ready(\n                    &session.repo,\n                    session.id.as_str(),\n                )?;\n            if verification.passed && contract_ready && plan_is_complete(session) {\n''',
          )
          replace_once(
              engine,
              '''            } else if !verification.passed {\n                session.messages.push(Message {\n''',
              '''            } else if verification.passed && !contract_ready {\n                let unresolved = crate::verification_contract::unresolved_summary(\n                    &session.repo,\n                    session.id.as_str(),\n                )?;\n                session.evidence.extend(unresolved.clone());\n                session.messages.push(Message {\n                    role: Role::User,\n                    content: vec![MessageBlock::Text {\n                        text: format!(\n                            "Authoritative checks ran, but the mandatory verification contract is unresolved. The task remains incomplete. Evidence:\\n{}",\n                            unresolved.join("\\n")\n                        ),\n                    }],\n                });\n            } else if !verification.passed {\n                session.messages.push(Message {\n''',
          )
          PY
      - name: Format
        run: cargo fmt --all
      - name: Unit tests for verification contract
        run: cargo test -p medusa-agent verification_contract -- --nocapture
      - name: Agent tests
        run: cargo test -p medusa-agent --all-targets --all-features
      - name: Clippy
        run: cargo clippy -p medusa-agent --all-targets --all-features -- -D warnings
      - name: Commit product changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/medusa-agent/src/lib.rs crates/medusa-agent/src/engine.rs crates/medusa-agent/src/verification_contract.rs
          git diff --cached --quiet && exit 0
          git commit -m 'Wire mandatory verification contract into coding loop'
          git push origin HEAD:codex/issue-873-verification-contract
