name: Apply and validate MiniMax fix
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply patch
        run: git apply .github/minimax-m3-openai-cancellation.patch
      - name: Format source
        run: cargo fmt --all
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --quiet --workspace --all-targets --all-features --message-format short -- -D warnings
      - name: Test workspace
        run: cargo test --quiet --workspace --all-features
