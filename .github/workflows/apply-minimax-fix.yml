name: Apply and validate MiniMax fix
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply patch
        run: git apply .github/minimax-m3-openai-cancellation.patch
      - name: Format source
        run: cargo fmt --all
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        shell: bash
        run: |
          set +e
          cargo clippy --workspace --all-targets --all-features --message-format short -- -D warnings >clippy.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "--- Clippy diagnostics ---"
            grep -E '(^error|: error|warning:|could not compile)' clippy.log | tail -n 120 || tail -n 120 clippy.log
          fi
          exit "$status"
      - name: Test workspace
        run: cargo test --quiet --workspace --all-features