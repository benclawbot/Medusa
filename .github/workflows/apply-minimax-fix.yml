name: Apply and validate MiniMax fix
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply patch
        run: git apply .github/minimax-m3-openai-cancellation.patch
      - name: Format source
        run: cargo fmt --all
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        id: clippy
        shell: bash
        run: |
          set +e
          cargo clippy --workspace --all-targets --all-features --message-format short -- -D warnings >clippy.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            grep -E '(^error|: error|warning:|could not compile)' clippy.log | tail -n 120 >clippy-diagnostics.txt || tail -n 120 clippy.log >clippy-diagnostics.txt
            cat clippy-diagnostics.txt
          fi
          exit "$status"
      - name: Upload Clippy diagnostics
        if: failure() && steps.clippy.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: minimax-clippy-diagnostics
          path: |
            clippy.log
            clippy-diagnostics.txt
          if-no-files-found: error
      - name: Test workspace
        run: cargo test --quiet --workspace --all-features
