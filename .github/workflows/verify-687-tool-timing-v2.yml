name: Verify 687 Tool Timing Telemetry v2
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  verify-source:
    if: github.head_ref == 'perf/687-tool-timing-telemetry'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: perf/687-tool-timing-telemetry
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0
        with:
          components: rustfmt, clippy
      - name: Apply timing source and frontend projection
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/verify-687-tool-timing.yml').read_text()
          marker = "          python - <<'PY'\n"
          source = workflow.split(marker, 1)[1].split("\n          PY", 1)[0]
          source = "\n".join(line[10:] if line.startswith("          ") else line for line in source.splitlines())
          exec(compile(source, 'timing-verifier-source', 'exec'))

          path = Path('crates/medusa-protocol/src/frontend/projection.rs')
          text = path.read_text()
          old = '''        EventPayload::ToolExecutionCompleted { tool, exit_code } => {\n            let succeeded = exit_code.is_none_or(|code| code == 0);\n'''
          new = '''        EventPayload::ToolExecutionTimingRecorded { .. } => return None,\n        EventPayload::ToolExecutionCompleted { tool, exit_code } => {\n            let succeeded = exit_code.is_none_or(|code| code == 0);\n'''
          assert old in text, 'tool completion projection anchor missing'
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Format
        run: cargo fmt --all -- --check || (cargo fmt --all && cargo fmt --all -- --check)
      - name: Protocol tests
        run: cargo test -p medusa-protocol -- --nocapture
      - name: Agent library tests
        run: cargo test -p medusa-agent --lib -- --nocapture
      - name: Clippy
        run: cargo clippy -p medusa-protocol -p medusa-agent --all-targets --all-features -- -D warnings
      - name: Publish verified source only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/medusa-protocol/src/lib.rs crates/medusa-protocol/src/frontend/projection.rs crates/medusa-agent/src/engine.rs
          git commit -m 'Record actual tool DAG execution timing'
          git push origin HEAD:perf/687-tool-timing-telemetry
