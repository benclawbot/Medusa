name: Fix 650 Evidence Preview

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: fix-650-evidence-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fix:
    if: github.event.pull_request.number == 663 && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0 # 1.88.0
        with:
          components: rustfmt, clippy
      - name: Add bounded evidence previews
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/medusa-agent/src/verification_authority.rs')
          text = path.read_text(encoding='utf-8')

          import_anchor = 'use sha2::{Digest, Sha256};\n'
          constants = '''use sha2::{Digest, Sha256};

          const COMMAND_PREVIEW_MAX_BYTES: usize = 4 * 1024;
          const COMMAND_PREVIEW_MAX_LINES: usize = 32;
          '''
          if text.count(import_anchor) != 1:
              raise SystemExit(f'import anchor count={text.count(import_anchor)}')
          text = text.replace(import_anchor, constants, 1)

          command_anchor = '''    let command = CommandReceipt::new(
              check,
              executed.exit_code,
              executed.timed_out,
              executed.duration_ms,
              stdout_id.clone(),
              stderr_id.clone(),
          );
          '''
          command_replacement = '''    let mut preview_details = command_output_preview("stdout", &executed.stdout);
          preview_details.extend(command_output_preview("stderr", &executed.stderr));
          let command = CommandReceipt::new(
              check,
              executed.exit_code,
              executed.timed_out,
              executed.duration_ms,
              stdout_id.clone(),
              stderr_id.clone(),
          );
          '''
          if text.count(command_anchor) != 1:
              raise SystemExit(f'command anchor count={text.count(command_anchor)}')
          text = text.replace(command_anchor, command_replacement, 1)

          details_anchor = '''    let details = vec![
              format!(
                  "command_program={}",
                  check.program.as_deref().unwrap_or_default()
              ),
              format!("command_args={}", check.args.join(" ")),
              format!("command_working_directory={}", check.working_directory),
              format!("command_exit_code={:?}", command.exit_code),
              format!("command_timed_out={}", command.timed_out),
              format!("command_duration_ms={}", command.duration_ms),
          ];
          '''
          details_replacement = '''    let mut details = vec![
              format!(
                  "command_program={}",
                  check.program.as_deref().unwrap_or_default()
              ),
              format!("command_args={}", check.args.join(" ")),
              format!("command_working_directory={}", check.working_directory),
              format!("command_exit_code={:?}", command.exit_code),
              format!("command_timed_out={}", command.timed_out),
              format!("command_duration_ms={}", command.duration_ms),
          ];
          details.extend(preview_details);
          '''
          if text.count(details_anchor) != 1:
              raise SystemExit(f'details anchor count={text.count(details_anchor)}')
          text = text.replace(details_anchor, details_replacement, 1)

          helper_anchor = '''fn rejected_material(reason: String) -> CheckMaterial {
          '''
          helper = '''fn command_output_preview(stream: &str, bytes: &[u8]) -> Vec<String> {
              if bytes.is_empty() {
                  return Vec::new();
              }
              let text = String::from_utf8_lossy(bytes);
              let mut lines = Vec::new();
              let mut remaining = COMMAND_PREVIEW_MAX_BYTES;
              let mut source_lines = text.lines();
              for source in source_lines.by_ref().take(COMMAND_PREVIEW_MAX_LINES) {
                  if remaining == 0 {
                      break;
                  }
                  let normalized = source
                      .chars()
                      .map(|character| {
                          if character == '\\t' {
                              ' '
                          } else if character.is_control() {
                              '�'
                          } else {
                              character
                          }
                      })
                      .collect::<String>();
                  let preview = if secret_like(&normalized) {
                      "[redacted secret-like output]".to_owned()
                  } else {
                      truncate_utf8(&normalized, remaining)
                  };
                  remaining = remaining.saturating_sub(preview.len());
                  lines.push(format!(
                      "command_{stream}_preview_non_authoritative={preview}"
                  ));
              }
              if source_lines.next().is_some()
                  || text.len() > COMMAND_PREVIEW_MAX_BYTES
                  || lines.len() == COMMAND_PREVIEW_MAX_LINES
              {
                  lines.push(format!(
                      "command_{stream}_preview_non_authoritative=[truncated; full output is stored as a content-addressed artifact]"
                  ));
              }
              lines
          }

          fn truncate_utf8(value: &str, max_bytes: usize) -> String {
              if value.len() <= max_bytes {
                  return value.to_owned();
              }
              let mut end = max_bytes;
              while end > 0 && !value.is_char_boundary(end) {
                  end -= 1;
              }
              value[..end].to_owned()
          }

          fn secret_like(value: &str) -> bool {
              let lower = value.to_ascii_lowercase();
              [
                  "api_key",
                  "apikey",
                  "authorization:",
                  "bearer ",
                  "password=",
                  "secret=",
                  "token=",
              ]
              .iter()
              .any(|marker| lower.contains(marker))
          }

          ''' + helper_anchor
          if text.count(helper_anchor) != 1:
              raise SystemExit(f'helper anchor count={text.count(helper_anchor)}')
          text = text.replace(helper_anchor, helper, 1)

          test_anchor = '''    #[test]
              fn corrupt_nonempty_json_fails_authoritative_receipt() {
          '''
          tests = '''    #[test]
              fn command_preview_is_bounded_and_redacts_secret_like_lines() {
                  let long = "x".repeat(COMMAND_PREVIEW_MAX_BYTES + 512);
                  let output = format!(
                      "verified-value-42\\ntoken=do-not-persist\\n{long}\\nextra-line"
                  );
                  let preview = command_output_preview("stdout", output.as_bytes());
                  assert!(preview.iter().any(|line| line.contains("verified-value-42")));
                  assert!(preview.iter().any(|line| line.contains("[redacted secret-like output]")));
                  assert!(!preview.iter().any(|line| line.contains("do-not-persist")));
                  assert!(preview.iter().any(|line| line.contains("[truncated;")));
                  assert!(
                      preview
                          .iter()
                          .map(String::len)
                          .sum::<usize>()
                          < COMMAND_PREVIEW_MAX_BYTES + 2 * 1024
                  );
              }

          ''' + test_anchor
          if text.count(test_anchor) != 1:
              raise SystemExit(f'test anchor count={text.count(test_anchor)}')
          path.write_text(text.replace(test_anchor, tests, 1), encoding='utf-8')
          PY
          cargo fmt --all
          changed="$(git diff --name-only)"
          test "$changed" = "crates/medusa-agent/src/verification_authority.rs"
          git diff --check
      - name: Validate evidence compatibility
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p medusa-agent fixture_bug_fix_survives_restart_with_exact_evidence --lib --locked
          cargo test -p medusa-agent command_preview_is_bounded_and_redacts_secret_like_lines --lib --locked
          cargo test -p medusa-agent verification_authority --lib --locked
          cargo test -p medusa-agent --lib --locked
          cargo clippy -p medusa-evidence -p medusa-agent -p medusa-runtime --all-targets --locked -- -D warnings
          python3 scripts/check-evidence-authority.py
      - name: Publish validated evidence preview
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/');
          const branch = process.env.HEAD_REF;
          const token = process.env.GITHUB_TOKEN;
          const path = 'crates/medusa-agent/src/verification_authority.rs';
          const encoded = path.split('/').map(encodeURIComponent).join('/');
          async function request(url, options = {}) {
            const response = await fetch(`https://api.github.com${url}`, {
              ...options,
              headers: {
                Accept: 'application/vnd.github+json',
                Authorization: `Bearer ${token}`,
                'X-GitHub-Api-Version': '2022-11-28',
                'User-Agent': 'medusa-evidence-preview-fix',
              },
            });
            const text = await response.text();
            const data = text ? JSON.parse(text) : {};
            if (!response.ok) throw new Error(`${response.status} ${text}`);
            return data;
          }
          (async () => {
            const current = await request(`/repos/${owner}/${repo}/contents/${encoded}?ref=${encodeURIComponent(branch)}`);
            const updated = await request(`/repos/${owner}/${repo}/contents/${encoded}`, {
              method: 'PUT',
              body: JSON.stringify({
                message: 'Preserve bounded verification evidence across restart',
                content: fs.readFileSync(path).toString('base64'),
                sha: current.sha,
                branch,
              }),
            });
            console.log(`published ${updated.commit.sha}`);
          })().catch((error) => {
            console.error(error.stack || String(error));
            process.exit(1);
          });
          NODE
