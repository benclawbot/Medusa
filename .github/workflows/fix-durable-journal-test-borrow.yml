name: Fix durable journal test borrow

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/fix-durable-journal-test-borrow.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.ref == 'agent/durable-session-journal-clean' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/durable-session-journal-clean
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Correct test ownership
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('crates/medusa-agent/src/journal.rs')
          source = path.read_text()
          old = 'load_or_migrate(directory.path(), &committed.id, Some(committed)).is_err()'
          new = 'load_or_migrate(directory.path(), &committed.id, Some(committed.clone())).is_err()'
          if source.count(old) != 1:
              raise SystemExit(f'expected one ownership fixture, found {source.count(old)}')
          path.write_text(source.replace(old, new))
          PY
          cargo fmt --all
          git rm .github/workflows/fix-durable-journal-test-borrow.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/medusa-agent/src/journal.rs
          git commit -m "Fix durable journal corruption test ownership"
          git push origin HEAD:agent/durable-session-journal-clean
