name: Fix PR 1053 Runtime Lints

on:
  push:
    branches:
      - ux/action-based-recovery
    paths:
      - '.github/workflows/fix-pr1053-runtime-lints.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref_name }}
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0 # 1.88.0
        with:
          components: rustfmt
      - name: Repair production lint violations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old!r}')
              file.write_text(text.replace(old, new))

          replace_once(
              'crates/medusa-runtime/src/workspace_worker_manager.rs',
              '''fn hidden_command(program: impl AsRef<std::ffi::OsStr>) -> Command {\n    let mut command = Command::new(program);\n    #[cfg(windows)]\n    command.creation_flags(0x0800_0000);\n    command\n}\n''',
              '''fn hidden_command(program: impl AsRef<std::ffi::OsStr>) -> Command {\n    let program = program.as_ref();\n    #[cfg(windows)]\n    let mut command = Command::new(program);\n    #[cfg(not(windows))]\n    let command = Command::new(program);\n    #[cfg(windows)]\n    command.creation_flags(0x0800_0000);\n    command\n}\n''',
          )

          replace_once(
              'crates/medusa-runtime/src/lib.rs',
              '''fn should_capture_review_baseline(general_chat: bool, resuming_pending_question: bool) -> bool {\n    !general_chat && !resuming_pending_question\n}\n\n''',
              '',
          )

          path = Path('crates/medusa-runtime/src/component_runtime.rs')
          text = path.read_text()
          lock_old = '.lock().expect("desired-state lock")'
          lock_count = text.count(lock_old)
          if lock_count != 4:
              raise SystemExit(f'component_runtime.rs: expected 4 desired-state lock expects, found {lock_count}')
          text = text.replace(
              lock_old,
              '.lock().unwrap_or_else(std::sync::PoisonError::into_inner)',
          )
          path.write_text(text)

          replacements = [
              (
                  '''            let record = self\n                .instances\n                .get_mut(&consumer)\n                .expect("consumer collected from instances");\n''',
                  '''            let record = self\n                .instances\n                .get_mut(&consumer)\n                .ok_or_else(|| ComponentRuntimeError::UnknownInstance(consumer.clone()))?;\n''',
              ),
              (
                  '''        let provider_rollback = self\n            .instances\n            .get_mut(provider)\n            .expect("provider exists")\n            .journal\n            .rollback();\n''',
                  '''        let provider_rollback = self\n            .instances\n            .get_mut(provider)\n            .ok_or_else(|| ComponentRuntimeError::UnknownInstance(provider.clone()))?\n            .journal\n            .rollback();\n''',
              ),
              (
                  '''            let record = self\n                .instances\n                .get_mut(&candidate)\n                .expect("candidate exists after instantiate");\n''',
                  '''            let record = self\n                .instances\n                .get_mut(&candidate)\n                .ok_or_else(|| ComponentRuntimeError::UnknownInstance(candidate.clone()))?;\n''',
              ),
              (
                  '''            let spec = self\n                .instances\n                .get(&candidate)\n                .expect("candidate exists")\n                .spec\n                .clone();\n''',
                  '''            let spec = self\n                .instances\n                .get(&candidate)\n                .ok_or_else(|| ComponentRuntimeError::UnknownInstance(candidate.clone()))?\n                .spec\n                .clone();\n''',
              ),
              (
                  '''            let record = self\n                .instances\n                .get_mut(consumer)\n                .expect("consumer collected from instances");\n''',
                  '''            let record = self\n                .instances\n                .get_mut(consumer)\n                .ok_or_else(|| ComponentRuntimeError::UnknownInstance((*consumer).clone()))?;\n''',
              ),
              (
                  '''        let old_rollback = self\n            .instances\n            .get_mut(old)\n            .expect("old provider exists")\n            .journal\n            .rollback();\n''',
                  '''        let old_rollback = self\n            .instances\n            .get_mut(old)\n            .ok_or_else(|| ComponentRuntimeError::UnknownInstance(old.clone()))?\n            .journal\n            .rollback();\n''',
              ),
          ]
          path = Path('crates/medusa-runtime/src/component_runtime.rs')
          text = path.read_text()
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'component_runtime.rs: expected one match, found {count}: {old!r}')
              text = text.replace(old, new)
          path.write_text(text)
          PY
          cargo fmt --all
      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/medusa-runtime/src/workspace_worker_manager.rs crates/medusa-runtime/src/lib.rs crates/medusa-runtime/src/component_runtime.rs
          git diff --cached --check
          git commit -m 'fix(runtime): satisfy production lint policy'
          git push origin HEAD:${GITHUB_REF_NAME}
