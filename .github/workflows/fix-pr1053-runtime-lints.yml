name: Fix PR 1053 Runtime Lints

on:
  pull_request:
    types: [synchronize]
    paths:
      - '.github/workflows/fix-pr1053-runtime-lints.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ux/action-based-recovery
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0 # 1.88.0
        with:
          components: rustfmt
      - name: Repair component runtime production lint violations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/medusa-runtime/src/component_runtime.rs')
          text = path.read_text()
          inline_lock = '.lock().expect("desired-state lock")'
          multiline_lock = '.lock()\n            .expect("desired-state lock")'
          if text.count(inline_lock) != 2:
              raise SystemExit(f'expected 2 inline desired-state lock expects, found {text.count(inline_lock)}')
          if text.count(multiline_lock) != 2:
              raise SystemExit(f'expected 2 multiline desired-state lock expects, found {text.count(multiline_lock)}')
          text = text.replace(
              inline_lock,
              '.lock().unwrap_or_else(std::sync::PoisonError::into_inner)',
          )
          text = text.replace(
              multiline_lock,
              '.lock()\n            .unwrap_or_else(std::sync::PoisonError::into_inner)',
          )

          replacements = [
              (
                  '''            let record = self\n                .instances\n                .get_mut(&consumer)\n                .expect("consumer collected from instances");\n''',
                  '''            let record = self\n                .instances\n                .get_mut(&consumer)\n                .ok_or_else(|| ComponentRuntimeError::UnknownInstance(consumer.clone()))?;\n''',
              ),
              (
                  '''        let provider_rollback = self\n            .instances\n            .get_mut(provider)\n            .expect("provider exists")\n            .journal\n            .rollback();\n''',
                  '''        let provider_rollback = self\n            .instances\n            .get_mut(provider)\n            .ok_or_else(|| ComponentRuntimeError::UnknownInstance(provider.clone()))?\n            .journal\n            .rollback();\n''',
              ),
              (
                  '''            let record = self\n                .instances\n                .get_mut(&candidate)\n                .expect("candidate exists after instantiate");\n''',
                  '''            let record = self\n                .instances\n                .get_mut(&candidate)\n                .ok_or_else(|| ComponentRuntimeError::UnknownInstance(candidate.clone()))?;\n''',
              ),
              (
                  '''            let spec = self\n                .instances\n                .get(&candidate)\n                .expect("candidate exists")\n                .spec\n                .clone();\n''',
                  '''            let spec = self\n                .instances\n                .get(&candidate)\n                .ok_or_else(|| ComponentRuntimeError::UnknownInstance(candidate.clone()))?\n                .spec\n                .clone();\n''',
              ),
              (
                  '''            let record = self\n                .instances\n                .get_mut(consumer)\n                .expect("consumer collected from instances");\n''',
                  '''            let record = self\n                .instances\n                .get_mut(consumer)\n                .ok_or_else(|| ComponentRuntimeError::UnknownInstance((*consumer).clone()))?;\n''',
              ),
              (
                  '''        let old_rollback = self\n            .instances\n            .get_mut(old)\n            .expect("old provider exists")\n            .journal\n            .rollback();\n''',
                  '''        let old_rollback = self\n            .instances\n            .get_mut(old)\n            .ok_or_else(|| ComponentRuntimeError::UnknownInstance(old.clone()))?\n            .journal\n            .rollback();\n''',
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one component-runtime match, found {count}: {old!r}')
              text = text.replace(old, new)
          path.write_text(text)
          PY
          cargo fmt --all
          git diff --check
      - name: Commit component runtime through file-backed GitHub API payload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          path='crates/medusa-runtime/src/component_runtime.rs'
          sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=ux/action-based-recovery" --jq .sha)"
          SHA="$sha" PATH_TO_FILE="$path" python3 - <<'PY'
          import base64, json, os
          from pathlib import Path
          path = Path(os.environ['PATH_TO_FILE'])
          payload = {
              'message': 'fix(runtime): satisfy component runtime lint policy',
              'content': base64.b64encode(path.read_bytes()).decode('ascii'),
              'sha': os.environ['SHA'],
              'branch': 'ux/action-based-recovery',
          }
          Path('payload.json').write_text(json.dumps(payload))
          PY
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$path" --input payload.json
