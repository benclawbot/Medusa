name: Merge main into issue 506

on:
  push:
    branches:
      - agent/issue-506-deterministic-regression-replay

permissions:
  contents: write

jobs:
  merge-main:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-506-deterministic-regression-replay
          fetch-depth: 0
      - name: Merge current main and resolve module exports
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ]; then
            cat > crates/medusa-improvement/src/lib.rs <<'EOF'
          mod implementation;

          #[allow(clippy::obfuscated_if_else)]
          pub mod correction_signals;
          pub mod lesson_inference;
          pub mod regression_replay;
          pub mod scoped_memory;
          #[allow(clippy::collapsible_if)]
          pub mod solution_selection;
          pub use implementation::*;
          EOF
            git add crates/medusa-improvement/src/lib.rs
          fi
          git rm .github/workflows/merge-main-506.yml
          git add -A
          git commit -m "chore: merge main into deterministic replay branch"
          git push
