name: Apply 692 persistence metrics test

on:
  push:
    branches:
      - agent/issue-692-journal-runtime-performance
    paths:
      - '.github/workflows/apply-692-metrics-test.yml'
      - '.github/scripts/apply-692-metrics-test.py'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-692-journal-runtime-performance
          fetch-depth: 0
      - name: Apply persistence metrics test
        run: python .github/scripts/apply-692-metrics-test.py
      - name: Verify and measure journal persistence
        run: |
          cargo fmt --all
          cargo test -p medusa-agent journal::tests::journal_persistence_benchmark_reports_required_metrics -- --nocapture
      - name: Commit tested measurement tranche
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/medusa-agent/src/journal.rs
          git diff --cached --check
          git commit -m 'test: report journal persistence hot-path metrics'
          git push origin HEAD:agent/issue-692-journal-runtime-performance
