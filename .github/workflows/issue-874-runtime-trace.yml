name: Issue 874 runtime trace

on:
  push:
    branches:
      - codex/issue-874-coding-trajectory-state

permissions:
  contents: write

jobs:
  trace:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Trace continuity symbols
        shell: bash
        run: |
          {
            echo '=== medusa_session_continuity ==='
            grep -RIn --exclude-dir=target --exclude='Cargo.lock' 'medusa_session_continuity' crates || true
            echo '=== ContinuityStore ==='
            grep -RIn --exclude-dir=target 'ContinuityStore' crates || true
            echo '=== CodingTrajectoryCheckpoint ==='
            grep -RIn --exclude-dir=target 'CodingTrajectoryCheckpoint' crates || true
            echo '=== AuthoritativeTaskState ==='
            grep -RIn --exclude-dir=target 'AuthoritativeTaskState' crates || true
            echo '=== continuity Cargo dependency ==='
            grep -RIn --include='Cargo.toml' 'medusa-session-continuity' crates || true
          } > .github/issue-874-runtime-trace.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/issue-874-runtime-trace.txt
          git commit -m 'ci: capture issue 874 runtime trace'
          git push origin HEAD:codex/issue-874-coding-trajectory-state
