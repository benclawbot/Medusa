name: Issue 874 runtime trace

on:
  push:
    branches:
      - codex/issue-874-coding-trajectory-state

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply runtime wiring
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/issue-874-runtime-wiring.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(src) if "python3 - <<'PY'" in line) + 1
          end = next(i for i in range(start, len(src)) if src[i].strip() == 'PY')
          prefix = '          '
          script = '\n'.join(line[len(prefix):] if line.startswith(prefix) else line for line in src[start:end]) + '\n'
          begin = script.index("anchor = '''    pub fn mutate")
          finish = script.index("module = r'''", begin)
          replacement = '''marker = "    pub fn handoff("
          if marker not in s:
              raise SystemExit("handoff insertion marker missing")
          project_task = r'''\n    /// Replaces the journal-derived task projection without claiming frontend ownership.\n    ///\n    /// The canonical session journal remains the execution authority; this writes only the\n    /// bounded deterministic projection consumed by continuity/resume.\n    pub fn project_task(\n        &self,\n        event_id: &str,\n        event: SessionEventKind,\n        task: AuthoritativeTaskState,\n    ) -> Result<ApplyOutcome, ContinuityError> {\n        let current = self.load()?;\n        self.update(\n            current.revision,\n            event_id,\n            |session| {\n                session.task = task;\n                Ok(event)\n            },\n            \"runtime-projection\",\n            0,\n        )\n    }\n\n'''\n          root.write_text(s.replace(marker, project_task + marker, 1))\n\n          '''
          script = script[:begin] + replacement + script[finish:]
          Path('/tmp/issue874.py').write_text(script)
          PY
          python3 /tmp/issue874.py
          cargo fmt --all
          cargo test -p medusa-session-continuity --locked
          cargo test -p medusa-runtime --locked coding_trajectory -- --nocapture
          cargo test -p medusa-runtime --locked attachment::session -- --nocapture
          cargo clippy -p medusa-session-continuity -p medusa-runtime --all-targets --locked -- -D warnings
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/issue-874-runtime-wiring.yml .github/workflows/issue-874-runtime-trace.yml .github/issue-874-runtime-trace.txt
          git add crates/medusa-session-continuity/src/root.rs crates/medusa-runtime/src/coding_trajectory.rs crates/medusa-runtime/src/lib.rs
          git commit -m 'feat(runtime): drive turns from durable coding trajectory'
          git push origin HEAD:codex/issue-874-coding-trajectory-state
