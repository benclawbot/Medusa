name: Issue 874 runtime trace

on:
  push:
    branches:
      - codex/issue-874-coding-trajectory-state

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply runtime wiring
        run: |
          python3 .github/issue-874-runtime-fixup.py
          python3 .github/issue-874-runtime-driver.py
      - name: Validate trajectory runtime
        run: |
          cargo fmt --all
          cargo test -p medusa-session-continuity --locked
          cargo test -p medusa-runtime --locked coding_trajectory -- --nocapture
          cargo test -p medusa-runtime --locked attachment::session -- --nocapture
          cargo test -p medusa-runtime --locked start_resumed -- --nocapture
          cargo clippy -p medusa-session-continuity -p medusa-runtime --all-targets --locked -- -D warnings
      - name: Commit validated source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f .github/workflows/issue-874-runtime-wiring.yml .github/workflows/issue-874-runtime-trace.yml .github/issue-874-runtime-trace.txt .github/issue-874-runtime-driver.py .github/issue-874-runtime-fixup.py
          git add crates/medusa-session-continuity/src/root.rs crates/medusa-runtime/src/coding_trajectory.rs crates/medusa-runtime/src/lib.rs crates/medusa-runtime/src/error.rs
          git commit -m 'feat(runtime): drive turns from durable coding trajectory'
          git push origin HEAD:codex/issue-874-coding-trajectory-state
