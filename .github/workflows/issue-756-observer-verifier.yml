name: Issue 756 observer verifier

on:
  push:
    branches:
      - agent/issue-756-live-observer

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0
      - name: Wire observer into runtime API
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('crates/medusa-runtime/src/lib.rs')
          text = path.read_text()
          anchor = 'pub mod openai_realtime;\n'
          if 'pub mod observer;' not in text:
              if anchor not in text:
                  raise SystemExit('runtime module anchor not found')
              text = text.replace(anchor, anchor + 'pub mod observer;\n', 1)
          export_anchor = 'pub use execution_history::{\n    RuntimeContinuityHealth, RuntimeExecutionHealth, RuntimeHistoricalState,\n};\n'
          export = '''pub use observer::{\n    ObservationMessage, ObservationStage, ObservationVerification, ObservedPlanStep,\n    SessionObservationSnapshot, SideQuestionCancelToken, SideQuestionRequest, SideQuestionResponse,\n    answer_side_question, observe_session,\n};\n'''
          if 'pub use observer::' not in text:
              if export_anchor not in text:
                  raise SystemExit('runtime export anchor not found')
              text = text.replace(export_anchor, export_anchor + export, 1)
          path.write_text(text)
          PY
      - name: Format
        run: cargo fmt --all -- --check
      - name: Test observer
        run: cargo test -p medusa-runtime observer --locked -- --nocapture
      - name: Check runtime and agent
        run: cargo check -p medusa-agent -p medusa-runtime --locked
      - name: Clippy runtime and agent
        run: cargo clippy -p medusa-agent -p medusa-runtime --all-targets --all-features --locked -- -D warnings
      - name: Commit verified source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/medusa-runtime/src/lib.rs crates/medusa-runtime/src/observer.rs
          if git diff --cached --quiet; then
            echo 'No source changes to commit'
            exit 0
          fi
          git commit -m 'Expose safe live-session observation'
          git push origin HEAD:agent/issue-756-live-observer
