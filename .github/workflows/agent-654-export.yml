name: Agent 654 Commit Runtime Authority

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - scripts/export-agent-654-runtime-authority.py
      - .github/workflows/agent-654-export.yml

permissions:
  contents: write

concurrency:
  group: agent-654-runtime-authority
  cancel-in-progress: true

jobs:
  apply-validate-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0 # 1.88.0
        with:
          components: rustfmt,clippy
      - name: Apply runtime authority patch
        run: python3 scripts/export-agent-654-runtime-authority.py
      - name: Format workspace
        run: cargo fmt --all
      - name: Validate runtime tests
        run: cargo test -p medusa-runtime --locked
      - name: Validate runtime lint
        run: cargo clippy -p medusa-runtime --all-targets --all-features --locked -- -D warnings
      - name: Remove temporary patch machinery
        run: rm scripts/export-agent-654-runtime-authority.py .github/workflows/agent-654-export.yml
      - name: Commit validated implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Bind dedicated review to active runtime authority"
          git push origin HEAD:${{ github.head_ref }}
