name: Format Engine Migration

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'agent/issue-307-direct-engine-modules'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt
      - name: Format migrated Rust source
        run: cargo fmt --all
      - name: Commit formatting and remove workflow
        shell: bash
        run: |
          rm .github/workflows/format-engine-migration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/medusa-agent/src/engine.rs crates/medusa-agent/src/autonomous_execution.rs .github/workflows/format-engine-migration.yml
          git commit -m "Format migrated engine source"
          git push origin HEAD:${{ github.head_ref }}
