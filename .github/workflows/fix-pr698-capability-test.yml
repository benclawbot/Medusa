name: Fix PR 698 capability test
on:
  push:
    branches: [codex/656-typescript-semantic-readonly]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Update truthful capability assertion
        run: |
          echo '' | base64 -d > /tmp/fix.patch
          echo 'b228d7b2496f8453e811c25f73956debdf321734cf98eb37bbebde10f9bf2a16  /tmp/fix.patch' | sha256sum -c -
          git apply --check /tmp/fix.patch
          git apply /tmp/fix.patch
          rm .github/workflows/fix-pr698-capability-test.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Update TypeScript capability assertion'
          git push
