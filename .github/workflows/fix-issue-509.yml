name: Fix issue 509 CI

on:
  push:
    branches:
      - agent/509-explainable-learning-retrieval

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[skip-fix-509]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/509-explainable-learning-retrieval
          fetch-depth: 0
      - name: Apply focused CI fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          retrieval = Path('crates/medusa-improvement/src/retrieval.rs')
          text = retrieval.read_text()
          text = text.replace('use std::collections::{BTreeMap, BTreeSet};', 'use std::collections::BTreeSet;')
          retrieval.write_text(text)
          Path('crates/medusa-runtime/src/prompt.rs').write_text('pub use crate::attachment::*;\n')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/medusa-improvement/src/retrieval.rs crates/medusa-runtime/src/prompt.rs
          git commit -m 'Fix issue 509 CI diagnostics [skip-fix-509]'
          git push origin HEAD:agent/509-explainable-learning-retrieval
