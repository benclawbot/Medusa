name: Finalize durable provider health

on:
  push:
    branches:
      - agent/654-durable-provider-health
    paths:
      - .github/workflows/apply-durable-provider-health.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/apply-durable-provider-health.yml

permissions:
  contents: write

concurrency:
  group: finalize-durable-provider-health
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/654-durable-provider-health
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0
        with:
          components: rustfmt
      - name: Apply final governance and test portability edits
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          baseline = Path("docs/architecture/baseline.json")
          text = baseline.read_text(encoding="utf-8")
          text = text.replace(
              '"configuration profile plus ProviderManager process state"',
              '"active provider profile plus ProviderHealthStore durable state"',
          )
          fixture = '''  "known_failure_fixtures": [
    [
      "provider-capability-mismatch",
      636,
      false,
      "streaming can be true while request_body forces false and cancellation leaves request thread alive",
      "remove after route claims match wire/cancellation"
    ]
  ],'''
          if text.count(fixture) != 1:
              raise RuntimeError("known-failure fixture did not match exactly once")
          baseline.write_text(
              text.replace(fixture, '  "known_failure_fixtures": [],'),
              encoding="utf-8",
          )

          store = Path("crates/medusa-provider/src/health_store.rs")
          text = store.read_text(encoding="utf-8")
          text = text.replace(
              "    use crate::RouteRetryPolicy;\n",
              "    use std::sync::atomic::{AtomicU64, Ordering};\n\n    use crate::RouteRetryPolicy;\n\n    static TEST_DIRECTORY_SEQUENCE: AtomicU64 = AtomicU64::new(1);\n\n    fn test_directory() -> PathBuf {\n        let path = std::env::temp_dir().join(format!(\n            \"medusa-provider-health-{}-{}\",\n            std::process::id(),\n            TEST_DIRECTORY_SEQUENCE.fetch_add(1, Ordering::SeqCst),\n        ));\n        let _ = fs::remove_dir_all(&path);\n        fs::create_dir_all(&path).expect(\"create test profile root\");\n        path\n    }\n",
          )
          text = text.replace(
              'let directory = tempfile::tempdir().expect("temporary profile root");',
              "let directory = test_directory();",
          )
          text = text.replace("directory.path()", "&directory")
          store.write_text(text, encoding="utf-8")
          PY
          cargo fmt --all
      - name: Commit final migration
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture/baseline.json crates/medusa-provider/src/health_store.rs
          git commit -m "Complete durable provider health authority"
          git push origin HEAD:agent/654-durable-provider-health
