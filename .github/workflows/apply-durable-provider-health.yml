name: Apply durable provider health

on:
  push:
    branches:
      - agent/654-durable-provider-health
    paths:
      - .github/workflows/apply-durable-provider-health.yml

permissions:
  contents: write

concurrency:
  group: apply-durable-provider-health
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/654-durable-provider-health
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0
        with:
          components: rustfmt
      - name: Apply authority migration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise RuntimeError(f"{path}: expected one match, found {text.count(old)}")
              target.write_text(text.replace(old, new), encoding="utf-8")

          lib = Path("crates/medusa-provider/src/lib.rs")
          text = lib.read_text(encoding="utf-8")
          text = text.replace("mod http;\nmod manager;", "mod health_store;\nmod http;\nmod manager;")
          text = text.replace(
              "pub use manager::{ProviderHealth, ProviderManager, ProviderRouteProfile, RouteRetryPolicy};",
              "pub use health_store::ProviderHealthStore;\npub use manager::{ProviderHealth, ProviderManager, ProviderRouteProfile, RouteRetryPolicy};",
          )
          lib.write_text(text, encoding="utf-8")

          manager = Path("crates/medusa-provider/src/manager.rs")
          text = manager.read_text(encoding="utf-8")
          text = text.replace(
              "use crate::{ModelProvider, ModelRequest, ModelResponse, ProviderCapabilities};",
              "use crate::{\n    ModelProvider, ModelRequest, ModelResponse, ProviderCapabilities, ProviderHealthStore,\n};",
          )
          text = text.replace(
              "    health: Mutex<Vec<ProviderHealth>>,\n    last_completed_provider: Mutex<Option<usize>>,\n    cache_hits: Mutex<u64>,\n    last_execution: Mutex<Option<Value>>,",
              "    state: ProviderHealthStore,",
          )
          start = text.index("impl<P> ProviderManager<P> {")
          end = text.index("impl<P: ModelProvider> ModelProvider for ProviderManager<P> {")
          replacement = r'''impl<P> ProviderManager<P> {
    /// Builds a manager with a primary provider and zero or more ordered fallbacks.
    #[must_use]
    pub fn new(providers: Vec<P>) -> Self {
        Self::new_with_profiles(providers, Vec::new())
    }

    #[must_use]
    pub fn new_with_profiles(providers: Vec<P>, profiles: Vec<ProviderRouteProfile>) -> Self {
        let profiles = normalized_profiles(providers.len(), profiles);
        let state = ProviderHealthStore::in_memory(&profiles);
        Self::new_with_profiles_and_store(providers, profiles, state)
    }

    pub fn new_with_profiles_and_repository(
        providers: Vec<P>,
        profiles: Vec<ProviderRouteProfile>,
        repository: &std::path::Path,
    ) -> MedusaResult<Self> {
        let profiles = normalized_profiles(providers.len(), profiles);
        let state = ProviderHealthStore::for_repository(repository, &profiles)?;
        Ok(Self::new_with_profiles_and_store(providers, profiles, state))
    }

    fn new_with_profiles_and_store(
        providers: Vec<P>,
        profiles: Vec<ProviderRouteProfile>,
        state: ProviderHealthStore,
    ) -> Self {
        Self {
            providers,
            profiles,
            cache: Mutex::new(BTreeMap::new()),
            state,
            sleeper: thread::sleep,
        }
    }

    #[must_use]
    pub fn with_retries(mut self, retries_per_provider: u8) -> Self {
        for profile in &mut self.profiles {
            profile.retry.max_retries = retries_per_provider;
        }
        self
    }

    #[cfg(test)]
    fn with_policy(mut self, policy: RouteRetryPolicy) -> Self {
        for profile in &mut self.profiles {
            profile.retry = policy;
        }
        self
    }

    #[cfg(test)]
    fn without_sleep(mut self) -> Self {
        self.sleeper = |_| {};
        self
    }

    /// Returns a copy from the shared route-health authority.
    #[must_use]
    pub fn health(&self) -> Vec<ProviderHealth> {
        self.state.health().unwrap_or_default()
    }

    /// Returns the configured provider position that completed the latest uncached request.
    #[must_use]
    pub fn last_completed_provider(&self) -> Option<usize> {
        self.state.last_completed_provider().unwrap_or_default()
    }

    /// Returns the total number of responses served from all managers sharing this store.
    #[must_use]
    pub fn cache_hits(&self) -> u64 {
        self.state.cache_hits().unwrap_or_default()
    }

    /// Returns the latest completed request snapshot from durable shared state.
    #[must_use]
    pub fn execution_status(&self) -> Option<Value> {
        match self.state.execution_status() {
            Ok(status) => status,
            Err(error) => Some(json!({"state_error": error.to_string()})),
        }
    }

    fn record_attempt(&self, index: usize) -> MedusaResult<()> {
        self.state.record_attempt(index)
    }

    fn record_success(&self, index: usize) -> MedusaResult<()> {
        self.state.record_success(index)
    }

    fn record_cache_hit(&self) -> MedusaResult<()> {
        self.state.record_cache_hit()
    }

    fn record_error(&self, index: usize, error: &MedusaError) -> MedusaResult<()> {
        self.state.record_error(index, error)
    }

    fn record_retry(&self, index: usize, delay_ms: u64) -> MedusaResult<()> {
        self.state.record_retry(index, delay_ms)
    }

    fn record_failover(&self, index: usize) -> MedusaResult<()> {
        self.state.record_failover(index)
    }
}

fn normalized_profiles(
    provider_count: usize,
    mut profiles: Vec<ProviderRouteProfile>,
) -> Vec<ProviderRouteProfile> {
    profiles.truncate(provider_count);
    while profiles.len() < provider_count {
        let index = profiles.len();
        profiles.push(ProviderRouteProfile {
            id: format!("provider[{index}]"),
            provider: format!("provider-{index}"),
            model: "unspecified".to_owned(),
            protocol: "unspecified".to_owned(),
            endpoint: None,
            auth_source: "unspecified".to_owned(),
            tool_calling: true,
            streaming: false,
            retry: RouteRetryPolicy::default(),
        });
    }
    profiles
}

'''
          text = text[:start] + replacement + text[end:]
          text = text.replace("            self.record_cache_hit();", "            self.record_cache_hit()?;")
          text = text.replace("                self.record_attempt(index);", "                self.record_attempt(index)?;")
          text = text.replace("                        self.record_success(index);", "                        self.record_success(index)?;")
          text = text.replace("                        self.record_error(index, &error);", "                        self.record_error(index, &error)?;")
          text = text.replace("                                self.record_retry(index, delay_ms);", "                                self.record_retry(index, delay_ms)?;")
          text = text.replace("                                self.record_failover(index);", "                                self.record_failover(index)?;")
          manager.write_text(text, encoding="utf-8")

          configured = Path("crates/medusa-provider/src/configured.rs")
          text = configured.read_text(encoding="utf-8")
          text = text.replace(
              "use std::sync::atomic::AtomicBool;",
              "use std::{path::Path, sync::atomic::AtomicBool};",
          )
          text = text.replace(
              "    pub fn manager_from_config(\n        config: &Config,",
              "    pub fn manager_from_config(\n        repository: &Path,\n        config: &Config,",
          )
          text = text.replace(
              "        Ok(ProviderManager::new_with_profiles(providers, profiles))",
              "        ProviderManager::new_with_profiles_and_repository(\n            providers,\n            profiles,\n            repository,\n        )",
          )
          configured.write_text(text, encoding="utf-8")

          replace_once(
              "crates/medusa-runtime/src/lib.rs",
              "ConfiguredProvider::manager_from_config(&config, state.session_api_key.clone())",
              "ConfiguredProvider::manager_from_config(\n        &state.repo,\n        &config,\n        state.session_api_key.clone(),\n    )",
          )

          cargo = Path("crates/medusa-provider/Cargo.toml")
          text = cargo.read_text(encoding="utf-8")
          text = text.replace(
              "reqwest = { version = \"0.12\", default-features = false, features = [\"blocking\", \"json\", \"rustls-tls\"] }\n",
              "reqwest = { version = \"0.12\", default-features = false, features = [\"blocking\", \"json\", \"rustls-tls\"] }\nrusqlite = { version = \"0.32\", features = [\"bundled\"] }\n",
          )
          text = text.replace(
              "\n[lints]\n",
              "\n[dev-dependencies]\ntempfile.workspace = true\n\n[lints]\n",
          )
          cargo.write_text(text, encoding="utf-8")

          conformance = Path("scripts/architecture-conformance.py")
          text = conformance.read_text(encoding="utf-8")
          start = text.index("def provider_capability_mismatch")
          end = text.index("\n\ndef load_expected_fixture_ids", start)
          text = text[:start] + 'PROBES: dict[str, Callable[[Path], tuple[bool, str]]] = {}' + text[end:]
          conformance.write_text(text, encoding="utf-8")

          baseline = Path("docs/architecture/baseline.json")
          text = baseline.read_text(encoding="utf-8")
          text = text.replace(
              '"configuration profile plus ProviderManager process state"',
              '"configuration profile plus repository-scoped ProviderHealthStore"',
          )
          fixture = '''  "known_failure_fixtures": [
    [
      "provider-capability-mismatch",
      636,
      false,
      "streaming can be true while request_body forces false and cancellation leaves request thread alive",
      "remove after route claims match wire/cancellation"
    ]
  ],'''
          if text.count(fixture) != 1:
              raise RuntimeError("known-failure fixture did not match exactly once")
          text = text.replace(fixture, '  "known_failure_fixtures": [],')
          baseline.write_text(text, encoding="utf-8")
          PY
          cargo fmt --all
          cargo generate-lockfile
      - name: Commit migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock crates/medusa-provider crates/medusa-runtime/src/lib.rs scripts/architecture-conformance.py docs/architecture/baseline.json
          git commit -m "Persist provider route health across runtimes"
          git push origin HEAD:agent/654-durable-provider-health
      - name: Validate provider authority
        run: |
          cargo test -p medusa-provider --all-targets
          python3 scripts/architecture-conformance.py --known-failures
