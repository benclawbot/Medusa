name: Temporary rustfmt PR 514

on:
  push:
    branches:
      - agent/issue-487-conversational-supervisor

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-487-conversational-supervisor
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt
      - name: Format and commit
        run: |
          cargo fmt --all
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/medusa-runtime-supervisor/src/conversational.rs
          git commit -m "Format conversational supervisor"
          git push origin HEAD:agent/issue-487-conversational-supervisor
