name: Apply issue 355 fix

on:
  push:
    branches:
      - fix/355-automatic-browser-verification
    paths:
      - .github/scripts/fix_issue_355.py
      - .github/scripts/fix_issue_355_policy.py
      - .github/workflows/apply-issue-355.yml
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main

concurrency:
  group: issue-355-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/355-automatic-browser-verification
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - name: Apply source migration
        run: |
          if ! grep -q 'browser_on_ui_change: bool' crates/medusa-config/src/lib.rs; then
            python3 .github/scripts/fix_issue_355.py
          fi
          if ! grep -q 'fn browser_policy_enabled' crates/medusa-agent/src/verification.rs; then
            python3 .github/scripts/fix_issue_355_policy.py
          fi
          cargo fmt --all
      - name: Commit source changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/medusa-config/src/lib.rs crates/medusa-agent/src/verification.rs docs/CONFIGURATION.md
          if ! git diff --cached --quiet; then
            git commit -m "fix(verification): trigger browser checks for UI changes (#355)"
            git pull --rebase origin fix/355-automatic-browser-verification
            git push origin HEAD:fix/355-automatic-browser-verification
          fi
      - name: Check affected crates
        run: cargo check -p medusa-config -p medusa-agent
      - name: Test affected crates
        run: cargo test -p medusa-config -p medusa-agent
      - name: Clippy affected crates
        run: cargo clippy -p medusa-config -p medusa-agent --all-targets -- -D warnings
