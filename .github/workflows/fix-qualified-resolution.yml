name: Fix qualified Rust resolution

on:
  push:
    branches:
      - agent/restore-rustfmt-baseline

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt
      - name: Fix terminal path resolution
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('crates/medusa-intelligence/src/resolution.rs')
          text = path.read_text()
          old = '''    if !matches!(
        parent.kind.as_str(),
        "scoped_identifier" | "scoped_type_identifier"
    ) {
        return None;
    }
    source
'''
          new = '''    if !matches!(
        parent.kind.as_str(),
        "scoped_identifier" | "scoped_type_identifier"
    ) || node.range.end_byte != parent.range.end_byte
    {
        return None;
    }
    source
'''
          if old not in text:
              raise SystemExit('qualified_path pattern not found')
          path.write_text(text.replace(old, new))
          PY
          cargo fmt --all
          cargo test -p medusa-intelligence --lib
      - name: Commit semantic fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/medusa-intelligence/src/resolution.rs
          git commit -m "fix: resolve qualified Rust paths once"
          git push
