[package]
name = "medusa-desktop"
version = "1.0.7"
description = "Medusa desktop adapter"
authors = ["BenClawBot"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "medusa_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "medusa-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64.workspace = true
image.workspace = true
medusa-config = { path = "../../../crates/medusa-config" }
medusa-core = { path = "../../../crates/medusa-core" }
medusa-daemon = { path = "../../../crates/medusa-daemon" }
medusa-github = { path = "../../../crates/medusa-github" }
medusa-learning = { path = "../../../crates/medusa-learning" }
medusa-memory = { path = "../../../crates/medusa-memory" }
medusa-protocol = { path = "../../../crates/medusa-protocol" }
medusa-provider = { path = "../../../crates/medusa-provider" }
medusa-runtime = { path = "../../../crates/medusa-runtime" }
medusa-session = { path = "../../../crates/medusa-session" }
medusa-update = { path = "../../../crates/medusa-update" }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
time.workspace = true
ulid.workspace = true
