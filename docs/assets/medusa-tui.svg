<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
<title id="title">Medusa terminal interface during a verified coding task</title><desc id="desc">The Medusa TUI shows a conversation, plan, tool activity, and targeted verification in progress.</desc>
<rect width="1600" height="960" fill="#080c12"/><rect x="35" y="35" width="1530" height="890" rx="20" fill="#0d121a" stroke="#3a465a" stroke-width="2"/><rect x="35" y="35" width="1530" height="55" fill="#161c26"/>
<circle cx="70" cy="63" r="9" fill="#ff5f56"/><circle cx="102" cy="63" r="9" fill="#ffbd2e"/><circle cx="134" cy="63" r="9" fill="#27c93f"/><g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><text x="142" y="70" font-size="20" fill="#bec8d7">Medusa — /workspace/medusa</text>
<text x="65" y="143" font-size="34" font-weight="700" fill="#dbeaff">MEDUSA</text><text x="245" y="138" font-size="20" fill="#6fc2ff">repository-aware coding agent</text><text x="1190" y="136" font-size="17" fill="#96a5b9">MiniMax-M3  •  effort:auto</text>
<rect x="60" y="170" width="1030" height="600" rx="12" fill="#0a0f16" stroke="#344256" stroke-width="2"/><rect x="1110" y="170" width="430" height="600" rx="12" fill="#0a0f16" stroke="#344256" stroke-width="2"/>
<text x="82" y="205" font-size="18" font-weight="700" fill="#9ad1ff">Conversation</text><text x="1132" y="205" font-size="18" font-weight="700" fill="#9ad1ff">Plan</text>
<g font-size="16"><text x="82" y="240" font-weight="700" fill="#96d2ff">YOU</text><text x="180" y="240" fill="#bfe5ff">Fix the flaky runtime test and verify the result.</text>
<text x="82" y="278" font-weight="700" fill="#e4e8f0">MEDUSA</text><text x="180" y="278" fill="#e4e8f0">I’ll trace the failure, make the smallest complete change, and run targeted checks.</text>
<text x="82" y="330" font-weight="700" fill="#9bb4cd">TOOL</text><text x="180" y="330" fill="#9bb4cd">Read(crates/medusa-runtime/src/tests.rs)</text>
<text x="82" y="370" font-weight="700" fill="#9bb4cd">TOOL</text><text x="180" y="370" fill="#9bb4cd">Search(&quot;completed.details&quot;)  •  3 matches</text>
<text x="82" y="412" font-weight="700" fill="#bacada">PLAN</text><text x="180" y="412" fill="#bacada">1  Inspect failing assertion                                  ✓</text>
<text x="82" y="450" font-weight="700" fill="#bacada">PLAN</text><text x="180" y="450" fill="#bacada">2  Preserve tool output details                              ✓</text>
<text x="82" y="488" font-weight="700" fill="#bacada">PLAN</text><text x="180" y="488" fill="#bacada">3  Run medusa-runtime tests                                  ●</text>
<text x="82" y="530" font-weight="700" fill="#9bb4cd">TOOL</text><text x="180" y="530" fill="#9bb4cd">cargo test -p medusa-runtime</text>
<text x="82" y="570" font-weight="700" fill="#70dc9b">DONE</text><text x="180" y="570" fill="#70dc9b">test result: ok. 87 passed; 0 failed</text>
<text x="82" y="610" font-weight="700" fill="#e4e8f0">MEDUSA</text><text x="180" y="610" fill="#e4e8f0">The stale assertion now expects the forwarded output.</text><text x="180" y="637" fill="#e4e8f0">Targeted verification passed.</text></g>
<g font-size="16"><text x="1135" y="245" fill="#70dc9b">✓</text><text x="1170" y="245" fill="#cdd7e6">Inspect failure</text><text x="1135" y="291" fill="#70dc9b">✓</text><text x="1170" y="291" fill="#cdd7e6">Apply focused fix</text><text x="1135" y="337" fill="#ffca5c">●</text><text x="1170" y="337" fill="#cdd7e6">Verify runtime</text><text x="1135" y="383" fill="#738299">○</text><text x="1170" y="383" fill="#cdd7e6">Summarize evidence</text></g>
<line x1="1130" y1="430" x2="1520" y2="430" stroke="#344256"/><text x="1132" y="468" font-size="18" font-weight="700" fill="#9ad1ff">Activity</text><g font-size="16"><text x="1135" y="510" fill="#cdd7e6">Read</text><text x="1415" y="510" fill="#70dc9b">done</text><text x="1135" y="550" fill="#cdd7e6">Search</text><text x="1415" y="550" fill="#70dc9b">done</text><text x="1135" y="590" fill="#cdd7e6">Patch</text><text x="1415" y="590" fill="#70dc9b">done</text><text x="1135" y="630" fill="#cdd7e6">Tests</text><text x="1415" y="630" fill="#ffca5c">running</text></g>
<rect x="60" y="790" width="1480" height="95" rx="12" fill="#0c121b" stroke="#3e536c" stroke-width="2"/><text x="82" y="830" font-size="18" fill="#788aa0">› Ask Medusa to change, inspect, or verify this repository…</text><text x="82" y="872" font-size="14" fill="#5a6e87">Enter send   Shift+Enter newline   Ctrl+C cancel   / commands</text><text x="1260" y="872" font-size="14" fill="#5a6e87">turn 4  •  18.2k tokens</text></g></svg>