<circle cx="1152" cy="360" r="12" fill="#37aa69"/><text x="1148" y="365" font-size="11" font-weight="700" fill="#fff">2</text><text x="1180" y="358" font-size="15" fill="#2f3949">Apply the focused correction</text><text x="1180" y="382" font-size="13" fill="#37aa69">completed</text>
<circle cx="1152" cy="442" r="12" fill="#e19a2a"/><text x="1148" y="447" font-size="11" font-weight="700" fill="#fff">3</text><text x="1180" y="440" font-size="15" fill="#2f3949">Run targeted verification</text><text x="1180" y="464" font-size="13" fill="#e19a2a">in progress</text>
<circle cx="1152" cy="524" r="12" fill="#919baa"/><text x="1148" y="529" font-size="11" font-weight="700" fill="#fff">4</text><text x="1180" y="522" font-size="15" fill="#2f3949">Report evidence</text><text x="1180" y="546" font-size="13" fill="#919baa">pending</text></g>
